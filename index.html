  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Safe ES-Module with Resilient Fallback) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function setupFirebase() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sign in anonymously
        await signInAnonymously(auth);

        // Public classroom collection path
        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        // Expose direct write and delete functions globally
        window.saveUserRecordToCloud = async (userKey, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', userKey);
            await setDoc(userDoc, data, { merge: true });
          } catch (err) {
            console.warn("Cloud save warning:", err.message);
          }
        };

        window.deleteUserRecordFromCloud = async (userKey) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', userKey);
            await deleteDoc(userDoc);
          } catch (err) {
            console.warn("Cloud delete warning:", err.message);
          }
        };

        // Real-time snapshot listener across all connected devices
        onSnapshot(usersCol, (snapshot) => {
          const fresh = {};
          snapshot.forEach((d) => {
            fresh[d.id] = d.data();
          });
          window.cachedCloudUsers = fresh;
          window.cloudAvailable = true;

          // Update connection indicator badge
          const status = document.getElementById('cloud-status-indicator');
          if (status) {
            status.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          // If current logged-in student had tokens updated elsewhere, reflect it
          if (window.app && window.app.currentUser && fresh[window.app.currentUser.key]) {
            const remote = fresh[window.app.currentUser.key];
            if (remote.stats && remote.stats.tokens !== undefined) {
              window.state.stats.tokens = remote.stats.tokens;
              const tokenEl = document.getElementById('nav-user-tokens');
              if (tokenEl) tokenEl.textContent = remote.stats.tokens;
            }
          }

          // Refresh leaderboards live
          if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
          if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
        }, (err) => {
          console.warn("Firestore snapshot listener:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init fallback:", err.message);
        const status = document.getElementById('cloud-status-indicator');
        if (status) {
          status.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    setupFirebase();
  </script>

  <!-- CORE LOGIC & VIEWS SCRIPT -->
  <script>
    // Audio Context Setup
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDrumSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      if (type === 'kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'snare') {
        // Noise buffer
        const bufferSize = ctx.sampleRate * 0.2;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 1000;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);

        // Tone part
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        oscGain.gain.setValueAtTime(0.6, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // Default In-Memory State
    window.state = {
      stats: { tokens: 10, testsTaken: 0 },
      inventory: [],
      testHistory: []
    };

    // Global App Router & Session Holder
    window.app = {
      currentUser: null,
      currentView: 'home',
      navigate: function(view, param) {
        this.currentView = view;
        const container = document.getElementById('app-viewport');
        if (!container) return;

        // Render target view
        if (view === 'home') renderHomeView(container);
        else if (view === 'login') renderLoginView(container);
        else if (view === 'studentDash') renderStudentDash(container);
        else if (view === 'teacherDash') renderTeacherDash(container);
        else if (view === 'rhythmModule') renderRhythmModule(container);
        else if (view === 'dictationChallenge') renderDictationChallenge(container);
        else if (view === 'shop') renderShopView(container);
        else if (view === 'studentTests') renderStudentTestsView(container);
        else renderHomeView(container);

        updateNavUI();
        updateGlobalLeaderboard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    // User Records Helper: Read strictly from real-time cloud or memory
    function getAllUserRecords() {
      if (window.cachedCloudUsers && Object.keys(window.cachedCloudUsers).length > 0) {
        return window.cachedCloudUsers;
      }
      try {
        const stored = localStorage.getItem('boncepts_users_db');
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function getDeduplicatedStudents() {
      const records = getAllUserRecords();
      const unique = {};
      Object.keys(records).forEach(key => {
        const r = records[key];
        if (r && r.role === 'student' && r.firstName && r.surname) {
          const normName = `${r.firstName.trim().toLowerCase()} ${r.surname.trim().toLowerCase()}`;
          if (!unique[normName]) {
            unique[normName] = { key, ...r };
          }
        }
      });
      return Object.values(unique);
    }

    function saveUserState() {
      if (!app.currentUser) return;
      const key = app.currentUser.key;
      const record = {
        firstName: app.currentUser.firstName,
        surname: app.currentUser.surname,
        class: app.currentUser.class,
        teacher: app.currentUser.teacher,
        role: app.currentUser.role,
        stats: state.stats,
        inventory: state.inventory,
        testHistory: state.testHistory,
        lastActive: new Date().toISOString()
      };

      // Save to cloud if live
      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, record);
      }

      // Safe local storage backup
      try {
        const users = getAllUserRecords();
        users[key] = record;
        localStorage.setItem('boncepts_users_db', JSON.stringify(users));
        localStorage.setItem('boncepts_active_session', JSON.stringify(app.currentUser));
      } catch (e) {}

      updateNavUI();
      updateGlobalLeaderboard();
    }

    function addTokens(count) {
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.tokens = (state.stats.tokens || 0) + count;
      saveUserState();
    }

    function updateNavUI() {
      const loginBtn = document.getElementById('nav-login-btn');
      const profile = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const userNameEl = document.getElementById('nav-user-name');
      const userRoleEl = document.getElementById('nav-user-role');
      const tokenCountEl = document.getElementById('nav-user-tokens');

      if (app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (userNameEl) userNameEl.textContent = `${app.currentUser.firstName} ${app.currentUser.surname}`;
        if (userRoleEl) userRoleEl.textContent = app.currentUser.role === 'teacher' ? 'Music Teacher' : `Class ${app.currentUser.class}`;

        if (app.currentUser.role === 'student') {
          if (tokenBadge) tokenBadge.classList.remove('hidden');
          if (tokenBadge) tokenBadge.classList.add('flex');
          if (tokenCountEl) tokenCountEl.textContent = state.stats.tokens || 0;
        } else {
          if (tokenBadge) tokenBadge.classList.add('hidden');
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
        if (tokenBadge) tokenBadge.classList.add('hidden');
      }
    }

    function logoutUser() {
      app.currentUser = null;
      state = { stats: { tokens: 10, testsTaken: 0 }, inventory: [], testHistory: [] };
      localStorage.removeItem('boncepts_active_session');
      app.navigate('home');
    }

    // Dynamic Overall Leaderboard Marquee & Table
    window.updateGlobalLeaderboard = function() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;

      const students = getDeduplicatedStudents();
      if (students.length === 0) {
        ticker.innerHTML = `<span>Welcome to The Boncepts of Music! Students join now to compete on the live leaderboard.</span>`;
        return;
      }

      // Sort by tokens held descending
      students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));

      const itemsHtml = students.map((s, idx) => {
        const tokens = (s.stats && s.stats.tokens) || 0;
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🪙';
        return `<span class="inline-flex items-center gap-1.5 mx-4">
          <span>${medal}</span>
          <span class="font-bold text-white">${s.firstName} ${s.surname}</span>
          <span class="text-indigo-300">(${s.class})</span>:
          <span class="font-extrabold text-amber-300">${tokens} Tokens</span>
        </span>`;
      }).join(' • ');

      ticker.innerHTML = itemsHtml;
    };

    window.refreshLeaderboardTableInPlace = function() {
      const tbody = document.getElementById('overall-leaderboard-tbody');
      if (!tbody) return;

      const students = getDeduplicatedStudents();
      students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">No students enrolled yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = students.map((s, idx) => {
        const tokens = (s.stats && s.stats.tokens) || 0;
        const items = (s.inventory && s.inventory.length) || 0;
        const medal = idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `#${idx + 1}`;
        return `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="px-4 py-3 font-bold text-slate-700">${medal}</td>
            <td class="px-4 py-3 font-semibold text-slate-900">${s.firstName} ${s.surname}</td>
            <td class="px-4 py-3 text-slate-500">${s.class}</td>
            <td class="px-4 py-3 text-right font-black text-amber-600">${tokens} 🪙</td>
          </tr>
        `;
      }).join('');
    };

    function scrollToStudentLeaderboard() {
      const section = document.getElementById('overall-student-leaderboard-section');
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' });
      } else {
        if (app.currentUser && app.currentUser.role === 'teacher') {
          app.navigate('teacherDash');
        } else if (app.currentUser && app.currentUser.role === 'student') {
          app.navigate('studentDash');
        } else {
          app.navigate('home');
        }
        setTimeout(() => {
          const s = document.getElementById('overall-student-leaderboard-section');
          if (s) s.scrollIntoView({ behavior: 'smooth' });
        }, 150);
      }
    }

    // ==========================================
    // VIEW RENDERING FUNCTIONS
    // ==========================================

    function renderHomeView(container) {
      container.innerHTML = `

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;

      const studentClass = role === 'student' ? document.getElementById('login-class').value : 'Staff';
      const teacher = role === 'student' ? document.getElementById('login-teacher').value.trim() : 'Self';

      if (!firstName || !surname) return;

      const userKey = `${role}_${firstName.toLowerCase()}_${surname.toLowerCase()}`;
      const allUsers = getAllUserRecords();
      let existing = allUsers[userKey];

      if (existing) {
        state.stats = existing.stats || { tokens: 10, testsTaken: 0 };
        state.inventory = existing.inventory || [];
        state.testHistory = existing.testHistory || [];
      } else {
        state.stats = { tokens: 10, testsTaken: 0 };
        state.inventory = [];
        state.testHistory = [];
      }

      app.currentUser = {
        key: userKey,
        firstName,
        surname,
        class: studentClass,
        teacher,
        role
      };

      saveUserState();

      if (role === 'teacher') {
        app.navigate('teacherDash');
      } else {
        app.navigate('studentDash');
      }
    }

    let drumPattern = [

      { beat: 3, type: 'quavers'  }, // Kick
      { beat: 4, type: 'crotchet' }, // Snare

    function renderRhythmModule(container) {
      container.innerHTML = `

            </div>
            <div class="flex items-center gap-2">

              </button>
            </div>
          </div>

          <!-- 8-Beat Module Visualizer -->
          <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-xl overflow-x-auto">
            <div class="grid grid-cols-8 gap-2 sm:gap-3 min-w-[620px]">
              ${drumPattern.map((p, idx) => {
                const isKick = idx % 2 === 0;
                const isCrotchet = p.type === 'crotchet';
                const colorClass = isKick
                  ? 'border-blue-500/60 bg-blue-950/40 text-blue-400 hover:bg-blue-900/50'
                  : 'border-rose-500/60 bg-rose-950/40 text-rose-400 hover:bg-rose-900/50';
                return `
                  <button onclick="togglePatternBeat(${idx})" class="flex flex-col items-center justify-between p-3 rounded-2xl border-2 transition-all cursor-pointer h-36 ${colorClass}">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">
                      B${idx + 1}: ${isKick ? 'KICK' : 'SNARE'}
                    </span>
                    <span class="text-3xl font-black py-1">
                      ${isCrotchet ? '♩' : '♫'}
                    </span>
                    <div class="text-center">
                      <span class="text-[11px] font-bold block text-white">${isCrotchet ? 'Crotchet' : 'Quavers'}</span>
                      <span class="text-[9px] text-slate-400">${isCrotchet ? '1 hit' : '2 hits'}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function togglePatternBeat(idx) {
      drumPattern[idx].type = drumPattern[idx].type === 'crotchet' ? 'quavers' : 'crotchet';
      const isKick = idx % 2 === 0;
      playDrumSound(isKick ? 'kick' : 'snare');
      renderRhythmModule(document.getElementById('app-viewport'));
    }

    function randomizePattern() {
      drumPattern.forEach(p => {
        p.type = Math.random() > 0.5 ? 'crotchet' : 'quavers';
      });
      renderRhythmModule(document.getElementById('app-viewport'));
    }

    async function playCurrentPattern() {
      const beatDuration = 0.5; // 120 bpm
      for (let i = 0; i < drumPattern.length; i++) {
        const item = drumPattern[i];
        const isKick = i % 2 === 0;
        const soundType = isKick ? 'kick' : 'snare';

        if (item.type === 'crotchet') {
          playDrumSound(soundType);
        } else {
          // Two quavers (half a beat apart)
          playDrumSound(soundType);
          setTimeout(() => playDrumSound(soundType), 250);
        }
        await new Promise(r => setTimeout(r, 500));
      }
    }

    let bestStreak = 0;

    function renderDictationChallenge(container) {
      generateMysteryPattern();

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-headphones text-amber-500"></i> Rhythm Dictation Challenge
              </h1>
              <p class="text-xs sm:text-sm text-slate-500">
                Listen to the mystery 8-beat rhythm and select the matching notation!
              </p>
            </div>
            <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-sm">
              <span class="text-xs font-bold text-slate-500">Streak: <span id="dictation-streak" class="text-amber-600 font-black text-base">${streakCount}</span></span>
              <span class="text-xs font-bold text-slate-500">Best: <span id="dictation-best" class="text-emerald-600 font-black text-base">${bestStreak}</span></span>
            </div>
          </div>

          <!-- Player Card -->
          <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 text-center">
            <button id="hear-mystery-btn" onclick="playMysteryAudio()" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl shadow-lg transition-all text-lg flex items-center gap-3 mx-auto">
              <i class="fa-solid fa-volume-high"></i> Hear Mystery Rhythm
            </button>
            <p id="dictation-status-msg" class="text-xs text-slate-400 font-semibold mt-4">
              Tap button above to hear the 8 beats.
            </p>
          </div>

          <!-- Answer Options A, B, C, D -->
          <div class="space-y-3" id="dictation-options-container">
            ${mysteryOptions.map((opt, optIdx) => {
              const letter = String.fromCharCode(65 + optIdx);
              return `
                <button onclick="handleOptionSelect(${optIdx})" class="w-full bg-white hover:bg-indigo-50/50 p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 transition-all flex items-center gap-4 text-left group">
                  <div class="w-10 h-10 rounded-xl bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center font-black text-slate-700 transition-colors shrink-0">
                    ${letter}
                  </div>
                  <div class="flex-1 grid grid-cols-8 gap-1.5 sm:gap-2">
                    ${opt.map((beatType, bIdx) => {
                      const isKick = bIdx % 2 === 0;
                      const isCrotchet = beatType === 1;
                      const cardStyle = isKick
                        ? 'bg-blue-50 border-blue-200 text-blue-700'
                        : 'bg-rose-50 border-rose-200 text-rose-700';
                      return `
                        <div class="flex flex-col items-center justify-center py-2 px-1 rounded-xl border ${cardStyle}">
                          <span class="text-xl sm:text-2xl font-black leading-none mb-1">
                            ${isCrotchet ? '♩' : '♫'}
                          </span>
                          <span class="text-[10px] font-bold text-slate-500">${bIdx + 1}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function generateMysteryPattern() {
      // 1 = crotchet (1 hit), 2 = quavers (2 hits)
      currentMysteryPattern = [];
      for (let i = 0; i < 8; i++) {
        currentMysteryPattern.push(Math.random() > 0.5 ? 1 : 2);
      }

      // Generate 3 unique distractors
      mysteryOptions = [currentMysteryPattern];
      while (mysteryOptions.length < 4) {
        const distractor = [];
        for (let i = 0; i < 8; i++) {
          distractor.push(Math.random() > 0.5 ? 1 : 2);
        }
        const matchesExisting = mysteryOptions.some(opt => 
          opt.every((val, idx) => val === distractor[idx])
        );
        if (!matchesExisting) {
          mysteryOptions.push(distractor);
        }
      }

      // Shuffle options array
      mysteryOptions.sort(() => Math.random() - 0.5);
    }

    async function playMysteryAudio() {
      const btn = document.getElementById('hear-mystery-btn');
      const msg = document.getElementById('dictation-status-msg');
      if (btn) btn.disabled = true;
      if (msg) msg.textContent = "Playing mystery pattern...";

      for (let i = 0; i < currentMysteryPattern.length; i++) {
        const beatType = currentMysteryPattern[i];
        const isKick = i % 2 === 0;
        const soundType = isKick ? 'kick' : 'snare';

        if (beatType === 1) {
          playDrumSound(soundType);
        } else {
          playDrumSound(soundType);
          setTimeout(() => playDrumSound(soundType), 250);
        }
        await new Promise(r => setTimeout(r, 500));
      }

      if (btn) btn.disabled = false;
      if (msg) msg.textContent = "Finished! Select pattern A, B, C, or D.";
    }

    function handleOptionSelect(chosenIdx) {
      const selected = mysteryOptions[chosenIdx];
      const isCorrect = selected.every((val, idx) => val === currentMysteryPattern[idx]);

      if (isCorrect) {
        streakCount++;
        if (streakCount > bestStreak) bestStreak = streakCount;
        addTokens(5);
        alert("🎉 Correct rhythm! You earned +5 Tokens!");
      } else {
        streakCount = 0;
        alert("❌ Not quite! Listen closely to the beats and try again.");
      }

      renderDictationChallenge(document.getElementById('app-viewport'));
    }

    // ==========================================
    // REWARDS SHOP VIEW
    // ==========================================
    const shopCatalog = [
      { id: 'item_gold_mic', name: 'Golden Microphone', cost: 15, icon: 'fa-microphone-lines', desc: 'Classroom audio privilege' },
      { id: 'item_drum_sticks', name: 'Master Drumsticks', cost: 25, icon: 'fa-drum', desc: 'Rhythm speed badge' },
      { id: 'item_dj_crown', name: 'DJ Crown', cost: 40, icon: 'fa-crown', desc: 'Leaderboard special avatar' },
      { id: 'item_synth_badge', name: 'Synthesizer Pro', cost: 50, icon: 'fa-compact-disc', desc: 'Music theory virtuoso' }
    ];

    function renderShopView(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-black text-slate-800">Classroom Rewards Shop</h1>
              <p class="text-xs sm:text-sm text-slate-500">Spend tokens to collect badges and equipment</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-2xl">
              <span class="text-xs font-bold text-amber-800">Your Wallet:</span>
              <span class="text-xl font-black text-amber-600 ml-1">${state.stats.tokens || 0} 🪙</span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            ${shopCatalog.map(item => {
              const owned = (state.inventory || []).includes(item.id);
              return `
                <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                  <div>
                    <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl mb-4">
                      <i class="fa-solid ${item.icon}"></i>
                    </div>
                    <h3 class="font-bold text-slate-800">${item.name}</h3>
                    <p class="text-xs text-slate-400 mt-1">${item.desc}</p>
                  </div>
                  <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                    <span class="font-black text-amber-600 text-sm">${item.cost} 🪙</span>
                    ${owned ? `
                      <span class="px-3 py-1 bg-emerald-50 text-emerald-600 font-bold text-xs rounded-lg">Owned</span>
                    ` : `
                      <button onclick="buyShopItem('${item.id}', ${item.cost})" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg transition-all shadow-sm">
                        Purchase
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function buyShopItem(itemId, cost) {
      if ((state.stats.tokens || 0) < cost) {
        alert("⚠️ You need more tokens to unlock this item!");
        return;
      }
      state.stats.tokens -= cost;
      if (!state.inventory) state.inventory = [];
      state.inventory.push(itemId);
      saveUserState();
      renderShopView(document.getElementById('app-viewport'));
    }

    // ==========================================
    // PRIVATE STUDENT TESTS VIEW
    // ==========================================
    function renderStudentTestsView(container) {
      if (!app.currentUser || app.currentUser.role !== 'student') {
        app.navigate('home');
        return;
      }

      const tests = state.testHistory || [];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-3xl font-black text-slate-800">My Assessment Results</h1>
              <p class="text-xs sm:text-sm text-slate-500">Confidential record visible only to you and your teacher</p>
            </div>
            <button onclick="app.navigate('studentDash')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">
              &larr; Back to Dashboard
            </button>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
            ${tests.length === 0 ? `
              <div class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-clipboard-check text-4xl mb-2 text-slate-300"></i>
                <p class="text-sm">No completed tests recorded yet.</p>
              </div>
            ` : `
              <div class="divide-y divide-slate-100">
                ${tests.map(t => `
                  <div class="py-3 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-slate-800 text-sm">${t.title || 'Music Theory Quiz'}</div>
                      <div class="text-[10px] text-slate-400">${new Date(t.date).toLocaleDateString()}</div>
                    </div>
                    <div class="text-right">
                      <span class="font-black text-indigo-600 text-base">${t.score} / ${t.total}</span>
                      <span class="text-xs text-slate-400 block">${Math.round((t.score / t.total) * 100)}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // APPLICATION STARTUP BOOTSTRAP
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          app.currentUser = JSON.parse(savedSession);
          const users = getAllUserRecords();
          if (users[app.currentUser.key]) {
            const u = users[app.currentUser.key];
            state.stats = u.stats || { tokens: 10, testsTaken: 0 };
            state.inventory = u.inventory || [];
            state.testHistory = u.testHistory || [];
          }
        }
      } catch (e) {
        console.warn("Session restore:", e.message);
      }

      app.navigate(app.currentUser ? (app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash') : 'home');
      updateGlobalLeaderboard();
    };
  </script>
</body>
</html>
