  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

  <!-- CURRICULUM DATA & CORE LOGIC SCRIPT -->
  <script>
    // ==========================================
    // GLOBAL STATE, NAVIGATION & AUDIO ENGINE
    // ==========================================
    window.state = {
      stats: { tokens: 10, testsTaken: 0 },
      inventory: [],
      testHistory: [],
      completedLessons: []
    };

    window.app = {
      currentUser: null,
      currentView: 'home',
      navigate(view, params = null) {
        this.currentView = view;
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        updateNavBar();

        switch (view) {
          case 'home':
            renderHomeView(viewport);
            break;
          case 'login':
            renderLoginView(viewport);
            break;
          case 'studentDash':
            if (!this.currentUser) return renderLoginView(viewport);
            renderStudentDash(viewport);
            break;
          case 'teacherDash':
            if (!this.currentUser || this.currentUser.role !== 'teacher') return renderLoginView(viewport);
            renderTeacherDash(viewport);
            break;
          case 'conceptsHub':
            if (!this.currentUser) return renderLoginView(viewport);
            renderConceptsHub(viewport);
            break;
          case 'conceptDetail':
            if (!this.currentUser) return renderLoginView(viewport);
            renderConceptDetail(viewport, params);
            break;
          case 'levelDetail':
            if (!this.currentUser) return renderLoginView(viewport);
            renderLevelDetail(viewport, params);
            break;
          case 'lessonDetail':
            if (!this.currentUser) return renderLoginView(viewport);
            renderLessonDetail(viewport, params);
            break;
          case 'levelTest':
            if (!this.currentUser) return renderLoginView(viewport);
            renderLevelTestView(viewport, params);
            break;
          case 'shop':
            if (!this.currentUser) return renderLoginView(viewport);
            renderShopView(viewport);
            break;
          case 'rhythmModule':
            if (!this.currentUser) return renderLoginView(viewport);
            renderRhythmModule(viewport);
            break;
          case 'dictationChallenge':
            if (!this.currentUser) return renderLoginView(viewport);
            renderDictationChallenge(viewport);
            break;
          default:
            renderHomeView(viewport);
        }
      }
    };

    function updateNavBar() {
      const loginBtn = document.getElementById('nav-login-btn');
      const userProfile = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const userNameEl = document.getElementById('nav-user-name');
      const userRoleEl = document.getElementById('nav-user-role');
      const userTokensEl = document.getElementById('nav-user-tokens');

      if (app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (userProfile) {
          userProfile.classList.remove('hidden');
          userProfile.classList.add('flex');
        }
        if (userNameEl) userNameEl.textContent = `${app.currentUser.firstName} ${app.currentUser.surname}`;
        if (userRoleEl) {
          userRoleEl.textContent = app.currentUser.role === 'teacher'
            ? 'Music Staff'
            : `Class ${app.currentUser.class} • ${app.currentUser.teacher || 'Mr B'}`;
        }
        if (tokenBadge) {
          if (app.currentUser.role === 'student') {
            tokenBadge.classList.remove('hidden');
            tokenBadge.classList.add('flex');
            if (userTokensEl) userTokensEl.textContent = (state.stats && state.stats.tokens) || 0;
          } else {
            tokenBadge.classList.add('hidden');
          }
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (userProfile) {
          userProfile.classList.add('hidden');
          userProfile.classList.remove('flex');
        }
        if (tokenBadge) {
          tokenBadge.classList.add('hidden');
          tokenBadge.classList.remove('flex');
        }
      }
    }

    function protectedNavigate(view, params = null) {
      if (!app.currentUser) {
        showAppModal('Login Required', 'Please log in with your Student or Teacher account before accessing lessons, games, or the shop.', false);
        app.navigate('login');
        return;
      }
      app.navigate(view, params);
    }

    function openCurrentPortal() {
      if (!app.currentUser) {
        app.navigate('login');
        return;
      }
      app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
    }

    function logoutUser() {
      app.currentUser = null;
      try { localStorage.removeItem('boncepts_active_session'); } catch (e) {}
      updateNavBar();
      app.navigate('home');
    }

    function scrollToStudentLeaderboard() {
      const el = document.getElementById('overall-student-leaderboard-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      } else {
        app.navigate('home');
        setTimeout(() => {
          const target = document.getElementById('overall-student-leaderboard-section');
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        }, 120);
      }
    }

    function showAppModal(title, body, isSuccess = true) {
      const modal = document.getElementById('app-modal');
      const icon = document.getElementById('app-modal-icon');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      if (!modal) return;
      if (titleEl) titleEl.textContent = title;
      if (bodyEl) bodyEl.textContent = body;
      if (icon) {
        icon.className = isSuccess
          ? 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-emerald-100 text-emerald-600'
          : 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-amber-100 text-amber-600';
        icon.innerHTML = isSuccess ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-circle-info"></i>';
      }
      modal.classList.remove('hidden');
    }

    function closeAppModal() {
      const modal = document.getElementById('app-modal');
      if (modal) modal.classList.add('hidden');
    }

    function renderEngravedNoteDarkSVG(type, color = '#ffffff', sizeClass = 'w-11 h-12') {
      if (type === 'crotchet') {
        return `<svg viewBox="0 0 80 88" class="${sizeClass} select-none" aria-hidden="true">
          <ellipse cx="34" cy="66" rx="14.5" ry="10" transform="rotate(-24 34 66)" fill="${color}" />
          <line x1="47.2" y1="63" x2="47.2" y2="12" stroke="${color}" stroke-width="4.2" stroke-linecap="round" />
        </svg>`;
      }
      if (type === 'quavers') {
        return `<svg viewBox="0 0 96 88" class="${sizeClass} select-none" aria-hidden="true">
          <ellipse cx="26" cy="66" rx="13.5" ry="9.5" transform="rotate(-24 26 66)" fill="${color}" />
          <line x1="38.2" y1="63" x2="38.2" y2="16" stroke="${color}" stroke-width="4" stroke-linecap="round" />
          <ellipse cx="66" cy="66" rx="13.5" ry="9.5" transform="rotate(-24 66 66)" fill="${color}" />
          <line x1="78.2" y1="63" x2="78.2" y2="16" stroke="${color}" stroke-width="4" stroke-linecap="round" />
          <rect x="36.2" y="12" width="44" height="8.5" rx="1.5" fill="${color}" />
        </svg>`;
      }
      if (type === 'minim') {
        return `<svg viewBox="0 0 80 88" class="${sizeClass} select-none" aria-hidden="true">
          <ellipse cx="34" cy="66" rx="14.5" ry="10" transform="rotate(-24 34 66)" fill="none" stroke="${color}" stroke-width="4.2" />
          <line x1="47.2" y1="63" x2="47.2" y2="12" stroke="${color}" stroke-width="4.2" stroke-linecap="round" />
        </svg>`;
      }
      if (type === 'dottedMinim') {

    function getDeduplicatedStudents() {
      const records = getAllUserRecords();
      const list = [];
      Object.keys(records).forEach(k => {
        const r = records[k];
        if (!r || typeof r !== 'object') return;
        if (r.role === 'teacher') return;
        list.push({
          ...r,
          key: r.key || k,
          stats: (r.stats && typeof r.stats === 'object') ? r.stats : { tokens: 0, testsTaken: 0 }
        });
      });
      return list;
    }

      if (!app.currentUser) return;
      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(app.currentUser));
      } catch (e) {}

      if (app.currentUser.role === 'student') {
        const record = {
          ...app.currentUser,
          stats: state.stats || { tokens: 10, testsTaken: 0 },
          inventory: state.inventory || [],
          testHistory: state.testHistory || [],
          completedLessons: state.completedLessons || []
        };
        try {
          const all = getAllUserRecords();
          all[app.currentUser.key] = record;
          localStorage.setItem('boncepts_users_db', JSON.stringify(all));
        } catch (e) {}
        if (window.saveUserRecordToCloud) {
          window.saveUserRecordToCloud(app.currentUser.key, record);
        }

      updateNavBar();
      updateGlobalLeaderboard();

    // ==========================================
    // WEB AUDIO SYNTHESIZERS (DRUMS & PITCHES)
    // ==========================================
    let sharedAudioCtx = null;
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playDrumSound(type = 'kick') {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(145, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
        gain.gain.setValueAtTime(0.85, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.23);
      } else {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.12);
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }

    function playTonePitch(freq = 440, duration = 0.4, volume = 0.4) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

        if (!document.getElementById('beat-visual-orb')) {
          stopBeatTapLoop();
          return;

        if (beatGame.lastBeatTime > 0 && !beatGame.tappedThisBeat && beatGame.streak > 0) {
          beatGame.streak = 0;
          updateBeatPipsUI('Missed a beat! Keep tapping steady.', 'text-rose-400');

        beatGame.lastBeatTime = performance.now();
        beatGame.tappedThisBeat = false;

        playTonePitch(523.25, 0.08, 0.35);
        const orb = document.getElementById('beat-visual-orb');
        if (orb) {
          orb.classList.add('scale-110', 'bg-amber-400', 'border-amber-300');
          setTimeout(() => {
            if (orb) orb.classList.remove('scale-110', 'bg-amber-400', 'border-amber-300');
          }, 120);
        }
      };

      pulseTick();
      beatGame.timerId = setInterval(pulseTick, beatGame.beatIntervalMs);

      }

    function registerBeatTap() {
      if (!beatGame.active || beatGame.completed) return;
      const now = performance.now();
      const diffFromLast = Math.abs(now - beatGame.lastBeatTime);
      const diffToNext = Math.abs(beatGame.beatIntervalMs - diffFromLast);
      const errorMs = Math.min(diffFromLast, diffToNext);
      const tolerance = Math.max(175, beatGame.beatIntervalMs * 0.34);

      if (errorMs <= tolerance && !beatGame.tappedThisBeat) {
        beatGame.tappedThisBeat = true;
        beatGame.streak++;
        playDrumSound('snare');
        updateBeatPipsUI('In Time! Keep going...', 'text-emerald-400');

      crotchetGame.hitBeats = new Set();
      crotchetGame.mistakes = 0;
      crotchetGame.active = true;
      renderCrotchetGameUI();

      const stepTick = () => {
        if (!document.getElementById('crotchet-feedback-msg')) {
          stopCrotchetGameLoop();
          return;
        }
        if (crotchetGame.currentBeat >= 0 && crotchetGame.currentBeat < 8) {
          const prev = crotchetGame.currentBeat;
          if (crotchetGame.pattern[prev] && !crotchetGame.hitBeats.has(prev)) {
            crotchetGame.mistakes++;
            const missedEl = document.getElementById(`crotchet-beat-card-${prev}`);
            if (missedEl) missedEl.classList.add('border-rose-500', 'bg-rose-950/70');
          }
        }

        crotchetGame.currentBeat++;
        crotchetGame.lastBeatTime = performance.now();
        const fb = document.getElementById('crotchet-feedback-msg');
        const badge = document.getElementById('crotchet-status-badge');

        if (crotchetGame.currentBeat < 0) {
          const countNum = crotchetGame.currentBeat + 5;
          playTonePitch(countNum === 1 ? 660 : 520, 0.08, 0.3);
          if (fb) fb.innerHTML = `<span class="text-2xl sm:text-3xl font-black text-amber-300 tracking-wide">Count-in: ${countNum}</span>`;
          if (badge) badge.textContent = `Count-in: ${countNum} / 4`;
          return;
        }

        if (crotchetGame.currentBeat < 8) {
          const b = crotchetGame.currentBeat;
          playTonePitch(440, 0.06, 0.22);
          if (badge) badge.textContent = `Beat ${b + 1} / 8`;
          for (let i = 0; i < 8; i++) {
            const card = document.getElementById(`crotchet-beat-card-${i}`);
            if (card) card.classList.toggle('beat-active', i === b);
          }
          if (fb) {
            fb.innerHTML = crotchetGame.pattern[b]
              ? `<span class="text-xl sm:text-2xl font-black text-amber-300">Beat ${b + 1}: TAP! (♩)</span>`
              : `<span class="text-xl sm:text-2xl font-black text-slate-400">Beat ${b + 1}: REST (𝄽)</span>`;
          }
        } else {
          const passed = crotchetGame.mistakes === 0;
          stopCrotchetGameLoop();

          if (passed) {
            if (crotchetGame.speedIdx < crotchetSpeeds.length - 1) {
              crotchetGame.speedIdx++;
              generateCrotchetPattern();
              renderCrotchetGameUI();
              showAppModal('Pattern Cleared!', `Zero mistakes! Advancing to ${crotchetSpeeds[crotchetGame.speedIdx].name}.`, true);
            } else {
              crotchetGame.completed = true;
              addTokens(10);
              renderCrotchetGameUI();
              showAppModal('🏆 Crotchet Sight-Reader Master!', 'You sight-read all 4 speeds accurately and earned +10 Tokens!', true);
            }
          } else {
            generateCrotchetPattern();
            renderCrotchetGameUI();
            showAppModal('Try Again!', 'You missed a crotchet or tapped during a rest. Watch the pattern and try again!', false);
          }
        }
      };

      stepTick();
      crotchetGame.timerId = setInterval(stepTick, crotchetGame.beatIntervalMs);
    }

    function registerCrotchetTap() {
      if (!crotchetGame.active || crotchetGame.completed) return;
      if (crotchetGame.currentBeat < 0) return;

      const now = performance.now();
      let targetBeat = crotchetGame.currentBeat;
      const elapsed = now - crotchetGame.lastBeatTime;
      if (elapsed > crotchetGame.beatIntervalMs * 0.65 && targetBeat < 7) {

    // ==========================================

    function stopQuaverGameLoop() {
      if (quaverGame.timerId) {
        clearInterval(quaverGame.timerId);
        quaverGame.timerId = null;

      quaverGame.currentHalfStep = -9;

    function generateQuaverComboPattern() {
      const choices = ['crotchet', 'quavers', 'quavers', 'rest'];
      const pat = Array.from({ length: 8 }, () => choices[Math.floor(Math.random() * choices.length)]);
      if (!pat.includes('quavers')) pat[1] = pat[5] = 'quavers';
      if (!pat.includes('crotchet')) pat[0] = pat[4] = 'crotchet';
      quaverGame.pattern = pat;
    }

    function isExpectedHitAtHalfStep(hs) {
      if (hs < 0 || hs > 15) return false;
      const beatIdx = Math.floor(hs / 2);
      const isAnd = hs % 2 === 1;
      const cell = quaverGame.pattern[beatIdx];
      if (cell === 'crotchet') return !isAnd;
      if (cell === 'quavers') return true;
      return false;
    }

    function mountEmbeddedQuaverGame(target) {

    function startQuaverSpeed() {
      stopQuaverGameLoop();
      const spd = quaverSpeeds[quaverGame.speedIdx] || quaverSpeeds[0];
      quaverGame.halfStepMs = Math.round(30000 / spd.bpm);
      quaverGame.currentHalfStep = -9;
      quaverGame.hitHalfSteps = new Set();
      quaverGame.mistakes = 0;
      quaverGame.active = true;
      renderQuaverGameUI();

      const halfStepTick = () => {
        if (!document.getElementById('quaver-feedback-msg')) {
          stopQuaverGameLoop();
          return;
        }

        if (quaverGame.currentHalfStep >= 0 && quaverGame.currentHalfStep < 16) {
          const prevHs = quaverGame.currentHalfStep;
          if (isExpectedHitAtHalfStep(prevHs) && !quaverGame.hitHalfSteps.has(prevHs)) {
            quaverGame.mistakes++;
            const prevBeatIdx = Math.floor(prevHs / 2);
            const missedEl = document.getElementById(`quaver-beat-card-${prevBeatIdx}`);
            if (missedEl) missedEl.classList.add('border-rose-500', 'bg-rose-950/70');
          }
        }

        quaverGame.currentHalfStep++;
        quaverGame.lastStepTime = performance.now();
        const fb = document.getElementById('quaver-feedback-msg');
        const badge = document.getElementById('quaver-status-badge');

        if (quaverGame.currentHalfStep < 0) {
          const absStep = quaverGame.currentHalfStep + 8;
          if (absStep % 2 === 0) {
            const countNum = Math.floor(absStep / 2) + 1;
            playTonePitch(countNum === 1 ? 660 : 520, 0.07, 0.28);
            if (fb) fb.textContent = `Count-in: ${countNum}`;
            if (badge) badge.textContent = `Count-in: ${countNum} / 4`;
          }
          return;
        }

        if (quaverGame.currentHalfStep < 16) {
          const hs = quaverGame.currentHalfStep;
          const beatIdx = Math.floor(hs / 2);
          const isAnd = hs % 2 === 1;
          const cell = quaverGame.pattern[beatIdx];

          if (!isAnd) {
            playTonePitch(440, 0.05, 0.2);
          }
          if (badge) badge.textContent = `Beat ${beatIdx + 1}${isAnd ? ' &' : ''}`;

          for (let i = 0; i < 8; i++) {
            const card = document.getElementById(`quaver-beat-card-${i}`);
            if (card) card.classList.toggle('beat-active', i === beatIdx);
          }

          if (fb) {
            if (cell === 'quavers') {
              fb.textContent = isAnd ? `Beat ${beatIdx + 1} &: TAP "&"! (♫)` : `Beat ${beatIdx + 1}: TAP "${beatIdx + 1}"! (♫)`;
            } else if (cell === 'crotchet') {
              fb.textContent = isAnd ? `Beat ${beatIdx + 1} (hold)` : `Beat ${beatIdx + 1}: TAP ONCE! (♩)`;
            } else {
              fb.textContent = `Beat ${beatIdx + 1}: REST (𝄽)`;
            }
          }
        } else {
          const passed = quaverGame.mistakes === 0;
          stopQuaverGameLoop();

          if (passed) {
            if (quaverGame.speedIdx < quaverSpeeds.length - 1) {
              quaverGame.speedIdx++;
              generateQuaverComboPattern();
              renderQuaverGameUI();
              showAppModal('Combo Pattern Cleared!', `Clean quaver & crotchet execution! Advancing to ${quaverSpeeds[quaverGame.speedIdx].name}.`, true);
            } else {
              quaverGame.completed = true;
              addTokens(10);
              renderQuaverGameUI();
              showAppModal('🏆 Quaver & Crotchet Master!', 'You completed all 4 speeds of Quaver & Crotchet combinations and earned +10 Tokens!', true);
            }
          } else {
            generateQuaverComboPattern();
            renderQuaverGameUI();
            showAppModal('Try Again!', 'Remember: tap twice ("1 &") on Paired Quavers (♫), once on Crotchets (♩), and skip Rests (𝄽).', false);
          }
        }
      };

      halfStepTick();
      quaverGame.timerId = setInterval(halfStepTick, quaverGame.halfStepMs);
    }

    function registerQuaverTap() {
      if (!quaverGame.active || quaverGame.completed) return;
      if (quaverGame.currentHalfStep < 0) return;

      const now = performance.now();
      let targetHs = quaverGame.currentHalfStep;
      const elapsed = now - quaverGame.lastStepTime;
      if (elapsed > quaverGame.halfStepMs * 0.58 && targetHs < 15) {
        targetHs++;
      }
      if (targetHs < 0 || targetHs > 15) return;

      const beatIdx = Math.floor(targetHs / 2);
      const card = document.getElementById(`quaver-beat-card-${beatIdx}`);

      if (isExpectedHitAtHalfStep(targetHs) && !quaverGame.hitHalfSteps.has(targetHs)) {
        quaverGame.hitHalfSteps.add(targetHs);
        playDrumSound(targetHs % 2 === 0 ? 'kick' : 'snare');
        const cell = quaverGame.pattern[beatIdx];
        const beatComplete = cell === 'crotchet'
          ? quaverGame.hitHalfSteps.has(beatIdx * 2)
          : (quaverGame.hitHalfSteps.has(beatIdx * 2) && quaverGame.hitHalfSteps.has(beatIdx * 2 + 1));
        if (card && beatComplete) {
          card.classList.add('border-emerald-400', 'bg-emerald-950/80');
        }
      } else {
        quaverGame.mistakes++;
        playTonePitch(160, 0.12, 0.35);
        if (card) card.classList.add('border-rose-500', 'bg-rose-950/80');
      }
    }

    const longNoteSpeeds = [

      active: false,
      completed: false,
      speedIdx: 0,
      // 8-beat phrase composed of notes with startBeat (0..7) and duration (1, 2, 3, or 4)
      notes: [
        { noteType: 'semibreve', name: 'Semibreve', startBeat: 0, duration: 4 },
        { noteType: 'dottedMinim', name: 'Dotted Minim', startBeat: 4, duration: 3 },
        { noteType: 'crotchet', name: 'Crotchet', startBeat: 7, duration: 1 }
      ],
      currentBeat: -5, // -4..-1 count-in, 0..7 beats
      timerId: null,
      beatIntervalMs: 789,
      isHolding: false,
      activeNoteIdx: -1,
      heldBeatsForCurrent: 0,
      startedOnTimeForCurrent: false,
      mistakes: 0,
      sustainOsc: null,
      sustainGain: null
    };

    function startSustainSynth(freq = 329.63) {
      if (longNoteGame.sustainOsc) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.04);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);

      longNoteGame.sustainOsc = osc;
      longNoteGame.sustainGain = gain;
    }

    function stopSustainSynth() {
      if (longNoteGame.sustainOsc && longNoteGame.sustainGain) {
        try {
          const ctx = getAudioCtx();
          const now = ctx ? ctx.currentTime : 0;
          longNoteGame.sustainGain.gain.setTargetAtTime(0.0001, now, 0.02);
          longNoteGame.sustainOsc.stop(now + 0.06);
        } catch (e) {}
      }
      longNoteGame.sustainOsc = null;
      longNoteGame.sustainGain = null;
    }

    function stopLongNoteGameLoop() {
      if (longNoteGame.timerId) {
        clearInterval(longNoteGame.timerId);
        longNoteGame.timerId = null;
      }
      stopSustainSynth();
      longNoteGame.active = false;
      longNoteGame.isHolding = false;
      longNoteGame.currentBeat = -5;
    }

    function generateLongNotePhrase() {
      // Build an 8-beat phrase combining Semibreve (4), Dotted Minim (3), Minim (2), and Crotchet (1)
      const templates = [
        [
          { noteType: 'semibreve', name: 'Semibreve', startBeat: 0, duration: 4 },
          { noteType: 'minim', name: 'Minim', startBeat: 4, duration: 2 },

          { noteType: 'crotchet', name: 'Crotchet', startBeat: 3, duration: 1 },
          { noteType: 'semibreve', name: 'Semibreve', startBeat: 4, duration: 4 }
        ],
        [
          { noteType: 'minim', name: 'Minim', startBeat: 0, duration: 2 },
          { noteType: 'dottedMinim', name: 'Dotted Minim', startBeat: 2, duration: 3 },
          { noteType: 'dottedMinim', name: 'Dotted Minim', startBeat: 5, duration: 3 }
        ],
        [
          { noteType: 'semibreve', name: 'Semibreve', startBeat: 0, duration: 4 },
          { noteType: 'dottedMinim', name: 'Dotted Minim', startBeat: 4, duration: 3 },
          { noteType: 'crotchet', name: 'Crotchet', startBeat: 7, duration: 1 }
        ]
      ];
      const chosen = templates[Math.floor(Math.random() * templates.length)];
      longNoteGame.notes = chosen.map(n => ({ ...n }));
    }

    function mountEmbeddedLongNoteGame(target) {

      if (!target) return;

      longNoteGame.speedIdx = 0;
      longNoteGame.completed = false;
      generateLongNotePhrase();
      renderLongNoteGameUI(target);

          ${longNoteGame.completed ? `

              <!-- 8-Beat Proportional Timeline -->
              <div class="grid grid-cols-8 gap-2">
                ${longNoteGame.notes.map((n, nIdx) => {
                  const spanClass = n.duration === 4 ? 'col-span-4' : n.duration === 3 ? 'col-span-3' : n.duration === 2 ? 'col-span-2' : 'col-span-1';
                  const colorClass = n.duration === 4
                    ? 'bg-amber-950/70 border-amber-400 text-amber-300'
                    : n.duration === 3
                    ? 'bg-violet-950/80 border-violet-400 text-violet-300'
                    : n.duration === 2
                    ? 'bg-indigo-950/80 border-indigo-400 text-indigo-300'
                    : 'bg-sky-950/80 border-sky-400 text-sky-300';
                  const strokeHex = n.duration === 4 ? '#fcd34d' : n.duration === 3 ? '#c4b5fd' : n.duration === 2 ? '#a5b4fc' : '#7dd3fc';
                  const beatSpanText = n.duration === 1 ? `Beat ${n.startBeat + 1}` : `Beats ${n.startBeat + 1}–${n.startBeat + n.duration}`;
                  return `
                    <div id="longnote-card-${nIdx}" class="${spanClass} p-3 rounded-2xl border-2 ${colorClass} flex flex-col items-center justify-between h-32 transition-all">
                      <span class="text-[10px] font-black uppercase tracking-wider text-slate-300">${beatSpanText}</span>
                      ${renderEngravedNoteDarkSVG(n.noteType || 'minim', strokeHex, 'w-12 h-14')}
                      <span class="text-[11px] font-black text-white">${n.name} (${n.duration}b)</span>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- 8-Beat Pulse Strip -->
              <div class="grid grid-cols-8 gap-2">
                ${Array.from({ length: 8 }, (_, b) => `
                  <div id="longnote-beat-dot-${b}" class="py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-center text-[11px] font-black text-slate-400">
                    ${b + 1}
                  </div>
                `).join('')}
              </div>

              <div id="longnote-feedback-msg" class="text-center font-black text-slate-300 min-h-[2.75rem] flex items-center justify-center">
                ${longNoteGame.active ? '<span class="text-2xl sm:text-3xl text-amber-300">Count-in: 1</span>' : '<span class="text-sm sm:text-base">Press Start Sustain Challenge to begin</span>'}
              </div>

              <div class="flex items-center justify-center gap-3">
                ${!longNoteGame.active ? `
                  <button onclick="startLongNoteSpeed()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl text-xs shadow-lg">
                    <i class="fa-solid fa-play mr-1"></i> Start Sustain Challenge (${spd.bpm} BPM)
                  </button>
                ` : `
                  <button
                    onmousedown="handleLongNotePress()"
                    onmouseup="handleLongNoteRelease()"
                    onmouseleave="handleLongNoteRelease()"
                    ontouchstart="event.preventDefault(); handleLongNotePress();"
                    ontouchend="event.preventDefault(); handleLongNoteRelease();"
                    class="px-8 py-4 bg-amber-400 hover:bg-amber-300 active:bg-emerald-400 text-slate-950 font-black rounded-2xl text-sm shadow-lg select-none">
                    PRESS & HOLD NOTE (or Hold SPACEBAR)
                  </button>
                  <button onclick="stopLongNoteGameLoop(); renderLongNoteGameUI();" class="px-4 py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs">
                    Stop
                  </button>
                `}
              </div>
            </div>
          `}
        </div>
      `;
    }

    function startLongNoteSpeed() {
      stopLongNoteGameLoop();
      const spd = longNoteSpeeds[longNoteGame.speedIdx] || longNoteSpeeds[0];
      longNoteGame.beatIntervalMs = Math.round(60000 / spd.bpm);
      longNoteGame.currentBeat = -5; // -4..-1 count-in, 0..7 beats
      longNoteGame.mistakes = 0;
      longNoteGame.activeNoteIdx = -1;
      longNoteGame.heldBeatsForCurrent = 0;
      longNoteGame.startedOnTimeForCurrent = false;
      longNoteGame.active = true;
      renderLongNoteGameUI();

      const beatTick = () => {
        if (!document.getElementById('longnote-feedback-msg')) {
          stopLongNoteGameLoop();
          return;
        }

        // Evaluate the beat that just finished (0..7)
        if (longNoteGame.currentBeat >= 0 && longNoteGame.currentBeat < 8) {
          const finishedBeat = longNoteGame.currentBeat;
          const noteIdx = longNoteGame.notes.findIndex(n => finishedBeat >= n.startBeat && finishedBeat < n.startBeat + n.duration);
          const noteObj = longNoteGame.notes[noteIdx];
          const cardEl = document.getElementById(`longnote-card-${noteIdx}`);

          // Check if player was holding during this beat
          if (longNoteGame.isHolding && longNoteGame.startedOnTimeForCurrent) {
            longNoteGame.heldBeatsForCurrent++;
          } else {
            longNoteGame.mistakes++;
            if (cardEl) cardEl.classList.add('border-rose-500', 'bg-rose-950/70');
          }

          // If this was the final beat of the current note, verify full duration was held
          if (noteObj && finishedBeat === noteObj.startBeat + noteObj.duration - 1) {
            if (longNoteGame.heldBeatsForCurrent >= noteObj.duration) {
              if (cardEl) cardEl.classList.add('border-emerald-400', 'bg-emerald-950/70');
            } else {
              longNoteGame.mistakes++;
              if (cardEl) cardEl.classList.add('border-rose-500', 'bg-rose-950/70');
            }
          }
        }

        longNoteGame.currentBeat++;
        const fb = document.getElementById('longnote-feedback-msg');
        const badge = document.getElementById('longnote-status-badge');

        if (longNoteGame.currentBeat < 0) {
          const countNum = longNoteGame.currentBeat + 5; // 1, 2, 3, 4
          playTonePitch(countNum === 1 ? 660 : 520, 0.08, 0.3);
          if (fb) fb.innerHTML = `<span class="text-2xl sm:text-3xl font-black text-amber-300 tracking-wide">Count-in: ${countNum}</span>`;
          if (badge) badge.textContent = `Count-in: ${countNum} / 4`;
          return;
        }

        if (longNoteGame.currentBeat < 8) {
          const b = longNoteGame.currentBeat;
          playTonePitch(b === 0 || b === 4 ? 587 : 440, 0.05, 0.16);
          if (badge) badge.textContent = `Beat ${b + 1} / 8`;

          for (let i = 0; i < 8; i++) {
            const dot = document.getElementById(`longnote-beat-dot-${i}`);
            if (dot) {
              dot.className = i === b
                ? 'py-1.5 rounded-lg bg-amber-400 border border-amber-300 text-center text-[11px] font-black text-slate-950 scale-105 transition-all'
                : 'py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-center text-[11px] font-black text-slate-400';
            }
          }

          const noteIdx = longNoteGame.notes.findIndex(n => b >= n.startBeat && b < n.startBeat + n.duration);
          const noteObj = longNoteGame.notes[noteIdx];

          if (noteIdx !== longNoteGame.activeNoteIdx) {
            longNoteGame.activeNoteIdx = noteIdx;
            longNoteGame.heldBeatsForCurrent = 0;
            // Must strike freshly for the new note (not just keep holding from a previous note)
            longNoteGame.startedOnTimeForCurrent = false;
          }

          for (let i = 0; i < longNoteGame.notes.length; i++) {
            const c = document.getElementById(`longnote-card-${i}`);
            if (c) c.classList.toggle('beat-active', i === noteIdx);
          }

          if (noteObj && fb) {
            const beatWithinNote = (b - noteObj.startBeat) + 1;
            fb.innerHTML = beatWithinNote === 1
              ? `<span class="text-lg sm:text-xl font-black text-amber-300">STRIKE & HOLD ${noteObj.name} for ${noteObj.duration} beat(s)!</span>`
              : `<span class="text-lg sm:text-xl font-black text-emerald-300">KEEP HOLDING ${noteObj.name}... (${beatWithinNote} / ${noteObj.duration})</span>`;
          }
        } else {
          // End of 8-beat phrase
          const passed = longNoteGame.mistakes === 0;
          stopLongNoteGameLoop();

          if (passed) {
            if (longNoteGame.speedIdx < longNoteSpeeds.length - 1) {
              longNoteGame.speedIdx++;
              generateLongNotePhrase();
              renderLongNoteGameUI();
              showAppModal('Sustain Phrase Cleared!', `Full note durations held cleanly! Advancing to ${longNoteSpeeds[longNoteGame.speedIdx].name}.`, true);
            } else {
              longNoteGame.completed = true;
              addTokens(10);
              renderLongNoteGameUI();
              showAppModal('🏆 Long Note Master!', 'You held every Minim, Dotted Minim, and Semibreve accurately across all 4 speeds and earned +10 Tokens!', true);
            }
          } else {
            generateLongNotePhrase();
            renderLongNoteGameUI();
            showAppModal('Try Again!', 'Make sure you strike at the start of each note, hold for its full beat value (2, 3, or 4 beats), and release briefly before the next note!', false);
          }
        }
      };

      beatTick();
      longNoteGame.timerId = setInterval(beatTick, longNoteGame.beatIntervalMs);
    }

    function handleLongNotePress() {
      if (!longNoteGame.active || longNoteGame.completed || longNoteGame.isHolding) return;
      longNoteGame.isHolding = true;

      const freqs = [261.63, 329.63, 392.00, 523.25];
      const f = freqs[Math.max(0, longNoteGame.activeNoteIdx) % freqs.length];
      startSustainSynth(f);

      if (longNoteGame.currentBeat >= 0 && longNoteGame.currentBeat < 8) {
        const noteObj = longNoteGame.notes[longNoteGame.activeNoteIdx];
        if (noteObj && longNoteGame.currentBeat === noteObj.startBeat) {
          longNoteGame.startedOnTimeForCurrent = true;
        }
      }
    }

    function handleLongNoteRelease() {
      if (!longNoteGame.isHolding) return;
      longNoteGame.isHolding = false;
      stopSustainSynth();
    }

    // Unified Spacebar Listener for Active Rhythm Minigames
    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && (beatGame.active || crotchetGame.active || quaverGame.active || longNoteGame.active)) {
        e.preventDefault();
        if (e.repeat) return;
        if (beatGame.active) registerBeatTap();
        if (crotchetGame.active) registerCrotchetTap();
        if (quaverGame.active) registerQuaverTap();
        if (longNoteGame.active) handleLongNotePress();
      }
    });

    window.addEventListener('keyup', function(e) {
      if (e.code === 'Space' && longNoteGame.active) {
        e.preventDefault();
        handleLongNoteRelease();
      }
    });

    // ==========================================
    // VIRTUAL PITCH KEYBOARD & DYNAMICS SIMULATOR
    // ==========================================
    function mountEmbeddedPitchKeyboard(target) {
      if (!target) return;
      const notes = [
        { name: 'C4', freq: 261.63 },
        { name: 'D4', freq: 293.66 },
        { name: 'E4', freq: 329.63 },
        { name: 'F4', freq: 349.23 },
        { name: 'G4', freq: 392.00 },

        { name: 'B4', freq: 493.88 },
        { name: 'C5', freq: 523.25 }
      ];
      target.innerHTML = `
        <div class="bg-slate-900 p-6 rounded-3xl space-y-3">
          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">

              <button onclick="playTonePitch(${n.freq}, 0.55, 0.45)" class="h-28 bg-white hover:bg-indigo-50 active:bg-amber-200 text-slate-900 rounded-2xl border-2 border-slate-300 shadow flex flex-col items-center justify-end pb-3 transition-all">
                <span class="font-black text-sm">${n.name}</span>

                <div class="text-2xl font-serif italic font-black">${d.mark}</div>

    // ==========================================
    // 8-BEAT DRUM SOUND MODULE & DICTATION LAB
    // ==========================================
    let drumSequencerState = {
      tab: 'sandbox',
      bpm: 110,
      isPlaying: false,
      pattern: ['crotchet', 'quavers', 'crotchet', 'quavers', 'crotchet', 'crotchet', 'quavers', 'crotchet'],
      dictationTarget: [],
      dictationChoices: [],
      dictationStreak: 0
    };

    function mountEmbeddedDrumModule(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      if (drumSequencerState.dictationTarget.length === 0) {
        generateNewDictationRound();
      }
      renderDrumLabUI(target);
    }

    function mountEmbeddedDictation(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      drumSequencerState.tab = 'dictation';
      if (drumSequencerState.dictationTarget.length === 0) {
        generateNewDictationRound();
      }
      renderDrumLabUI(target);
    }

    function switchDrumLabTab(tab) {
      drumSequencerState.tab = tab;
      if (tab === 'dictation' && drumSequencerState.dictationTarget.length === 0) {
        generateNewDictationRound();
      }
      renderDrumLabUI();
    }

    function togglePatternBeat(idx) {
      drumSequencerState.pattern[idx] = drumSequencerState.pattern[idx] === 'crotchet' ? 'quavers' : 'crotchet';
      playDrumSound(idx % 2 === 0 ? 'kick' : 'snare');
      renderDrumLabUI();
    }

    function randomizeDrumPattern() {
      drumSequencerState.pattern = Array.from({ length: 8 }, () => (Math.random() > 0.45 ? 'crotchet' : 'quavers'));
      renderDrumLabUI();
    }

    function playPatternArray(pat, highlightIds = true) {
      if (drumSequencerState.isPlaying) return;
      drumSequencerState.isPlaying = true;
      const stepMs = Math.round(60000 / drumSequencerState.bpm);

      pat.forEach((type, idx) => {
        setTimeout(() => {
          const drumType = idx % 2 === 0 ? 'kick' : 'snare';
          if (highlightIds) {
            for (let i = 0; i < 8; i++) {
              const el = document.getElementById(`drum-beat-card-${i}`);
              if (el) el.classList.toggle('beat-active', i === idx);
            }
          }
          playDrumSound(drumType);
          if (type === 'quavers') {
            setTimeout(() => playDrumSound(drumType), Math.round(stepMs / 2));
          }
          if (idx === pat.length - 1) {
            setTimeout(() => {
              drumSequencerState.isPlaying = false;
              if (highlightIds) {
                for (let i = 0; i < 8; i++) {
                  const el = document.getElementById(`drum-beat-card-${i}`);
                  if (el) el.classList.remove('beat-active');
                }
              }
            }, stepMs);
          }
        }, idx * stepMs);
      });
    }

    function playCurrentPattern() {
      playPatternArray(drumSequencerState.pattern, true);
    }

    function generateNewDictationRound() {
      const makePat = () => Array.from({ length: 8 }, () => (Math.random() > 0.45 ? 'crotchet' : 'quavers'));
      const correctPat = makePat();
      const choices = [correctPat];
      while (choices.length < 3) {
        const candidate = makePat();
        if (!choices.some(c => c.join(',') === candidate.join(','))) {
          choices.push(candidate);
        }
      }
      choices.sort(() => Math.random() - 0.5);
      drumSequencerState.dictationTarget = correctPat;
      drumSequencerState.dictationChoices = choices;
    }

    function checkDictationChoice(choiceIdx) {
      const chosen = drumSequencerState.dictationChoices[choiceIdx];
      const isCorrect = chosen && chosen.join(',') === drumSequencerState.dictationTarget.join(',');
      if (isCorrect) {
        drumSequencerState.dictationStreak++;
        addTokens(5);
        showAppModal('🎉 Correct Dictation!', `Spot on! You matched the 8-beat rhythm and earned +5 Tokens (Streak: ${drumSequencerState.dictationStreak}).`, true);
        generateNewDictationRound();
        renderDrumLabUI();
      } else {
        drumSequencerState.dictationStreak = 0;
        showAppModal('Not Quite!', 'Listen again to the mystery beat pattern and compare the crotchets (♩) and quavers (♫).', false);
        renderDrumLabUI();
      }
    }

    function renderDrumLabUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-6 border border-slate-800">
          <!-- Mode Tabs -->

            <div class="flex items-center gap-2">

                <i class="fa-solid fa-drum mr-1"></i> 1. 8-Beat Drum Sequencer

                <i class="fa-solid fa-ear-listen mr-1"></i> 2. Dictation Activity (+5 Tokens)
              </button>
            </div>
            <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
              <span>Tempo: ${drumSequencerState.bpm} BPM</span>
              <input type="range" min="70" max="150" value="${drumSequencerState.bpm}" onchange="drumSequencerState.bpm = Number(this.value); renderDrumLabUI();" class="w-24 accent-amber-400">
            </div>
          </div>

          ${drumSequencerState.tab === 'sandbox' ? `
            <div class="space-y-5">
              <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5">
                ${drumSequencerState.pattern.map((type, idx) => {
                  const isKick = idx % 2 === 0;
                  const countText = type === 'crotchet' ? `${idx + 1}` : `${idx + 1} &`;
                  return `
                    <button id="drum-beat-card-${idx}" onclick="togglePatternBeat(${idx})" class="note-btn p-3 rounded-2xl border-2 ${isKick ? 'bg-blue-600/90 border-blue-400' : 'bg-rose-600/90 border-rose-400'} flex flex-col items-center justify-between h-28 shadow-md">
                      <span class="text-[10px] font-black uppercase tracking-wider text-white/80">${isKick ? 'KICK' : 'SNARE'}</span>
                      ${renderEngravedNoteDarkSVG(type === 'crotchet' ? 'crotchet' : 'quavers', '#ffffff', 'w-11 h-12')}
                      <span class="text-xs font-black bg-black/25 px-2 py-0.5 rounded-md text-amber-200">${countText}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              <div class="flex flex-wrap items-center justify-center gap-3">
                <button onclick="playCurrentPattern()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl text-xs shadow-lg flex items-center gap-2">
                  <i class="fa-solid fa-play"></i> Play 8-Beat Pattern
                </button>
                <button onclick="randomizeDrumPattern()" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl text-xs border border-slate-700">
                  <i class="fa-solid fa-shuffle mr-1"></i> Randomize Beats
                </button>
              </div>
            </div>
          ` : `
            <div class="space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
                <div>
                  <h4 class="font-black text-sm text-amber-300">Listen & Match the 8-Beat Pattern</h4>
                  <p class="text-xs text-slate-300">Click <strong>Hear Mystery Rhythm</strong>, then select the matching notation sequence below.</p>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-xs font-bold text-emerald-400">Streak: ${drumSequencerState.dictationStreak}</span>
                  <button onclick="playPatternArray(drumSequencerState.dictationTarget, false)" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs shadow">
                    <i class="fa-solid fa-volume-high mr-1"></i> Hear Mystery Rhythm
                  </button>
                </div>
              </div>

              <div class="space-y-3">
                ${drumSequencerState.dictationChoices.map((choice, cIdx) => `
                  <button onclick="checkDictationChoice(${cIdx})" class="w-full p-4 rounded-2xl bg-slate-800 hover:bg-indigo-900/70 border border-slate-700 hover:border-amber-400 transition-all text-left flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <span class="text-xs font-black uppercase tracking-wider text-amber-300 shrink-0">Option ${String.fromCharCode(65 + cIdx)}</span>
                    <div class="grid grid-cols-8 gap-1.5 w-full">
                      ${choice.map((t, bIdx) => `
                        <div class="p-2 rounded-xl ${bIdx % 2 === 0 ? 'bg-blue-950/90 border border-blue-700' : 'bg-rose-950/90 border border-rose-700'} text-center flex flex-col items-center justify-center">
                          ${renderEngravedNoteDarkSVG(t === 'crotchet' ? 'crotchet' : 'quavers', '#ffffff', 'w-8 h-9')}
                          <div class="text-[9px] font-bold text-slate-300 mt-1">${bIdx + 1}</div>
                        </div>
                      `).join('')}
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>
          `}
        </div>
      `;
    }

    function renderRhythmModule(container) {
      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6">
          <button onclick="app.navigate('conceptsHub')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">&larr; Back to Concepts</button>

      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const questions = level.testQuestions || [];

      container.innerHTML = `

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">

                  </p>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${item.options.map((opt, oIdx) => `

    function submitLevelTest(conceptId, levelNum) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const questions = level.testQuestions || [];
      let score = 0;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected && Number(selected.value) === q.correct) {
          score++;
        }
      });

      const pct = Math.round((score / questions.length) * 100);
      const earnedTokens = pct >= 80 ? 25 : pct >= 50 ? 15 : 5;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.unshift({
        concept: concept.title,
        level: level.title,
        score: score,
        total: questions.length,
        percentage: pct,
        date: new Date().toLocaleDateString()
      });
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;
      addTokens(earnedTokens);

      showAppModal(
        `Test Complete: ${score}/${questions.length} (${pct}%)`,
        `Your mark has been confidentially recorded in your Student Markbook, and you earned +${earnedTokens} Tokens!`,
        pct >= 50
      );
      app.navigate('studentDash');
    }

      if (bal < item.cost) {

                              lvl.lessons.forEach(les => {
                                totalLessonsInConcept++;
                                const lKey = `${concept.id}_lvl${lvl.level}_les${les.lessonNum}`;
                                if (completedLessons.includes(lKey)) viewedCount++;
                              });
                            });
                            const isModuleComplete = totalLessonsInConcept > 0 && viewedCount >= totalLessonsInConcept;
                            const isStarted = viewedCount > 0 && !isModuleComplete;

                            return `
                              <div class="p-3 rounded-2xl border ${isModuleComplete ? 'bg-emerald-50/70 border-emerald-200' : isStarted ? 'bg-amber-50/60 border-amber-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5 min-w-0">
                                  <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs shrink-0 ${
                                    isModuleComplete
                                      ? 'bg-emerald-500 text-white'
                                      : isStarted
                                      ? 'bg-amber-400 text-slate-950'
                                      : 'bg-white border border-slate-300 text-slate-300'
                                  }">
                                    <i class="fa-solid ${isModuleComplete ? 'fa-check' : isStarted ? 'fa-spinner' : 'fa-minus'}"></i>
                                  </span>
                                  <div class="truncate">
                                    <div class="text-xs font-bold text-slate-800 truncate">${concept.title}</div>
                                    <div class="text-[10px] font-semibold ${isModuleComplete ? 'text-emerald-700' : isStarted ? 'text-amber-700' : 'text-slate-400'}">
                                      ${viewedCount} / ${totalLessonsInConcept} Lessons Viewed
                                    </div>
                                  </div>
                                </div>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-black shrink-0 ${
                                  isModuleComplete
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : isStarted
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-slate-200/70 text-slate-500'
                                }">
                                  ${isModuleComplete ? 'Done' : isStarted ? 'In Progress' : 'Not Started'}
                                </span>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>

                      <!-- Right: Confidential 15-Question Test Results (5 cols) -->
                      <div class="lg:col-span-5 space-y-3">
                        <h4 class="text-xs font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                          <i class="fa-solid fa-file-circle-check text-emerald-600"></i> 15-Question Level Test Results (${testHistory.length})
                        </h4>
                        ${testHistory.length === 0 ? `
                          <div class="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-xs text-slate-400 text-center">
                            No level tests submitted yet.
                          </div>
                        ` : `
                          <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                            ${testHistory.map(t => `
                              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                                <div>
                                  <div class="font-bold text-slate-800">${t.concept}</div>
                                  <div class="text-[10px] text-slate-500">${t.level} &bull; ${t.date}</div>
                                </div>
                                <span class="px-2.5 py-1 rounded-xl font-black shrink-0 ${
                                  t.percentage >= 80
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : t.percentage >= 50
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-rose-100 text-rose-800'
                                }">
                                  ${t.score}/${t.total} (${t.percentage}%)
                                </span>
                              </div>
                            `).join('')}
                          </div>
                        `}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function openEditStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('edit-student-key').value = key;
      document.getElementById('edit-student-firstname').value = s.firstName || '';
      document.getElementById('edit-student-surname').value = s.surname || '';
      document.getElementById('edit-student-class').value = s.class || '7A';
      document.getElementById('edit-student-teacher').value = s.teacher || 'Mr B';
      document.getElementById('edit-student-tokens').value = (s.stats && s.stats.tokens) || 0;
      document.getElementById('edit-student-modal').classList.remove('hidden');
    }

    function closeEditStudentModal() {
      document.getElementById('edit-student-modal').classList.add('hidden');
    }

    function saveEditedStudent() {
      const key = document.getElementById('edit-student-key').value;
      const all = getAllUserRecords();
      const existing = all[key];
      if (!existing) return;

      existing.firstName = document.getElementById('edit-student-firstname').value.trim() || existing.firstName;
      existing.surname = document.getElementById('edit-student-surname').value.trim() || existing.surname;
      existing.class = document.getElementById('edit-student-class').value;
      existing.teacher = document.getElementById('edit-student-teacher').value;
      if (!existing.stats) existing.stats = { tokens: 0, testsTaken: 0 };
      existing.stats.tokens = Number(document.getElementById('edit-student-tokens').value) || 0;

      try {
        all[key] = existing;
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, existing);
      }

      closeEditStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    function openDeleteStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('delete-student-key').value = key;
      document.getElementById('delete-student-name').textContent = `${s.firstName} ${s.surname}`;
      document.getElementById('delete-student-modal').classList.remove('hidden');
    }

    function closeDeleteStudentModal() {
      document.getElementById('delete-student-modal').classList.add('hidden');
    }

    function confirmDeleteStudent() {
      const key = document.getElementById('delete-student-key').value;
      if (!key) return;
      try {
        const all = getAllUserRecords();
        delete all[key];
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.cachedCloudUsers) delete window.cachedCloudUsers[key];
      if (window.deleteUserRecordFromCloud) window.deleteUserRecordFromCloud(key);

      closeDeleteStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    // ==========================================
    // OVERALL STUDENT LEADERBOARD MARKUP
    // ==========================================
    function renderLeaderboardMarkup() {
      return `
        <section id="overall-student-leaderboard-section" class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500"></i> Overall Classroom Token Leaderboard
              </h2>
              <p class="text-xs text-slate-500">Live token standings synced across all logged-in devices.</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-xs font-bold self-start sm:self-auto">
              Live Sync Active
            </span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-black uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="px-4 py-3">Rank</th>
                  <th class="px-4 py-3">Student</th>
                  <th class="px-4 py-3">Class</th>
                  <th class="px-4 py-3 text-right">Tokens</th>
                </tr>
              </thead>
              <tbody id="overall-leaderboard-tbody" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="px-4 py-6 text-center text-slate-400 text-xs">Loading live classroom standings...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ==========================================
    // APPLICATION BOOTSTRAP ON WINDOW LOAD
    // ==========================================
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.key) {
            app.currentUser = parsed;
            const db = getAllUserRecords();
            if (db[parsed.key]) {
              state = {
                stats: db[parsed.key].stats || { tokens: 10, testsTaken: 0 },
                inventory: db[parsed.key].inventory || [],
                testHistory: db[parsed.key].testHistory || [],
                completedLessons: db[parsed.key].completedLessons || []
              };
            }
          }
        }
      } catch (e) {}

      updateNavBar();
      updateGlobalLeaderboard();
      app.navigate('home');
    };
  </script>
</body>
</html>
