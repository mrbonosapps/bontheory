    <script>
        // --- Data & State Management ---
        const DB_STORAGE_KEY = 'boncepts_users_db';
        const SESSION_STORAGE_KEY = 'boncepts_active_session';

        const state = {
            stats: { completedTests: 0, avgScore: 0, tokens: 0 },
            inventory: [],
            testResults: []
        };
        window.state = state;

        // Helper to generate a unique key per user based on name and class
        function getUserRecordKey(user) {
            if (!user || !user.name) return null;
            const cleanName = (user.name || '').trim().toLowerCase();
            const cleanClass = (user.classGroup || '').trim().toLowerCase();
            const cleanTeacher = (user.teacher || '').trim().toLowerCase();
            const role = user.role || 'student';
            return `${role}::${cleanTeacher}::${cleanClass}::${cleanName}`;
        }

        // Get the entire local dictionary of saved accounts
        function getAllUserRecords() {
            try {
                const raw = localStorage.getItem(DB_STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (err) {
                console.warn('Unable to load users db:', err);
                return {};
            }
        }

        // Save current user state to their isolated profile entry in the database
        function saveUserState() {
            if (!app.currentUser) return;
            try {
                const key = getUserRecordKey(app.currentUser);
                if (!key) return;

                const db = getAllUserRecords();
                db[key] = {
                    currentUser: app.currentUser,
                    stats: state.stats,
                    inventory: state.inventory,
                    testResults: state.testResults || [],
                    lastActive: Date.now()
                };

                localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(db));
                localStorage.setItem(SESSION_STORAGE_KEY, key);
            } catch (err) {
                console.warn('Unable to save user record:', err);
            }
        }

        // Restore a specific user profile or the last active session
        function loadUserState(specificKey = null) {
            try {
                const targetKey = specificKey || localStorage.getItem(SESSION_STORAGE_KEY);
                if (!targetKey) return null;

                const db = getAllUserRecords();
                const record = db[targetKey];
                if (!record) return null;

                if (record.stats) Object.assign(state.stats, record.stats);
                if (Array.isArray(record.inventory)) state.inventory = record.inventory;
                state.testResults = Array.isArray(record.testResults) ? record.testResults : [];
                if (record.currentUser) app.currentUser = record.currentUser;

                return record;
            } catch (err) {
                console.warn('Unable to load user record:', err);
                return null;
            }
        }

                                        <tr>
                                            <td colspan="8" class="py-8 text-center text-slate-400 font-medium">No test submissions recorded yet.</td>
                                        </tr>
                                    ` : allRecentTests.map(t => {
                                        const dateStr = new Date(t.timestamp).toLocaleDateString() + ' ' + new Date(t.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                        return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3.5 px-4 font-bold text-slate-800">${t.studentName}</td>
                                            <td class="py-3.5 px-4"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold text-xs">${t.classGroup}</span></td>
                                            <td class="py-3.5 px-4 capitalize font-semibold text-slate-700">${t.area}</td>
                                            <td class="py-3.5 px-4 font-bold text-slate-800">Level ${t.level}</td>
                                            <td class="py-3.5 px-4 font-mono font-bold text-slate-800">${t.score} / ${t.total}</td>
                                            <td class="py-3.5 px-4 font-black ${t.pct >= 50 ? 'text-emerald-600' : 'text-red-500'}">${t.pct}%</td>
                                            <td class="py-3.5 px-4">
                                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${t.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                                    ${t.passed ? 'PASSED' : 'RETRY'}
                                                </span>
                                            </td>
                                            <td class="py-3.5 px-4 text-xs text-slate-400">${dateStr}</td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Student Profiles Table -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                <i class="fa-solid fa-users text-indigo-600"></i>
                                <span>Student Roster (${currentTeacher}'s Classes)</span>
                            </h3>
                            <span class="text-xs text-slate-400 font-semibold">${displayList.length} Accounts Found</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 text-xs uppercase tracking-wider">
                                        <th class="py-3.5 px-4">Student Name</th>
                                        <th class="py-3.5 px-4">Class</th>
                                        <th class="py-3.5 px-4">Teacher</th>
                                        <th class="py-3.5 px-4">Tokens</th>
                                        <th class="py-3.5 px-4">Tests Passed</th>
                                        <th class="py-3.5 px-4">Items Owned</th>
                                        <th class="py-3.5 px-4">Last Active</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${displayList.length === 0 ? `
                                        <tr>
                                            <td colspan="7" class="py-8 text-center text-slate-400 font-medium">No students registered under ${currentTeacher} yet.</td>
                                        </tr>
                                    ` : displayList.map(rec => {
                                        const u = rec.currentUser || {};
                                        const st = rec.stats || {};
                                        const inv = rec.inventory || [];
                                        const lastAct = rec.lastActive ? new Date(rec.lastActive).toLocaleDateString() : 'N/A';
                                        return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3.5 px-4 font-bold text-slate-800">${u.name || 'Anonymous'}</td>
                                            <td class="py-3.5 px-4"><span class="bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-md font-bold text-xs">${u.classGroup || 'N/A'}</span></td>
                                            <td class="py-3.5 px-4 text-slate-600 font-medium">${u.teacher || 'Unassigned'}</td>
                                            <td class="py-3.5 px-4"><span class="font-extrabold text-amber-600"><i class="fa-solid fa-coins text-xs mr-1 text-amber-500"></i>${st.tokens || 0}</span></td>
                                            <td class="py-3.5 px-4"><span class="font-bold text-blue-600">${st.completedTests || 0}</span></td>
                                            <td class="py-3.5 px-4 text-slate-600">${inv.length}</td>
                                            <td class="py-3.5 px-4 text-slate-400 text-xs">${lastAct}</td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                `;
            }
        };

        // --- Tone.js Audio Synth ---
        let synth = null;
        function initChordSynth() {
            if(!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -6;
            }
        }

        window.playNoteAudio = function(note) {
            if(!synth) initChordSynth();
            Tone.start();
            synth.triggerAttackRelease(note, "0.8n");
        };

        window.playCurrentChord = function() {
            if(!synth) initChordSynth();
            Tone.start();
            const rootEl = document.getElementById('chord-root');
            const catEl = document.getElementById('chord-cat');
            if (!rootEl || !catEl) return;
            const root = rootEl.value;
            const type = catEl.value;
            
            let notes = [];
            if(type === 'major') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else if(type === 'minor') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(3).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote(), Tone.Frequency(`${root}4`).transpose(10).toNote()];

            synth.triggerAttackRelease(notes, "1.5n");
        };

        window.updateChordDisplay = function() {
            const rootEl = document.getElementById('chord-root');
            const catEl = document.getElementById('chord-cat');
            if (!rootEl || !catEl) return;
            const root = rootEl.value;
            const cat = catEl.value;
            let name = `${root} Major`;
            let formula = '1 - 3 - 5';
            
            if(cat === 'minor') { name = `${root} Minor`; formula = '1 - b3 - 5'; }
            if(cat === 'dominant') { name = `${root} Dominant 7`; formula = '1 - 3 - 5 - b7'; }
            
            const nameEl = document.getElementById('display-chord-name');
            const formulaEl = document.getElementById('display-formula');
            const notesEl = document.getElementById('display-notes');

            if (nameEl) nameEl.textContent = name;
            if (formulaEl) formulaEl.textContent = formula;

            try {
                let noteNames = [];
                if(cat === 'major') noteNames = [root, Tone.Frequency(`${root}4`).transpose(4).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];
                else if(cat === 'minor') noteNames = [root, Tone.Frequency(`${root}4`).transpose(3).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];
                else noteNames = [root, Tone.Frequency(`${root}4`).transpose(4).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(10).toNote().slice(0,-1)];
                if (notesEl) notesEl.textContent = noteNames.join(' - ');
            } catch(e) {
                if (notesEl) notesEl.textContent = root + " - ...";
            }
        };

        // --- Pitch Level 2 Lesson 1: Scale Audio & Game Logic ---
        window.playScaleAudio = function(tonic) {
            initChordSynth();
            Tone.start();
            let notes = [];
            if (tonic === 'C') notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
            if (tonic === 'G') notes = ['G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F#5', 'G5'];
            if (tonic === 'F') notes = ['F4', 'G4', 'A4', 'Bb4', 'C5', 'D5', 'E5', 'F5'];

            const now = Tone.now();
            notes.forEach((n, idx) => {
                synth.triggerAttackRelease(n, "0.3n", now + idx * 0.35);
            });
        };

        window.scaleGameState = {
            streak: 0,
            best: 0,
            currentQ: null,
            pool: [
                {
                    prompt: "What is the 7th note (Leading Tone) of G Major?",
                    display: "G &ndash; A &ndash; B &ndash; C &ndash; D &ndash; E &ndash; [ ? ] &ndash; G",
                    ans: "F#",
                    cat: "Accidental Rule",
                    options: ["F", "F#", "Gb", "E"]
                },
                {
                    prompt: "What is the 4th note (Subdominant) of F Major?",
                    display: "F &ndash; G &ndash; A &ndash; [ ? ] &ndash; C &ndash; D &ndash; E &ndash; F",
                    ans: "Bb",
                    cat: "Accidental Rule",
                    options: ["B", "Bb", "A#", "C"]
                },
                {
                    prompt: "Between which degrees do semitones occur in ANY Major scale?",
                    display: "Degrees 1 to 8",
                    ans: "3-4 & 7-8",
                    cat: "Formula Check",
                    options: ["2-3 & 6-7", "3-4 & 7-8", "1-2 & 5-6", "4-5 & 7-8"]
                },
                {
                    prompt: "Which accidental belongs in the G Major key signature?",
                    display: "G Major Scale",
                    ans: "F#",
                    cat: "Key Signature",
                    options: ["Bb", "C#", "F#", "G#"]
                },
                {
                    prompt: "Which accidental belongs in the F Major key signature?",
                    display: "F Major Scale",
                    ans: "Bb",
                    cat: "Key Signature",
                    options: ["Bb", "F#", "Eb", "Ab"]
                }
            ]
        };

        window.startScaleGame = function() {
            const state = window.scaleGameState;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            const q = state.currentQ;

            const promptEl = document.getElementById('scale-q-prompt');
            const catEl = document.getElementById('scale-q-cat');
            const displayEl = document.getElementById('scale-display');
            const optsContainer = document.getElementById('scale-options-container');
            const fb = document.getElementById('scale-feedback');

            if (promptEl) promptEl.textContent = q.prompt;
            if (catEl) catEl.textContent = q.cat;
            if (displayEl) displayEl.innerHTML = q.display;
            if (fb) fb.textContent = '';

            if (optsContainer) {
                optsContainer.innerHTML = q.options.map(opt => `
                    <button onclick="checkScaleAnswer('${opt}')" class="bg-white border-2 border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-800 font-extrabold py-3.5 px-4 rounded-xl transition text-base shadow-sm">
                        ${opt}
                    </button>
                `).join('');
            }
        };

        window.checkScaleAnswer = function(chosen) {
            const state = window.scaleGameState;
            const q = state.currentQ;
            const fb = document.getElementById('scale-feedback');
            if (!q || !fb) return;

            if (chosen === q.ans) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(5);
                fb.textContent = `Correct! ${q.ans} is correct!`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-emerald-600";
                document.getElementById('scale-game-streak').textContent = state.streak;
                document.getElementById('scale-game-best').textContent = state.best;
                setTimeout(window.startScaleGame, 1100);
            } else {
                state.streak = 0;
                document.getElementById('scale-game-streak').textContent = state.streak;
                fb.textContent = `Incorrect! The correct answer is ${q.ans}.`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-red-500";
            }
        };

        // --- Pitch Level 2 Lesson 2: Interval Audio & Game Logic ---
        window.playIntervalDemo = function(n1, n2) {
            initChordSynth();
            Tone.start();
            const now = Tone.now();
            synth.triggerAttackRelease(n1, "0.5n", now);
            synth.triggerAttackRelease(n2, "0.7n", now + 0.5);
        };

        window.intervalGameState = {
            streak: 0,
            best: 0,
            currentQ: null,
            pool: [
                { n1: "C4", n2: "D4", cy1: 140, cy2: 130, name: "2nd (Second)", options: ["Unison", "2nd (Second)", "3rd (Third)", "5th (Fifth)"] },
                { n1: "C4", n2: "E4", cy1: 140, cy2: 120, name: "3rd (Third)", options: ["2nd (Second)", "3rd (Third)", "4th (Fourth)", "5th (Fifth)"] },
                { n1: "C4", n2: "F4", cy1: 140, cy2: 110, name: "4th (Fourth)", options: ["3rd (Third)", "4th (Fourth)", "5th (Fifth)", "6th (Sixth)"] },
                { n1: "C4", n2: "G4", cy1: 140, cy2: 100, name: "5th (Fifth)", options: ["4th (Fourth)", "5th (Fifth)", "6th (Sixth)", "Octave (8ve)"] },
                { n1: "C4", n2: "C5", cy1: 140, cy2: 70, name: "Octave (8ve)", options: ["5th (Fifth)", "6th (Sixth)", "7th (Seventh)", "Octave (8ve)"] }
            ]
        };

        window.startIntervalGame = function() {
            const state = window.intervalGameState;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            const q = state.currentQ;

            const staffEl = document.getElementById('interval-staff-display');
            const optsContainer = document.getElementById('interval-options-container');
            const fb = document.getElementById('interval-feedback');
            if (fb) fb.textContent = '';

            if (staffEl) {
                staffEl.innerHTML = `
                    <svg width="260" height="130" viewBox="0 0 260 130">
                        <line x1="20" y1="30" x2="240" y2="30" class="staff-line"/>
                        <line x1="20" y1="50" x2="240" y2="50" class="staff-line"/>
                        <line x1="20" y1="70" x2="240" y2="70" class="staff-line"/>
                        <line x1="20" y1="90" x2="240" y2="90" class="staff-line"/>
                        <line x1="20" y1="110" x2="240" y2="110" class="staff-line"/>
                        <text x="25" y="111" font-size="90" font-family="serif" fill="#0f172a">&#119070;</text>

                        <!-- Note 1 -->
                        ${q.cy1 === 140 ? '<line x1="85" y1="140" x2="115" y2="140" stroke="#0f172a" stroke-width="2"/>' : ''}
                        <ellipse cx="100" cy="${q.cy1}" rx="9" ry="6" fill="#2563eb"/>

                        <!-- Note 2 -->
                        ${q.cy2 === 140 ? '<line x1="155" y1="140" x2="185" y2="140" stroke="#0f172a" stroke-width="2"/>' : ''}
                        <ellipse cx="170" cy="${q.cy2}" rx="9" ry="6" fill="#2563eb"/>
                    </svg>
                `;
            }

            if (optsContainer) {
                optsContainer.innerHTML = q.options.map(opt => `
                    <button onclick="checkIntervalAnswer('${opt}')" class="bg-white border-2 border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-800 font-extrabold py-3.5 px-4 rounded-xl transition text-sm shadow-sm">
                        ${opt}
                    </button>
                `).join('');
            }

            replayCurrentIntervalAudio();
        };

        window.replayCurrentIntervalAudio = function() {
            const q = window.intervalGameState.currentQ;
            if (q) window.playIntervalDemo(q.n1, q.n2);
        };

        window.checkIntervalAnswer = function(chosen) {
            const state = window.intervalGameState;
            const q = state.currentQ;
            const fb = document.getElementById('interval-feedback');
            if (!q || !fb) return;

            if (chosen === q.name) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(5);
                fb.textContent = `Correct! ${q.n1} to ${q.n2} is a ${q.name}!`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-emerald-600";
                document.getElementById('interval-streak').textContent = state.streak;
                document.getElementById('interval-best').textContent = state.best;
                setTimeout(window.startIntervalGame, 1200);
            } else {
                state.streak = 0;
                document.getElementById('interval-streak').textContent = state.streak;
                fb.textContent = `Incorrect! The correct interval is ${q.name}.`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-red-500";
            }
        };

        // --- Pitch Level 2 Lesson 3: Triad Audio & Game Logic ---
        window.playTriadAudio = function(root, quality) {
            initChordSynth();
            Tone.start();
            let notes = [];
            if (quality === 'major') {
                notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            } else {
                notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(3).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            }
            synth.triggerAttackRelease(notes, "1.2n");
        };

        window.triadGameState = {
            streak: 0,
            best: 0,
            currentQ: null,
            placedNotes: [],
            pool: [
                { root: "C", rootCy: 140 },
                { root: "F", rootCy: 110 },
                { root: "G", rootCy: 100 },
                { root: "A", rootCy: 90 },
                { root: "D", rootCy: 130 }
            ]
        };

        window.startTriadGame = function() {
            const state = window.triadGameState;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            state.placedNotes = [];
            
            const q = state.currentQ;
            const promptEl = document.getElementById('triad-q-prompt');
            const catEl = document.getElementById('triad-q-cat');
            const fb = document.getElementById('triad-feedback');

            if (promptEl) promptEl.textContent = `Build a ${q.root} triad!`;
            if (catEl) catEl.textContent = `Stack the 3rd and 5th`;
            if (fb) fb.textContent = '';
            
            renderTriadGameSVG();
        };

        window.renderTriadGameSVG = function() {
            const state = window.triadGameState;
            const q = state.currentQ;
            const displayEl = document.getElementById('triad-display');
            
            if (!displayEl) return;
            
            let svg = `<svg width="220" height="170" viewBox="0 0 220 170">
                <line x1="20" y1="40" x2="200" y2="40" class="staff-line stroke-slate-500"/>
                <line x1="20" y1="60" x2="200" y2="60" class="staff-line stroke-slate-500"/>
                <line x1="20" y1="80" x2="200" y2="80" class="staff-line stroke-slate-500"/>
                <line x1="20" y1="100" x2="200" y2="100" class="staff-line stroke-slate-500"/>
                <line x1="20" y1="120" x2="200" y2="120" class="staff-line stroke-slate-500"/>
                <text x="25" y="121" font-size="90" font-family="serif" fill="#94a3b8">&#119070;</text>
            `;
            
            // Render C ledger line if needed
            if (q.rootCy === 140 || state.placedNotes.includes(140)) {
                svg += `<line x1="95" y1="140" x2="145" y2="140" stroke="#f8fafc" stroke-width="2"/>`;
            }

            // Root Note
            svg += `<ellipse cx="120" cy="${q.rootCy}" rx="12" ry="8" fill="#f8fafc"/>`;
            
            // Placed Notes
            state.placedNotes.forEach(cy => {
                svg += `<ellipse cx="120" cy="${cy}" rx="12" ry="8" fill="#60a5fa" class="fade-in"/>`;
            });
            
            // Interactive Drop/Click Zones
            if (state.placedNotes.length < 2) {
                for(let y = 30; y <= 150; y += 10) {
                    if (y !== q.rootCy && !state.placedNotes.includes(y)) {
                        svg += `<rect x="90" y="${y-5}" width="60" height="10" fill="transparent" class="hover:fill-blue-500/40 cursor-pointer transition-colors duration-200" onclick="placeTriadNote(${y})" />`;
                    }
                }
            }
            
            svg += `</svg>`;
            displayEl.innerHTML = svg;
        };

        window.placeTriadNote = function(cy) {
            const state = window.triadGameState;
            if (state.placedNotes.length >= 2) return;
            
            state.placedNotes.push(cy);
            renderTriadGameSVG();
            
            if (state.placedNotes.length === 2) {
                checkTriadConstruction();
            }
        };

        window.checkTriadConstruction = function() {
            const state = window.triadGameState;
            const q = state.currentQ;
            const fb = document.getElementById('triad-feedback');
            if (!fb) return;

            // A root position triad stacks thirds (cy - 20) and fifths (cy - 40) directly above the root
            const requiredNotes = [q.rootCy - 20, q.rootCy - 40];
            const correct = state.placedNotes.includes(requiredNotes[0]) && state.placedNotes.includes(requiredNotes[1]);
            
            if (correct) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(10);
                fb.textContent = `Correct! Perfect snowman shape!`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-emerald-500";
                
                document.getElementById('triad-streak').textContent = state.streak;
                document.getElementById('triad-best').textContent = state.best;
                
                if (window.playTriadAudio) {
                    // Quick map for reward chord quality
                    const quality = (q.root === 'C' || q.root === 'F' || q.root === 'G') ? 'major' : 'minor';
                    window.playTriadAudio(q.root, quality);
                }
                
                setTimeout(window.startTriadGame, 1600);
            } else {
                state.streak = 0;
                document.getElementById('triad-streak').textContent = state.streak;
                fb.textContent = `Incorrect! Stack the notes in the adjacent spaces or lines directly above the root!`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-red-500";
                
                // Clear the notes after a short delay so the user can try again
                setTimeout(() => {
                    state.placedNotes = [];
                    renderTriadGameSVG();
                    fb.textContent = '';
                }, 1600);
            }
        };

        // --- Duration Level 2 Lesson 2: Tie Game Logic ---
        window.tieGameState = {
            streak: 0,
            best: 0,
            currentQ: null,
            pool: [
                { prompt: "Minim tied to a Crotchet", n1: "Minim (2)", n2: "Crotchet (1)", ans: "3 Beats", options: ["2 Beats", "3 Beats", "4 Beats", "2.5 Beats"] },
                { prompt: "Crotchet tied to a Crotchet", n1: "Crotchet (1)", n2: "Crotchet (1)", ans: "2 Beats", options: ["1 Beat", "2 Beats", "3 Beats", "1.5 Beats"] },
                { prompt: "Semibreve tied to a Minim", n1: "Semibreve (4)", n2: "Minim (2)", ans: "6 Beats", options: ["4 Beats", "5 Beats", "6 Beats", "8 Beats"] },
                { prompt: "Crotchet tied to a Quaver", n1: "Crotchet (1)", n2: "Quaver (0.5)", ans: "1.5 Beats", options: ["1 Beat", "1.5 Beats", "2 Beats", "2.5 Beats"] },
                { prompt: "Dotted Minim tied to a Crotchet", n1: "Dotted Minim (3)", n2: "Crotchet (1)", ans: "4 Beats", options: ["3 Beats", "4 Beats", "5 Beats", "3.5 Beats"] }
            ]
        };

        window.startTieGame = function() {
            const state = window.tieGameState;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            const q = state.currentQ;

            const promptEl = document.getElementById('tie-q-prompt');
            const rhythmEl = document.getElementById('tie-rhythm-display');
            const optsContainer = document.getElementById('tie-options-container');
            const fb = document.getElementById('tie-feedback');

            if (promptEl) promptEl.textContent = `Calculate duration: ${q.prompt}`;
            if (fb) fb.textContent = '';

        // Synthesised Drum Instruments via Tone.js
        let kickDrumSynth = null;

        function initDrumSynths() {

                    pitchDecay: 0.05,
                    octaves: 6,
                    oscillator: { type: "sine" },

                }).toDestination();

            if (isKick) {
                kickDrumSynth.triggerAttackRelease(isOffbeat ? "C1" : "C1", "8n");
            } else {
                snareDrumSynth.triggerAttackRelease("16n");

        window.toggleDrumStepPattern = function(index) {

                btn.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Stop Pattern</span>`;
            }

            const bpm = 96;
            const beatIntervalMs = (60 / bpm) * 1000; // ~625ms per beat

            const stepLoop = () => {
                if (!state.isPlaying) return;
                state.currentBeatIndex = (state.currentBeatIndex + 1) % 8;
                const idx = state.currentBeatIndex;
                const beatNum = idx + 1;
                const isQuaver = (state.pattern[idx] === 1);

        // Dictation Challenge Logic
        function renderDictationRhythmSVG(pattern, isCorrectSelection = false) {
            let svg = `<svg width="100%" height="45" viewBox="0 0 540 45" class="w-full max-w-full h-auto select-none pointer-events-none">`;
            // Staff pulse line
            svg += `<line x1="10" y1="26" x2="530" y2="26" stroke="#cbd5e1" stroke-width="2"/>`;

            const stepW = 62;
            const startX = 25;

            pattern.forEach((val, i) => {
                const cx = startX + i * stepW;
                const beatNum = i + 1;
                const noteColor = (beatNum % 2 === 1) ? "#2563eb" : "#e11d48"; // Blue for Kick, Red for Snare

                if (val === 0) {
                    // Crotchet (1 beat)
                    svg += `
                        <ellipse cx="${cx}" cy="26" rx="6.5" ry="4.5" fill="${noteColor}"/>
                        <line x1="${cx+5}" y1="26" x2="${cx+5}" y2="9" stroke="${noteColor}" stroke-width="2"/>
                    `;
                } else {
                    // Beamed Quavers (2 eighth notes)
                    svg += `
                        <ellipse cx="${cx-9}" cy="26" rx="5" ry="3.5" fill="${noteColor}"/>
                        <line x1="${cx-5}" y1="26" x2="${cx-5}" y2="10" stroke="${noteColor}" stroke-width="1.8"/>
                        <ellipse cx="${cx+9}" cy="26" rx="5" ry="3.5" fill="${noteColor}"/>

                }
            });

            svg += `</svg>`;
            return svg;
        }

        window.startQuaverDictationChallenge = function() {
            const state = window.quaverDictationState;
            state.isLocked = false;
            window.stopDictationAudio();

            // Generate target pattern of 8 beats (0 = crotchet, 1 = quavers)
            // Ensure at least two crotchets and two quavers for variety
            let target;
            do {
                target = Array.from({ length: 8 }, () => (Math.random() > 0.5 ? 1 : 0));
            } while (target.filter(v => v === 0).length < 2 || target.filter(v => v === 1).length < 2);

            // Generate 3 unique distractor patterns
            const options = [target];
            while (options.length < 4) {
                const distractor = [...target];
                // Flip 2 random beats to make it subtle
                const flipIndex1 = Math.floor(Math.random() * 8);
                let flipIndex2 = Math.floor(Math.random() * 8);
                while (flipIndex2 === flipIndex1) flipIndex2 = Math.floor(Math.random() * 8);

                distractor[flipIndex1] = distractor[flipIndex1] === 0 ? 1 : 0;
                distractor[flipIndex2] = distractor[flipIndex2] === 0 ? 1 : 0;

                const isDup = options.some(opt => opt.every((val, i) => val === distractor[i]));
                if (!isDup) options.push(distractor);
            }

            // Shuffle options
            const shuffledOptions = options.sort(() => Math.random() - 0.5);
            state.currentChallenge = {
                target,
                options: shuffledOptions,
                correctIndex: shuffledOptions.findIndex(opt => opt.every((v, i) => v === target[i]))
            };

            const optsContainer = document.getElementById('dictation-options-container');
            const fb = document.getElementById('dictation-feedback');
            const playInd = document.getElementById('dictation-playhead-indicator');

            if (fb) fb.textContent = '';
            if (playInd) playInd.innerHTML = 'Click the button above to listen to the mystery 8-beat pattern.';

            if (optsContainer) {
                optsContainer.innerHTML = shuffledOptions.map((opt, idx) => {
                    const optLetter = String.fromCharCode(65 + idx);
                    return `
                        <div id="dictation-opt-${idx}" onclick="checkDictationAnswer(${idx})" class="p-3.5 bg-white border-2 border-slate-200 hover:border-amber-400 rounded-2xl flex items-center gap-3 cursor-pointer shadow-xs transition hover:shadow-sm">
                            <span class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 font-extrabold text-sm flex items-center justify-center flex-shrink-0">${optLetter}</span>
                            <div class="flex-1 overflow-x-auto">
                                ${renderDictationRhythmSVG(opt)}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        };

        window.playCurrentDictationRhythm = function() {
            window.stopQuaverDrumAudio();
            const state = window.quaverDictationState;
            if (state.isPlaying || !state.currentChallenge) return;

            state.isPlaying = true;
            const targetPattern = state.currentChallenge.target;
            const playInd = document.getElementById('dictation-playhead-indicator');
            const playBtn = document.getElementById('play-dictation-btn');

            if (playBtn) playBtn.classList.add('opacity-80', 'cursor-wait');

            const bpm = 100;
            const beatMs = (60 / bpm) * 1000;
            let currentStep = 0;

            const playStep = () => {
                if (currentStep >= 8) {
                    state.isPlaying = false;

        window.flipTempoCard = function(index) {
            const state = window.tempoMemoryState;
            if (state.isLocked) return;
            const cardEl = document.getElementById(`tempo-card-${index}`);
            if (!cardEl || cardEl.classList.contains('matched') || state.flipped.includes(index)) return;

            const card = state.cards[index];
            const backIcon = cardEl.querySelector('.card-back');
            const frontText = cardEl.querySelector('.card-front');
            if (backIcon && frontText) {
                backIcon.classList.add('hidden');
                frontText.textContent = card.text;

            }
            cardEl.classList.remove('bg-white', 'border-slate-200');
            cardEl.classList.add('bg-emerald-50', 'border-emerald-500');

            state.flipped.push(index);

            if (state.flipped.length === 2) {
                state.turns++;
                const turnsEl = document.getElementById('tempo-turns-count');
                if (turnsEl) turnsEl.textContent = state.turns;

                const [i1, i2] = state.flipped;

        window.startScoreHuntGame = function() {
            const state = window.scoreHuntState;
            if (!state.completedCounts) state.completedCounts = {};
            state.isLocked = false;

            let availableTargets = [];
            state.targets.forEach(t => {
                if ((state.completedCounts[t.id] || 0) < 2) {
                    availableTargets.push(t);
                }
            });

            // Auto-reset if the game was fully completed and is being restarted
            if (availableTargets.length === 0) {
                state.completedCounts = {};
                availableTargets = [...state.targets];
            }
            
            // Pick a random target but avoid repeating the same one twice in a row if possible
            let next;
            do {
                next = availableTargets[Math.floor(Math.random() * availableTargets.length)];
            } while (state.currentTarget && next.id === state.currentTarget.id && availableTargets.length > 1);

            state.currentTarget = next;
            const targetEl = document.getElementById('score-hunt-target');
            if (targetEl) targetEl.textContent = next.label;

        window.checkScoreHuntAnswer = function(selectedId) {
            const state = window.scoreHuntState;
            const fb = document.getElementById('score-hunt-feedback');
            if (!state.currentTarget || !fb || state.isLocked) return;

            let allDone = state.targets.every(t => (state.completedCounts[t.id] || 0) >= 2);
            if (allDone) return;
            
            state.isLocked = true;

            if (selectedId === state.currentTarget.id) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                
                if (!state.completedCounts) state.completedCounts = {};
                state.completedCounts[selectedId] = (state.completedCounts[selectedId] || 0) + 1;
                
                let extraMsg = '';
                // Award tokens for every streak of 3 in a row
                if (state.streak > 0 && state.streak % 3 === 0) {
                    window.addTokens(10);
                    extraMsg = ' <span class="text-amber-500 ml-2">+10 Tokens!</span>';
                }

                fb.innerHTML = `Correct! That is the ${state.currentTarget.label}!${extraMsg}`;
                fb.className = 'font-bold h-6 text-lg mt-4 text-center text-emerald-600';
                
                const streakEl = document.getElementById('score-hunt-streak');
                const bestEl = document.getElementById('score-hunt-best');
                if (streakEl) streakEl.textContent = state.streak;
                if (bestEl) bestEl.textContent = state.best;
                
                allDone = state.targets.every(t => (state.completedCounts[t.id] || 0) >= 2);
                if (allDone) {
                    setTimeout(() => {
                        const targetEl = document.getElementById('score-hunt-target');
                        if (targetEl) targetEl.textContent = "All Done!";
                        if (fb) {
                            fb.textContent = "Congratulations! You've found every symbol twice!";
                            fb.className = 'font-bold h-6 text-lg mt-4 text-center text-blue-600';
                        }
                        state.isLocked = false;

                    setTimeout(() => {
                        window.startScoreHuntGame();
                    }, 1300);
                }
            } else {
                state.streak = 0;
                fb.textContent = `Oops! That was not the ${state.currentTarget.label}. Try again!`;

                for (let b = 1; b <= 6; b++) {
                    const bx = startX + (b - 1) * barWidth;
                    markup += `<line x1="${bx}" y1="5" x2="${bx}" y2="145" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" /><text x="${bx + barWidth/2}" y="18" font-family="Inter" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">BAR ${b}</text>`;

                    const pos = layerYMap[layer.id];
                    if (pos && layer.active) {
                        const startXPos = startX + (layer.startBar - 1) * barWidth;
                        const blockW = (6 - layer.startBar + 1) * barWidth;
                        markup += `<rect x="${startXPos}" y="${pos.y}" width="${blockW}" height="${pos.h}" fill="${layer.color}" rx="4" opacity="0.9" />`;

                });

                const stepInBar = state.stepIndex % 4;
                state.currentBar = Math.floor((state.stepIndex % (state.totalBars * 4)) / 4) + 1;
                const bar = state.currentBar;
                const notesToTrigger = [];

                },
                {
                    prompt: "1st ending spanning Bar 2, 2nd ending spanning Bar 3, then finish at Bar 4",
                    svg: `

                            <!-- Bar 1 -->
                            <text x="45" y="52" font-family="Inter" font-size="11" font-weight="bold" fill="#94a3b8">Bar 1</text>
                            <line x1="90" y1="25" x2="90" y2="70" stroke="#64748b" stroke-width="1.5"/>
                            <!-- 1st Ending (Bar 2) -->
                            <polyline points="95,18 95,8 175,8" fill="none" stroke="#f59e0b" stroke-width="2"/>
                            <text x="100" y="16" font-family="Inter" font-size="10" font-weight="bold" fill="#f59e0b">1.</text>
                            <text x="135" y="52" font-family="Inter" font-size="11" font-weight="bold" fill="#f59e0b">Bar 2</text>

                            <polyline points="185,18 185,8 265,8" fill="none" stroke="#38bdf8" stroke-width="2"/>

                            <text x="315" y="52" font-family="Inter" font-size="11" font-weight="bold" fill="#94a3b8">Bar 4</text>

                    ans: "1, 2, 1, 3, 4",
                    options: ["1, 2, 1, 3, 4", "1, 2, 3, 4", "1, 2, 1, 2, 3, 4", "1, 3, 4"]
                }
            ]
        };

        window.startVoltaGame = function() {
            const state = window.voltaGameState;
            let next;
            do {
                next = state.pool[Math.floor(Math.random() * state.pool.length)];
            } while (state.currentQ && next.prompt === state.currentQ.prompt && state.pool.length > 1);
            state.currentQ = next;
            const q = state.currentQ;

            const promptEl = document.getElementById('volta-q-prompt');
            const scoreEl = document.getElementById('volta-score-display');
            const optsContainer = document.getElementById('volta-options-container');
            const fb = document.getElementById('volta-feedback');

            if (promptEl) promptEl.textContent = `Sequence for: ${q.prompt}`;
            if (scoreEl) scoreEl.innerHTML = q.svg;
            if (fb) fb.textContent = '';

            // Randomize option positions
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            if (optsContainer) {
                optsContainer.innerHTML = shuffledOptions.map(opt => `
                    <button onclick="checkVoltaAnswer('${opt}')" class="bg-white border-2 border-slate-200 hover:border-purple-400 hover:bg-purple-50 text-slate-800 font-extrabold py-3.5 px-4 rounded-xl transition text-base shadow-sm">
                        ${opt}
                    </button>
                `).join('');
            }
        };

        window.checkVoltaAnswer = function(chosen) {
            const state = window.voltaGameState;
            const q = state.currentQ;
            const fb = document.getElementById('volta-feedback');
            if (!q || !fb) return;

            if (chosen === q.ans) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(5);
                fb.textContent = `Correct! ${q.ans}`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-emerald-600";
                document.getElementById('volta-streak').textContent = state.streak;
                document.getElementById('volta-best').textContent = state.best;
                setTimeout(window.startVoltaGame, 1200);
            } else {
                state.streak = 0;
                document.getElementById('volta-streak').textContent = state.streak;
                fb.textContent = `Incorrect! The correct sequence is ${q.ans}.`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-red-500";
            }
        };

        // --- Texture Game 1 ---
        window.textureGame1State = {
            streak: 0, best: 0, currentQ: null, isPlaying: false, playTimeout: null, userGuess: [],
            pool: [
                { layers: ['lead'] },
                { layers: ['bass', 'lead'] },
                { layers: ['bass', 'pad', 'arp', 'lead', 'sparkle'] },
                { layers: ['bass', 'pad'] },
                { layers: ['pad', 'arp'] },
                { layers: ['arp', 'lead', 'sparkle'] }
            ]
        };

        window.startTextureGame1 = function() {
            const state = window.textureGame1State;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            state.userGuess = []; // Reset guess array
            
            const togglesContainer = document.getElementById('tex-game1-toggles');
            const fb = document.getElementById('tex-game1-feedback');
            if (fb) fb.textContent = '';
            
            if (togglesContainer) {
                const allLayers = window.textureLabState.layers;
                togglesContainer.innerHTML = allLayers.map(l => `
                    <button id="tex1-guess-${l.id}" onclick="toggleTextureGame1Layer('${l.id}')" class="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-2 rounded-xl transition shadow-sm text-xs sm:text-sm">
                        ${l.name}
                    </button>
                `).join('');
            }
        };

        window.toggleTextureGame1Layer = function(layerId) {
            const state = window.textureGame1State;
            const idx = state.userGuess.indexOf(layerId);
            const btn = document.getElementById(`tex1-guess-${layerId}`);
            if (idx === -1) {
                state.userGuess.push(layerId);
                if(btn) {
                    btn.classList.remove('bg-white', 'border-slate-200', 'text-slate-700');
                    btn.classList.add('bg-pink-100', 'border-pink-500', 'text-pink-800');
                }
            } else {
                state.userGuess.splice(idx, 1);
                if(btn) {
                    btn.classList.remove('bg-pink-100', 'border-pink-500', 'text-pink-800');
                    btn.classList.add('bg-white', 'border-slate-200', 'text-slate-700');
                }
            }
        };

        window.playTextureGame1Audio = function() {
            const state = window.textureGame1State;
            if (state.isPlaying) return;
            const q = state.currentQ;
            if (!q) return;

            if (!synth) initChordSynth();
            Tone.start();

            state.isPlaying = true;
            let step = 0;
            const loop = setInterval(() => {
                if (step >= 4) {
                    clearInterval(loop);
                    state.isPlaying = false;
                    return;
                }
                const idx = step % 4;
                const notesToTrigger = [];
                const allLayers = window.textureLabState.layers;
                q.layers.forEach(lid => {
                    const l = allLayers.find(x => x.id === lid);
                    if (l) {
                        if (l.id === 'bass' && idx === 0) notesToTrigger.push('C2');
                        if (l.id === 'pad' && (idx === 0 || idx === 2)) notesToTrigger.push(...l.notes);
                        if (l.pattern && l.pattern[idx]) notesToTrigger.push(l.pattern[idx]);
                    }
                });
                if (notesToTrigger.length > 0 && synth) synth.triggerAttackRelease(notesToTrigger, "0.45n");
                step++;
            }, 500);
        };

        window.checkTextureGame1 = function() {
            const state = window.textureGame1State;
            const q = state.currentQ;
            const fb = document.getElementById('tex-game1-feedback');
            if (!q || !fb) return;

            // Check if arrays match regardless of order
            const isCorrect = q.layers.length === state.userGuess.length && q.layers.every(l => state.userGuess.includes(l));

            if (isCorrect) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(3);
                fb.textContent = 'Correct!';
                fb.className = 'font-bold h-6 text-lg mt-5 text-center text-emerald-500';
                document.getElementById('tex-game1-streak').textContent = state.streak;
                document.getElementById('tex-game1-best').textContent = state.best;
                setTimeout(window.startTextureGame1, 1500);
            } else {
                state.streak = 0;
                fb.textContent = 'Incorrect! Keep listening and try adjusting the layers.';
                fb.className = 'font-bold h-6 text-lg mt-5 text-center text-red-500';
                document.getElementById('tex-game1-streak').textContent = state.streak;
            }
        };

        // --- Texture Game 2 ---
        window.textureGame2State = {
            streak: 0, best: 0, currentQ: null, isPlaying: false, userGuess: [],
            pool: [
                { layers: ['sub'] },
                { layers: ['sub', 'cello', 'arpm'] },
                { layers: ['sub', 'cello', 'arpm', 'leadm', 'chimem'] },
                { layers: ['leadm', 'chimem'] },
                { layers: ['cello', 'arpm'] },
                { layers: ['sub', 'chimem'] }
            ]
        };

        window.startTextureGame2 = function() {
            const state = window.textureGame2State;
            state.currentQ = state.pool[Math.floor(Math.random() * state.pool.length)];
            state.userGuess = []; // Reset guess array
            
            const togglesContainer = document.getElementById('tex-game2-toggles');
            const fb = document.getElementById('tex-game2-feedback');
            if (fb) fb.textContent = '';
            
            if (togglesContainer) {
                const allLayers = window.textureLab2State.layers;
                togglesContainer.innerHTML = allLayers.map(l => `
                    <button id="tex2-guess-${l.id}" onclick="toggleTextureGame2Layer('${l.id}')" class="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-2 rounded-xl transition shadow-sm text-xs sm:text-sm">
                        ${l.name.substring(3)} <!-- Removing the "1. " numbering from name -->
                    </button>
                `).join('');
            }
        };

        window.toggleTextureGame2Layer = function(layerId) {
            const state = window.textureGame2State;
            const idx = state.userGuess.indexOf(layerId);
            const btn = document.getElementById(`tex2-guess-${layerId}`);
            if (idx === -1) {
                state.userGuess.push(layerId);
                if(btn) {
                    btn.classList.remove('bg-white', 'border-slate-200', 'text-slate-700');
                    btn.classList.add('bg-indigo-100', 'border-indigo-500', 'text-indigo-800');
                }
            } else {
                state.userGuess.splice(idx, 1);
                if(btn) {
                    btn.classList.remove('bg-indigo-100', 'border-indigo-500', 'text-indigo-800');
                    btn.classList.add('bg-white', 'border-slate-200', 'text-slate-700');
                }
            }
        };

        window.playTextureGame2Audio = function() {
            const state = window.textureGame2State;
            if (state.isPlaying) return;
            const q = state.currentQ;
            if (!q) return;

            if (!synth) initChordSynth();
            Tone.start();

            state.isPlaying = true;
            let step = 0;
            const loop = setInterval(() => {
                if (step >= 4) {
                    clearInterval(loop);
                    state.isPlaying = false;
                    return;
                }
                const idx = step % 4;
                const notesToTrigger = [];
                const allLayers = window.textureLab2State.layers;
                q.layers.forEach(lid => {
                    const l = allLayers.find(x => x.id === lid);
                    if (l) {
                        if (l.id === 'sub' && (idx === 0 || idx === 2)) notesToTrigger.push('A1');
                        if (l.id === 'cello' && idx === 0) notesToTrigger.push('A2', 'E2');
                        if (l.pattern && l.pattern[idx]) notesToTrigger.push(l.pattern[idx]);
                    }
                });
                if (notesToTrigger.length > 0 && synth) synth.triggerAttackRelease(notesToTrigger, "0.4n");
                step++;
            }, 468);
        };

        window.checkTextureGame2 = function() {
            const state = window.textureGame2State;
            const q = state.currentQ;
            const fb = document.getElementById('tex-game2-feedback');
            if (!q || !fb) return;

            // Check if arrays match regardless of order
            const isCorrect = q.layers.length === state.userGuess.length && q.layers.every(l => state.userGuess.includes(l));

            if (isCorrect) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(3);
                fb.textContent = 'Correct!';
                fb.className = 'font-bold h-6 text-lg mt-5 text-center text-emerald-500';
                document.getElementById('tex-game2-streak').textContent = state.streak;
                document.getElementById('tex-game2-best').textContent = state.best;
                setTimeout(window.startTextureGame2, 1500);
            } else {
                state.streak = 0;
                fb.textContent = 'Incorrect! Keep listening and try adjusting the layers.';
                fb.className = 'font-bold h-6 text-lg mt-5 text-center text-red-500';
                document.getElementById('tex-game2-streak').textContent = state.streak;
            }
        };

        // --- Authentication & Submission Handlers ---
        window.loginRole = 'student';
        window.setRole = function(role) {
            window.loginRole = role;
            const roleStudent = document.getElementById('roleStudent');
            const roleTeacher = document.getElementById('roleTeacher');
            const passContainer = document.getElementById('passwordContainer');
            const classContainer = document.getElementById('classContainer');
            const nameFields = document.getElementById('nameFieldsContainer');
            const teacherSelect = document.getElementById('teacherSelectContainer');
            const teacherLabel = document.getElementById('teacherSelectLabel');

            if (roleStudent && roleTeacher) {
                if (role === 'student') {
                    roleStudent.className = 'bg-white shadow-sm text-blue-600 rounded-xl py-2.5 font-bold transition';
                    roleTeacher.className = 'text-slate-500 hover:text-slate-800 rounded-xl py-2.5 font-bold transition';
                    if (classContainer) classContainer.classList.remove('hidden');
                    if (passContainer) passContainer.classList.add('hidden');
                    if (nameFields) nameFields.classList.remove('hidden');
                    if (teacherLabel) teacherLabel.textContent = "Teacher";
                } else {
                    roleTeacher.className = 'bg-white shadow-sm text-blue-600 rounded-xl py-2.5 font-bold transition';
                    roleStudent.className = 'text-slate-500 hover:text-slate-800 rounded-xl py-2.5 font-bold transition';
                    if (classContainer) classContainer.classList.add('hidden');
                    if (passContainer) passContainer.classList.remove('hidden');
                    if (nameFields) nameFields.classList.add('hidden');
                    if (teacherLabel) teacherLabel.textContent = "Select Your Teacher Profile";
                }
            }
        };

        window.handleLogin = function() {
            const role = window.loginRole || 'student';
            const teacherChoice = document.getElementById('login-teacher')?.value || 'Mr B';

            if (role === 'teacher') {
                const pass = document.getElementById('login-passcode')?.value;
                if (pass !== 'Rocky') {
                    document.getElementById('login-error')?.classList.remove('hidden');
                    return;
                }
                app.currentUser = { name: teacherChoice, role: 'teacher', classGroup: 'Staff', teacher: teacherChoice };
            } else {
                const firstName = document.getElementById('login-firstname')?.value.trim();
                const surname = document.getElementById('login-surname')?.value.trim();
                if (!firstName || !surname) return;
                const studentClass = document.getElementById('login-class')?.value.trim() || '7A';
                const fullName = `${firstName} ${surname}`;
                app.currentUser = { 
                    name: fullName, 
                    firstName, 
                    surname, 
                    role: 'student', 
                    classGroup: studentClass, 
                    teacher: teacherChoice 
                };
            }

            // Look up existing profile for this specific user or initialise clean progress
            const userKey = getUserRecordKey(app.currentUser);
            const existingRecord = loadUserState(userKey);

            if (!existingRecord) {
                // New user: fresh state
                state.stats = { completedTests: 0, avgScore: 0, tokens: 0 };
                state.inventory = [];
                state.testResults = [];
            }

            saveUserState();

            if (app.currentUser.role === 'teacher') {
                app.navigate('teacherDash');
            } else {
                app.navigate('studentDash');
            }
        };

        window.logout = function() {
            // Save current progress before logout
            saveUserState();
            app.currentUser = null;
            state.stats = { completedTests: 0, avgScore: 0, tokens: 0 };
            state.inventory = [];
            state.testResults = [];
            try {
                // Clear active session pointer so next session starts at login screen
                localStorage.removeItem(SESSION_STORAGE_KEY);
            } catch (e) {}
            app.navigate('login');
        };

        window.getTeacherSpreadsheetUrl = function() {
            return "https://docs.google.com/spreadsheets/d/140auyVwux2-WUJZ6DybpfWRrnwOG2FTX-1QpMsvfY0c/edit?gid=0#gid=0";
        };

        window.selectQuizOption = function(idx) {
            if (window.quizState) {
                window.quizState.selectedOption = idx;
                app.navigate('testModule');
            }
        };

        window.submitQuizAnswer = function() {
            if (!window.quizState || window.quizState.selectedOption === null) return;
            const stateObj = window.quizState;
            const q = stateObj.questions[stateObj.currentIndex];
            stateObj.userAnswers.push(stateObj.selectedOption);
            if (stateObj.selectedOption === q.a) {
                stateObj.score++;
                window.addTokens(10);
            }
            stateObj.currentIndex++;
            stateObj.selectedOption = null;

            if (stateObj.currentIndex >= stateObj.questions.length) {
                stateObj.finished = true;
                if (stateObj.type === 'test') {
                    const pct = Math.round((stateObj.score / stateObj.questions.length) * 100);
                    const isPass = pct >= 50;

                    if (!Array.isArray(state.testResults)) state.testResults = [];
                    state.testResults.push({
                        area: stateObj.area,
                        level: stateObj.level,
                        score: stateObj.score,
                        total: stateObj.questions.length,
                        percentage: pct,
                        passed: isPass,
                        timestamp: Date.now()
                    });

                    state.stats.completedTests = (state.stats.completedTests || 0) + 1;
                    saveUserState();
                }
            }
            app.navigate('testModule');
        };

        window.addTokens = function(amount) {
            state.stats.tokens += amount;
            saveUserState();
            const tokenEl = document.getElementById('nav-tokens');
            if (tokenEl) {
                tokenEl.textContent = state.stats.tokens;
                tokenEl.classList.add('scale-125', 'text-amber-600');
                setTimeout(() => {
                    tokenEl.classList.remove('scale-125', 'text-amber-600');
                }, 300);
            }
        };

        window.buyItem = function(id, cost) {
            if (state.stats.tokens >= cost && !state.inventory.includes(id)) {
                state.stats.tokens -= cost;
                state.inventory.push(id);
                saveUserState();
                const tokenEl = document.getElementById('nav-tokens');
                if (tokenEl) tokenEl.textContent = state.stats.tokens;
                app.navigate('shop');
            }
        };

        // --- App Bootstrapping ---
        window.onload = () => {
            const savedData = loadUserState();
            if (app.currentUser) {
                // If user was previously logged in, resume their dashboard
                app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
            } else {
                app.navigate('login');
            }
        };
    </script>
