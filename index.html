  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
                if (typeof remoteMe.stats.overallTokensOffset === 'number') {
                  window.state.stats.overallTokensOffset = remoteMe.stats.overallTokensOffset;
                }
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

  <script>
    // ==========================================
    // CORE AUDIO ENGINE & SHARED HELPERS
    // ==========================================
    let sharedAudioCtx = null;

    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) sharedAudioCtx = new AC();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    function playTonePitch(freq = 440, duration = 0.25, volume = 0.25, wave = 'triangle') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(Math.max(40, freq), now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(Math.min(0.6, Math.max(0.01, volume)), now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.05, duration));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + Math.max(0.06, duration) + 0.02);
      } catch (e) {}
    }

    function getLocalUserRecords() {
      try {
        const raw = localStorage.getItem('boncepts_users_db');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveLocalUserRecords(db) {
      try {
        localStorage.setItem('boncepts_users_db', JSON.stringify(db));
      } catch (e) {}
    }

    function getAllUserRecords() {
      const localDb = getLocalUserRecords();
      const cloudDb = (window.cachedCloudUsers && typeof window.cachedCloudUsers === 'object') ? window.cachedCloudUsers : {};
      return { ...localDb, ...cloudDb };
    }

    function persistCurrentUser() {
      const user = window.app && window.app.currentUser;
      if (!user || user.role === 'teacher') return;
      const db = getLocalUserRecords();
      const record = {
        key: user.key,
        firstName: user.firstName,
        surname: user.surname,
        classGroup: user.classGroup,
        teacher: user.teacher || 'Mr B',
        role: 'student',
        stats: window.state.stats || { tokens: 0, testsTaken: 0, overallTokensOffset: 0 },
        inventory: window.state.inventory || [],
        testHistory: window.state.testHistory || [],
        completedLessons: window.state.completedLessons || [],
        avatar: window.state.avatar || { bg: 'bg_midnight', outfit: 'outfit_hoodie', hat: 'hat_none', unlocked: ['bg_midnight', 'outfit_hoodie', 'hat_none'] }
      };
      db[user.key] = record;
      saveLocalUserRecords(db);
      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(user.key, record);
      }
      updateNavBar();
      updateGlobalLeaderboard();
    }

    function getStudentSpentTokens(rec) {
      if (!rec) return 0;
      let spent = 0;
      const inv = Array.isArray(rec.inventory) ? rec.inventory : [];
      inv.forEach(itemId => {
        const found = shopItems.find(it => it.id === itemId);
        if (found) spent += found.cost;
      });
      const unlocked = (rec.avatar && Array.isArray(rec.avatar.unlocked)) ? rec.avatar.unlocked : [];
      unlocked.forEach(upgId => {
        if (typeof avatarUpgradeCosts[upgId] === 'number') {
          spent += avatarUpgradeCosts[upgId];
        }
      });
      return spent;
    }

    function getStudentOverallTokens(rec) {
      if (!rec) return 0;
      const left = (rec.stats && typeof rec.stats.tokens === 'number') ? rec.stats.tokens : 0;
      const offset = (rec.stats && typeof rec.stats.overallTokensOffset === 'number') ? rec.stats.overallTokensOffset : 0;
      return Math.max(0, left + getStudentSpentTokens(rec) + offset);
    }

    function addTokens(amount) {
      if (!window.app || !window.app.currentUser || window.app.currentUser.role === 'teacher') return;
      if (!window.state.stats) window.state.stats = { tokens: 0, testsTaken: 0, overallTokensOffset: 0 };
      window.state.stats.tokens = Math.max(0, (window.state.stats.tokens || 0) + amount);
      persistCurrentUser();
    }

    function updateNavBar() {
      const user = window.app && window.app.currentUser;
      const loginBtn = document.getElementById('nav-login-btn');
      const profileBox = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const tokenVal = document.getElementById('nav-user-tokens');
      const nameEl = document.getElementById('nav-user-name');
      const roleEl = document.getElementById('nav-user-role');
      const bonaLink = document.getElementById('nav-bonachord-link');

      if (user) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profileBox) {
          profileBox.classList.remove('hidden');
          profileBox.classList.add('flex');
        }
        if (bonaLink) bonaLink.classList.remove('hidden');
        if (nameEl) nameEl.textContent = user.role === 'teacher' ? `${user.firstName} (Teacher)` : `${user.firstName} ${user.surname}`;
        if (roleEl) roleEl.textContent = user.role === 'teacher' ? 'Staff Access • Free Arcade' : `Class ${user.classGroup} • ${user.teacher || 'Mr B'}`;
        if (tokenBadge) {
          if (user.role === 'teacher') {
            tokenBadge.classList.add('hidden');
          } else {
            tokenBadge.classList.remove('hidden');
            tokenBadge.classList.add('flex');
            if (tokenVal) tokenVal.textContent = (window.state && window.state.stats) ? (window.state.stats.tokens || 0) : 0;
          }
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profileBox) {
          profileBox.classList.add('hidden');
          profileBox.classList.remove('flex');
        }
        if (tokenBadge) {
          tokenBadge.classList.add('hidden');
          tokenBadge.classList.remove('flex');
        }
        if (bonaLink) bonaLink.classList.add('hidden');
      }
    }

    function getSortedStudents() {
      const db = getAllUserRecords();
      return Object.values(db)
        .filter(u => u && u.role !== 'teacher' && u.firstName)
        .map(u => ({
          ...u,
          tokensLeft: (u.stats && typeof u.stats.tokens === 'number') ? u.stats.tokens : 0,
          overallTokens: getStudentOverallTokens(u)
        }))
        .sort((a, b) => b.overallTokens - a.overallTokens || b.tokensLeft - a.tokensLeft);
    }

      const students = getSortedStudents();
      if (!students.length) {

        return;

      ticker.innerHTML = students.slice(0, 15).map((s, idx) =>
        `<span class="mx-4"><strong class="text-amber-300">#${idx + 1} ${s.firstName} ${s.surname ? s.surname[0] + '.' : ''}</strong> (${s.classGroup || ''}) — <span class="text-emerald-300 font-bold">${s.overallTokens} Overall</span> • ${s.tokensLeft} Left</span>`
      ).join('•');
    }

    let repeatRoadmapState = { round: 1, totalRounds: 10, score: 0, queue: [], current: null, opts: [], answered: false, picked: null, completed: false };

    function mountEmbeddedRepeatRoadmapGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const deck = [...repeatRoadmapScenarios].sort(() => Math.random() - 0.5).slice(0, 10);
      repeatRoadmapState = {

    function guessRepeatRoadmap(choice) {
      const st = repeatRoadmapState;
      if (st.answered || st.completed) return;
      st.answered = true;
      st.picked = choice;
      if (choice === st.current.answer) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.3, 'triangle');
      } else {
        playTonePitch(160, 0.25, 0.3, 'sawtooth');

      renderRepeatRoadmapUI(document.getElementById('embedded-tool-container'));

        st.round++;
        st.current = st.queue[st.round - 1];
        st.opts = [...st.current.options].sort(() => Math.random() - 0.5);
        st.answered = false;
        st.picked = null;
        renderRepeatRoadmapUI(document.getElementById('embedded-tool-container'));

    const polyphonicRoundSongs = [
      { title: 'Row, Row, Row Your Boat', layers: 4, staggerBars: 1, notes: [261.63, 261.63, 261.63, 293.66, 329.63, 329.63, 293.66, 329.63, 349.23, 392.00] },

      { title: 'Kookaburra Sits in the Old Gum Tree', layers: 4, staggerBars: 1, notes: [392.00, 392.00, 440.00, 440.00, 493.88, 493.88, 440.00, 392.00] },

    let polyphonicRoundState = { idx: 0, offsets: [0, 0, 0, 0], solved: [], timers: [], playing: false, checked: false, lastOk: false };

    function stopPolyphonicRoundGame() {
      if (polyphonicRoundState.timers) polyphonicRoundState.timers.forEach(t => clearTimeout(t));
      polyphonicRoundState.timers = [];
      polyphonicRoundState.playing = false;
    }

    function mountEmbeddedPolyphonicRoundGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      stopPolyphonicRoundGame();
      polyphonicRoundState = { idx: 0, offsets: [0, 0, 0, 0], solved: [], timers: [], playing: false, checked: false, lastOk: false };
      renderPolyphonicRoundUI(target);
    }

    function setPolyphonicOffset(layerIdx, val) {
      polyphonicRoundState.offsets[layerIdx] = Math.max(0, Math.min(4, parseInt(val, 10) || 0));
      polyphonicRoundState.checked = false;
      renderPolyphonicRoundUI(document.getElementById('embedded-tool-container'));
    }

    function playPolyphonicRoundPreview() {
      stopPolyphonicRoundGame();
      const song = polyphonicRoundSongs[polyphonicRoundState.idx];
      if (!song) return;
      polyphonicRoundState.playing = true;
      const waves = ['triangle', 'sine', 'sawtooth', 'square'];
      const barMs = 640;
      const stepMs = barMs / 2;
      for (let l = 0; l < song.layers; l++) {
        const delay = (polyphonicRoundState.offsets[l] || 0) * barMs;
        song.notes.forEach((f, nIdx) => {
          const t = setTimeout(() => {
            playTonePitch(f, 0.25, l > 1 ? 0.1 : 0.18, waves[l % waves.length]);
          }, delay + nIdx * stepMs);
          polyphonicRoundState.timers.push(t);
        });
      }
      const endT = setTimeout(() => {
        polyphonicRoundState.playing = false;
      }, 4 * barMs + song.notes.length * stepMs);
      polyphonicRoundState.timers.push(endT);
    }

    function checkPolyphonicArrangement() {
      const st = polyphonicRoundState;
      const song = polyphonicRoundSongs[st.idx];
      const expected = Array.from({ length: song.layers }, (_, i) => i * song.staggerBars);
      const actual = st.offsets.slice(0, song.layers);
      const ok = expected.every((v, i) => v === actual[i]);
      st.checked = true;
      st.lastOk = ok;
      if (ok && !st.solved.includes(st.idx)) {
        st.solved.push(st.idx);
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.34, 'triangle');
        setTimeout(() => playTonePitch(880, 0.28, 0.34, 'triangle'), 140);
      } else if (!ok) {
        playTonePitch(155, 0.25, 0.3, 'sawtooth');
      }
      renderPolyphonicRoundUI(document.getElementById('embedded-tool-container'));
    }

      stopPolyphonicRoundGame();
      polyphonicRoundState.idx = i;
      polyphonicRoundState.offsets = [0, 0, 0, 0];
      polyphonicRoundState.checked = false;
      polyphonicRoundState.lastOk = false;
      renderPolyphonicRoundUI(document.getElementById('embedded-tool-container'));
    }

    function renderPolyphonicRoundUI(target) {

            `).join('')}

              const off = st.offsets[l] || 0;

                <div class="p-3.5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-2">
                  <div class="flex items-center justify-between text-xs font-bold">

                      <div class="flex items-center gap-2">
                        <button type="button" onclick="setPolyphonicOffset(${l}, ${off - 1})" class="px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 font-black">←</button>
                        <input type="range" min="0" max="4" value="${off}" oninput="setPolyphonicOffset(${l}, this.value)" class="w-24 accent-cyan-400">

                      </div>
                    ` : ''}
                  </div>
                  <div class="h-8 rounded-xl bg-slate-950 relative overflow-hidden border border-slate-700">
                    <div class="absolute top-1 bottom-1 rounded-lg ${colors[l]} text-slate-950 font-black text-[10px] flex items-center justify-center transition-all" style="left:${off * 18}%; width:46%;">
                      ${song.title}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 pt-1">

          ${st.checked ? `
            <div class="p-3.5 rounded-2xl text-xs font-bold text-center border ${st.lastOk ? 'bg-emerald-950/70 border-emerald-500 text-emerald-200' : 'bg-rose-950/70 border-rose-500 text-rose-200'}">

            </div>
          ` : ''}
        </div>
      `;

            renderLessonDetail(viewport, params.conceptId, params.levelNum, params.lessonNum);
            break;
          case 'masteryTest':
            if (!this.currentUser) return renderLoginView(viewport);
            renderMasteryTest(viewport, params.conceptId, params.levelNum);
            break;
          case 'shop':
            if (!this.currentUser) return renderLoginView(viewport);
            renderShopView(viewport);
            break;
          case 'studentDash':
            if (!this.currentUser) return renderLoginView(viewport);
            renderStudentDash(viewport);

      const tTab = document.getElementById('tab-teacher-login');
      if (mode === 'teacher') {
        if (sForm) sForm.classList.add('hidden');
        if (tForm) tForm.classList.remove('hidden');

    function handleUserLogin(e, mode) {
      e.preventDefault();
      if (mode === 'teacher') {
        const code = (document.getElementById('teacher-passcode')?.value || '').trim().toLowerCase();
        const tName = document.getElementById('teacher-name-select')?.value || 'Mr B';
        if (code !== 'music2026' && code !== 'boncepts' && code !== 'teacher') {
          showAppModal('Invalid Passcode', 'Please enter the teacher passcode (e.g. music2026).', false);
          return;
        }
        window.app.currentUser = { key: 'teacher_' + tName.replace(/\s+/g, '_'), firstName: tName, surname: '', role: 'teacher' };
        localStorage.setItem('boncepts_active_session', JSON.stringify(window.app.currentUser));
        updateNavBar();
        window.app.navigate('teacherDash');
        return;
      }

      const firstName = (document.getElementById('login-firstname')?.value || '').trim();
      const surname = (document.getElementById('login-surname')?.value || '').trim();
      const classGroup = document.getElementById('login-class')?.value || '7A';
      const teacher = document.getElementById('login-teacher')?.value || 'Mr B';
      if (!firstName || !surname) return;

      const key = `${firstName}_${surname}_${classGroup}`.toLowerCase().replace(/[^a-z0-9_]/g, '');
      const db = getAllUserRecords();
      const existing = db[key];

      window.app.currentUser = { key, firstName, surname, classGroup, teacher, role: 'student' };
      localStorage.setItem('boncepts_active_session', JSON.stringify(window.app.currentUser));

      if (existing) {
        window.state = {
          stats: existing.stats || { tokens: 10, testsTaken: 0, overallTokensOffset: 0 },
          inventory: existing.inventory || [],
          testHistory: existing.testHistory || [],
          completedLessons: existing.completedLessons || [],
          avatar: existing.avatar || { bg: 'bg_midnight', outfit: 'outfit_hoodie', hat: 'hat_none', unlocked: ['bg_midnight', 'outfit_hoodie', 'hat_none'] }
        };

        window.state = {
          stats: { tokens: 10, testsTaken: 0, overallTokensOffset: 0 },
          inventory: [],
          testHistory: [],
          completedLessons: [],
          avatar: { bg: 'bg_midnight', outfit: 'outfit_hoodie', hat: 'hat_none', unlocked: ['bg_midnight', 'outfit_hoodie', 'hat_none'] }
        };
      }
      persistCurrentUser();
      window.app.navigate('studentDash');
    }

    let activeTestState = null;
    function renderMasteryTest(viewport, conceptId, levelNum) {
      const concept = curriculumData.find(c => c.id === conceptId) || curriculumData[0];
      const level = concept.levels.find(l => l.levelNum === levelNum) || concept.levels[0];
      activeTestState = { concept, level, idx: 0, score: 0, answered: false, picked: null, done: false };
      drawMasteryTest(viewport);
    }

    function answerMasteryQ(optIdx) {
      const st = activeTestState;
      if (!st || st.answered || st.done) return;
      const q = st.level.testQuestions[st.idx];
      st.answered = true;
      st.picked = optIdx;
      if (optIdx === q.correct) {
        st.score++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.3, 'triangle');
      } else {
        playTonePitch(160, 0.25, 0.3, 'sawtooth');
      }
      drawMasteryTest(document.getElementById('app-viewport'));
    }

    function nextMasteryQ() {
      const st = activeTestState;
      if (st.idx + 1 < st.level.testQuestions.length) {
        st.idx++;
        st.answered = false;
        st.picked = null;
      } else {
        st.done = true;
        if (window.state && window.state.stats) {
          window.state.stats.testsTaken = (window.state.stats.testsTaken || 0) + 1;
          persistCurrentUser();
        }
      }
      drawMasteryTest(document.getElementById('app-viewport'));
    }

    function drawMasteryTest(viewport) {
      const st = activeTestState;
      const q = st.level.testQuestions[st.idx];
      viewport.innerHTML = `
        <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-lg space-y-6">
          <div class="flex items-center justify-between">
            <button onclick="window.app.navigate('conceptDetail', { conceptId: '${st.concept.id}' })" class="text-xs font-bold text-slate-500 hover:text-indigo-600">← Exit Test</button>
            <span class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 font-black text-xs">Question ${Math.min(st.idx + 1, st.level.testQuestions.length)} / ${st.level.testQuestions.length}</span>
          </div>
          ${st.done ? `
            <div class="text-center space-y-4 py-4">
              <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto"><i class="fa-solid fa-award"></i></div>
              <h2 class="text-2xl font-black text-slate-900">Mastery Test Complete!</h2>
              <p class="text-sm text-slate-600">You scored <strong>${st.score} / ${st.level.testQuestions.length}</strong> and earned <strong>+${st.score * 2} Tokens</strong>!</p>
              <button onclick="window.app.navigate('conceptDetail', { conceptId: '${st.concept.id}' })" class="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-black text-xs shadow">Back to ${st.concept.title}</button>
            </div>
          ` : `
            <h2 class="text-xl font-black text-slate-900">${q.q}</h2>
            <div class="space-y-3">
              ${q.options.map((opt, i) => {
                let cls = 'bg-slate-50 hover:bg-indigo-50 border-slate-200 text-slate-800';
                if (st.answered) {
                  if (i === q.correct) cls = 'bg-emerald-500 border-emerald-600 text-white';
                  else if (i === st.picked) cls = 'bg-rose-500 border-rose-600 text-white';
                  else cls = 'bg-slate-100 border-slate-200 text-slate-400 opacity-60';
                }
                return `<button type="button" onclick="answerMasteryQ(${i})" ${st.answered ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border-2 font-bold text-sm transition-all ${cls}">${opt}</button>`;
              }).join('')}
            </div>
            ${st.answered ? `<button type="button" onclick="nextMasteryQ()" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm">Continue →</button>` : ''}
          `}
        </div>
      `;
    }

    function buyShopItem(itemId) {
      const item = shopItems.find(i => i.id === itemId);

      const tokens = window.state.stats.tokens || 0;

        showAppModal('Not Enough Tokens', `You need ${item.cost} Tokens to unlock ${item.name}. Keep completing lessons and games!`, false);
        return;
      }
      window.state.stats.tokens -= item.cost;
      if (!window.state.inventory.includes(item.id)) window.state.inventory.push(item.id);
      persistCurrentUser();
      showAppModal('Item Unlocked!', `You redeemed ${item.name}!`, true);
      if (item.route) window.app.navigate(item.route);
      else renderShopView(document.getElementById('app-viewport'));
    }

    function tradeShopItem(itemId) {
      const item = shopItems.find(i => i.id === itemId);
      if (!item) return;
      const idx = window.state.inventory.indexOf(itemId);
      if (idx < 0) return;
      window.state.inventory.splice(idx, 1);
      window.state.stats.tokens = (window.state.stats.tokens || 0) + item.cost;
      persistCurrentUser();
      showAppModal('Item Traded Back', `Refunded +${item.cost} Tokens for ${item.name}.`, true);
      renderShopView(document.getElementById('app-viewport'));
    }

    function saveEditedStudent() {
      const key = document.getElementById('edit-student-key').value;
      const db = getLocalUserRecords();
      const existing = getAllUserRecords()[key];
      if (!existing) return;
      const newLeft = Math.max(0, parseInt(document.getElementById('edit-student-tokens').value, 10) || 0);
      const newOverall = Math.max(0, parseInt(document.getElementById('edit-student-overall-tokens').value, 10) || 0);
      const spent = getStudentSpentTokens(existing);
      const updated = {
        ...existing,
        firstName: document.getElementById('edit-student-firstname').value.trim(),
        surname: document.getElementById('edit-student-surname').value.trim(),
        classGroup: document.getElementById('edit-student-class').value,
        teacher: document.getElementById('edit-student-teacher').value,
        stats: { ...(existing.stats || {}), tokens: newLeft, overallTokensOffset: newOverall - (newLeft + spent) }
      };
      db[key] = updated;
      saveLocalUserRecords(db);
      if (window.saveUserRecordToCloud) window.saveUserRecordToCloud(key, updated);
      closeEditStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));

    let waveState = { round: 1, total: 6, score: 0, target: { wave: 'sine', freq: 3, amp: 60 }, user: { wave: 'sine', freq: 2, amp: 40 }, raf: null };

    function stopWaveformGame() {
      if (waveState.raf) cancelAnimationFrame(waveState.raf);
      waveState.raf = null;
    }

    function nextWaveTarget() {
      const waves = ['sine', 'triangle', 'square', 'sawtooth'];
      waveState.target = {
        wave: waves[Math.floor(Math.random() * waves.length)],
        freq: 2 + Math.floor(Math.random() * 5),
        amp: 30 + Math.floor(Math.random() * 6) * 10
      };
    }

    function renderWaveformGameView(viewport) {
      stopWaveformGame();
      waveState = { round: 1, total: 6, score: 0, target: { wave: 'sine', freq: 4, amp: 70 }, user: { wave: 'sine', freq: 2, amp: 40 }, raf: null };
      nextWaveTarget();
      drawWaveformGameUI(viewport);
    }

    function drawWaveformCanvas() {
      const canvas = document.getElementById('waveform-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth || 600;
      const h = canvas.height = 180;
      ctx.clearRect(0, 0, w, h);

      const sample = (type, phase) => {
        const p = phase % (Math.PI * 2);
        if (type === 'square') return Math.sin(p) >= 0 ? 1 : -1;
        if (type === 'sawtooth') return (p / Math.PI) - 1;
        if (type === 'triangle') return (2 / Math.PI) * Math.asin(Math.sin(p));
        return Math.sin(p);
      };

      const plot = (cfg, color, dash) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = dash ? 3 : 3.5;
        ctx.setLineDash(dash ? [8, 6] : []);
        for (let x = 0; x <= w; x += 2) {
          const phase = (x / w) * Math.PI * 2 * cfg.freq;
          const y = h / 2 - sample(cfg.wave, phase) * (cfg.amp / 100) * (h * 0.4);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      };

      plot(waveState.target, '#34d399', true);
      plot(waveState.user, '#38bdf8', false);
    }

    function updateWaveSlider(prop, val) {
      waveState.user[prop] = prop === 'wave' ? val : Number(val);
      drawWaveformCanvas();
      const matchEl = document.getElementById('wave-match-pct');
      if (matchEl) {
        const wOk = waveState.user.wave === waveState.target.wave ? 40 : 0;
        const fOk = Math.max(0, 30 - Math.abs(waveState.user.freq - waveState.target.freq) * 10);
        const aOk = Math.max(0, 30 - Math.abs(waveState.user.amp - waveState.target.amp) * 0.6);
        matchEl.textContent = Math.round(wOk + fOk + aOk) + '%';
      }
    }

    function checkWaveMatch() {
      const ok = waveState.user.wave === waveState.target.wave &&
                 waveState.user.freq === waveState.target.freq &&
                 Math.abs(waveState.user.amp - waveState.target.amp) <= 10;
      if (ok) {
        waveState.score++;
        addTokens(2);
        playTonePitch(220 * waveState.target.freq * 0.5, 0.35, 0.25, waveState.target.wave);
        if (waveState.round < waveState.total) {
          waveState.round++;
          nextWaveTarget();
          drawWaveformGameUI(document.getElementById('app-viewport'));
        } else {
          showAppModal('Waveform Sculptor Complete!', `You matched ${waveState.score} / ${waveState.total} waves and earned +${waveState.score * 2} Tokens!`, true);
          window.app.navigate('shop');
        }
      } else {
        playTonePitch(150, 0.2, 0.25, 'sawtooth');
        showAppModal('Almost There!', 'Match the Wave Shape, Frequency, and Amplitude sliders closely to the dashed green target wave!', false);
      }
    }

              <button type="button" onclick="checkWaveMatch()" class="px-6 py-2.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black text-xs shadow">Lock In Wave (+2 Tokens)</button>

    // ==========================================
    // SHOP MINIGAME 2: INSTRUMENT NINJA (MAESTRO CONDUCTOR BATON)
    // ==========================================
    let ninjaState = { running: false, raf: null, spawnTimer: null, score: 0, lives: 3, round: 1, items: [], trail: [], targetFamily: 'Strings' };

    function stopDynamicsTracer() {
      ninjaState.running = false;
      if (ninjaState.raf) cancelAnimationFrame(ninjaState.raf);
      if (ninjaState.spawnTimer) clearInterval(ninjaState.spawnTimer);
      ninjaState.raf = null;
      ninjaState.spawnTimer = null;
    }

    function renderDynamicsTracerView(viewport) {
      stopDynamicsTracer();
      const families = ['Strings', 'Brass', 'Woodwinds', 'Percussion'];
      ninjaState = { running: true, raf: null, spawnTimer: null, score: 0, lives: 3, round: 1, items: [], trail: [], targetFamily: families[0] };
      viewport.innerHTML = `

        { emoji: '🥁', name: 'Snare Drum', family: 'Percussion', freq: 196.00 }
      ];

      const sliceAt = (x, y) => {
        ninjaState.trail.push({ x, y, life: 12 });
        ninjaState.items.forEach(it => {
          if (it.sliced) return;
          const dist = Math.hypot(it.x - x, it.y - y);
          if (dist < 42) {
            it.sliced = true;
            if (it.family === ninjaState.targetFamily) {
              ninjaState.score++;
              playTonePitch(it.freq, 0.2, 0.28, 'triangle');
              if (ninjaState.score % 5 === 0) {
                addTokens(1);
                ninjaState.round++;
                ninjaState.targetFamily = families[(ninjaState.round - 1) % families.length];
                const mEl = document.getElementById('ninja-mission');
                if (mEl) mEl.textContent = `Slice ONLY: ${ninjaState.targetFamily.toUpperCase()}!`;
              }
            } else {
              ninjaState.lives--;
              playTonePitch(130, 0.3, 0.32, 'sawtooth');
            }
            const sEl = document.getElementById('ninja-score');
            const lEl = document.getElementById('ninja-lives');
            if (sEl) sEl.textContent = `Sliced: ${ninjaState.score}`;
            if (lEl) lEl.textContent = '❤️'.repeat(Math.max(0, ninjaState.lives));
            if (ninjaState.lives <= 0) {
              stopDynamicsTracer();
              showAppModal('Instrument Ninja Over!', `You sliced ${ninjaState.score} target instruments!`, ninjaState.score >= 5);
            }
          }
        });
      };

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const pt = e.touches ? e.touches[0] : e;
        return { x: (pt.clientX - rect.left) * (canvas.width / rect.width), y: (pt.clientY - rect.top) * (canvas.height / rect.height) };
      };
      canvas.addEventListener('mousemove', e => { const p = getPos(e); sliceAt(p.x, p.y); });
      canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = getPos(e); sliceAt(p.x, p.y); }, { passive: false });

      ninjaState.spawnTimer = setInterval(() => {
        if (!ninjaState.running) return;
        const w = canvas.width || 700;
        const pick = Math.random() < 0.55
          ? pool.filter(p => p.family === ninjaState.targetFamily)[0] || pool[0]
          : pool[Math.floor(Math.random() * pool.length)];
        ninjaState.items.push({
          ...pick,
          x: 70 + Math.random() * Math.max(100, w - 140),
          y: (canvas.height || 380) + 20,
          vx: (Math.random() - 0.5) * 4,
          vy: -(11 + Math.random() * 3),
          sliced: false
        });
      }, 950);

      const loop = () => {
        if (!ninjaState.running) return;
        const w = canvas.width = canvas.clientWidth || 700;
        const h = canvas.height = 384;
        ctx.clearRect(0, 0, w, h);

        ninjaState.items.forEach(it => {
          it.x += it.vx;
          it.y += it.vy;
          it.vy += 0.28;
          ctx.font = '38px serif';
          ctx.textAlign = 'center';
          if (it.sliced) {
            ctx.fillText(it.emoji, it.x - 14, it.y);
            ctx.fillText(it.emoji, it.x + 14, it.y + 8);
          } else {
            ctx.fillText(it.emoji, it.x, it.y);
            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#e2e8f0';
            ctx.fillText(it.name, it.x, it.y + 20);
          }
        });
        ninjaState.items = ninjaState.items.filter(it => it.y < h + 60);

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ninjaState.trail.forEach((p, idx) => {
          p.life--;
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ninjaState.trail = ninjaState.trail.filter(p => p.life > 0);

        ninjaState.raf = requestAnimationFrame(loop);
      };
      loop();
    }

    // ==========================================

    const evhScaleRounds = [
      { name: 'C Major Scale', bpm: 200, notes: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25], labels: ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'] },

    ];

    let evhState = { active: false, round: 0, score: 0, targetIdx: 4, currentStep: -1, phase: 'idle', pressedThisRound: false, timers: [], keyHandler: null };

    function stopEvhGuitarGame() {
      evhState.active = false;
      evhState.timers.forEach(t => clearTimeout(t));
      evhState.timers = [];
      if (evhState.keyHandler) {
        window.removeEventListener('keydown', evhState.keyHandler);
        evhState.keyHandler = null;
      }
    }

    function renderEvhGuitarGameView(viewport) {
      stopEvhGuitarGame();
      evhState = { active: true, round: 0, score: 0, targetIdx: 4, currentStep: -1, phase: 'idle', pressedThisRound: false, timers: [], keyHandler: null };

      evhState.keyHandler = (e) => {
        if (!evhState.active) return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (e.repeat) return; // Anti-auto-click
          triggerEvhHit();
        }
      };
      window.addEventListener('keydown', evhState.keyHandler);
      drawEvhGuitarUI(viewport);
    }

    function startEvhRound() {
      evhState.timers.forEach(t => clearTimeout(t));
      evhState.timers = [];
      const r = evhScaleRounds[evhState.round];
      if (!r) return;
      evhState.targetIdx = 2 + Math.floor(Math.random() * 5);
      evhState.currentStep = -1;
      evhState.pressedThisRound = false;
      evhState.phase = 'countin';
      drawEvhGuitarUI(document.getElementById('app-viewport'));

      const beatMs = Math.round(60000 / r.bpm);
      for (let c = 0; c < 4; c++) {
        evhState.timers.push(setTimeout(() => {
          playTonePitch(c === 0 ? 880 : 660, 0.06, 0.25, 'square');
          const el = document.getElementById('evh-status');
          if (el) el.textContent = `Count-In: ${c + 1}...`;
        }, c * beatMs));
      }

      const startOffset = 4 * beatMs;
      r.notes.forEach((freq, idx) => {
        evhState.timers.push(setTimeout(() => {
          evhState.phase = 'playing';
          evhState.currentStep = idx;
          playTonePitch(freq, Math.max(0.12, beatMs / 1000 * 0.9), 0.22, 'sawtooth');
          drawEvhGuitarUI(document.getElementById('app-viewport'));
        }, startOffset + idx * beatMs));
      });

      evhState.timers.push(setTimeout(() => {
        evhState.phase = 'idle';
        evhState.currentStep = -1;
        if (evhState.round + 1 < evhScaleRounds.length) {
          evhState.round++;
          drawEvhGuitarUI(document.getElementById('app-viewport'));
        } else {
          showAppModal('EVH Shred Challenge Complete!', `You nailed ${evhState.score} / ${evhScaleRounds.length} shred hits and earned +${evhState.score} Tokens!`, evhState.score >= 6);
        }
      }, startOffset + r.notes.length * beatMs + 350));
    }

      if (evhState.phase !== 'playing' || evhState.pressedThisRound) return;
      evhState.pressedThisRound = true;
      const el = document.getElementById('evh-status');
      if (evhState.currentStep === evhState.targetIdx) {
        evhState.score++;

        playTonePitch(880, 0.22, 0.35, 'sawtooth');

    function buildMonophonicContourSVG(notes, strokeColor, revealed) {
      if (!revealed) {
        return `
          <svg viewBox="0 0 220 40" class="w-full h-10 bg-slate-950/70 rounded-xl border border-slate-700/70">
            <line x1="12" y1="20" x2="208" y2="20" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
            <text x="110" y="24" fill="#94a3b8" font-size="9.5" font-weight="800" text-anchor="middle">LISTEN TO COMPARE MELODY</text>
          </svg>
        `;
      }
      const minF = Math.min(...notes) - 30;
      const maxF = Math.max(...notes) + 30;
      const span = Math.max(1, maxF - minF);
      const pts = notes.map((f, idx) => {
        const x = 16 + (idx / Math.max(1, notes.length - 1)) * 188;
        const y = 33 - ((f - minF) / span) * 26;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `
        <svg viewBox="0 0 220 40" class="w-full h-10 bg-slate-950 rounded-xl border border-slate-700">
          <polyline points="${pts}" fill="none" stroke="${strokeColor}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          ${notes.map((f, idx) => {
            const x = 16 + (idx / Math.max(1, notes.length - 1)) * 188;
            const y = 33 - ((f - minF) / span) * 26;
            return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#ffffff"/>`;
          }).join('')}
        </svg>
      `;
    }

    function setupMonophonicRescueRound() {
      stopMonophonicCleanerGame();
      const st = monophonicCleanerState;
      const mix = st.queue[st.round - 1] || monophonicRescueMixes[0];
      st.mix = mix;

      const chosenPalette = [...monophonicTrackPalette].sort(() => Math.random() - 0.5).slice(0, mix.trackCount);
      const imposterIdx = Math.floor(Math.random() * mix.trackCount);
      st.imposterIdx = imposterIdx;

      st.tracks = chosenPalette.map((inst, idx) => ({
        ...inst,
        trackNum: idx + 1,
        isImposter: idx === imposterIdx,
        notes: idx === imposterIdx ? mix.imposterNotes : mix.mainNotes
      }));

      st.answered = false;
      st.deletedIdx = null;
      st.lastCorrect = false;
    }

    function mountEmbeddedMonophonicCleanerGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      stopMonophonicCleanerGame();
      const shuffled = [...monophonicRescueMixes].sort(() => Math.random() - 0.5);
      monophonicCleanerState = {
        round: 1,
        totalRounds: 8,
        score: 0,
        queue: shuffled,
        mix: null,
        tracks: [],
        imposterIdx: 0,
        playingMode: null,
        answered: false,
        deletedIdx: null,
        lastCorrect: false,
        completed: false,
        timers: []
      };
      setupMonophonicRescueRound();
      renderMonophonicCleanerGameUI(target);
    }

    function playMonophonicRescueAudio(mode) {
      const st = monophonicCleanerState;
      if (!st.tracks || st.tracks.length === 0) return;
      stopMonophonicCleanerGame();
      st.playingMode = mode;
      renderMonophonicCleanerGameUI(document.getElementById('embedded-tool-container'));

      const stepMs = 340;
      const noteLen = st.mix ? st.mix.mainNotes.length : 6;

      for (let s = 0; s < noteLen; s++) {
        const t = setTimeout(() => {
          st.tracks.forEach((tr, idx) => {
            const shouldPlay =
              (mode === 'mix') ||
              (mode === 'rescued' && !tr.isImposter) ||
              (mode === idx);
            if (shouldPlay && tr.notes[s]) {
              const scaleVol = (mode === 'mix' || mode === 'rescued') ? tr.vol * 0.75 : tr.vol;
              playTonePitch(tr.notes[s], 0.30, scaleVol, tr.wave);
            }
          });
        }, s * stepMs);
        st.timers.push(t);
      }

      const endT = setTimeout(() => {
        st.playingMode = null;
        renderMonophonicCleanerGameUI(document.getElementById('embedded-tool-container'));
      }, noteLen * stepMs + 140);
      st.timers.push(endT);
    }

    function deleteMonophonicTrack(trackIdx) {
      const st = monophonicCleanerState;
      if (st.answered || st.completed) return;
      stopMonophonicCleanerGame();

      st.answered = true;
      st.deletedIdx = trackIdx;
      st.lastCorrect = (trackIdx === st.imposterIdx);

      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.16, 0.34, 'triangle');

      renderMonophonicCleanerGameUI(document.getElementById('embedded-tool-container'));
    }

      stopHomophonicRoleGame();
      st.playingMode = mode;
      renderHomophonicRoleGameUI(document.getElementById('embedded-tool-container'));

      const playMelody = (mode === 'mix') || (st.tracks[mode] && st.tracks[mode].kind === 'melody');
      const playChords = (mode === 'mix') || (st.tracks[mode] && st.tracks[mode].kind === 'chords');
      const playBass   = (mode === 'mix') || (st.tracks[mode] && st.tracks[mode].kind === 'bass');

      const stepMs = 340;
      for (let s = 0; s < 8; s++) {
        const t = setTimeout(() => {
          if (playMelody && song.melodyNotes[s]) {
            const vol = song.melodyWave === 'sawtooth' || song.melodyWave === 'square' ? 0.14 : 0.25;
            playTonePitch(song.melodyNotes[s], 0.30, vol, song.melodyWave);
          }
          if (playBass && song.bassNotes[s]) {
            playTonePitch(song.bassNotes[s], 0.30, 0.24, 'triangle');
          }
          if (playChords && s % 2 === 0) {
            const chord = song.chords[Math.floor(s / 2)];
            if (chord) {
              chord.forEach(cf => playTonePitch(cf, 0.62, 0.085, 'sine'));
            }
          }
        }, s * stepMs);
        st.timers.push(t);
      }

      const endT = setTimeout(() => {
        st.playingMode = null;
        renderHomophonicRoleGameUI(document.getElementById('embedded-tool-container'));
      }, 8 * stepMs + 120);
      st.timers.push(endT);
    }

      st.selectedRole = roleChoice;

      { meter: '4/4', beats: 4, notes: ['minim', 'minim'], caption: '2 Minims in the bar' },
      { meter: '4/4', beats: 4, notes: ['semibreve'], caption: '1 Semibreve (4 beats) in the bar' },
      { meter: '4/4', beats: 4, notes: ['dottedMinim', 'crotchet'], caption: 'Dotted Minim + Crotchet' },
      { meter: '4/4', beats: 4, notes: ['crotchet', 'quavers', 'minim'], caption: 'Crotchet + Paired Quavers + Minim' }
    ];

    let simpleTimePulseState = {
      activeMeter: null,
      beatsPerBar: 0,
      currentBeat: -1,
      intervalId: null
    };

    let meterMatchState = {
      round: 1,
      totalRounds: 10,
      score: 0,
      streak: 0,
      best: 0,
      queue: [],
      current: null,
      answered: false,
      selectedMeter: null,
      lastCorrect: false,
      completed: false
    };

    function stopSimpleMeterPulse() {
      if (simpleTimePulseState.intervalId) {
        clearInterval(simpleTimePulseState.intervalId);
        simpleTimePulseState.intervalId = null;
      }
      simpleTimePulseState.activeMeter = null;
      simpleTimePulseState.beatsPerBar = 0;
      simpleTimePulseState.currentBeat = -1;
      updateSimplePulseVisuals();
    }

    function startSimpleMeterPulse(beatsPerBar) {
      stopSimpleMeterPulse();
      simpleTimePulseState.activeMeter = `${beatsPerBar}/4`;
      simpleTimePulseState.beatsPerBar = beatsPerBar;
      simpleTimePulseState.currentBeat = -1;

      const tick = () => {
        simpleTimePulseState.currentBeat = (simpleTimePulseState.currentBeat + 1) % beatsPerBar;
        const isStrong = simpleTimePulseState.currentBeat === 0;
        playTonePitch(isStrong ? 880 : 523.25, 0.08, isStrong ? 0.36 : 0.2, isStrong ? 'triangle' : 'sine');
        updateSimplePulseVisuals();
      };

      tick();
      simpleTimePulseState.intervalId = setInterval(tick, 540);
    }

    function updateSimplePulseVisuals() {
      const statusEl = document.getElementById('simple-pulse-status');
      const dotsEl = document.getElementById('simple-pulse-dots');
      const st = simpleTimePulseState;

      ['2', '3', '4'].forEach(num => {
        const btn = document.getElementById(`pulse-btn-${num}`);
        if (!btn) return;
        const isActive = st.activeMeter === `${num}/4`;
        btn.className = isActive
          ? 'px-5 py-2.5 rounded-xl font-black text-xs bg-indigo-700 text-white ring-4 ring-indigo-300 shadow-md transition-all'
          : 'px-5 py-2.5 rounded-xl font-black text-xs bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-all';
      });

      if (statusEl) {
        statusEl.textContent = st.activeMeter
          ? `Playing ${st.activeMeter} Pulse — Strong accent on Beat 1!`
          : 'Click a meter above to hear the rhythmic accent pulse.';
      }

      if (dotsEl) {
        if (!st.beatsPerBar) {
          dotsEl.innerHTML = '';
        } else {
          dotsEl.innerHTML = Array.from({ length: st.beatsPerBar }, (_, idx) => {
            const active = idx === st.currentBeat;
            const isOne = idx === 0;
            return `<span class="w-9 h-9 rounded-full flex items-center justify-center font-black text-xs transition-all ${
              active
                ? (isOne ? 'bg-amber-400 text-slate-950 scale-110 shadow-md' : 'bg-blue-600 text-white scale-105 shadow')
                : 'bg-slate-200 text-slate-500'
            }">${idx + 1}</span>`;
          }).join('');
        }
      }
    }

    function getNoteBeatValue(type) {
      if (type === 'semibreve') return 4;
      if (type === 'dottedMinim') return 3;
      if (type === 'minim') return 2;
      return 1; // crotchet, quavers, rest
    }

    function playRhythmNoteSequence(noteList, beatMs = 460) {
      let cursorMs = 0;
      noteList.forEach(n => {
        const val = getNoteBeatValue(n);
        const startAt = cursorMs;
        if (n === 'quavers') {
          setTimeout(() => playTonePitch(523.25, 0.11, 0.3, 'triangle'), startAt);
          setTimeout(() => playTonePitch(523.25, 0.11, 0.3, 'triangle'), startAt + beatMs / 2);
        } else if (n !== 'rest') {
          setTimeout(() => playTonePitch(440, Math.min(1.3, (val * beatMs) / 1000 * 0.85), 0.32, 'triangle'), startAt);
        }
        cursorMs += val * beatMs;
      });
    }

    function playMeterMatchBarAudio() {
      if (!meterMatchState.current) return;
      playRhythmNoteSequence(meterMatchState.current.notes, 480);
    }

    function mountEmbeddedSimpleTimeSigLab(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      stopSimpleMeterPulse();
      const shuffled = [...meterMatchPatterns].sort(() => Math.random() - 0.5).slice(0, 10);
      meterMatchState = {
        round: 1,
        totalRounds: 10,
        score: 0,
        streak: 0,
        best: meterMatchState.best || 0,
        queue: shuffled,
        current: shuffled[0],
        answered: false,
        selectedMeter: null,
        lastCorrect: false,
        completed: false
      };
      renderSimpleTimeSigLabUI(target);
    }

    function guessMeterMatch(meterChoice) {
      const st = meterMatchState;
      if (st.answered || st.completed || !st.current) return;
      st.answered = true;
      st.selectedMeter = meterChoice;
      st.lastCorrect = (st.current.meter === meterChoice);

      if (st.lastCorrect) {
        st.score++;
        st.streak++;
        if (st.streak > st.best) st.best = st.streak;
        addTokens(1);
        playTonePitch(659.25, 0.18, 0.34, 'triangle');
      } else {
        st.streak = 0;
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderSimpleTimeSigLabUI(document.getElementById('embedded-tool-container'));
    }

    function nextMeterMatchRound() {
      const st = meterMatchState;
      if (st.round < st.totalRounds) {
        st.round++;
        st.current = st.queue[st.round - 1];
        st.answered = false;
        st.selectedMeter = null;
        st.lastCorrect = false;
        renderSimpleTimeSigLabUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderSimpleTimeSigLabUI(document.getElementById('embedded-tool-container'));
        showAppModal(
          'Meter Match Complete!',
          `You matched ${st.score} / ${st.totalRounds} time signatures and earned +${st.score} Tokens!`,
          st.score >= 5
        );
      }
    }

    function renderSimpleTimeSigLabUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = meterMatchState;
      const cur = st.current;

      target.innerHTML = `
        <div class="space-y-6">

            <h3 class="text-lg font-black text-slate-900">Listen to the Pulse</h3>
            <div class="flex flex-wrap items-center justify-center gap-2.5">
              <button type="button" id="pulse-btn-2" onclick="startSimpleMeterPulse(2)" class="px-5 py-2.5 rounded-xl font-black text-xs bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-all">2/4 Pulse</button>
              <button type="button" id="pulse-btn-3" onclick="startSimpleMeterPulse(3)" class="px-5 py-2.5 rounded-xl font-black text-xs bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-all">3/4 Pulse</button>
              <button type="button" id="pulse-btn-4" onclick="startSimpleMeterPulse(4)" class="px-5 py-2.5 rounded-xl font-black text-xs bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-all">4/4 Pulse</button>
              <button type="button" onclick="stopSimpleMeterPulse()" class="px-5 py-2.5 rounded-xl font-black text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 transition-all">Stop</button>
            </div>
            <div id="simple-pulse-dots" class="flex items-center justify-center gap-3 min-h-[36px]"></div>
            <p id="simple-pulse-status" class="text-xs font-semibold text-slate-500">Click a meter above to hear the rhythmic accent pulse.</p>
          </div>

          <!-- PART 2: METER MATCH GAME -->
          <div class="space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">

              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-xl bg-indigo-50 border border-indigo-200 text-xs font-black text-indigo-700">Round ${st.round} / ${st.totalRounds}</span>
                <span class="px-3 py-1 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-black text-emerald-700">Score: ${st.score} (+${st.score} Tokens)</span>

            </div>

            <div class="bg-slate-50 rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              <div class="flex items-center justify-between gap-2">
                <span class="text-sm font-black text-slate-700">Streak: <span class="text-amber-600">${st.streak}</span></span>
                <span class="px-4 py-1.5 rounded-full bg-amber-100 border border-amber-300 text-[11px] font-black uppercase tracking-wider text-amber-900">Identify Time Signature</span>
                <span class="text-sm font-black text-slate-700">Best: <span class="text-emerald-600">${st.best}</span></span>
              </div>

              ${st.completed ? `
                <div class="bg-white rounded-3xl p-8 border border-emerald-200 text-center space-y-3 shadow-sm">
                  <div class="w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center text-2xl mx-auto shadow">
                    <i class="fa-solid fa-trophy"></i>
                  </div>
                  <h4 class="text-2xl font-black text-slate-900">Meter Match Complete!</h4>
                  <p class="text-xs text-slate-600">You scored <strong>${st.score} / ${st.totalRounds}</strong> and earned <strong>+${st.score} Tokens</strong>!</p>
                  <button type="button" onclick="mountEmbeddedSimpleTimeSigLab(document.getElementById('embedded-tool-container'))" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-xs shadow">
                    Play Another 10 Rounds
                  </button>
                </div>
              ` : `
                <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm text-center space-y-5">
                  <h4 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">Which time signature matches this rhythm?</h4>

                  <!-- Dark Engraved Rhythm Bar -->
                  <div class="bg-slate-950 rounded-2xl px-6 py-7 relative flex items-center justify-center gap-6 sm:gap-10 max-w-xl mx-auto shadow-inner border border-slate-800">
                    <div class="absolute left-6 right-6 top-1/2 h-0.5 bg-slate-600/80 pointer-events-none"></div>
                    ${cur.notes.map(n => `
                      <div class="relative z-10 text-white">${renderEngravedNoteDarkSVG(n, 'w-12 h-16 sm:w-14 sm:h-20')}</div>
                    `).join('')}
                  </div>

                  <div class="flex flex-wrap items-center justify-center gap-3">
                    <span class="text-xs font-semibold text-slate-400">${st.answered ? cur.caption : 'Count the total crotchet beats in the bar!'}</span>
                    <button type="button" onclick="playMeterMatchBarAudio()" class="px-3.5 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-black text-[11px] transition-colors">
                      <i class="fa-solid fa-volume-high mr-1"></i> Hear Bar
                    </button>
                  </div>
                </div>

                <!-- 2/4, 3/4, 4/4 Answer Buttons -->
                <div class="flex items-center justify-center gap-4">
                  ${['2/4', '3/4', '4/4'].map(m => {
                    let cls = 'bg-white hover:bg-indigo-50 border-slate-200 hover:border-indigo-400 text-slate-900 shadow-sm';
                    if (st.answered) {
                      if (m === cur.meter) cls = 'bg-emerald-500 border-emerald-600 text-white shadow-md scale-105';
                      else if (m === st.selectedMeter) cls = 'bg-rose-500 border-rose-600 text-white';
                      else cls = 'bg-slate-100 border-slate-200 text-slate-400 opacity-50';
                    }
                    return `
                      <button type="button" onclick="guessMeterMatch('${m}')" ${st.answered ? 'disabled' : ''} class="w-24 py-4 rounded-2xl border-2 font-black text-xl transition-all ${cls}">
                        ${m}
                      </button>
                    `;
                  }).join('')}
                </div>

                ${st.answered ? `
                  <div class="p-4 rounded-2xl border ${st.lastCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'} flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span class="text-xs font-bold">
                      ${st.lastCorrect
                        ? `✓ Spot on (+1 Token)! That bar has ${cur.beats} crotchet beats (${cur.meter}).`
                        : `✗ Not quite — that bar totals ${cur.beats} crotchet beats, so it is <strong>${cur.meter}</strong>.`}
                    </span>
                    <button type="button" onclick="nextMeterMatchRound()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shrink-0 shadow">
                      ${st.round < st.totalRounds ? 'Next Rhythm →' : 'Finish'}
                    </button>
                  </div>
                ` : ''}
              `}
            </div>
          </div>
        </div>
      `;
      updateSimplePulseVisuals();
    }

    // ==========================================
    // DURATION LEVEL 3, LESSON 2: BARS & BARLINES (ADD THE BARLINES! 3-BAR RHYTHM BUILDER)
    // ==========================================
    const barlinePuzzles = [
      { meter: '2/4', beatsPerBar: 2, notes: ['crotchet', 'crotchet', 'minim', 'quavers', 'crotchet'] },
      { meter: '2/4', beatsPerBar: 2, notes: ['minim', 'crotchet', 'rest', 'crotchet', 'crotchet'] },
      { meter: '2/4', beatsPerBar: 2, notes: ['quavers', 'crotchet', 'crotchet', 'quavers', 'minim'] },
      { meter: '3/4', beatsPerBar: 3, notes: ['crotchet', 'crotchet', 'crotchet', 'minim', 'crotchet', 'dottedMinim'] },
      { meter: '3/4', beatsPerBar: 3, notes: ['minim', 'crotchet', 'crotchet', 'quavers', 'crotchet', 'crotchet', 'minim'] },
      { meter: '3/4', beatsPerBar: 3, notes: ['dottedMinim', 'crotchet', 'rest', 'crotchet', 'minim', 'crotchet'] },
      { meter: '4/4', beatsPerBar: 4, notes: ['crotchet', 'crotchet', 'minim', 'minim', 'minim', 'semibreve'] },
      { meter: '4/4', beatsPerBar: 4, notes: ['minim', 'crotchet', 'crotchet', 'dottedMinim', 'crotchet', 'crotchet', 'quavers', 'minim'] },
      { meter: '4/4', beatsPerBar: 4, notes: ['semibreve', 'crotchet', 'crotchet', 'crotchet', 'crotchet', 'minim', 'crotchet', 'rest'] },
      { meter: '3/4', beatsPerBar: 3, notes: ['crotchet', 'minim', 'quavers', 'crotchet', 'crotchet', 'dottedMinim'] }
    ];

    let barlineBuilderState = {
      round: 1,
      totalRounds: 10,
      score: 0,
      queue: [],
      current: null,
      placedSlots: [], // indices i meaning a barline placed AFTER notes[i]
      correctSlots: [],
      answered: false,
      lastCorrect: false,
      completed: false
    };

    function computeCorrectBarlineSlots(puzzle) {
      const slots = [];
      let running = 0;
      for (let i = 0; i < puzzle.notes.length - 1; i++) {
        running += getNoteBeatValue(puzzle.notes[i]);
        if (running === puzzle.beatsPerBar) {
          slots.push(i);
          running = 0;
        }
      }
      return slots;
    }

    function setupBarlineRound() {
      const st = barlineBuilderState;
      st.current = st.queue[st.round - 1] || barlinePuzzles[0];
      st.placedSlots = [];
      st.correctSlots = computeCorrectBarlineSlots(st.current);
      st.answered = false;
      st.lastCorrect = false;
    }

    function mountEmbeddedBarlineBuilderGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const shuffled = [...barlinePuzzles].sort(() => Math.random() - 0.5);
      barlineBuilderState = {
        round: 1,
        totalRounds: 10,
        score: 0,
        queue: shuffled,
        current: null,
        placedSlots: [],
        correctSlots: [],
        answered: false,
        lastCorrect: false,
        completed: false
      };
      setupBarlineRound();
      renderBarlineBuilderUI(target);
    }

    function toggleBarlineSlot(slotIdx) {
      const st = barlineBuilderState;
      if (st.answered || st.completed) return;
      const pos = st.placedSlots.indexOf(slotIdx);
      if (pos >= 0) {
        st.placedSlots.splice(pos, 1);
        playTonePitch(330, 0.06, 0.18, 'sine');
      } else {
        st.placedSlots.push(slotIdx);
        st.placedSlots.sort((a, b) => a - b);
        playTonePitch(587.33, 0.08, 0.22, 'triangle');
      }
      renderBarlineBuilderUI(document.getElementById('embedded-tool-container'));
    }

    function playBarlinePuzzleAudio() {
      if (!barlineBuilderState.current) return;
      playRhythmNoteSequence(barlineBuilderState.current.notes, 380);
    }

    function checkBarlinePlacement() {
      const st = barlineBuilderState;
      if (st.answered || st.completed) return;
      const placed = [...st.placedSlots].sort((a, b) => a - b);
      const expected = [...st.correctSlots].sort((a, b) => a - b);
      const isRight = placed.length === expected.length && placed.every((v, i) => v === expected[i]);

      st.answered = true;
      st.lastCorrect = isRight;

      if (isRight) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.18, 0.34, 'triangle');
        setTimeout(() => playTonePitch(880, 0.22, 0.34, 'triangle'), 130);
      } else {
        playTonePitch(155.56, 0.28, 0.3, 'sawtooth');
      }
      renderBarlineBuilderUI(document.getElementById('embedded-tool-container'));
    }

    function nextBarlineRound() {
      const st = barlineBuilderState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupBarlineRound();
        renderBarlineBuilderUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderBarlineBuilderUI(document.getElementById('embedded-tool-container'));
        showAppModal(
          'Barline Builder Complete!',
          `You divided ${st.score} / ${st.totalRounds} 3-bar rhythms accurately and earned +${st.score} Tokens!`,
          st.score >= 5
        );
      }
    }

    function renderBarlineBuilderUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = barlineBuilderState;
      const cur = st.current;
      const [topNum, botNum] = cur.meter.split('/');

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-6 border border-slate-800 shadow-lg">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">10-Round Challenge • 1 Token Per Correct Answer</span>
              <h3 class="text-xl font-black mt-0.5">Add the Barlines! (3-Bar Rhythm Builder)</h3>
              <p class="text-xs text-slate-300 mt-1">Click the dashed gaps between notes to place <strong>2 single barlines</strong> so this <strong>${cur.meter}</strong> rhythm is divided into <strong>3 equal bars</strong> of <strong>${cur.beatsPerBar} beats</strong> each!</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="px-3 py-1.5 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">Round ${st.round} / ${st.totalRounds}</span>
              <span class="px-3 py-1.5 rounded-xl bg-emerald-950 border border-emerald-700 text-xs font-black text-emerald-300">Score: ${st.score} (+${st.score} Tokens)</span>
            </div>
          </div>

          ${st.completed ? `
            <div class="p-6 rounded-2xl bg-emerald-950/60 border-2 border-emerald-500 text-center space-y-3">
              <div class="w-14 h-14 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center text-2xl mx-auto shadow-lg">
                <i class="fa-solid fa-check-double"></i>
              </div>
              <h4 class="text-2xl font-black text-emerald-300">3-Bar Rhythm Builder Mastered!</h4>
              <p class="text-xs text-slate-200">You scored <strong>${st.score} / ${st.totalRounds}</strong> and earned <strong>+${st.score} Tokens</strong> (1 Token per correct rhythm)!</p>
              <button type="button" onclick="mountEmbeddedBarlineBuilderGame(document.getElementById('embedded-tool-container'))" class="px-6 py-2.5 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black rounded-xl text-xs shadow">
                Play Another 10 Rounds
              </button>
            </div>
          ` : `
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <span class="font-bold text-slate-300">Barlines placed: <strong class="text-amber-300">${st.placedSlots.length}</strong> (Goal: 2 single barlines for 3 bars)</span>
              <button type="button" onclick="playBarlinePuzzleAudio()" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs shadow">
                <i class="fa-solid fa-volume-high mr-1.5"></i> Hear 3-Bar Rhythm
              </button>
            </div>

            <!-- Interactive Rhythm Stave with Clickable Barline Gaps -->
            <div class="bg-slate-950 rounded-2xl p-4 sm:p-6 border border-slate-800 overflow-x-auto">
              <div class="flex items-center justify-center gap-1 sm:gap-2 min-w-max mx-auto relative py-2">
                <!-- Time Signature Badge -->
                <div class="flex flex-col items-center justify-center px-3 py-1 rounded-xl bg-amber-400/15 border border-amber-400/40 text-amber-300 font-black text-2xl leading-none mr-2 select-none">
                  <span>${topNum}</span>
                  <span class="border-t border-amber-400/40 pt-1 mt-1">${botNum}</span>
                </div>

                ${cur.notes.map((n, idx) => {
                  const hasBarline = st.placedSlots.includes(idx);
                  const shouldHaveBarline = st.correctSlots.includes(idx);
                  let slotBtn = '';

                  if (idx < cur.notes.length - 1) {
                    let slotCls = hasBarline
                      ? 'bg-amber-400/20 border-amber-400 text-amber-300'
                      : 'bg-slate-900/60 border-dashed border-slate-700 hover:border-amber-400 text-slate-600 hover:text-amber-300';
                    if (st.answered) {
                      if (hasBarline && shouldHaveBarline) slotCls = 'bg-emerald-500/25 border-emerald-400 text-emerald-300';
                      else if (!hasBarline && shouldHaveBarline) slotCls = 'bg-amber-500/25 border-amber-400 text-amber-300 animate-pulse';
                      else if (hasBarline && !shouldHaveBarline) slotCls = 'bg-rose-500/25 border-rose-500 text-rose-400';
                      else slotCls = 'border-transparent opacity-25';
                    }
                    slotBtn = `
                      <button type="button" onclick="toggleBarlineSlot(${idx})" ${st.answered ? 'disabled' : ''} title="Click to add or remove barline" class="w-8 sm:w-10 h-20 rounded-xl border-2 flex items-center justify-center transition-all shrink-0 ${slotCls}">
                        ${(hasBarline || (st.answered && shouldHaveBarline))
                          ? '<span class="w-1 h-14 rounded-full bg-current block"></span>'
                          : '<i class="fa-solid fa-plus text-[10px]"></i>'}
                      </button>
                    `;
                  }

                  return `
                    <div class="flex flex-col items-center justify-center px-1.5 select-none">
                      <div class="text-white">${renderEngravedNoteDarkSVG(n, 'w-10 h-14 sm:w-12 sm:h-16')}</div>
                      <span class="text-[10px] font-bold text-slate-400 mt-1">${getNoteBeatValue(n)}b</span>
                    </div>
                    ${slotBtn}
                  `;
                }).join('')}

                <!-- Final Double Barline -->
                <div class="flex items-center gap-1 ml-2 pl-1 select-none" title="Final Double Barline">
                  <span class="w-0.5 h-16 bg-emerald-400 block"></span>
                  <span class="w-2 h-16 bg-emerald-400 block rounded-r"></span>
                </div>
              </div>
            </div>

            ${!st.answered ? `
              <div class="flex flex-wrap items-center justify-center gap-3">
                <button type="button" onclick="checkBarlinePlacement()" class="px-7 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl text-xs sm:text-sm shadow-lg">
                  <i class="fa-solid fa-check mr-1.5"></i> Check My Barlines (+1 Token)
                </button>
                <button type="button" onclick="barlineBuilderState.placedSlots=[]; renderBarlineBuilderUI(document.getElementById('embedded-tool-container'));" class="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs">
                  Clear Barlines
                </button>
              </div>
            ` : `
              <div class="p-4 rounded-2xl border ${st.lastCorrect ? 'bg-emerald-950/70 border-emerald-500 text-emerald-200' : 'bg-rose-950/70 border-rose-500 text-rose-200'} flex flex-col sm:flex-row items-center justify-between gap-3">
                <span class="text-xs font-bold">
                  ${st.lastCorrect
                    ? `✓ Spot on (+1 Token)! Each of the 3 bars adds up to exactly ${cur.beatsPerBar} beats in ${cur.meter} time.`
                    : `✗ Not quite — check the highlighted amber barlines above so each bar equals ${cur.beatsPerBar} beats in ${cur.meter} time.`}
                </span>
                <button type="button" onclick="nextBarlineRound()" class="px-5 py-2.5 bg-white text-slate-950 hover:bg-slate-100 font-black rounded-xl text-xs shrink-0 shadow">
                  ${st.round < st.totalRounds ? 'Next Rhythm →' : 'Finish'}
                </button>
              </div>
            `}
          `}
        </div>
      `;
    }

    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.key) {
            window.app.currentUser = parsed;
            const db = getAllUserRecords();
            if (db[parsed.key]) {
              window.state = {
                stats: db[parsed.key].stats || { tokens: 10, testsTaken: 0 },
                inventory: db[parsed.key].inventory || [],
                testHistory: db[parsed.key].testHistory || [],
                completedLessons: db[parsed.key].completedLessons || []
              };
            }
          }
        }
      } catch (e) {}

      if (!window.state) {
        window.state = {
          stats: { tokens: 0, testsTaken: 0 },
          inventory: [],
          testHistory: [],
          completedLessons: []
        };
      }

      updateNavBar();
      updateGlobalLeaderboard();
      window.app.navigate('home');
    };
  </script>
</body>
</html>
