  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Anonymous auth for students and teachers across devices
        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        // Real-time listener for updates across all classroom laptops & tablets
        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            remoteUsers[d.id] = d.data();
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          // If current logged-in user tokens were updated remotely, reflect live
          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe.stats && remoteMe.stats.tokens !== undefined) {
              window.state.stats.tokens = remoteMe.stats.tokens;
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
          if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

    // ==========================================
    // AUDIO ENGINE (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDrumSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      if (type === 'kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.45);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'snare') {
        const bufferSize = ctx.sampleRate * 0.18;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1100;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);

        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        oscGain.gain.setValueAtTime(0.6, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    }

    function playTonePitch(freq, duration = 0.4) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Read deduplicated users from live cloud memory or fallback storage
    function getAllUserRecords() {
      if (window.cachedCloudUsers && Object.keys(window.cachedCloudUsers).length > 0) {
        return window.cachedCloudUsers;
      }
      try {
        const stored = localStorage.getItem('boncepts_users_db');
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function getDeduplicatedStudents() {
      const records = getAllUserRecords();
      if (!records || typeof records !== 'object') return [];
      const unique = {};
      Object.keys(records).forEach(key => {
        const r = records[key];
        if (r && typeof r === 'object' && r.role === 'student' && r.firstName && r.surname) {
          const normName = `${String(r.firstName).trim().toLowerCase()} ${String(r.surname).trim().toLowerCase()}`;
          if (!unique[normName]) {
            unique[normName] = { 
              key, 
              ...r,
              stats: r.stats || { tokens: 0, testsTaken: 0 }
            };
          }
        }
      });
      return Object.values(unique).filter(Boolean);
    }

    function saveUserState() {
      if (!app.currentUser) return;
      const key = app.currentUser.key;
      const record = {
        firstName: app.currentUser.firstName,
        surname: app.currentUser.surname,
        class: app.currentUser.class,
        teacher: app.currentUser.teacher,
        role: app.currentUser.role,
        stats: state.stats,
        inventory: state.inventory,
        testHistory: state.testHistory,
        lastActive: new Date().toISOString()
      };

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, record);
      }

      try {
        const users = getAllUserRecords();
        users[key] = record;
        localStorage.setItem('boncepts_users_db', JSON.stringify(users));
        localStorage.setItem('boncepts_active_session', JSON.stringify(app.currentUser));

      updateNavUI();

    function addTokens(count) {
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.tokens = (state.stats.tokens || 0) + count;
      saveUserState();
    }

    function updateNavUI() {
      const loginBtn = document.getElementById('nav-login-btn');
      const profile = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const userNameEl = document.getElementById('nav-user-name');
      const userRoleEl = document.getElementById('nav-user-role');
      const tokenCountEl = document.getElementById('nav-user-tokens');

      if (app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (userNameEl) userNameEl.textContent = `${app.currentUser.firstName} ${app.currentUser.surname}`;
        if (userRoleEl) userRoleEl.textContent = app.currentUser.role === 'teacher' ? 'Music Teacher' : `Class ${app.currentUser.class}`;

        if (app.currentUser.role === 'student') {
          if (tokenBadge) {
            tokenBadge.classList.remove('hidden');
            tokenBadge.classList.add('inline-flex');
          }
          if (tokenCountEl) tokenCountEl.textContent = state.stats.tokens || 0;
        } else {
          if (tokenBadge) tokenBadge.classList.add('hidden');
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
        if (tokenBadge) tokenBadge.classList.add('hidden');
      }
    }

    function logoutUser() {
      app.currentUser = null;
      state = { stats: { tokens: 10, testsTaken: 0 }, inventory: [], testHistory: [] };
      localStorage.removeItem('boncepts_active_session');
      app.navigate('home');
      showAppModal('Logged Out', 'You have been signed out of your session.');

    window.updateGlobalLeaderboard = function() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;

      const students = getDeduplicatedStudents();
      if (!students || students.length === 0) {
        ticker.innerHTML = `<span>Welcome to The Boncepts of Music! Students join now to compete on the classroom leaderboard.</span>`;
        return;
      }

      students.sort((a, b) => {
        const aTok = (a && a.stats && typeof a.stats.tokens === 'number') ? a.stats.tokens : 0;
        const bTok = (b && b.stats && typeof b.stats.tokens === 'number') ? b.stats.tokens : 0;
        return bTok - aTok;
      });

      const itemsHtml = students.map((s, idx) => {
        if (!s) return '';
        const tokens = (s.stats && typeof s.stats.tokens === 'number') ? s.stats.tokens : 0;
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🪙';
        return `<span class="inline-flex items-center gap-1.5 mx-4">
          <span>${medal}</span>
          <span class="font-bold text-white">${s.firstName || 'Student'} ${s.surname || ''}</span>
          <span class="text-indigo-300">(${s.class || 'Class'})</span>:
          <span class="font-extrabold text-amber-300">${tokens} Tokens</span>
        </span>`;
      }).filter(Boolean).join(' • ');

      ticker.innerHTML = itemsHtml || `<span>Welcome to The Boncepts of Music!</span>`;
    };

    window.refreshLeaderboardTableInPlace = function() {
      const tbody = document.getElementById('overall-leaderboard-tbody');

      if (!students || students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">No students enrolled yet.</td></tr>`;
        return;

      students.sort((a, b) => {

        const bTok = (b && b.stats && typeof b.stats.tokens === 'number') ? b.stats.tokens : 0;
        return bTok - aTok;
      });

      tbody.innerHTML = students.map((s, idx) => {
        if (!s) return '';
        const tokens = (s.stats && typeof s.stats.tokens === 'number') ? s.stats.tokens : 0;
        const medal = idx === 0 ? '🥇 1st' : idx === 1 ? '🥈 2nd' : idx === 2 ? '🥉 3rd' : `#${idx + 1}`;

    function playToneWithGain(volume) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playCrescendoDemo() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, now);
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.linearRampToValueAtTime(0.7, now + 1.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 2.2);
    }

    function handleLevelQuizSubmit(e, conceptId, levelNum) {
      e.preventDefault();
      const concept = conceptsCurriculum.find(c => c.id === conceptId);
      const level = concept.levels.find(l => l.level === levelNum);
      const quiz = level.quiz;

      let score = 0;
      for (let i = 0; i < quiz.length; i++) {
        const selected = document.querySelector(`input[name="quiz_q_${i}"]:checked`);
        if (selected && parseInt(selected.value, 10) === quiz[i].correct) {
          score++;
        }
      }

      const total = quiz.length;
      const passed = score === total;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.push({
        title: `${concept.title} - ${level.title}`,
        score,
        total,
        date: new Date().toISOString()
      });

      if (!state.stats) state.stats = { tokens: 10, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;

      if (passed) {
        addTokens(10);
        showAppModal('🎉 Outstanding Result!', `Perfect score: ${score}/${total}! You mastered this level and earned +10 Tokens!`, true);
      } else {
        addTokens(3);
        showAppModal('Keep Practicing!', `You scored ${score}/${total}. Review the concepts and try again! Earned +3 effort tokens.`, false);
      }

      saveUserState();
    }

      if (!s) return;
      document.getElementById('edit-student-key').value = key;
      document.getElementById('edit-student-firstname').value = s.firstName || '';
      document.getElementById('edit-student-surname').value = s.surname || '';
      document.getElementById('edit-student-class').value = s.class || '7A';
      document.getElementById('edit-student-teacher').value = s.teacher || '';
      document.getElementById('edit-student-tokens').value = (s.stats && s.stats.tokens) || 0;
      document.getElementById('edit-student-modal').classList.remove('hidden');
    };

    window.closeEditStudentModal = function() {
      document.getElementById('edit-student-modal').classList.add('hidden');
    };

    window.saveEditedStudent = function() {
      const key = document.getElementById('edit-student-key').value;
      const records = getAllUserRecords();
      const s = records[key];
      if (!s) return;

      s.firstName = document.getElementById('edit-student-firstname').value.trim();
      s.surname = document.getElementById('edit-student-surname').value.trim();
      s.class = document.getElementById('edit-student-class').value;
      s.teacher = document.getElementById('edit-student-teacher').value.trim();
      if (!s.stats) s.stats = {};
      s.stats.tokens = parseInt(document.getElementById('edit-student-tokens').value, 10) || 0;

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, s);
      }
      try {
        records[key] = s;
        localStorage.setItem('boncepts_users_db', JSON.stringify(records));
      } catch (e) {}

      closeEditStudentModal();
      app.navigate(app.currentView);
      showAppModal('Student Profile Updated', `${s.firstName} ${s.surname} was successfully updated.`);
    };

    window.openDeleteStudentModal = function(key, name) {
      document.getElementById('delete-student-key').value = key;
      document.getElementById('delete-student-name').textContent = name;
      document.getElementById('delete-student-modal').classList.remove('hidden');
    };

    window.closeDeleteStudentModal = function() {
      document.getElementById('delete-student-modal').classList.add('hidden');
    };

    window.confirmDeleteStudent = function() {
      const key = document.getElementById('delete-student-key').value;
      if (window.deleteUserRecordFromCloud) {
        window.deleteUserRecordFromCloud(key);
      }
      try {
        const records = getAllUserRecords();
        delete records[key];
        localStorage.setItem('boncepts_users_db', JSON.stringify(records));
      } catch (e) {}

      closeDeleteStudentModal();
      app.navigate(app.currentView);
      showAppModal('Record Deleted', 'Student was removed from classroom rosters and leaderboards.');
    };

    // ==========================================
    // 8-BEAT DRUM SOUND MODULE VIEW
    // ==========================================
    let drumPattern = [
      { beat: 1, type: 'crotchet' },
      { beat: 2, type: 'crotchet' },
      { beat: 3, type: 'quavers'  },
      { beat: 4, type: 'crotchet' },
      { beat: 5, type: 'quavers'  },
      { beat: 6, type: 'quavers'  },
      { beat: 7, type: 'crotchet' },
      { beat: 8, type: 'quavers'  }
    ];

    function renderRhythmModule(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-black text-slate-800">8-Beat Drum Sound Module</h1>
              <p class="text-xs sm:text-sm text-slate-500">
                Tap any beat to toggle between a <strong>Crotchet (♩)</strong> and <strong>Quavers (♫)</strong>. Odd beats play <span class="text-blue-600 font-bold">KICK (Blue)</span> and even beats play <span class="text-rose-600 font-bold">SNARE (Red)</span>.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="playCurrentPattern()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center gap-2">
                <i class="fa-solid fa-play"></i> Play Pattern
              </button>
              <button onclick="randomizePattern()" title="Randomize Pattern" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all">
                <i class="fa-solid fa-shuffle"></i>
              </button>
            </div>
          </div>

          <!-- 8-Beat Module Visualizer -->
          <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl shadow-xl overflow-x-auto">
            <div class="grid grid-cols-8 gap-2 sm:gap-3 min-w-[620px]">
              ${drumPattern.map((p, idx) => {
                const isKick = idx % 2 === 0;
                const isCrotchet = p.type === 'crotchet';
                const colorClass = isKick
                  ? 'border-blue-500/60 bg-blue-950/40 text-blue-400 hover:bg-blue-900/50'
                  : 'border-rose-500/60 bg-rose-950/40 text-rose-400 hover:bg-rose-900/50';
                return `
                  <button onclick="togglePatternBeat(${idx})" class="flex flex-col items-center justify-between p-3 rounded-2xl border-2 transition-all cursor-pointer h-36 ${colorClass}">
                    <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">
                      B${idx + 1}: ${isKick ? 'KICK' : 'SNARE'}
                    </span>
                    <span class="text-3xl font-black py-1">
                      ${isCrotchet ? '♩' : '♫'}
                    </span>
                    <div class="text-center">
                      <span class="text-[11px] font-bold block text-white">${isCrotchet ? 'Crotchet' : 'Quavers'}</span>
                      <span class="text-[9px] text-slate-400">${isCrotchet ? '1 hit' : '2 hits'}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function togglePatternBeat(idx) {
      drumPattern[idx].type = drumPattern[idx].type === 'crotchet' ? 'quavers' : 'crotchet';
      const isKick = idx % 2 === 0;
      playDrumSound(isKick ? 'kick' : 'snare');
      const container = document.getElementById('embedded-tool-container');
      if (container) mountEmbeddedDrumModule(container);
    }

    function randomizePattern() {
      drumPattern.forEach(p => {
        p.type = Math.random() > 0.5 ? 'crotchet' : 'quavers';
      });
      const container = document.getElementById('embedded-tool-container');
      if (container) mountEmbeddedDrumModule(container);
    }

    // ==========================================
    // RHYTHM DICTATION CHALLENGE
    // ==========================================
    let currentMysteryPattern = [];
    let mysteryOptions = [];
    let streakCount = 0;
    let bestStreak = 0;

    function renderDictationChallenge(container) {
      generateMysteryPattern();

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-headphones text-amber-500"></i> Rhythm Dictation Challenge
              </h1>
              <p class="text-xs sm:text-sm text-slate-500">
                Listen to the mystery 8-beat rhythm and select the matching notation!
              </p>
            </div>
            <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-sm">
              <span class="text-xs font-bold text-slate-500">Streak: <span id="dictation-streak" class="text-amber-600 font-black text-base">${streakCount}</span></span>
              <span class="text-xs font-bold text-slate-500">Best: <span id="dictation-best" class="text-emerald-600 font-black text-base">${bestStreak}</span></span>
            </div>
          </div>

          <!-- Player Card -->
          <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 text-center">
            <button id="hear-mystery-btn" onclick="playMysteryAudio()" class="px-8 py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl shadow-lg transition-all text-lg flex items-center gap-3 mx-auto">
              <i class="fa-solid fa-volume-high"></i> Hear Mystery Rhythm
            </button>
            <p id="dictation-status-msg" class="text-xs text-slate-400 font-semibold mt-4">
              Tap button above to hear the 8 beats.
            </p>
          </div>

          <!-- Answer Options A, B, C, D -->
          <div class="space-y-3" id="dictation-options-container">
            ${mysteryOptions.map((opt, optIdx) => {
              const letter = String.fromCharCode(65 + optIdx);
              return `
                <button onclick="handleOptionSelect(${optIdx})" class="w-full bg-white hover:bg-indigo-50/50 p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-400 transition-all flex items-center gap-4 text-left group">
                  <div class="w-10 h-10 rounded-xl bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center font-black text-slate-700 transition-colors shrink-0">
                    ${letter}
                  </div>
                  <div class="flex-1 grid grid-cols-8 gap-1.5 sm:gap-2">
                    ${opt.map((beatType, bIdx) => {
                      const isKick = bIdx % 2 === 0;
                      const isCrotchet = beatType === 1;
                      const cardStyle = isKick
                        ? 'bg-blue-50 border-blue-200 text-blue-700'
                        : 'bg-rose-50 border-rose-200 text-rose-700';
                      return `
                        <div class="flex flex-col items-center justify-center py-2 px-1 rounded-xl border ${cardStyle}">
                          <span class="text-xl sm:text-2xl font-black leading-none mb-1">
                            ${isCrotchet ? '♩' : '♫'}
                          </span>
                          <span class="text-[10px] font-bold text-slate-500">${bIdx + 1}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function generateMysteryPattern() {
      currentMysteryPattern = [];
      for (let i = 0; i < 8; i++) {
        currentMysteryPattern.push(Math.random() > 0.5 ? 1 : 2);
      }

      mysteryOptions = [currentMysteryPattern];
      while (mysteryOptions.length < 4) {
        const distractor = [];
        for (let i = 0; i < 8; i++) {
          distractor.push(Math.random() > 0.5 ? 1 : 2);
        }
        const matchesExisting = mysteryOptions.some(opt => 
          opt.every((val, idx) => val === distractor[idx])
        );
        if (!matchesExisting) {
          mysteryOptions.push(distractor);
        }
      }
      mysteryOptions.sort(() => Math.random() - 0.5);
    }

    async function playMysteryAudio() {
      const btn = document.getElementById('hear-mystery-btn');
      const msg = document.getElementById('dictation-status-msg');
      if (btn) btn.disabled = true;
      if (msg) msg.textContent = "Playing mystery pattern...";

      for (let i = 0; i < currentMysteryPattern.length; i++) {
        const beatType = currentMysteryPattern[i];
        const isKick = i % 2 === 0;
        const soundType = isKick ? 'kick' : 'snare';

        if (beatType === 1) {
          playDrumSound(soundType);
        } else {
          playDrumSound(soundType);
          setTimeout(() => playDrumSound(soundType), 240);
        }
        await new Promise(r => setTimeout(r, 480));
      }

      if (btn) btn.disabled = false;
      if (msg) msg.textContent = "Finished! Select pattern A, B, C, or D.";
    }

    function handleOptionSelect(chosenIdx) {
      const selected = mysteryOptions[chosenIdx];
      const isCorrect = selected.every((val, idx) => val === currentMysteryPattern[idx]);

      if (isCorrect) {
        streakCount++;
        if (streakCount > bestStreak) bestStreak = streakCount;
        addTokens(5);
        showAppModal('🎉 Correct Rhythm!', 'Fantastic ear! You identified the mystery pattern and earned +5 Tokens.', true);
      } else {
        streakCount = 0;
        showAppModal('❌ Not Quite', 'That was not the matching pattern. Listen carefully to the bass and snare beats and try again!', false);
      }

      const container = document.getElementById('embedded-tool-container');
      if (container) mountEmbeddedDictation(container);
    }

    // ==========================================
    // REWARDS SHOP
    // ==========================================
    let currentShopCategory = 'All';

    function renderShopView(container) {
      const categories = ['All', 'Hardware', 'Instruments', 'Avatars', 'Equipment', 'Trophies'];
      const filtered = currentShopCategory === 'All' 
        ? shopCatalog 
        : shopCatalog.filter(i => i.category === currentShopCategory);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold text-amber-600 uppercase tracking-widest">Classroom Economy</span>
              <h1 class="text-3xl font-black text-slate-800">Classroom Rewards Shop</h1>
              <p class="text-xs sm:text-sm text-slate-500">Spend tokens earned from quizzes and rhythm dictations on badges and gear.</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 px-5 py-2.5 rounded-2xl flex items-center gap-3">
              <i class="fa-solid fa-coins text-amber-500 text-xl animate-pulse"></i>
              <div>
                <span class="text-[10px] font-bold text-amber-800 uppercase block">Available Balance</span>
                <span class="text-xl font-black text-amber-600">${state.stats.tokens || 0} Tokens</span>
              </div>
            </div>
          </div>

          <!-- Category Filter Pills -->
          <div class="flex flex-wrap gap-2">
            ${categories.map(cat => `
              <button onclick="filterShopCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${currentShopCategory === cat ? 'bg-indigo-600 text-white shadow' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                ${cat}
              </button>
            `).join('')}
          </div>

          <!-- Shop Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.map(item => {
              const owned = (state.inventory || []).includes(item.id);
              return `
                <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between mb-4">
                      <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl shadow-inner">
                        <i class="fa-solid ${item.icon}"></i>
                      </div>
                      <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 uppercase tracking-wider">
                        ${item.category}
                      </span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
                    <p class="text-xs text-slate-500 leading-relaxed mt-1 mb-4">${item.desc}</p>
                  </div>
                  <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <span class="font-black text-amber-600 text-base flex items-center gap-1.5">
                      <i class="fa-solid fa-coins text-amber-500"></i> ${item.cost}
                    </span>
                    ${owned ? `
                      <span class="px-3 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 font-bold text-xs rounded-xl flex items-center gap-1">
                        <i class="fa-solid fa-check"></i> Owned
                      </span>
                    ` : `
                      <button onclick="buyShopItem('${item.id}', ${item.cost})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-sm">
                        Unlock Item
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function filterShopCategory(cat) {
      currentShopCategory = cat;
      renderShopView(document.getElementById('app-viewport'));
    }

    function buyShopItem(itemId, cost) {
      if ((state.stats.tokens || 0) < cost) {
        showAppModal('Insufficient Tokens', 'You need more tokens to unlock this item. Complete challenges or level quizzes to earn more!', false);
        return;
      }
      state.stats.tokens -= cost;
      if (!state.inventory) state.inventory = [];
      state.inventory.push(itemId);
      saveUserState();
      renderShopView(document.getElementById('app-viewport'));
      showAppModal('Reward Unlocked! 🎁', 'Item has been added to your inventory.', true);
    }

    // ==========================================
    // CONFIDENTIAL STUDENT TESTS VIEW
    // ==========================================
    function renderStudentTestsView(container) {
      if (!app.currentUser || app.currentUser.role !== 'student') {
        app.navigate('home');
        return;
      }

      const tests = state.testHistory || [];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-3xl font-black text-slate-800">My Assessment Results</h1>
              <p class="text-xs sm:text-sm text-slate-500">Confidential mark record visible only to you and your teacher</p>
            </div>
            <button onclick="app.navigate('studentDash')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">
              &larr; Back to Dashboard
            </button>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
            ${tests.length === 0 ? `
              <div class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-clipboard-check text-4xl mb-2 text-slate-300"></i>
                <p class="text-sm">No completed tests recorded yet. Start exploring the concepts to take your first quiz!</p>
              </div>
            ` : `
              <div class="divide-y divide-slate-100">
                ${tests.map(t => `
                  <div class="py-3 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-slate-800 text-sm">${t.title || 'Music Theory Quiz'}</div>
                      <div class="text-[10px] text-slate-400">${new Date(t.date).toLocaleDateString()}</div>
                    </div>
                    <div class="text-right">
                      <span class="font-black text-indigo-600 text-base">${t.score} / ${t.total}</span>
                      <span class="text-xs text-slate-400 block">${Math.round((t.score / t.total) * 100)}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // APPLICATION STARTUP BOOTSTRAP
    // ==========================================
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          app.currentUser = JSON.parse(savedSession);
          const users = getAllUserRecords();
          if (users[app.currentUser.key]) {
            const u = users[app.currentUser.key];
            state.stats = u.stats || { tokens: 10, testsTaken: 0 };
            state.inventory = u.inventory || [];
            state.testHistory = u.testHistory || [];
          }
        }
      } catch (e) {
        console.warn("Session restore:", e.message);
      }

      app.navigate(app.currentUser ? (app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash') : 'home');
      updateGlobalLeaderboard();
    };
  </script>
</body>
</html>
