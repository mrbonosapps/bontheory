<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonTheory - Music Theory Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Styles for SVGs */
        .staff-line { stroke: #334155; stroke-width: 2; }
        .staff-text { font-family: 'Inter', sans-serif; font-weight: 700; fill: #2563eb; }
        .note-head { fill: #0f172a; }
        
        /* Chord UI Styles */
        .chord-bg { background-google: #1e293b; }
        .chord-panel { background-color: #0f172a; }
        .custom-select { background-color: #1e293b; color: white; border: 1px solid #334155; }

        /* Print styles for Certificate export */
        @media print {
            body { background: white !important; overflow: visible !important; height: auto !important; }
            header, #cert-actions, #nav-user, .print-hide { display: none !important; }
            #app-root { overflow: visible !important; height: auto !important; }
            #cert-container { 
                box-shadow: none !important; 
                border: 6px double #1e293b !important; 
                margin: 0 auto !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="bg-white shadow-sm z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="if(app.currentUser) app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash')">
                <i class="fa-solid fa-music text-blue-600 text-2xl"></i>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BonTheory</h1>
            </div>
            <div id="nav-user" class="hidden flex items-center gap-6">
                <div class="text-sm font-medium text-gray-500">
                    Tests: <span id="nav-tests" class="text-gray-800 font-bold">0</span>
                </div>
                <div class="flex items-center gap-3 bg-blue-50 py-1.5 px-4 rounded-full border border-blue-100">
                    <span id="nav-username" class="font-bold text-blue-700">Student</span>
                    <button onclick="logout()" class="text-blue-500 hover:text-blue-700 transition" title="Logout">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-root" class="flex-1 overflow-y-auto w-full relative"></main>

    <script>

            },
            structure: {
                level1Practice: [
                    { q: "In a song, which section usually has changing lyrics to advance the story?", options: ["Chorus", "Verse", "Intro", "Outro"], a: 1 },

                    { q: "What is the most standard order for a basic Verse-Chorus song?", options: ["Chorus - Chorus - Verse", "Verse 1 - Chorus - Verse 2 - Chorus", "Bridge - Verse - Outro", "Verse 1 - Verse 2 - Verse 3"], a: 1 },
                    { q: "Why is the Chorus often performed louder or with more instruments?", options: ["To make it less noticeable", "To highlight the emotional peak and main theme", "Because the verse is always silent", "It is an accidental mistake"], a: 1 },
                    { q: "What musical structure consists of two distinct, contrasting sections (AB)?", options: ["Ternary Form", "Binary Form", "Rondo Form", "Monophonic"], a: 1 },

                ],
                level1Test: [
                    { q: "What is the primary function of a Verse in popular song structure?", options: ["To provide the main repeating tagline", "To tell the story and introduce new lyrical ideas", "To end the song abruptly", "To act as a drum solo"], a: 1 },
                    { q: "How do the lyrics of different verses in the same song typically compare?", options: ["They are always 100% identical", "They change between verses to progress the narrative", "They are never sung in English", "They must have no rhyme scheme"], a: 1 },

                    { q: "Why is 'Twinkle, Twinkle, Little Star' considered an example of Ternary Form?", options: ["It has only one single verse", "It features an opening theme, a contrasting middle, and an exact return of the opening theme", "It has no repeating melodies", "It is written in two contrasting movements"], a: 1 },

                ]
            },

                    { q: "What vibrates to produce sound in a Chordophone?", options: ["A column of air", "A stretched membrane or skin", "Stretched strings", "An electronic oscillator"], a: 2 },

                    { q: "Why is an acoustic piano considered a Chordophone?", options: ["It has wooden keys", "Its sound is produced by hammers striking stretched strings", "It uses an amplifier", "It blows air across pipes"], a: 1 },
                    { q: "The Australian Didgeridoo creates sound through vibrating air blown through a hollow cylinder. It is an:", options: ["Aerophone", "Idiophone", "Membranophone", "Electrophone"], a: 0 },
                    { q: "Which of the following is an example of an Electrophone?", options: ["Acoustic Violin", "Synthesizer", "Snare Drum", "Clarinet"], a: 1 },
                    { q: "Cymbals produce sound through the vibration of their own metal body. They are:", options: ["Idiophones", "Membranophones", "Chordophones", "Aerophones"], a: 0 },
                    { q: "Which instrument is a Chordophone?", options: ["Trumpet", "Harp", "Tambourine", "Saxophone"], a: 1 },

                    { q: "Which adjective would most accurately describe the timbre of orchestral cymbals crashing together?", options: ["Mellow and warm", "Shimmering, metallic and bright", "Deep and hollow", "Airy and breathy"], a: 1 },
                    { q: "A cello playing a lyrical melody in its lower register is most accurately described as having a timbre that is:", options: ["Piercing and shrill", "Buzzing and robotic", "Warm, rich, and resonant", "Brittle and dry"], a: 2 }
                ]
            },
            texture: {
                level1Practice: [
                    { q: "What does musical 'Texture' describe?", options: ["How loud or soft the instruments play", "How many layers of sound are heard and how they relate to each other", "The speed and tempo of the rhythm", "The pitch clef used on the staff"], a: 1 },
                    { q: "Which of the following describes a 'Thin' texture?", options: ["A full symphony orchestra playing together", "A solo acoustic flute playing alone in a quiet room", "A rock band with drums, bass, distorted guitars, and vocals", "A 100-person choir singing 8-part harmony"], a: 1 },
                    { q: "What happens to the musical texture when a soloist is joined by a bassline, chords, and background instruments?", options: ["The texture becomes thinner", "The texture becomes thicker and more dense", "The tempo is cut in half", "The notes change from sharp to flat"], a: 1 },
                    { q: "If you remove the harmony pad, bass, and arpeggios leaving only a single note, the texture is:", options: ["Very thick", "Dense and crowded", "Thin and transparent", "Polyphonic"], a: 2 }
                ],
                level1Test: [
                    { q: "In the study of music, the term 'Texture' is best defined as:", options: ["The physical feeling of the instrument's wood or brass", "The layers of sound heard in a piece and the density they create", "The key signature at the start of a bar", "The volume changes marked by hairpins"], a: 1 },

                    { q: "Why might a composer deliberately choose a very thin texture for the beginning of a piece?", options: ["Because they ran out of instruments", "To create intimacy, focus, or suspense before building energy", "Because thin textures are always faster", "Instruments cannot play at the start of a song"], a: 1 },
                    { q: "When an entire choir sings together in rich 4-part harmony, how does the texture compare to a solo singer?", options: ["It is much thicker and richer", "It is much thinner", "It is completely unchanged", "It becomes an Idiophone"], a: 0 },

                    { q: "If a band suddenly stops playing and only the lead singer's voice continues unaccompanied, the texture has:", options: ["Shifted dramatically from thick to thin", "Shifted from thin to thick", "Become an electrophone", "Modulated to a major key"], a: 0 },
                    { q: "Can a piece of music change between thick and thin textures throughout its duration?", options: ["No, a piece must remain one texture from start to finish", "Yes, composers vary texture across sections to create contrast and excitement", "Only if it is written in Binary form", "Only if it uses synthesizers"], a: 1 }
                ]
            }
        };

        // --- Core App Logic ---
        const app = {
            currentUser: null,
            navigate(viewName, data = null) {
                // If leaving texture lab, silence its audio loop
                if (window.stopTextureLabAudio) window.stopTextureLabAudio();
                if (window.stopTextureLab2Audio) window.stopTextureLab2Audio();

                const root = document.getElementById('app-root');
                if (!views[viewName]) {
                    console.error("View not found:", viewName);
                    return;
                }
                root.innerHTML = views[viewName](data);
                
                // Update Navbar
                const navUser = document.getElementById('nav-user');
                if (this.currentUser) {
                    navUser.classList.remove('hidden');
                    document.getElementById('nav-username').textContent = this.currentUser.name;
                    document.getElementById('nav-tests').textContent = state.stats.completedTests;
                } else {
                    navUser.classList.add('hidden');
                }

                // If navigating to Chord Theory, initialize synth & update display
                if(viewName === 'chordTheoryCentre') {
                    try {
                        initChordSynth();
                        setTimeout(() => { if (window.updateChordDisplay) window.updateChordDisplay(); }, 20);
                    } catch(err) {
                        console.error("Chord Theory init error:", err);
                    }
                }
                
                // Game Init Triggers
                if(viewName === 'durationLesson1' && data === 'game') setTimeout(() => { if(window.startStemGame) window.startStemGame(); }, 50);
                if(viewName === 'durationLesson2' && data === 'game') setTimeout(() => { if(window.startDurationGame2) window.startDurationGame2(); }, 50);
                if(viewName === 'durationLesson3' && data === 'game') setTimeout(() => { if(window.startQuaverGame) window.startQuaverGame(); }, 50);
                if(viewName === 'durationLesson4' && data === 'game') setTimeout(() => { if(window.startDurationGame4) window.startDurationGame4(); }, 50);
                if(viewName === 'dynamicsLesson1' && data === 'game') setTimeout(() => { if(window.startTempoMemoryGame) window.startTempoMemoryGame(); }, 50);
                if(viewName === 'dynamicsLesson2' && data === 'game') setTimeout(() => { if(window.startDynamicsMatchingGame) window.startDynamicsMatchingGame(); }, 50);
                if(viewName === 'dynamicsLesson3' && data === 'game') setTimeout(() => { if(window.startScoreHuntGame) window.startScoreHuntGame(); }, 50);
                if(viewName === 'structureLesson1' && data === 'game') setTimeout(() => { if(window.startStructureLesson1Game) window.startStructureLesson1Game(); }, 50);
                if(viewName === 'structureLesson3' && data === 'game') setTimeout(() => { if(window.startStructureLesson3Game) window.startStructureLesson3Game(); }, 50);
                if(viewName === 'timbreLesson1' && data === 'game') setTimeout(() => { if(window.startTimbreGame) window.startTimbreGame(); }, 50);
                if(viewName === 'timbreLesson2' && data === 'game') setTimeout(() => { if(window.startTimbreWordGame) window.startTimbreWordGame(); }, 50);
                if(viewName === 'textureLesson1' && data === 'game') setTimeout(() => { if(window.initTextureLab) window.initTextureLab(); }, 50);
                if(viewName === 'textureLesson2' && data === 'game') setTimeout(() => { if(window.initTextureLab2) window.initTextureLab2(); }, 50);
                if(viewName === 'pitchLesson4' && data === 'game') setTimeout(() => { if(window.startBassClefGame) window.startBassClefGame(); }, 50);
                if(viewName === 'pitchLesson1' && data === 'game') setTimeout(() => { if(window.startTrebleClefGame) window.startTrebleClefGame(); }, 50);
                if(viewName === 'pitchLesson2' && data === 'game') setTimeout(() => { if(window.startToneSemitoneGame) window.startToneSemitoneGame(); }, 50);
                if(viewName === 'pitchLesson3' && data === 'game') setTimeout(() => { if(window.startAccGame) window.startAccGame(); }, 50);
            }
        };

        // --- Views ---
        const views = {
            login() {
                return `
                <div class="h-full flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full fade-in border border-gray-100">
                        <div class="text-center mb-8">
