    }

    // --- LEDGER LINE GAME ---
    const ledgerGameNotes = { 
      'C6': { y: 30, lines: [30, 45], label: 'C above the staff' },
      'B5': { y: 37.5, lines: [45], label: 'B above the staff' },
      'A5': { y: 45, lines: [45], label: 'A above the staff' },
      'G5': { y: 52.5, lines: [], label: 'G above the staff' },
      'D4': { y: 127.5, lines: [], label: 'D below the staff' },
      'C4': { y: 135, lines: [135], label: 'C below the staff' },
      'B3': { y: 142.5, lines: [135], label: 'B below the staff' },
      'A3': { y: 150, lines: [135, 150], label: 'A below the staff' } 
    };
    let ledgerLineGameState = { round: 1, totalRounds: 10, score: 0, targetNote: null, answered: false, guessedNote: null, lastCorrect: false, completed: false, roundStartTime: 0 };

    function setupLedgerLineRound() {
      const pool = Object.keys(ledgerGameNotes);
      ledgerLineGameState.targetNote = pool[Math.floor(Math.random() * pool.length)];
      ledgerLineGameState.answered = false;
      ledgerLineGameState.guessedNote = null;
      ledgerLineGameState.lastCorrect = false;
      ledgerLineGameState.roundStartTime = performance.now();
    }

    function mountEmbeddedLedgerLineGame(target) {
      if (!target) return;
      ledgerLineGameState = { round: 1, totalRounds: 10, score: 0, targetNote: null, answered: false, guessedNote: null, lastCorrect: false, completed: false, roundStartTime: 0 };
      setupLedgerLineRound();
      renderLedgerLineGameUI(target);
    }

    function handleLedgerDragStart(event) {
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', 'note');
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleLedgerDrop(event, droppedNoteName) {
      if (event) event.preventDefault();
      const st = ledgerLineGameState;
      if (st.answered || st.completed || !st.targetNote) return;
      if (performance.now() - st.roundStartTime < 800) return;
      
      st.guessedNote = droppedNoteName;
      st.answered = true;
      st.lastCorrect = (droppedNoteName === st.targetNote);
      
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderLedgerLineGameUI(document.getElementById('embedded-tool-container'));
    }

    function nextLedgerLineRound() {
      const st = ledgerLineGameState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupLedgerLineRound();
        renderLedgerLineGameUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderLedgerLineGameUI(document.getElementById('embedded-tool-container'));
        showAppModal('Ledger Line Game Complete!', `You placed ${st.score}/${st.totalRounds} notes correctly and earned +${st.score} Tokens!`, st.score >= 5);
      }
    }

    function drawLedgerLinesForTarget(noteName, cx = 150) {
      const noteDef = ledgerGameNotes[noteName];
      if (!noteDef || !noteDef.lines) return '';
      return noteDef.lines.map(y => `<line x1="${cx - 15}" y1="${y}" x2="${cx + 15}" y2="${y}" stroke="#1e293b" stroke-width="2"/>`).join('');
    }

    function renderLedgerLineGameUI(target) {
      if (!target) return;
      const st = ledgerLineGameState;
      
      let staffLines = '';
      for (let i = 0; i < 5; i++) {
        staffLines += `<line x1="20" y1="${60 + i*15}" x2="280" y2="${60 + i*15}" stroke="#475569" stroke-width="2"/>`;
      }
      staffLines += `<text x="35" y="130" font-size="75" font-family="serif" fill="#94a3b8" font-weight="bold">&#119070;</text>`;

      let dropZones = '';
      let answerDots = '';

      if (!st.answered) {
        // Render invisible interactive drop zones for each ledger location
        Object.keys(ledgerGameNotes).forEach(noteName => {
          const y = ledgerGameNotes[noteName].y;
          dropZones += `
            <rect x="80" y="${y - 7.5}" width="140" height="15" fill="transparent" class="cursor-pointer"
              ondragover="event.preventDefault(); this.setAttribute('fill', 'rgba(56,189,248,0.2)');"
              ondragleave="this.setAttribute('fill', 'transparent');"
              ondrop="this.setAttribute('fill', 'transparent'); handleLedgerDrop(event, '${noteName}');"
              onclick="handleLedgerDrop(null, '${noteName}')"
            />
          `;
        });
      } else {
        const guessedY = ledgerGameNotes[st.guessedNote].y;
        const targetY = ledgerGameNotes[st.targetNote].y;
        
        if (st.lastCorrect) {
          answerDots = drawLedgerLinesForTarget(st.guessedNote, 150) + `<ellipse cx="150" cy="${guessedY}" rx="10" ry="7" fill="#34d399"/>`;
        } else {
          answerDots = drawLedgerLinesForTarget(st.guessedNote, 150) + `<ellipse cx="150" cy="${guessedY}" rx="10" ry="7" fill="#ef4444"/>` +
                       drawLedgerLinesForTarget(st.targetNote, 150) + `<ellipse cx="150" cy="${targetY}" rx="10" ry="7" fill="#34d399" opacity="0.6"/>`;
        }
      }

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-sky-400">10-Round Challenge • Drag &amp; Drop</span>
              <h3 class="text-xl font-black">Ledger Line Target Practice</h3>
              <p class="text-xs text-slate-300 mt-1">Drag the note (or tap the staff) to place the requested pitch precisely on or between the ledger lines!</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">Round ${st.round} / ${st.totalRounds}</span>
              <span class="px-3 py-1 rounded-xl bg-emerald-950 border border-emerald-700 text-xs font-black text-emerald-300">Score: ${st.score} (+${st.score} Tokens)</span>
            </div>
          </div>

          ${st.completed ? `
            <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-3">
              <h4 class="text-xl font-black text-emerald-300">Ledger Line Game Complete!</h4>
              <p class="text-xs text-slate-200">You placed <strong>${st.score} / ${st.totalRounds}</strong> notes correctly and earned <strong>+${st.score} Tokens</strong>!</p>
              <button type="button" onclick="mountEmbeddedLedgerLineGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Another 10 Rounds</button>
            </div>
          ` : `
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-indigo-950/80 border border-indigo-700/70">
              <div class="text-center sm:text-left">
                <span class="text-sm font-black text-sky-300">Target Note: <span class="text-xl text-white ml-1">${st.targetNote ? ledgerGameNotes[st.targetNote].label : ''}</span></span>
              </div>
              <div draggable="true" ondragstart="handleLedgerDragStart(event)" class="w-14 h-14 rounded-full bg-white border-4 border-sky-400 flex items-center justify-center cursor-grab active:cursor-grabbing shadow-lg shadow-sky-500/30 ${st.answered ? 'opacity-50 pointer-events-none' : ''}">
                 <svg viewBox="0 0 40 40" class="w-8 h-8"><ellipse cx="20" cy="20" rx="14" ry="10" fill="#0f172a"/></svg>
              </div>
            </div>

            <div class="flex justify-center mt-4">
              <svg viewBox="0 15 300 150" class="w-full max-w-md h-auto bg-slate-50 rounded-xl shadow-inner border border-slate-300">
                ${staffLines}
                ${dropZones}
                ${answerDots}
              </svg>
            </div>

            ${st.answered ? `
              <div class="mt-4 p-4 rounded-2xl border ${st.lastCorrect ? 'bg-emerald-950/70 border-emerald-500 text-emerald-200' : 'bg-rose-950/70 border-rose-500 text-rose-200'} flex items-center justify-between gap-3">
                <span class="text-xs font-bold">${st.lastCorrect ? '✓ Spot on (+1 Token)!' : `✗ Not quite. You placed it on ${ledgerGameNotes[st.guessedNote].label}.`}</span>
                <button type="button" onclick="nextLedgerLineRound()" class="px-4 py-2 bg-white text-slate-950 hover:bg-slate-100 font-black rounded-xl text-xs shrink-0">
                  ${st.round < st.totalRounds ? 'Next Round →' : 'Finish'}
                </button>
              </div>
            ` : ''}
          `}
        </div>
      `;
    }

    // ==========================================
    // 6 CONCEPTS OF MUSIC CURRICULUM & UNIQUE 15-QUESTION TESTS
    // ==========================================
    // INTERACTIVE MINIGAME: STAGGERED TEXTURE SOUND LAB
    // ==========================================
    const staggeredLayers = [
      { id: 'bass', name: 'Sub Bass Pulse', color: 'bg-indigo-600', hex: '#4f46e5' },
      { id: 'cello', name: 'Cello Drone', color: 'bg-violet-500', hex: '#8b5cf6' },
      { id: 'ostinato', name: 'Tension Ostinato', color: 'bg-amber-600', hex: '#d97706' },
      { id: 'melody', name: 'Haunting Melody', color: 'bg-rose-600', hex: '#e11d48' },
      { id: 'chime', name: 'High Chime', color: 'bg-cyan-600', hex: '#0891b2' }
    ];

    let staggeredLabState = {
      activeTab: 'lab',
      playing: false,
      globalBeat: -1,
      intervalId: null,
      config: { 'bass': 1, 'cello': 2, 'ostinato': 3, 'melody': 4, 'chime': 5 },
      round: 1, totalRounds: 5, score: 0,
      gameTargetOrder: [], gameGuessOrder: [],
      gameAnswered: false, gameCompleted: false, audioPlayed: false
    };

    function stopStaggeredLabLoop() {
      if (staggeredLabState.intervalId) clearInterval(staggeredLabState.intervalId);
      staggeredLabState.intervalId = null;
      staggeredLabState.playing = false;
      staggeredLabState.globalBeat = -1;
    }

    function toggleStaggeredLabPlayback() {
      if (staggeredLabState.playing) {
        stopStaggeredLabLoop();
        renderStaggeredTextureLabUI();
        return;
      }
      
      staggeredLabState.playing = true;
      staggeredLabState.globalBeat = -1;
      const bpm = 120;
      const beatMs = 60000 / bpm; // 500ms

      const step = () => {
        if (!staggeredLabState.playing) return;
        staggeredLabState.globalBeat++;
        
        // Loop back after 6 bars (24 beats)
        if (staggeredLabState.globalBeat >= 24) {
           staggeredLabState.globalBeat = 0;
        }

        const b = staggeredLabState.globalBeat;
        const currentBar = Math.floor(b / 4) + 1;
        const beatInBar = b % 4; // 0, 1, 2, 3
        
        const cnf = staggeredLabState.activeTab === 'game' ? staggeredLabState.gameConfig : staggeredLabState.config;
        
        // Bass: Plays on beats 1 and 3 (0 and 2)
        if (cnf.bass && currentBar >= cnf.bass && (beatInBar === 0 || beatInBar === 2)) {
          playTonePitch(65.41, 0.3, 0.4, 'sawtooth');
        }
        // Cello: Plays on beat 1, sustained for the whole bar
        if (cnf.cello && currentBar >= cnf.cello && beatInBar === 0) {
          playTonePitch(130.81, 1.9, 0.15, 'triangle');
          playTonePitch(196.00, 1.9, 0.1, 'triangle'); // Fifth
        }
        // Ostinato: Plays tight sequence every beat
        if (cnf.ostinato && currentBar >= cnf.ostinato) {
          const arp = [392.00, 440.00, 392.00, 349.23];
          playTonePitch(arp[beatInBar], 0.1, 0.25, 'square');
          setTimeout(() => playTonePitch(arp[(beatInBar + 1) % 4], 0.1, 0.15, 'square'), 250); // eighth note
        }
        // Melody: Slow haunted phrase
        if (cnf.melody && currentBar >= cnf.melody) {
           if (beatInBar === 0) playTonePitch(523.25, 0.9, 0.3, 'sawtooth');
           if (beatInBar === 2) playTonePitch(587.33, 0.9, 0.3, 'sawtooth');
        }
        // Chime: Bell hit on beat 2 (index 1)
        if (cnf.chime && currentBar >= cnf.chime && beatInBar === 1) {
           playTonePitch(1046.50, 0.8, 0.25, 'sine');
           setTimeout(() => playTonePitch(1567.98, 0.6, 0.15, 'sine'), 150);
        }

        renderStaggeredTextureLabUI();
      };
      
      step();
      staggeredLabState.intervalId = setInterval(step, beatMs);
    }

    function setStaggeredConfig(layerId, barVal) {
      if (staggeredLabState.playing) stopStaggeredLabLoop();
      staggeredLabState.config[layerId] = barVal;
      renderStaggeredTextureLabUI();
    }

    function presetStaggeredConfig(type) {
      if (staggeredLabState.playing) stopStaggeredLabLoop();
      if (type === 'stagger') {
        staggeredLabState.config = { 'bass': 1, 'cello': 2, 'ostinato': 3, 'melody': 4, 'chime': 5 };
      } else if (type === 'all') {
        staggeredLabState.config = { 'bass': 1, 'cello': 1, 'ostinato': 1, 'melody': 1, 'chime': 1 };
      } else if (type === 'clear') {
        staggeredLabState.config = { 'bass': null, 'cello': null, 'ostinato': null, 'melody': null, 'chime': null };
      }
      renderStaggeredTextureLabUI();
    }

    function setupStaggeredGameRound() {
      const st = staggeredLabState;
      
      // Progressive difficulty: Round 1 (2 layers) -> Round 5 (5 layers)
      const difficultyMap = [2, 3, 3, 4, 5]; 
      const activeCount = difficultyMap[st.round - 1] || 3;
      
      const shuffledIds = staggeredLayers.map(l => l.id).sort(() => Math.random() - 0.5).slice(0, activeCount);
      
      st.gameConfig = { 'bass': null, 'cello': null, 'ostinato': null, 'melody': null, 'chime': null };
      st.gameTargetOrder = shuffledIds;
      
      // Assign them sequentially to bars 1, 2, 3, etc.
      shuffledIds.forEach((id, index) => {
        st.gameConfig[id] = index + 1;
      });
      
      st.gameGuessOrder = [];
      st.gameAnswered = false;
      st.gameCompleted = false;
      st.audioPlayed = false;
      stopStaggeredLabLoop();
    }

    function playStaggeredMystery() {
       if (staggeredLabState.playing) return;
       staggeredLabState.gameGuessOrder = [];
       staggeredLabState.audioPlayed = true;
       toggleStaggeredLabPlayback();
       // Auto-stop after the sequence finishes (Wait for highest entry bar + 1 bar to hear it)
       const highestBar = staggeredLabState.gameTargetOrder.length;
       const stopAfterMs = (highestBar + 1) * 4 * 500; 
       setTimeout(() => {
         if (staggeredLabState.activeTab === 'game') stopStaggeredLabLoop();
         renderStaggeredTextureLabUI();
       }, stopAfterMs);
    }

    function guessStaggeredLayer(layerId) {
      if (staggeredLabState.gameAnswered || staggeredLabState.gameCompleted) return;
      if (!staggeredLabState.audioPlayed) { showAppModal('Listen First', 'Please play the mystery sequence before guessing!', false); return; }
      if (!staggeredLabState.gameGuessOrder.includes(layerId)) {
        staggeredLabState.gameGuessOrder.push(layerId);
        playTonePitch(523.25, 0.1, 0.2, 'triangle');
        renderStaggeredTextureLabUI();
      }
    }

    function submitStaggeredGuess() {
      const st = staggeredLabState;
      if (st.gameGuessOrder.length !== st.gameTargetOrder.length) return;
      
      st.gameAnswered = true;
      const isRight = st.gameTargetOrder.every((val, idx) => val === st.gameGuessOrder[idx]);
      st.lastCorrect = isRight;

      if (isRight) {
        st.score++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderStaggeredTextureLabUI();
    }

    function nextStaggeredGameRound() {
      const st = staggeredLabState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupStaggeredGameRound();
        renderStaggeredTextureLabUI();
      } else {
        st.gameCompleted = true;
        renderStaggeredTextureLabUI();
        showAppModal('Layer Order Detective Complete!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score * 2} Tokens!`, st.score >= 3);
      }
    }

    function mountEmbeddedStaggeredTextureLab(target) {
      if (!target) return;
      stopStaggeredLabLoop();
      staggeredLabState = {
        activeTab: 'lab', playing: false, globalBeat: -1, intervalId: null,
        config: { 'bass': 1, 'cello': 2, 'ostinato': 3, 'melody': 4, 'chime': 5 },
        round: 1, totalRounds: 5, score: 0,
        gameTargetOrder: [], gameGuessOrder: [], gameAnswered: false, gameCompleted: false
      };
      renderStaggeredTextureLabUI(target);
    }

    function renderStaggeredTextureLabUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = staggeredLabState;
      
      const currentBar = st.playing ? Math.floor(st.globalBeat / 4) + 1 : 0;
      const beatInBar = st.playing ? (st.globalBeat % 4) + 1 : 0;
      
      // Calculate visualizer tracks
      const renderVisualizer = (configObj) => {
        let gridHtml = '';
        for (let b = 1; b <= 6; b++) {
           gridHtml += `<div class="border-r border-slate-700/50 flex flex-col justify-between items-center text-[9px] text-slate-500 font-black tracking-widest pt-2 h-full"><span class="bg-[#0f172a] px-1 z-10">BAR ${b}</span></div>`;
        }
        
        let tracksHtml = '';
        staggeredLayers.forEach((layer, i) => {
           const entryBar = configObj[layer.id];
           if (entryBar) {
              const leftPct = ((entryBar - 1) / 6) * 100;
              const widthPct = ((6 - entryBar + 1) / 6) * 100;
              const isActiveNow = currentBar >= entryBar;
              const shadowClass = isActiveNow ? 'shadow-[0_0_15px_' + layer.hex + '40]' : '';
              tracksHtml += `<div class="absolute h-4 rounded-full ${layer.color} ${shadowClass} transition-opacity duration-300" style="top: ${32 + (i * 24)}px; left: ${leftPct}%; width: ${widthPct}%;"></div>`;
           }
        });
        
        let playheadHtml = '';
        if (currentBar >= 1 && currentBar <= 6) {
           const phLeft = (((currentBar - 1) * 4 + (beatInBar - 1)) / 24) * 100;
           playheadHtml = `<div class="absolute top-0 bottom-0 w-0.5 bg-amber-400 shadow-[0_0_8px_#fbbf24] z-20 transition-all duration-100 ease-linear" style="left: ${phLeft}%;"></div>`;
        }

        return `
          <div class="relative w-full h-[160px] bg-[#0b0f19] rounded-2xl border border-slate-800 overflow-hidden mt-4">
             <div class="absolute inset-0 grid grid-cols-6">${gridHtml}</div>
             ${tracksHtml}
             ${playheadHtml}
          </div>
        `;
      };

      let activeCount = Object.values(st.config).filter(v => v !== null).length;

    // ==========================================
    // MINIGAME 10: REPEAT SIGNS & ROADMAPS

    const repeatGameScenarios = [
      { id: 'rs1', title: 'Bar 1, 2, repeat back to Bar 1', fwd: null, bwd: 2, correctPath: '1, 2, 1, 2', wrongPaths: ['1, 2, 3', '1, 2, 1', '1, 2, 2'] },

    function setupRepeatSignRound() {

    function mountEmbeddedRepeatSignGame(target) {

    function guessRepeatPath(selectedPath) {

      st.answered = true;
      st.lastCorrect = (st.currentScenario.correctPath === selectedPath);

              <p class="text-xs font-bold text-slate-400 mt-1">Follow the dots inward!</p>

            ${st.answered ? `

                <span class="text-xs font-bold">${st.lastCorrect ? '✓ Correct! You traced the perfect roadmap.' : `✗ Incorrect. The correct path was: <strong>${scenario.correctPath}</strong>`}</span>

    // ==========================================
    // MINIGAME 11: VOLTA TIME BARS (1ST & 2ND ENDINGS) ROADMAP GAME

    const voltaGameScenarios = [
      {
        id: 'v1',

        renderVoltaBracketGameUI();

    function renderVoltaBracketGameUI(target) {

              <h3 class="text-xl font-black">Volta Ending Game</h3>

    // ==========================================
    // MINIGAME 12: BINARY & TERNARY FORM EAR CHALLENGE

    let structureGameState = {
      round: 1, totalRounds: 5, score: 0,
      targetForm: null, // 'AB' or 'ABA'
      motifs: { A: [], B: [] },
      isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false
    };

    function setupStructureGameRound() {
      structureGameState.targetForm = Math.random() > 0.5 ? 'AB' : 'ABA';
      
      const scales = [
        [261.63, 293.66, 329.63, 349.23, 392.00], // C Major
        [440.00, 493.88, 523.25, 587.33, 659.25], // A minor higher
        [196.00, 220.00, 246.94, 261.63, 293.66], // G Major low
        [349.23, 392.00, 440.00, 466.16, 523.25]  // F Major
      ];
      
      const sA = scales.splice(Math.floor(Math.random() * scales.length), 1)[0];
      const sB = scales[Math.floor(Math.random() * scales.length)];

      const genMotif = (scale) => [
        scale[Math.floor(Math.random() * scale.length)],
        scale[Math.floor(Math.random() * scale.length)],
        scale[Math.floor(Math.random() * scale.length)],
        scale[Math.floor(Math.random() * scale.length)]
      ];
      
      structureGameState.motifs.A = genMotif(sA);
      structureGameState.motifs.B = genMotif(sB);
      structureGameState.answered = false;
      structureGameState.audioPlayed = false;
    }

    function playStructureMysterySequence() {
      if(structureGameState.isPlaying) return;
      structureGameState.isPlaying = true;
      structureGameState.audioPlayed = true;
      renderStructureFormGameUI();

      const form = structureGameState.targetForm;
      const noteDelay = 250;
      let delayCursor = 0;

      const playSection = (motif, wave) => {
        motif.forEach((freq, i) => {
          setTimeout(() => playTonePitch(freq, 0.2, 0.35, wave), delayCursor + (i * noteDelay));
        });
        delayCursor += (motif.length * noteDelay) + 400; // time + pause gap
      };

      // Play Section A
      playSection(structureGameState.motifs.A, 'triangle');
      // Play Section B
      playSection(structureGameState.motifs.B, 'square');
      // Play Section A again if Ternary
      if (form === 'ABA') playSection(structureGameState.motifs.A, 'triangle');

      setTimeout(() => {
        structureGameState.isPlaying = false;
        renderStructureFormGameUI();
      }, delayCursor);
    }

    function guessStructureForm(guess) {
      if(structureGameState.answered || structureGameState.completed) return;
      if(!structureGameState.audioPlayed) { showAppModal('Listen First', 'Please play the mystery melody before guessing!', false); return; }
      structureGameState.answered = true;
      structureGameState.lastCorrect = (guess === structureGameState.targetForm);
      
      if(structureGameState.lastCorrect) {
        structureGameState.score++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderStructureFormGameUI();
    }

    function nextStructureFormRound() {
      if (structureGameState.round < structureGameState.totalRounds) {
        structureGameState.round++;
        setupStructureGameRound();
        renderStructureFormGameUI();
      } else {
        structureGameState.completed = true;
        renderStructureFormGameUI();
        showAppModal('Form Detective Complete!', `You identified ${structureGameState.score}/${structureGameState.totalRounds} musical forms correctly and earned +${structureGameState.score * 2} Tokens!`, structureGameState.score >= 3);
      }
    }

    function submitLevelTest(conceptId, levelNum) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const questions = activeShuffledQuestions.length > 0 ? activeShuffledQuestions : (level.testQuestions || []);
      let score = 0;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected && Number(selected.value) === q.correct) {
          score++;
        }
      });

      const pct = Math.round((score / questions.length) * 100);
      const earnedTokens = pct >= 80 ? 25 : pct >= 50 ? 15 : 5;

      if (!window.state) window.state = {};
      if (!window.state.testHistory) window.state.testHistory = [];
      window.state.testHistory.unshift({
        concept: concept.title,
        level: level.title,
        score: score,
        total: questions.length,
        percentage: pct,
        date: new Date().toLocaleDateString()
      });
      if (!window.state.stats) window.state.stats = { tokens: 0, testsTaken: 0 };
      window.state.stats.testsTaken = (window.state.stats.testsTaken || 0) + 1;
      addTokens(earnedTokens);

      showAppModal(
        `Test Complete: ${score}/${questions.length} (${pct}%)`,
        `Your mark has been confidentially recorded in your Student Markbook, and you earned +${earnedTokens} Tokens!`,
        pct >= 50
      );
      window.app.navigate('studentDash');
    }

    let activeShuffledQuestions = [];

    function renderLevelTestView(container, { conceptId, levelNum }) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];

      const rawQuestions = level.testQuestions || [];
      const t = conceptThemes[concept.color] || conceptThemes.indigo;

      activeShuffledQuestions = rawQuestions.map(q => {
        const mapped = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
        for (let i = mapped.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [mapped[i], mapped[j]] = [mapped[j], mapped[i]];
        }
        return {
          q: q.q,
          options: mapped.map(m => m.text),
          correct: mapped.findIndex(m => m.isCorrect)
        };
      });

      container.innerHTML = `

              </div>

              Submit ${activeShuffledQuestions.length}-Question Level Test &rarr;

    function buyShopItem(itemId) {
      const item = shopCatalog.find(i => i.id === itemId);
      if (!item) return;
      if (!window.state) window.state = {};
      if (!window.state.inventory) window.state.inventory = [];
      if (window.state.inventory.includes(item.id)) return;

      const bal = (window.state.stats && window.state.stats.tokens) || 0;
      if (bal < item.cost) {
        showAppModal('Not Enough Tokens', `You need ${item.cost} tokens for ${item.name}, and you currently have ${bal}. Complete lessons and tests to earn more!`, false);
        return;
      }

      window.state.stats.tokens = bal - item.cost;
      window.state.inventory.push(item.id);
      saveUserState();
      showAppModal('Item Unlocked!', `You redeemed ${item.name} (${item.category})!`, true);
      renderShopView(document.getElementById('app-viewport'));
    }

    function tradeShopItem(itemId) {
      const item = shopCatalog.find(i => i.id === itemId);
      if (!item) return;
      if (!window.state || !window.state.inventory) return;
      
      const idx = window.state.inventory.indexOf(item.id);
      if (idx === -1) return; // Item not owned

      const bal = (window.state.stats && window.state.stats.tokens) || 0;
      
      // Refund the tokens and remove from inventory
      window.state.stats.tokens = bal + item.cost;
      window.state.inventory.splice(idx, 1);
      
      saveUserState();
      showAppModal('Trade Successful!', `You traded back ${item.name} and received a refund of ${item.cost} Tokens!`, true);
      renderShopView(document.getElementById('app-viewport'));
    }

    function toggleTeacherPasscodeField() {
      const role = document.getElementById('login-role').value;
      const stuGroup = document.getElementById('student-fields-group');
      const passGroup = document.getElementById('teacher-passcode-group');
      if (role === 'teacher') {
        if (stuGroup) stuGroup.classList.add('hidden');
        if (passGroup) passGroup.classList.remove('hidden');
      } else {
        if (stuGroup) stuGroup.classList.remove('hidden');
        if (passGroup) passGroup.classList.add('hidden');
      }
    }

    function handleUserLogin() {
      const role = document.getElementById('login-role').value;
      const firstName = document.getElementById('login-firstname').value.trim();
      const surname = document.getElementById('login-surname').value.trim();
      if (!firstName || !surname) return;

      if (role === 'teacher') {
        const code = (document.getElementById('login-passcode').value || '').trim();
        if (code !== 'Rocky') {
          showAppModal('Invalid Staff Code', 'Please enter the valid teacher staff access code.', false);
          return;
        }
        const key = `teacher_${firstName.toLowerCase()}_${surname.toLowerCase()}`.replace(/\s+/g, '_');
        window.app.currentUser = { key, firstName, surname, role: 'teacher', class: 'Staff', teacher: `${firstName} ${surname}` };
        saveUserState();
        window.app.navigate('teacherDash');
        return;
      }

      const studentClass = document.getElementById('login-class').value;
      const teacher = document.getElementById('login-teacher').value;
      const key = `student_${firstName.toLowerCase()}_${surname.toLowerCase()}`.replace(/\s+/g, '_');

      const existingUsers = getAllUserRecords();
      const existing = existingUsers[key];

      window.app.currentUser = {
        key,
        firstName,
        surname,
        class: studentClass,
        teacher,
        role: 'student'
      };

      if (existing) {
        window.state = {
          stats: existing.stats || { tokens: 10, testsTaken: 0 },
          inventory: existing.inventory || [],
          testHistory: existing.testHistory || [],
          completedLessons: existing.completedLessons || [],
          avatar: existing.avatar || { bg: '#c7d2fe', head: 'round', eyes: 'normal', mouth: 'smile', headwear: 'headphones' }
        };
      } else {
        window.state = {
          stats: { tokens: 10, testsTaken: 0 },
          inventory: [],
          testHistory: [],
          completedLessons: [],
          avatar: { bg: '#c7d2fe', head: 'round', eyes: 'normal', mouth: 'smile', headwear: 'headphones' }
        };
      }

      saveUserState();
      window.app.navigate('studentDash');
    }

                <label class="text-xs font-black uppercase text-slate-500">Class:</label>
                <select onchange="teacherFilters.classFilter = this.value; renderTeacherDash(document.getElementById('app-viewport'));" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                  ${classOptions.map(c => `<option value="${c}" ${teacherFilters.classFilter === c ? 'selected' : ''}>${c === 'ALL' ? 'All Classes' : c}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center gap-2">
                <label class="text-xs font-black uppercase text-slate-500">Teacher:</label>
                <select onchange="teacherFilters.teacherFilter = this.value; renderTeacherDash(document.getElementById('app-viewport'));" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="ALL" ${teacherFilters.teacherFilter === 'ALL' ? 'selected' : ''}>All Teachers</option>
                  <option value="Mr B" ${teacherFilters.teacherFilter === 'Mr B' ? 'selected' : ''}>Mr B</option>
                  <option value="Mr H" ${teacherFilters.teacherFilter === 'Mr H' ? 'selected' : ''}>Mr H</option>
                  <option value="Mr T" ${teacherFilters.teacherFilter === 'Mr T' ? 'selected' : ''}>Mr T</option>
                </select>
              </div>
              <div class="flex items-center gap-2">
                <label class="text-xs font-black uppercase text-slate-500">Sort By:</label>
                <select onchange="teacherFilters.sortBy = this.value; renderTeacherDash(document.getElementById('app-viewport'));" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="class" ${teacherFilters.sortBy === 'class' ? 'selected' : ''}>Class (A-Z)</option>
                  <option value="tokens" ${teacherFilters.sortBy === 'tokens' ? 'selected' : ''}>Tokens Ranking (High-Low)</option>
                  <option value="date" ${teacherFilters.sortBy === 'date' ? 'selected' : ''}>Latest Test Date</option>
                </select>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-500">Showing ${filteredStudents.length} of ${students.length} students</span>
          </div>

          <!-- Student Progress & Markbook Cards -->
          ${filteredStudents.length === 0 ? `
            <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center text-xs text-slate-400">
              No student records match the selected filters.
            </div>
          ` : `
            <div class="space-y-4">
              ${filteredStudents.map(s => {
                const completedLessons = Array.isArray(s.completedLessons) ? s.completedLessons : [];
                const testHistory = Array.isArray(s.testHistory) ? s.testHistory : [];
                const tokens = (s.stats && s.stats.tokens) || 0;

                return `
                  <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                    <!-- Student Header Row -->
                    <div class="p-5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                      <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white font-black flex items-center justify-center text-sm shadow-sm">
                          ${(s.firstName || 'S')[0]}${(s.surname || '')[0] || ''}
                        </div>
                        <div>
                          <h3 class="font-black text-base text-slate-800">${s.firstName} ${s.surname}</h3>
                          <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500 font-semibold">
                            <span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-700 font-bold">Class ${s.class}</span>
                            <span>&bull; Teacher: <strong>${s.teacher || 'Mr B'}</strong></span>
                            <span>&bull; <span class="text-amber-600 font-black"><i class="fa-solid fa-coins text-amber-400"></i> ${tokens} Tokens</span></span>
                          </div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="openEditStudentModal('${s.key}')" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl text-xs transition-colors">
                          <i class="fa-solid fa-pen mr-1"></i> Edit
                        </button>
                        <button onclick="openDeleteStudentModal('${s.key}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs transition-colors">
                          <i class="fa-solid fa-trash mr-1"></i> Delete
                        </button>
                      </div>
                    </div>

                    <!-- Two-Column Body: Module Checklist & Test Results -->
                    <div class="p-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
                      <!-- Left: 6-Concept Module Completion Checklist (7 cols) -->
                      <div class="lg:col-span-7 space-y-3">
                        <h4 class="text-xs font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                          <i class="fa-solid fa-list-check text-indigo-600"></i> Module & Lesson Completion Checklist
                        </h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          ${conceptsCurriculum.map(concept => {
                            let totalLessonsInConcept = 0;
                            let viewedCount = 0;
                            concept.levels.forEach(lvl => {
                              lvl.lessons.forEach(les => {
                                totalLessonsInConcept++;
                                const lKey = `${concept.id}_lvl${lvl.level}_les${les.lessonNum}`;
                                if (completedLessons.includes(lKey)) viewedCount++;
                              });
                            });
                            const isModuleComplete = totalLessonsInConcept > 0 && viewedCount >= totalLessonsInConcept;
                            const isStarted = viewedCount > 0 && !isModuleComplete;

                            return `
                              <div class="p-3 rounded-2xl border ${isModuleComplete ? 'bg-emerald-50/70 border-emerald-200' : isStarted ? 'bg-amber-50/60 border-amber-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5 min-w-0">
                                  <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs shrink-0 ${
                                    isModuleComplete
                                      ? 'bg-emerald-500 text-white'
                                      : isStarted
                                      ? 'bg-amber-400 text-slate-950'
                                      : 'bg-white border border-slate-300 text-slate-300'
                                  }">
                                    <i class="fa-solid ${isModuleComplete ? 'fa-check' : isStarted ? 'fa-spinner' : 'fa-minus'}"></i>
                                  </span>
                                  <div class="truncate">
                                    <div class="text-xs font-bold text-slate-800 truncate">${concept.title}</div>
                                    <div class="text-[10px] font-semibold ${isModuleComplete ? 'text-emerald-700' : isStarted ? 'text-amber-700' : 'text-slate-400'}">
                                      ${viewedCount} / ${totalLessonsInConcept} Lessons Viewed
                                    </div>
                                  </div>
                                </div>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-black shrink-0 ${
                                  isModuleComplete
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : isStarted
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-slate-200/70 text-slate-500'
                                }">
                                  ${isModuleComplete ? 'Done' : isStarted ? 'In Progress' : 'Not Started'}
                                </span>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>

                      <!-- Right: Confidential 15-Question Test Results (5 cols) -->
                      <div class="lg:col-span-5 space-y-3">
                        <h4 class="text-xs font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                          <i class="fa-solid fa-file-circle-check text-emerald-600"></i> 15-Question Level Test Results (${testHistory.length})
                        </h4>
                        ${testHistory.length === 0 ? `
                          <div class="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-xs text-slate-400 text-center">
                            No level tests submitted yet.
                          </div>
                        ` : `
                          <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                            ${testHistory.map(t => `
                              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                                <div>
                                  <div class="font-bold text-slate-800">${t.concept}</div>
                                  <div class="text-[10px] text-slate-500">${t.level} &bull; ${t.date}</div>
                                </div>
                                <span class="px-2.5 py-1 rounded-xl font-black shrink-0 ${
                                  t.percentage >= 80
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : t.percentage >= 50
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-rose-100 text-rose-800'
                                }">
                                  ${t.score}/${t.total} (${t.percentage}%)
                                </span>
                              </div>
                            `).join('')}
                          </div>
                        `}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
          
          <!-- Unified Leaderboard View within Teacher Dashboard -->
          <div class="mt-8">
            ${renderLeaderboardMarkup()}
          </div>
        </div>
      `;
      
      // Hydrate leaderboard immediately after rendering the dashboard
      refreshLeaderboardTableInPlace();
    }

    function openEditStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('edit-student-key').value = key;
      document.getElementById('edit-student-firstname').value = s.firstName || '';
      document.getElementById('edit-student-surname').value = s.surname || '';
      document.getElementById('edit-student-class').value = s.class || '7A';
      document.getElementById('edit-student-teacher').value = s.teacher || 'Mr B';
      document.getElementById('edit-student-tokens').value = (s.stats && s.stats.tokens) || 0;
      document.getElementById('edit-student-modal').classList.remove('hidden');
    }

    function closeEditStudentModal() {
      document.getElementById('edit-student-modal').classList.add('hidden');
    }

    function saveEditedStudent() {
      const key = document.getElementById('edit-student-key').value;
      const all = getAllUserRecords();
      const existing = all[key];
      if (!existing) return;

      existing.firstName = document.getElementById('edit-student-firstname').value.trim() || existing.firstName;
      existing.surname = document.getElementById('edit-student-surname').value.trim() || existing.surname;
      existing.class = document.getElementById('edit-student-class').value;
      existing.teacher = document.getElementById('edit-student-teacher').value;
      if (!existing.stats) existing.stats = { tokens: 0, testsTaken: 0 };
      existing.stats.tokens = Number(document.getElementById('edit-student-tokens').value) || 0;

      try {
        all[key] = existing;
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, existing);
      }

      closeEditStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    function openDeleteStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('delete-student-key').value = key;
      document.getElementById('delete-student-name').textContent = `${s.firstName} ${s.surname}`;
      document.getElementById('delete-student-modal').classList.remove('hidden');
    }

    function closeDeleteStudentModal() {
      document.getElementById('delete-student-modal').classList.add('hidden');
    }

    function confirmDeleteStudent() {
      const key = document.getElementById('delete-student-key').value;
      if (!key) return;
      try {
        const all = getAllUserRecords();
        delete all[key];
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.cachedCloudUsers) delete window.cachedCloudUsers[key];
      if (window.deleteUserRecordFromCloud) window.deleteUserRecordFromCloud(key);

      closeDeleteStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    // ==========================================
    // OVERALL STUDENT LEADERBOARD MARKUP
    // ==========================================
    function renderLeaderboardMarkup() {
      const filters = window.leaderboardFilters || { timeframe: 'overall', classGroup: 'ALL' };
      const classOptions = ['ALL', '7A', '7B', '7C', '7D', '7E', '7F', '7G', '7H', '7I', '7J', '8A', '8B', '8C', '8D', '8E', '8F', '8G', '8H', '8I', '8J', 'Yr 9', 'Yr 10', 'Yr 11', 'Yr 12'];

      return `
        <section id="overall-student-leaderboard-section" class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden mt-6">
          <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500"></i> Classroom Leaderboard
              </h2>
              <p class="text-xs text-slate-500 mt-1">Live token standings synced across all logged-in devices.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <select onchange="window.leaderboardFilters.timeframe = this.value; refreshLeaderboardTableInPlace();" class="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="overall" ${filters.timeframe === 'overall' ? 'selected' : ''}>Overall Leaderboard</option>
                <option value="daily" ${filters.timeframe === 'daily' ? 'selected' : ''}>Daily Leaderboard (Today)</option>
              </select>
              <select onchange="window.leaderboardFilters.classGroup = this.value; refreshLeaderboardTableInPlace();" class="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                ${classOptions.map(c => `<option value="${c}" ${filters.classGroup === c ? 'selected' : ''}>${c === 'ALL' ? 'All Classes' : c}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-black uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="px-4 py-3">Rank</th>
                  <th class="px-4 py-3">Student</th>
                  <th class="px-4 py-3">Class</th>
                  <th class="px-4 py-3 text-right">Tokens</th>
                </tr>
              </thead>
              <tbody id="overall-leaderboard-tbody" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="px-4 py-6 text-center text-slate-400 text-xs">Loading live classroom standings...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ==========================================
    // APPLICATION BOOTSTRAP ON WINDOW LOAD
    // ==========================================
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.key) {
            app.currentUser = parsed;
            const db = getAllUserRecords();
            if (db[parsed.key]) {
              state = {
                stats: db[parsed.key].stats || { tokens: 10, testsTaken: 0 },
                inventory: db[parsed.key].inventory || [],
                testHistory: db[parsed.key].testHistory || [],
                completedLessons: db[parsed.key].completedLessons || []
              };
            }
          }
        }
      } catch (e) {}

      updateNavBar();
      updateGlobalLeaderboard();
      window.app.navigate('home');
    };
  </script>
</body>
</html>
