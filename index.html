  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

  <!-- CURRICULUM DATA & CORE LOGIC SCRIPT -->
  <script>
    // ==========================================
    // GLOBAL APPLICATION STATE & ROUTER
    // ==========================================
    window.state = {
      stats: { tokens: 10, testsTaken: 0 },
      inventory: [],
      testHistory: [],
      completedLessons: []
    };

    window.app = {
      currentUser: null,
      currentView: 'home',
      currentParams: null,
      navigate(view, params = null) {
        const protectedViews = [
          'conceptsHub', 'conceptDetail', 'levelDetail', 'lessonDetail',
          'levelTest', 'shop', 'rhythmModule', 'dictationChallenge',
          'studentDash', 'studentTests', 'teacherDash'
        ];
        if (protectedViews.includes(view) && !this.currentUser) {
          showAppModal('Login Required', 'Please log in as a student or teacher to unlock interactive lessons, games, the shop, and 15-question tests.', false);
          view = 'login';
          params = null;
        }
        this.currentView = view;
        this.currentParams = params;
        updateNavBar();
        const container = document.getElementById('app-viewport');
        if (!container) return;

        switch (view) {
          case 'home': renderHomeView(container); break;
          case 'login': renderLoginView(container); break;
          case 'conceptsHub': renderConceptsHub(container); break;
          case 'conceptDetail': renderConceptDetail(container, params); break;
          case 'levelDetail': renderLevelDetail(container, params); break;
          case 'lessonDetail': renderLessonDetail(container, params); break;
          case 'levelTest': renderLevelTestView(container, params); break;
          case 'shop': renderShopView(container); break;
          case 'rhythmModule': renderRhythmModule(container); break;
          case 'dictationChallenge': renderDictationChallenge(container); break;
          case 'studentDash': renderStudentDash(container); break;
          case 'studentTests': renderStudentTestsView(container); break;
          case 'teacherDash': renderTeacherDash(container); break;
          default: renderHomeView(container);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    function protectedNavigate(view, params = null) {
      app.navigate(view, params);
    }

    function openCurrentPortal() {
      if (!app.currentUser) {
        app.navigate('login');
      } else {
        app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
      }
    }

    function logoutUser() {
      app.currentUser = null;
      state = { stats: { tokens: 10, testsTaken: 0 }, inventory: [], testHistory: [], completedLessons: [] };
      try { localStorage.removeItem('boncepts_active_session'); } catch (e) {}
      updateNavBar();
      app.navigate('home');
    }

    function updateNavBar() {
      const loginBtn = document.getElementById('nav-login-btn');
      const profileBox = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const nameEl = document.getElementById('nav-user-name');
      const roleEl = document.getElementById('nav-user-role');
      const tokEl = document.getElementById('nav-user-tokens');

      if (app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profileBox) {
          profileBox.classList.remove('hidden');
          profileBox.classList.add('flex');
        }
        if (nameEl) nameEl.textContent = `${app.currentUser.firstName} ${app.currentUser.surname}`;
        if (roleEl) roleEl.textContent = app.currentUser.role === 'teacher' ? 'Teacher Staff' : `Class ${app.currentUser.class}`;
        if (app.currentUser.role === 'student' && tokenBadge) {
          tokenBadge.classList.remove('hidden');
          tokenBadge.classList.add('flex');
          if (tokEl) tokEl.textContent = (state.stats && state.stats.tokens) || 0;
        } else if (tokenBadge) {
          tokenBadge.classList.add('hidden');
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profileBox) profileBox.classList.add('hidden');
        if (tokenBadge) tokenBadge.classList.add('hidden');
      }
    }

    function showAppModal(title, body, isSuccess = true) {
      const modal = document.getElementById('app-modal');
      const iconBox = document.getElementById('app-modal-icon');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      if (!modal) return;
      if (titleEl) titleEl.textContent = title;
      if (bodyEl) bodyEl.textContent = body;
      if (iconBox) {
        iconBox.className = isSuccess
          ? 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-emerald-100 text-emerald-600'
          : 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-amber-100 text-amber-600';
        iconBox.innerHTML = isSuccess ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-circle-info"></i>';
      }
      modal.classList.remove('hidden');
    }

    function closeAppModal() {
      const modal = document.getElementById('app-modal');
      if (modal) modal.classList.add('hidden');
    }

    function scrollToStudentLeaderboard() {
      const el = document.getElementById('overall-student-leaderboard-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      } else {
        app.navigate('home');
        setTimeout(() => {
          const target = document.getElementById('overall-student-leaderboard-section');
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        }, 120);
      }
    }

    // ==========================================
    // CLOUD & LOCAL USER STORAGE SYNC
    // ==========================================
    function getAllUserRecords() {
      let localUsers = {};
      try {
        const raw = localStorage.getItem('boncepts_users_db');
        if (raw) localUsers = JSON.parse(raw);
      } catch (e) {}
      return Object.assign({}, localUsers, window.cachedCloudUsers || {});
    }

    function getDeduplicatedStudents() {
      const all = getAllUserRecords();
      const map = {};
      Object.keys(all).forEach(k => {
        const u = all[k];
        if (!u || typeof u !== 'object' || u.role !== 'student') return;
        const cleanKey = k.toLowerCase();
        map[cleanKey] = {
          ...u,
          key: k,
          firstName: u.firstName || 'Student',
          surname: u.surname || '',
          class: u.class || '7A',
          stats: (u.stats && typeof u.stats === 'object') ? u.stats : { tokens: 0, testsTaken: 0 }
        };
      });
      return Object.values(map);
    }

    function saveUserState() {
      if (!app.currentUser) return;
      const record = {
        key: app.currentUser.key,
        firstName: app.currentUser.firstName,
        surname: app.currentUser.surname,
        class: app.currentUser.class,
        teacher: app.currentUser.teacher,
        role: app.currentUser.role,
        stats: state.stats || { tokens: 10, testsTaken: 0 },
        inventory: state.inventory || [],
        testHistory: state.testHistory || [],
        completedLessons: state.completedLessons || [],
        updatedAt: Date.now()
      };

      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(app.currentUser));
        const db = getAllUserRecords();
        db[app.currentUser.key] = record;
        localStorage.setItem('boncepts_users_db', JSON.stringify(db));
      } catch (e) {}

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(app.currentUser.key, record);
      }

      updateNavBar();
      updateGlobalLeaderboard();
      refreshLeaderboardTableInPlace();
    }

    function addTokens(amount) {
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.tokens = (Number(state.stats.tokens) || 0) + amount;
      saveUserState();
    }

    window.updateGlobalLeaderboard = function() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;
      const students = getDeduplicatedStudents();
      students.sort((a, b) => (Number(b?.stats?.tokens) || 0) - (Number(a?.stats?.tokens) || 0));

      if (students.length === 0) {
        ticker.textContent = 'Log in to start earning classroom tokens and appear on the live leaderboard!';
        return;
      }

      ticker.innerHTML = students.map((s, idx) => {

    // ==========================================
    // WEB AUDIO SYNTHESIZERS (DRUMS & PITCH)
    // ==========================================
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playDrumSound(type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.23);
      } else {
        // Snare noise + body
        const bufferSize = ctx.sampleRate * 0.16;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 900;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
      }
    }

    function playTonePitch(freq, duration = 0.5, volume = 0.4) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

      const lesson = lessons[currentLessonIdx >= 0 ? currentLessonIdx : 0] || lessons[0];
      const nextLesson = lessons[currentLessonIdx + 1];
      const prevLesson = lessons[currentLessonIdx - 1];

      // Mark this lesson as viewed so the 15-question Level Test unlocks once all lessons are read
      const lessonKey = `${concept.id}_lvl${level.level}_les${lesson.lessonNum}`;
      if (!state.completedLessons) state.completedLessons = [];
      if (!state.completedLessons.includes(lessonKey)) {
        state.completedLessons.push(lessonKey);

      container.innerHTML = `

    function handleLevelTestSubmit(e, conceptId, levelNum) {
      e.preventDefault();
      const concept = conceptsCurriculum.find(c => c.id === conceptId);
      const level = concept.levels.find(l => l.level === levelNum);
      const questions = level.testQuestions || [];

      let score = 0;
      for (let i = 0; i < questions.length; i++) {
        const selected = document.querySelector(`input[name="level_q_${i}"]:checked`);
        if (selected && parseInt(selected.value, 10) === questions[i].correct) {
          score++;
        }
      }

      const total = questions.length;
      const pct = Math.round((score / total) * 100);
      const earnedTokens = pct >= 80 ? 25 : pct >= 50 ? 15 : 5;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.push({
        title: `${concept.title} - ${level.title} (15-Q Test)`,
        score,
        total,
        date: new Date().toISOString()
      });

      if (!state.stats) state.stats = { tokens: 10, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;

      addTokens(earnedTokens);
      app.navigate('levelDetail', { conceptId, levelNum });
      showAppModal(
        pct >= 80 ? '🏆 Level Mastered!' : 'Assessment Submitted!',
        `You scored ${score}/${total} (${pct}%) and earned +${earnedTokens} Tokens! Your mark has been saved to your confidential record.`,
        pct >= 50
      );
    }

    function handleLessonQuizSubmit(e, conceptId, levelNum, lessonNum) {
      e.preventDefault();

      const level = concept.levels.find(l => l.level === levelNum);

      for (let i = 0; i < quiz.length; i++) {

        if (selected && parseInt(selected.value, 10) === quiz[i].correct) {
          score++;
        }

      const total = quiz.length;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.push({
        title: `${concept.title} - ${lesson.title}`,
        score,

        date: new Date().toISOString()
      });

      if (!state.stats) state.stats = { tokens: 10, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;

      if (passed) {
        addTokens(10);
        showAppModal('🎉 Outstanding Result!', `Perfect score: ${score}/${total}! You mastered this lesson and earned +10 Tokens!`, true);

        addTokens(3);
        showAppModal('Keep Practicing!', `You scored ${score}/${total}. Review the concepts and try again! Earned +3 effort tokens.`, false);

      const studentClass = role === 'student' ? document.getElementById('login-class').value : 'Staff';

      if (!firstName || !surname) return;

      const userKey = `${role}_${firstName.toLowerCase()}_${surname.toLowerCase()}`;
      const allUsers = getAllUserRecords();
      let existing = allUsers[userKey];

      if (existing) {
        state.stats = existing.stats || { tokens: 10, testsTaken: 0 };
        state.inventory = existing.inventory || [];
        state.testHistory = existing.testHistory || [];
      } else {
        state.stats = { tokens: 10, testsTaken: 0 };
        state.inventory = [];
        state.testHistory = [];
      }

      app.currentUser = {
        key: userKey,
        firstName,
        surname,
        class: studentClass,
        teacher,
        role
      };

      saveUserState();

      if (role === 'teacher') {
        app.navigate('teacherDash');
      } else {
        app.navigate('studentDash');

      showAppModal('Welcome', `Signed in as ${firstName} ${surname}`);

      document.getElementById('edit-student-key').value = key;
      document.getElementById('edit-student-firstname').value = s.firstName || '';
      document.getElementById('edit-student-surname').value = s.surname || '';
      document.getElementById('edit-student-class').value = s.class || '7A';
      const teacherSelect = document.getElementById('edit-student-teacher');
      teacherSelect.value = ['Mr B', 'Mr H', 'Mr T'].includes(s.teacher) ? s.teacher : 'Mr B';
      document.getElementById('edit-student-tokens').value = (s.stats && s.stats.tokens) || 0;

    window.saveEditedStudent = function() {
      const key = document.getElementById('edit-student-key').value;
      const records = getAllUserRecords();
      const s = records[key];
      if (!s) return;

      s.firstName = document.getElementById('edit-student-firstname').value.trim();
      s.surname = document.getElementById('edit-student-surname').value.trim();
      s.class = document.getElementById('edit-student-class').value;
      s.teacher = document.getElementById('edit-student-teacher').value.trim();
      if (!s.stats) s.stats = {};
      s.stats.tokens = parseInt(document.getElementById('edit-student-tokens').value, 10) || 0;

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, s);
      }
      try {
        records[key] = s;
        localStorage.setItem('boncepts_users_db', JSON.stringify(records));

      closeEditStudentModal();
      app.navigate(app.currentView);

    async function playCurrentPattern() {
      if (isPlayingPattern) return;
      isPlayingPattern = true;
      const playBtn = document.getElementById('play-pattern-btn');
      if (playBtn) {
        playBtn.disabled = true;
        playBtn.innerHTML = `<i class="fa-solid fa-volume-high animate-pulse"></i> Playing...`;
      }

      for (let i = 0; i < drumPattern.length; i++) {
        const card = document.getElementById(`drum-beat-card-${i}`);
        if (card) card.classList.add('beat-active');

        const isKick = i % 2 === 0;
        const soundType = isKick ? 'kick' : 'snare';

        if (drumPattern[i].type === 'crotchet') {
          playDrumSound(soundType);
        } else {
          playDrumSound(soundType);
          setTimeout(() => playDrumSound(soundType), 230);
        }

        await new Promise(r => setTimeout(r, 460));
        if (card) card.classList.remove('beat-active');
      }

      isPlayingPattern = false;
      if (playBtn) {
        playBtn.disabled = false;
        playBtn.innerHTML = `<i class="fa-solid fa-play"></i> Play Pattern`;
      }
    }

    function togglePatternBeat(idx) {
      drumPattern[idx].type = drumPattern[idx].type === 'crotchet' ? 'quavers' : 'crotchet';

      const container = document.getElementById('embedded-tool-container');

    function generateMysteryPattern() {
      currentMysteryPattern = [];
      for (let i = 0; i < 8; i++) {
        currentMysteryPattern.push(Math.random() > 0.5 ? 1 : 2);
      }

      mysteryOptions = [currentMysteryPattern];
      while (mysteryOptions.length < 4) {
        const distractor = [];
        for (let i = 0; i < 8; i++) {
          distractor.push(Math.random() > 0.5 ? 1 : 2);
        }
        const matchesExisting = mysteryOptions.some(opt => 
          opt.every((val, idx) => val === distractor[idx])
        );
        if (!matchesExisting) {
          mysteryOptions.push(distractor);
        }
      }
      mysteryOptions.sort(() => Math.random() - 0.5);
    }

    async function playMysteryAudio() {
      const btn = document.getElementById('hear-mystery-btn');
      const msg = document.getElementById('dictation-status-msg');
      if (btn) btn.disabled = true;
      if (msg) msg.textContent = "Playing mystery pattern... Count 1 to 8!";

      for (let i = 0; i < currentMysteryPattern.length; i++) {
        const beatType = currentMysteryPattern[i];
        const isKick = i % 2 === 0;
        const soundType = isKick ? 'kick' : 'snare';

        if (beatType === 1) {
          playDrumSound(soundType);
        } else {
          playDrumSound(soundType);
          setTimeout(() => playDrumSound(soundType), 240);
        }
        await new Promise(r => setTimeout(r, 480));
      }

      if (btn) btn.disabled = false;
      if (msg) msg.textContent = "Finished! Select pattern A, B, C, or D.";
    }

    function handleOptionSelect(chosenIdx) {
      const selected = mysteryOptions[chosenIdx];
      const isCorrect = selected.every((val, idx) => val === currentMysteryPattern[idx]);

      if (isCorrect) {
        streakCount++;
        if (streakCount > bestStreak) bestStreak = streakCount;
        addTokens(5);
        generateMysteryPattern();
        showAppModal('🎉 Correct Rhythm!', 'Fantastic ear! You identified the mystery pattern and earned +5 Tokens.', true);
      } else {
        streakCount = 0;
        showAppModal('❌ Not Quite', 'That was not the matching pattern. Listen carefully to the bass (Kick) and snare beats and try again!', false);
      }

      const container = document.getElementById('embedded-tool-container');
      if (container) {
        if (drumModuleTab === 'dictation' && app.currentView === 'rhythmModule') {
          mountEmbeddedDrumModule(container);
        } else if (app.currentView === 'lessonDetail' && drumModuleTab === 'dictation') {

          <div class="flex flex-wrap gap-2">
            ${categories.map(cat => `
              <button onclick="filterShopCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${currentShopCategory === cat ? 'bg-indigo-600 text-white shadow' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                ${cat}
              </button>
            `).join('')}
          </div>

          <!-- Shop Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.map(item => {
              const owned = (state.inventory || []).includes(item.id);
              return `
                <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between mb-4">
                      <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl shadow-inner">
                        <i class="fa-solid ${item.icon}"></i>
                      </div>
                      <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 uppercase tracking-wider">
                        ${item.category}
                      </span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
                    <p class="text-xs text-slate-500 leading-relaxed mt-1 mb-4">${item.desc}</p>
                  </div>
                  <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <span class="font-black text-amber-600 text-base flex items-center gap-1.5">
                      <i class="fa-solid fa-coins text-amber-500"></i> ${item.cost}
                    </span>
                    ${owned ? `
                      <span class="px-3 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 font-bold text-xs rounded-xl flex items-center gap-1">
                        <i class="fa-solid fa-check"></i> Owned
                      </span>
                    ` : `
                      <button onclick="buyShopItem('${item.id}', ${item.cost})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-sm">
                        Unlock Item
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function filterShopCategory(cat) {
      currentShopCategory = cat;
      renderShopView(document.getElementById('app-viewport'));
    }

    function buyShopItem(itemId, cost) {
      if ((state.stats.tokens || 0) < cost) {
        showAppModal('Insufficient Tokens', 'You need more tokens to unlock this item. Complete challenges or level quizzes to earn more!', false);
        return;
      }
      state.stats.tokens -= cost;
      if (!state.inventory) state.inventory = [];
      state.inventory.push(itemId);
      saveUserState();
      renderShopView(document.getElementById('app-viewport'));
      showAppModal('Reward Unlocked! 🎁', 'Item has been added to your inventory.', true);
    }

    // ==========================================
    // CONFIDENTIAL STUDENT TESTS VIEW
    // ==========================================
    function renderStudentTestsView(container) {
      if (!app.currentUser || app.currentUser.role !== 'student') {
        app.navigate('home');
        return;
      }

      const tests = state.testHistory || [];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-3xl font-black text-slate-800">My Assessment Results</h1>
              <p class="text-xs sm:text-sm text-slate-500">Confidential mark record visible only to you and your teacher</p>
            </div>
            <button onclick="app.navigate('studentDash')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">
              &larr; Back to Dashboard
            </button>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
            ${tests.length === 0 ? `
              <div class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-clipboard-check text-4xl mb-2 text-slate-300"></i>
                <p class="text-sm">No completed tests recorded yet. Start exploring the concepts to take your first quiz!</p>
              </div>
            ` : `
              <div class="divide-y divide-slate-100">
                ${tests.map(t => `
                  <div class="py-3 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-slate-800 text-sm">${t.title || 'Music Theory Quiz'}</div>
                      <div class="text-[10px] text-slate-400">${new Date(t.date).toLocaleDateString()}</div>
                    </div>
                    <div class="text-right">
                      <span class="font-black text-indigo-600 text-base">${t.score} / ${t.total}</span>
                      <span class="text-xs text-slate-400 block">${Math.round((t.score / t.total) * 100)}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // APPLICATION STARTUP BOOTSTRAP
    // ==========================================
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          app.currentUser = JSON.parse(savedSession);
          const users = getAllUserRecords();
          if (users[app.currentUser.key]) {
            const u = users[app.currentUser.key];
            state.stats = u.stats || { tokens: 10, testsTaken: 0 };
            state.inventory = u.inventory || [];
            state.testHistory = u.testHistory || [];
            state.completedLessons = u.completedLessons || [];
          }
        }
      } catch (e) {
        console.warn("Session restore:", e.message);
      }

      app.navigate(app.currentUser ? (app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash') : 'home');
      updateGlobalLeaderboard();
    };
  </script>
</body>
</html>
