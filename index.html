  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
                if (typeof remoteMe.stats.overallTokensOffset === 'number') {
                  window.state.stats.overallTokensOffset = remoteMe.stats.overallTokensOffset;
                }
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

    function showAppModal(title, body, isSuccess = true) {
      const modal = document.getElementById('app-modal');
      const iconBox = document.getElementById('app-modal-icon');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      if (!modal) return;
      if (titleEl) titleEl.textContent = title;

          ? 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-emerald-100 text-emerald-600'
          : 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-amber-100 text-amber-600';

    function getAllUserRecords() {
      let localDb = {};
      try {
        const raw = localStorage.getItem('boncepts_users_db');
        if (raw) localDb = JSON.parse(raw);
      } catch (e) {}

      const merged = { ...localDb };
      if (window.cachedCloudUsers && typeof window.cachedCloudUsers === 'object') {
        Object.keys(window.cachedCloudUsers).forEach(k => {
          merged[k] = {
            ...(merged[k] || {}),
            ...window.cachedCloudUsers[k]
          };
        });
      }
      return merged;
    }

    function getDeduplicatedStudents() {
      const all = getAllUserRecords();
      return Object.values(all).filter(u => u && u.role === 'student' && u.firstName);
    }

    function saveUserState() {
      if (!window.app.currentUser) return;
      const u = window.app.currentUser;
      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(u));
      } catch (e) {}

      if (u.role === 'student') {
        const record = {
          key: u.key,
          firstName: u.firstName,
          surname: u.surname,
          class: u.class,
          teacher: u.teacher,
          role: 'student',
          stats: window.state.stats || { tokens: 10, testsTaken: 0 },
          inventory: window.state.inventory || [],
          testHistory: window.state.testHistory || [],
          completedLessons: window.state.completedLessons || [],
          avatar: window.state.avatar || { bg: '#c7d2fe', head: 'round', eyes: 'normal', mouth: 'smile', headwear: 'headphones' }
        };
        try {
          const db = getAllUserRecords();
          db[u.key] = record;
          localStorage.setItem('boncepts_users_db', JSON.stringify(db));
        } catch (e) {}
        if (window.saveUserRecordToCloud) {
          window.saveUserRecordToCloud(u.key, record);
        }
      } else if (u.role === 'teacher') {
        const teacherRecord = {
          key: u.key,
          firstName: u.firstName,
          surname: u.surname,
          class: 'Staff',
          teacher: `${u.firstName} ${u.surname}`,
          role: 'teacher',
          avatar: (window.state && window.state.avatar) || { bg: '#c7d2fe', head: 'round', eyes: 'normal', mouth: 'smile', headwear: 'conductor' }
        };
        try {
          const db = getAllUserRecords();
          db[u.key] = teacherRecord;
          localStorage.setItem('boncepts_users_db', JSON.stringify(db));
        } catch (e) {}
      }
      updateNavBar();
      updateGlobalLeaderboard();
      refreshLeaderboardTableInPlace();
    }

    function addTokens(amount) {
      if (!window.state.stats) window.state.stats = { tokens: 0, testsTaken: 0 };
      window.state.stats.tokens = Math.max(0, (Number(window.state.stats.tokens) || 0) + Number(amount));
      
      const todayStr = new Date().toLocaleDateString();
      if (!window.state.stats.dailyTokens || window.state.stats.dailyTokens.date !== todayStr) {
        window.state.stats.dailyTokens = { date: todayStr, amount: 0 };
      }
      window.state.stats.dailyTokens.amount += Number(amount);

      saveUserState();
    }

    function updateGlobalLeaderboard() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;
      const students = getDeduplicatedStudents();
      students.sort((a, b) => getStudentOverallTokens(b) - getStudentOverallTokens(a));
      if (students.length === 0) {
        ticker.textContent = 'Welcome to The Boncepts of Music! Log in to start earning tokens in interactive music labs.';

      ).join(' • ');

    function getStudentSpentTokens(student) {
      const inv = (student && Array.isArray(student.inventory)) ? student.inventory : [];
      let spent = 0;
      inv.forEach(itemId => {
        const shopItem = shopCatalog.find(i => i.id === itemId);
        if (shopItem) {
          spent += Number(shopItem.cost) || 0;
        } else if (avatarUpgradeCosts[itemId]) {
          spent += avatarUpgradeCosts[itemId];
        }
      });
      return spent;
    }

    function getStudentOverallTokens(student) {
      const tokensLeft = (student && student.stats && Number(student.stats.tokens)) || 0;
      const spent = getStudentSpentTokens(student);
      const offset = (student && student.stats && Number(student.stats.overallTokensOffset)) || 0;
      return Math.max(0, tokensLeft + spent + offset);
    }

    function refreshLeaderboardTableInPlace() {
      const tbody = document.getElementById('overall-leaderboard-tbody');
      if (!tbody) return;
      let students = getDeduplicatedStudents();
      
      const todayStr = new Date().toLocaleDateString();
      const { timeframe, classGroup } = window.leaderboardFilters || { timeframe: 'overall', classGroup: 'ALL' };

      if (classGroup !== 'ALL') {
        students = students.filter(s => s.class === classGroup);
      }

      if (timeframe === 'daily') {
        students = students.filter(s => s.stats && s.stats.dailyTokens && s.stats.dailyTokens.date === todayStr && s.stats.dailyTokens.amount > 0);
        students.sort((a, b) => b.stats.dailyTokens.amount - a.stats.dailyTokens.amount);
      } else {
        students.sort((a, b) => getStudentOverallTokens(b) - getStudentOverallTokens(a));
      }

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400 text-xs">No students found for this leaderboard filter. Log in and play to appear here!</td></tr>`;
        return;
      }
      tbody.innerHTML = students.map((s, idx) => {
        const tokensLeft = (s.stats && s.stats.tokens) || 0;
        const overallTokens = getStudentOverallTokens(s);
        const dailyBadge = timeframe === 'daily'
          ? `<span class="ml-1.5 px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 text-[10px] font-black">+${s.stats.dailyTokens.amount} today</span>`
          : '';
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-black text-slate-700">${medal}</td>
            <td class="px-4 py-3 font-bold text-slate-800">
              <div class="flex items-center gap-2">
                ${renderAvatarSVG(s.avatar, 'w-7 h-7')}
                <span>${s.firstName} ${s.surname}</span>
              </div>
            </td>
            <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700">${s.class}</span></td>
            <td class="px-4 py-3 text-right font-bold text-slate-600"><i class="fa-solid fa-coins text-amber-400 mr-1"></i>${tokensLeft}</td>
            <td class="px-4 py-3 text-right font-black text-amber-600"><i class="fa-solid fa-trophy text-amber-500 mr-1"></i>${overallTokens}${dailyBadge}</td>
          </tr>
        `;
      }).join('');
    }

    // ==========================================
    // WEB AUDIO SYNTHESIZER & SOUND ENGINE
    // ==========================================
    let sharedAudioCtx = null;

    function getAudioCtx() {
      try {
        if (!sharedAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) sharedAudioCtx = new AudioCtx();
        }
        if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume();
        }
        return sharedAudioCtx;
      } catch (e) {
        return null;
      }
    }

    function playTonePitch(freq = 440, duration = 0.35, volume = 0.3, waveType = 'triangle') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType || 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(Math.max(0.01, volume), now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + Math.max(0.05, duration));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + Math.max(0.06, duration) + 0.02);
      } catch (e) {}
    }

    function playDrumSound(type = 'kick') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'kick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
          gain.gain.setValueAtTime(0.65, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'snare') {
          const bufferSize = Math.floor(ctx.sampleRate * 0.14);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(900, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          playTonePitch(190, 0.08, 0.22, 'triangle');
        } else {
          const bufferSize = Math.floor(ctx.sampleRate * 0.06);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(5500, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        }
      } catch (e) {}
    }

    function playOrchestralString(instId, technique = 'arco') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (instId === 'harp') {
          // Lush plucked harp arpeggio with warm overtone decay
          const harpChord = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          harpChord.forEach((f, i) => {
            const t = now + i * 0.065;
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'triangle';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(f, t);
            osc2.frequency.setValueAtTime(f * 2, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.18, t + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 1.15);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start(t); osc2.start(t);
            osc1.stop(t + 1.2); osc2.stop(t + 1.2);
          });
          return;
        }

        const profiles = {
          violin:     { freq: 659.25, cutoff: 3200, bodyFreq: 520,  vol: 0.20 },
          viola:      { freq: 440.00, cutoff: 2100, bodyFreq: 360,  vol: 0.22 },
          cello:      { freq: 196.00, cutoff: 1350, bodyFreq: 210,  vol: 0.26 },
          doublebass: { freq: 82.41,  cutoff: 520,  bodyFreq: 115,  vol: 0.34 }
        };
        const p = profiles[instId] || profiles.violin;

        const playBowedStroke = (startTime, dur, isPluck = false) => {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';
          osc1.frequency.setValueAtTime(p.freq, startTime);
          osc2.frequency.setValueAtTime(p.freq * 1.0035, startTime); // Rich ensemble shimmer

          // Subtle expressive vibrato for sustained arco notes
          if (!isPluck && dur >= 0.4) {
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(5.4, startTime);
            lfoGain.gain.setValueAtTime(0, startTime);
            lfoGain.gain.linearRampToValueAtTime(p.freq * 0.007, startTime + 0.28);
            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);
            lfoGain.connect(osc2.frequency);
            lfo.start(startTime);
            lfo.stop(startTime + dur + 0.05);
          }

          // Wooden resonant body filter
          const bodyPeak = ctx.createBiquadFilter();
          bodyPeak.type = 'peaking';
          bodyPeak.frequency.setValueAtTime(p.bodyFreq, startTime);
          bodyPeak.Q.setValueAtTime(2.2, startTime);
          bodyPeak.gain.setValueAtTime(5.5, startTime);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          if (isPluck) {
            lp.frequency.setValueAtTime(p.cutoff * 1.4, startTime);
            lp.frequency.exponentialRampToValueAtTime(Math.max(240, p.cutoff * 0.35), startTime + dur);
          } else {
            lp.frequency.setValueAtTime(p.cutoff * 0.65, startTime);
            lp.frequency.linearRampToValueAtTime(p.cutoff, startTime + Math.min(0.14, dur * 0.3));
          }

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, startTime);
          if (isPluck) {
            gain.gain.linearRampToValueAtTime(p.vol * 1.35, startTime + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
          } else {
            const atk = Math.min(0.12, dur * 0.25);
            gain.gain.linearRampToValueAtTime(p.vol, startTime + atk);
            gain.gain.setValueAtTime(p.vol * 0.92, startTime + Math.max(atk, dur - 0.14));
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
          }

          osc1.connect(bodyPeak);
          osc2.connect(bodyPeak);
          bodyPeak.connect(lp);
          lp.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(startTime); osc2.start(startTime);
          osc1.stop(startTime + dur + 0.04); osc2.stop(startTime + dur + 0.04);
        };

        if (technique === 'pizzicato') {
          playBowedStroke(now, 0.32, true);
        } else if (technique === 'tremolo') {
          for (let i = 0; i < 9; i++) {
            playBowedStroke(now + i * 0.085, 0.08, false);
          }
        } else {
          playBowedStroke(now, 1.05, false);
        }
      } catch (e) {}
    }

    function playOrchestralWoodwind(instId) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const dur = 0.9;

        if (instId === 'piccolo' || instId === 'flute') {
          // Edge-blown air-jet: pure sine + soft 2nd harmonic + breathy attack chiff + vibrato
          const freq = instId === 'piccolo' ? 1174.66 : 587.33;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now);

          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.setValueAtTime(5.2, now);
          lfoGain.gain.setValueAtTime(0, now);
          lfoGain.gain.linearRampToValueAtTime(freq * 0.006, now + 0.25);
          lfo.connect(lfoGain);
          lfoGain.connect(osc1.frequency);
          lfoGain.connect(osc2.frequency);

          const g1 = ctx.createGain();
          const g2 = ctx.createGain();
          g1.gain.setValueAtTime(0.001, now);
          g1.gain.linearRampToValueAtTime(instId === 'piccolo' ? 0.22 : 0.28, now + 0.07);
          g1.gain.setValueAtTime(instId === 'piccolo' ? 0.20 : 0.26, now + dur - 0.15);
          g1.gain.exponentialRampToValueAtTime(0.001, now + dur);

          g2.gain.setValueAtTime(0.001, now);
          g2.gain.linearRampToValueAtTime(0.06, now + 0.06);
          g2.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc1.connect(g1); g1.connect(ctx.destination);
          osc2.connect(g2); g2.connect(ctx.destination);

          // Breathy air chiff burst
          const bufLen = Math.floor(ctx.sampleRate * 0.14);
          const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buf;
          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(freq * 2.2, now);
          bp.Q.setValueAtTime(3.0, now);
          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.07, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          noise.connect(bp); bp.connect(ng); ng.connect(ctx.destination);

          osc1.start(now); osc2.start(now); lfo.start(now); noise.start(now);
          osc1.stop(now + dur + 0.04); osc2.stop(now + dur + 0.04); lfo.stop(now + dur + 0.04);
          return;
        }

        if (instId === 'clarinet') {
          // Single-reed cylindrical bore: hollow odd-harmonic square wave through warm lowpass
          const freq = 329.63;
          const osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(950, now);
          lp.frequency.linearRampToValueAtTime(1650, now + 0.12);
          lp.Q.setValueAtTime(1.2, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.17, now + 0.055);
          gain.gain.setValueAtTime(0.16, now + dur - 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + dur + 0.04);
          return;
        }

        // Double Reed: Oboe or Bassoon (nasal double-reed formant filters + sawtooth)
        const isBassoon = instId === 'bassoon';
        const freq = isBassoon ? 130.81 : 440.00;
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);

        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.setValueAtTime(5.6, now);
        lfoGain.gain.setValueAtTime(0, now);
        lfoGain.gain.linearRampToValueAtTime(freq * 0.006, now + 0.25);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        const formant = ctx.createBiquadFilter();
        formant.type = 'peaking';
        formant.frequency.setValueAtTime(isBassoon ? 520 : 1450, now);
        formant.Q.setValueAtTime(3.2, now);
        formant.gain.setValueAtTime(9, now);

        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(isBassoon ? 1050 : 2850, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(isBassoon ? 0.24 : 0.16, now + 0.06);
        gain.gain.setValueAtTime(isBassoon ? 0.22 : 0.15, now + dur - 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        osc.connect(formant); formant.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
        osc.start(now); lfo.start(now);
        osc.stop(now + dur + 0.04); lfo.stop(now + dur + 0.04);
      } catch (e) {}
    }

    function playOrchestralBrass(instId) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        const profiles = {
          trumpet: {
            notes: [{ f: 523.25, t: 0, d: 0.22 }, { f: 659.25, t: 0.21, d: 0.22 }, { f: 783.99, t: 0.42, d: 0.56 }],
            fStart: 480, fPeak: 3900, fSus: 2400, q: 2.4, vol: 0.20, subSine: false, slideIn: false
          },
          frenchhorn: {
            notes: [{ f: 349.23, t: 0, d: 0.92 }],
            fStart: 220, fPeak: 1650, fSus: 1050, q: 1.6, vol: 0.26, subSine: true, slideIn: false
          },
          trombone: {
            notes: [{ f: 196.00, t: 0, d: 0.92 }],
            fStart: 200, fPeak: 2250, fSus: 1280, q: 2.1, vol: 0.25, subSine: false, slideIn: true
          },
          tuba: {
            notes: [{ f: 87.31, t: 0, d: 0.98 }],
            fStart: 120, fPeak: 720, fSus: 420, q: 1.5, vol: 0.34, subSine: true, slideIn: false
          }
        };
        const p = profiles[instId] || profiles.trumpet;

        p.notes.forEach(n => {
          const st = now + n.t;
          const dur = n.d;

          // Dual slightly detuned sawtooth oscillators for authentic brass buzzing-lip harmonics
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';

          // Subtle brass lip-attack scoop (or trombone slide-in!)
          const startFreq = p.slideIn ? n.f * 0.89 : n.f * 0.985;
          const scoopDur = p.slideIn ? 0.14 : 0.032;
          osc1.frequency.setValueAtTime(startFreq, st);
          osc1.frequency.exponentialRampToValueAtTime(n.f, st + scoopDur);
          osc2.frequency.setValueAtTime(startFreq * 1.004, st);
          osc2.frequency.exponentialRampToValueAtTime(n.f * 1.004, st + scoopDur);

          // Classic Brass Filter Envelope (sharp brassy flare on attack -> warm metallic sustain)
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.Q.setValueAtTime(p.q, st);
          filter.frequency.setValueAtTime(p.fStart, st);
          filter.frequency.exponentialRampToValueAtTime(p.fPeak, st + 0.065);
          filter.frequency.exponentialRampToValueAtTime(p.fSus, st + Math.min(0.26, dur * 0.5));

          // Brass bell resonance boost
          const bellPeak = ctx.createBiquadFilter();
          bellPeak.type = 'peaking';
          bellPeak.frequency.setValueAtTime(Math.min(2600, n.f * 3.2), st);
          bellPeak.Q.setValueAtTime(1.8, st);
          bellPeak.gain.setValueAtTime(4.5, st);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, st);
          gain.gain.linearRampToValueAtTime(p.vol, st + 0.045);
          gain.gain.setValueAtTime(p.vol * 0.88, st + Math.max(0.06, dur - 0.12));
          gain.gain.exponentialRampToValueAtTime(0.001, st + dur);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(bellPeak);
          bellPeak.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(st); osc2.start(st);
          osc1.stop(st + dur + 0.04); osc2.stop(st + dur + 0.04);

          // Warm fundamental reinforcement for French Horn & Tuba
          if (p.subSine) {
            const sub = ctx.createOscillator();
            const subG = ctx.createGain();
            sub.type = 'sine';
            sub.frequency.setValueAtTime(n.f, st);
            subG.gain.setValueAtTime(0.001, st);
            subG.gain.linearRampToValueAtTime(p.vol * 0.85, st + 0.06);
            subG.gain.exponentialRampToValueAtTime(0.001, st + dur);
            sub.connect(subG); subG.connect(ctx.destination);
            sub.start(st); sub.stop(st + dur + 0.04);
          }
        });
      } catch (e) {}
    }

    function playOrchestralPercussion(id) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        const makeNoiseBuffer = (sec) => {
          const len = Math.max(1, Math.floor(ctx.sampleRate * sec));
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          return buf;
        };

        if (id === 'drum') {
          playDrumSound('snare');
          return;
        }

        if (id === 'cymbal') {
          // Metallic inharmonic partials + shimmering highpass noise
          const ratios = [320, 487, 611, 845, 1120, 1540];
          const hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.setValueAtTime(4200, now);
          const master = ctx.createGain();
          master.gain.setValueAtTime(0.24, now);
          master.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
          hp.connect(master); master.connect(ctx.destination);

          ratios.forEach(freq => {
            const o = ctx.createOscillator();
            o.type = 'square';
            o.frequency.setValueAtTime(freq * 2.4, now);
            o.connect(hp);
            o.start(now); o.stop(now + 1.18);
          });

          const noise = ctx.createBufferSource();
          noise.buffer = makeNoiseBuffer(1.15);
          const nhp = ctx.createBiquadFilter();
          nhp.type = 'highpass';
          nhp.frequency.setValueAtTime(5200, now);
          const ng = ctx.createGain();
          ng.gain.setValueAtTime(0.26, now);
          ng.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
          noise.connect(nhp); nhp.connect(ng); ng.connect(ctx.destination);
          noise.start(now);
          return;
        }

        if (id === 'woodblock') {
          [820, 1380].forEach((f, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now);
            o.frequency.exponentialRampToValueAtTime(f * 0.94, now + 0.065);
            g.gain.setValueAtTime(idx === 0 ? 0.42 : 0.18, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
            o.connect(g); g.connect(ctx.destination);
            o.start(now); o.stop(now + 0.085);
          });
          return;
        }

        if (id === 'castanets') {
          [0, 0.09, 0.21].forEach((offset, idx) => {
            const t = now + offset;
            const noise = ctx.createBufferSource();
            noise.buffer = makeNoiseBuffer(0.045);
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(idx === 2 ? 2100 : 1750, t);
            bp.Q.setValueAtTime(5.5, t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(idx === 2 ? 0.65 : 0.45, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
            noise.start(t);
          });
          return;
        }

        if (id === 'maraca') {
          [0, 0.14, 0.28, 0.44].forEach((offset, idx) => {
            const t = now + offset;
            const noise = ctx.createBufferSource();
            noise.buffer = makeNoiseBuffer(0.09);
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(5600, t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.001, t);
            g.gain.linearRampToValueAtTime(idx === 3 ? 0.34 : 0.22, t + 0.015);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.085);
            noise.connect(hp); hp.connect(g); g.connect(ctx.destination);
            noise.start(t);
          });
          return;
        }

        if (id === 'tambourine' || id === 'sleighbells') {
          const isBells = id === 'sleighbells';
          const pings = isBells ? [2900, 3750, 4620, 5840] : [4400, 5950, 7200];
          [0, 0.16, 0.32].forEach(offset => {
            const t = now + offset;
            pings.forEach(freq => {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = 'sine';
              o.frequency.setValueAtTime(freq, t);
              g.gain.setValueAtTime(0.001, t);
              g.gain.linearRampToValueAtTime(isBells ? 0.09 : 0.06, t + 0.01);
              g.gain.exponentialRampToValueAtTime(0.001, t + (isBells ? 0.26 : 0.14));
              o.connect(g); g.connect(ctx.destination);
              o.start(t); o.stop(t + 0.28);
            });
            const noise = ctx.createBufferSource();
            noise.buffer = makeNoiseBuffer(0.12);
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(6200, t);
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.18, t);
            ng.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
            noise.connect(hp); hp.connect(ng); ng.connect(ctx.destination);
            noise.start(t);
          });
          return;
        }

        if (id === 'guiro') {
          // Notched hollow gourd scrape: rapid rising woody ridges
          for (let i = 0; i < 9; i++) {
            const t = now + i * 0.028;
            const noise = ctx.createBufferSource();
            noise.buffer = makeNoiseBuffer(0.024);
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(920 + i * 75, t);
            bp.Q.setValueAtTime(7.5, t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.42, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.022);
            noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
            noise.start(t);
          }
          return;
        }

        // Cabasa & Sandblocks: rhythmic textured rubbing
        const isCabasa = id === 'cabasa';
        [0, 0.26].forEach(offset => {
          const t = now + offset;
          const noise = ctx.createBufferSource();
          noise.buffer = makeNoiseBuffer(0.22);
          const f = ctx.createBiquadFilter();
          f.type = 'bandpass';
          f.frequency.setValueAtTime(isCabasa ? 5400 : 2500, t);
          f.Q.setValueAtTime(isCabasa ? 2.2 : 1.3, t);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(0.32, t + 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.21);
          noise.connect(f); f.connect(g); g.connect(ctx.destination);
          noise.start(t);
        });
      } catch (e) {}
    }

    // --- RESTORED STATE OBJECTS & EMBEDDED MINIGAMES ---
    let beatTapState = { running: false, intervalId: null, hits: 0, targetHits: 8, lastBeatTime: 0, beatMs: 600, score: 0, msg: 'Click Start, then tap Spacebar on every beat!' };
    function stopBeatTapLoop() { beatTapState.running = false; if (beatTapState.intervalId) { clearInterval(beatTapState.intervalId); beatTapState.intervalId = null; } }
    function handleBeatTapHit() {
      if (!beatTapState.running) return;
      const diff = Math.abs(performance.now() - beatTapState.lastBeatTime);
      const ok = diff < 210 || Math.abs(diff - beatTapState.beatMs) < 210;
      beatTapState.hits++;
      if (ok) { beatTapState.score++; playTonePitch(659.25, 0.12, 0.3, 'triangle'); beatTapState.msg = `✓ On the Beat! (${beatTapState.score}/${beatTapState.targetHits})`; }
      else { playTonePitch(180, 0.14, 0.25, 'sawtooth'); beatTapState.msg = '✗ Slightly off the beat — keep listening!'; }
      if (beatTapState.hits >= beatTapState.targetHits) {
        stopBeatTapLoop();
        const reward = Math.max(1, Math.round(beatTapState.score / 2));
        addTokens(reward);
        beatTapState.msg = `Finished! ${beatTapState.score}/${beatTapState.targetHits} on beat (+${reward} Tokens)!`;
      }
      renderBeatTapUI();
    }
    function startBeatTapGame() {
      stopBeatTapLoop();
      beatTapState = { running: true, intervalId: null, hits: 0, targetHits: 8, lastBeatTime: performance.now(), beatMs: 600, score: 0, msg: 'Tap SPACEBAR or the button in time with the beat!' };
      playDrumSound('kick');
      beatTapState.intervalId = setInterval(() => {
        if (!beatTapState.running) return;

        playDrumSound('kick');
      }, beatTapState.beatMs);

    ];
    function stopLongNoteGameLoop() {
      longNoteState.running = false;
      longNoteState.holding = false;
      longNoteState.readyToHold = false;
      if (longNoteState.beatIntervalId) { clearInterval(longNoteState.beatIntervalId); longNoteState.beatIntervalId = null; }
    }
    function setupLongNoteRound() {
      stopLongNoteGameLoop();
      const pick = longNoteTargets[Math.floor(Math.random() * longNoteTargets.length)];
      longNoteState.targetType = pick.type;

      longNoteState.targetBeats = pick.beats;

      longNoteState.activeBeatIdx = 0;
      longNoteState.feedback = `Click "Start 4-Beat Count-In" to begin Round ${longNoteState.round}!`;
    }
    function startLongNoteRoundWithCountIn() {
      stopLongNoteGameLoop();
      const st = longNoteState;
      st.running = true;
      st.readyToHold = false;
      st.holding = false;
      st.countInBeat = 0;
      st.activeBeatIdx = 0;
      const beatMs = 667; // 90 BPM

      const tick = () => {
        if (!st.running) return;
        st.countInBeat++;
        st.activeBeatIdx = ((st.countInBeat - 1) % 4) + 1;
        if (st.countInBeat <= 4) {
          playTonePitch(st.countInBeat === 1 ? 880 : 660, 0.07, 0.28, 'triangle');
          st.feedback = `Count-In: ${st.countInBeat} ...`;
          if (st.countInBeat === 4) {
            setTimeout(() => {
              if (!st.running) return;
              st.readyToHold = true;
              st.feedback = `GO! Hold SPACEBAR or button for ${st.targetBeats} beats!`;
              renderLongNoteUI();
            }, beatMs - 40);
          }
        } else {
          // Steady background beat continues while holding!
          playTonePitch(st.activeBeatIdx === 1 ? 520 : 400, 0.05, 0.16, 'sine');
        }
        renderLongNoteUI();
      };
      tick();
      st.beatIntervalId = setInterval(tick, beatMs);
    }
    function beginLongNoteHold() {
      const st = longNoteState;
      if (!st.running || !st.readyToHold || st.holding) return;
      st.holding = true;
      st.holdStart = performance.now();
      playTonePitch(440, st.targetBeats * 0.72, 0.25, 'triangle');
      st.feedback = `Holding... count ${st.targetBeats} beats with the background pulse!`;
      renderLongNoteUI();
    }
    function endLongNoteHold() {
      const st = longNoteState;
      if (!st.holding) return;
      const elapsedBeats = (performance.now() - st.holdStart) / 667;
      stopLongNoteGameLoop();
      const ok = Math.abs(elapsedBeats - st.targetBeats) <= 0.55;
      if (ok) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.34, 'triangle');
        st.feedback = `✓ Nice! You held ${elapsedBeats.toFixed(1)} beats (Target: ${st.targetBeats}) (+1 Token)!`;
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
        st.feedback = `✗ Held ${elapsedBeats.toFixed(1)} beats — aim for ${st.targetBeats} beats!`;

      if (st.round < st.totalRounds) {

    // Quick interactive quiz helper for restored lesson labs
    function mountSimpleConceptQuiz(target, title, badge, items, onHear) {
      if (!target) return;
      let idx = 0, score = 0, answered = false;
      const deck = [...items].sort(() => Math.random() - 0.5);
      const draw = () => {
        const cur = deck[idx];
        const done = idx >= deck.length;
        target.innerHTML = `
          <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">

            </div>
            ${done ? `
              <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-3">
                <h4 class="text-xl font-black text-emerald-300">Activity Complete!</h4>
                <p class="text-xs text-slate-200">You scored <strong>${score} / ${deck.length}</strong> (+${score} Tokens)!</p>
                <button type="button" id="sq-replay" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
              </div>
            ` : `
              <div class="p-5 rounded-2xl bg-slate-800/80 border border-slate-700 text-center space-y-3">
                <div class="text-base font-black text-white">${cur.prompt}</div>
                ${onHear ? `<button type="button" id="sq-hear" class="px-5 py-2 bg-amber-400 text-slate-950 font-black rounded-xl text-xs"><i class="fa-solid fa-volume-high mr-1"></i> Hear Audio</button>` : ''}
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${cur.options.map((opt, oIdx) => `<button type="button" data-sq-opt="${oIdx}" class="p-4 rounded-2xl border-2 border-slate-600 bg-slate-800 hover:border-amber-400 font-black text-sm transition-all">${opt}</button>`).join('')}
              </div>
            `}
          </div>`;
        if (done) {
          const r = target.querySelector('#sq-replay');
          if (r) r.onclick = () => mountSimpleConceptQuiz(target, title, badge, items, onHear);
        } else {
          const h = target.querySelector('#sq-hear');
          if (h && onHear) h.onclick = () => onHear(cur);
          target.querySelectorAll('[data-sq-opt]').forEach(btn => {
            btn.onclick = () => {
              if (answered) return;
              answered = true;
              const chosen = Number(btn.getAttribute('data-sq-opt'));
              if (chosen === cur.correct) { score++; addTokens(1); playTonePitch(659.25, 0.2, 0.34, 'triangle'); btn.classList.add('border-emerald-400', 'bg-emerald-950'); }
              else { playTonePitch(155.56, 0.25, 0.3, 'sawtooth'); btn.classList.add('border-rose-500', 'bg-rose-950'); }
              setTimeout(() => { idx++; answered = false; draw(); }, 750);
            };
          });
        }
      };
      draw();
    }

    // Shop Minigame: Brass Pyramid Metronome (Internal Pulse Challenge)
    let metronomeGameState = {
      running: false,
      completed: false,
      bpm: 92,
      round: 1,
      totalRounds: 5,
      beatIndex: 0,           // 1..4 audible count-in, 5..8 silent pulse
      beatTimes: [],          // scheduled performance.now() timestamps for beats 1..8
      tappedBeats: {},        // tracks which silent beat index (5..8) was already tapped
      roundHits: 0,
      totalHits: 0,
      streak: 0,
      best: 0,
      tokensEarned: 0,
      pendulumSide: -1,
      lastClickTime: 0,
      phase: 'idle',          // 'idle' | 'listen' | 'silent' | 'roundEnd' | 'done'
      feedback: 'Pick a tempo or press Start! Listen to 4 clicks, then tap SPACEBAR on the 4 silent beats.',
      feedbackTone: 'amber',
      timers: [],
      rafId: null
    };

    const metronomeTempoLevels = [
      { round: 1, bpm: 84,  label: 'Andante (84 BPM)' },
      { round: 2, bpm: 96,  label: 'Moderato (96 BPM)' },
      { round: 3, bpm: 108, label: 'Allegretto (108 BPM)' },
      { round: 4, bpm: 120, label: 'Allegro (120 BPM)' },
      { round: 5, bpm: 132, label: 'Vivace (132 BPM)' }
    ];

    function stopMetronomeGame() {
      metronomeGameState.running = false;
      if (metronomeGameState.timers && metronomeGameState.timers.length) {
        metronomeGameState.timers.forEach(t => clearTimeout(t));
      }
      metronomeGameState.timers = [];
      if (metronomeGameState.rafId) {
        cancelAnimationFrame(metronomeGameState.rafId);
        metronomeGameState.rafId = null;
      }
    }

    function playMetronomeWoodClick(isAccent = false) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isAccent ? 1280 : 880, now);
        osc.frequency.exponentialRampToValueAtTime(isAccent ? 640 : 420, now + 0.045);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(isAccent ? 0.42 : 0.28, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      } catch (e) {}
    }

    function setMetronomeCustomBpm(bpmVal) {
      if (metronomeGameState.running) return;
      metronomeGameState.bpm = Number(bpmVal) || 96;
      renderMetronomeGameView(document.getElementById('app-viewport'));
    }

    function startMetronomeGame(useCurrentBpm = false) {
      stopMetronomeGame();
      const startBpm = useCurrentBpm ? (metronomeGameState.bpm || 96) : metronomeTempoLevels[0].bpm;
      metronomeGameState = {
        running: true,
        completed: false,
        bpm: startBpm,
        round: 1,
        totalRounds: metronomeTempoLevels.length,
        beatIndex: 0,
        beatTimes: [],
        tappedBeats: {},
        roundHits: 0,
        totalHits: 0,
        streak: 0,
        best: metronomeGameState.best || 0,
        tokensEarned: 0,
        pendulumSide: -1,
        lastClickTime: performance.now(),
        phase: 'listen',
        feedback: 'Listen closely to the 4 brass metronome clicks...',
        feedbackTone: 'amber',
        timers: [],
        rafId: null,
        customMode: useCurrentBpm
      };
      renderMetronomeGameView(document.getElementById('app-viewport'));
      launchMetronomeRound();
    }

    function launchMetronomeRound() {
      const st = metronomeGameState;
      if (!st.running) return;
      if (st.timers && st.timers.length) st.timers.forEach(t => clearTimeout(t));
      st.timers = [];

      if (!st.customMode) {
        const cfg = metronomeTempoLevels[st.round - 1] || metronomeTempoLevels[0];
        st.bpm = cfg.bpm;
      }

      const beatMs = Math.round(60000 / st.bpm);
      const startTime = performance.now() + 260;
      st.beatIndex = 0;
      st.tappedBeats = {};
      st.roundHits = 0;
      st.phase = 'listen';
      st.beatTimes = [];
      for (let i = 0; i < 8; i++) {
        st.beatTimes.push(startTime + i * beatMs);
      }
      st.feedback = `Round ${st.round}: Feel the pulse at ${st.bpm} BPM (4 audible clicks)...`;
      st.feedbackTone = 'amber';
      updateMetronomeLiveDOM();

      // Schedule Beats 1..4 (Audible + Pendulum Visible)
      for (let b = 1; b <= 4; b++) {
        const delay = Math.max(0, st.beatTimes[b - 1] - performance.now());
        st.timers.push(setTimeout(() => {
          if (!st.running) return;
          st.beatIndex = b;
          st.phase = 'listen';
          st.pendulumSide = b % 2 === 1 ? -1 : 1;
          st.lastClickTime = performance.now();
          playMetronomeWoodClick(b === 1);
          st.feedback = `Listen & Lock In: Click ${b} of 4`;
          st.feedbackTone = 'amber';
          updateMetronomeLiveDOM();
        }, delay));
      }

      // Transition right before Beat 5 into Silent Pulse Phase
      const silentStartDelay = Math.max(0, st.beatTimes[4] - performance.now() - Math.round(beatMs * 0.45));
      st.timers.push(setTimeout(() => {
        if (!st.running) return;
        st.phase = 'silent';
        st.feedback = '🔇 SILENT PULSE! Tap SPACEBAR on Beats 5, 6, 7 & 8!';
        st.feedbackTone = 'sky';
        updateMetronomeLiveDOM();
      }, silentStartDelay));

      // Track Beat 5..8 silent ticks (no audio!)
      for (let b = 5; b <= 8; b++) {
        const delay = Math.max(0, st.beatTimes[b - 1] - performance.now());
        st.timers.push(setTimeout(() => {
          if (!st.running) return;
          st.beatIndex = b;
          updateMetronomeLiveDOM();
        }, delay));
      }

      // End of 8-beat round evaluation
      const endDelay = Math.max(0, st.beatTimes[7] - performance.now() + Math.round(beatMs * 0.6));
      st.timers.push(setTimeout(() => {
        if (!st.running) return;
        st.phase = 'roundEnd';
        const reward = st.roundHits === 4 ? 2 : st.roundHits >= 3 ? 1 : 0;
        if (reward > 0) {
          st.tokensEarned += reward;
          addTokens(reward);
          playTonePitch(659.25, 0.16, 0.3, 'triangle');
          setTimeout(() => playTonePitch(880, 0.24, 0.3, 'triangle'), 130);
          st.feedback = `✓ Round ${st.round} Complete! ${st.roundHits}/4 Silent Beats Locked In (+${reward} Token${reward > 1 ? 's' : ''})!`;
          st.feedbackTone = 'emerald';
        } else {
          playTonePitch(155.56, 0.25, 0.28, 'sawtooth');
          st.feedback = `Round ${st.round}: ${st.roundHits}/4 Silent Beats hit — keep feeling that steady pulse!`;
          st.feedbackTone = 'rose';
        }
        updateMetronomeLiveDOM();

        st.timers.push(setTimeout(() => {
          if (!st.running) return;
          if (st.round < st.totalRounds) {
            st.round++;
            launchMetronomeRound();
          } else {
            stopMetronomeGame();
            st.completed = true;
            st.phase = 'done';
            renderMetronomeGameView(document.getElementById('app-viewport'));
          }
        }, 1600));
      }, endDelay));

      startMetronomePendulumLoop();
    }

    function startMetronomePendulumLoop() {
      const st = metronomeGameState;
      if (st.rafId) cancelAnimationFrame(st.rafId);

      const animate = (now) => {
        if (!st.running) return;
        const arm = document.getElementById('metro-pendulum-arm');
        if (arm && st.beatTimes.length >= 8) {
          const beatMs = 60000 / st.bpm;
          const elapsedBeats = (now - st.beatTimes[0]) / beatMs;
          // Smooth sinusoidal pendulum swing synced to BPM
          const angle = Math.sin(elapsedBeats * Math.PI) * 28;
          arm.setAttribute('transform', `rotate(${angle.toFixed(1)} 100 165)`);
          arm.setAttribute('opacity', st.phase === 'silent' ? '0.12' : '1');
        }
        st.rafId = requestAnimationFrame(animate);
      };
      st.rafId = requestAnimationFrame(animate);
    }

    function handleMetronomeHit() {
      const st = metronomeGameState;
      if (!st.running || st.phase !== 'silent') return;

      const now = performance.now();
      const beatMs = 60000 / st.bpm;
      const toleranceMs = Math.min(220, Math.max(135, beatMs * 0.34));

      // Find closest silent beat (indices 4..7 -> Beats 5..8)
      let closestIdx = -1;
      let closestSigned = 9999;
      for (let i = 4; i < 8; i++) {
        const diff = now - st.beatTimes[i];
        if (Math.abs(diff) < Math.abs(closestSigned)) {
          closestSigned = diff;
          closestIdx = i;
        }
      }

      if (closestIdx < 4) return;
      const beatNum = closestIdx + 1;

      // Prevent multi-tapping the same silent beat
      if (st.tappedBeats[beatNum]) return;

      const absDiff = Math.abs(closestSigned);
      if (absDiff <= toleranceMs) {
        st.tappedBeats[beatNum] = 'hit';
        st.roundHits++;
        st.totalHits++;
        st.streak++;
        if (st.streak > st.best) st.best = st.streak;
        playTonePitch(absDiff <= 75 ? 783.99 : 659.25, 0.11, 0.3, 'triangle');
        const tag = absDiff <= 75 ? '⚡ PERFECT!' : '✓ ON BEAT!';
        st.feedback = `${tag} Beat ${beatNum} (${Math.round(absDiff)}ms ${closestSigned < 0 ? 'early' : 'late'})`;
        st.feedbackTone = 'emerald';
      } else {
        st.tappedBeats[beatNum] = 'miss';
        st.streak = 0;
        playTonePitch(165, 0.16, 0.26, 'sawtooth');
        st.feedback = `✗ Off Beat (${Math.round(absDiff)}ms ${closestSigned < 0 ? 'too early' : 'too late'})`;
        st.feedbackTone = 'rose';
      }
      updateMetronomeLiveDOM();
    }

    function updateMetronomeLiveDOM() {
      const st = metronomeGameState;
      const roundBadge = document.getElementById('metro-round-badge');
      const bpmBadge = document.getElementById('metro-bpm-badge');
      const tokenBadge = document.getElementById('metro-token-badge');
      const streakEl = document.getElementById('metro-streak-val');
      const fbEl = document.getElementById('metro-feedback-bar');
      const tapBtn = document.getElementById('metro-tap-btn');
      const veilEl = document.getElementById('metro-silent-veil');

      if (roundBadge) roundBadge.textContent = `Round ${st.round} / ${st.totalRounds}`;
      if (bpmBadge) bpmBadge.textContent = `${st.bpm} BPM`;
      if (tokenBadge) tokenBadge.textContent = `+${st.tokensEarned} Tokens`;
      if (streakEl) streakEl.textContent = `Streak: ${st.streak} • Best: ${st.best}`;
      if (veilEl) veilEl.style.opacity = st.phase === 'silent' ? '1' : '0';

      if (fbEl) {
        fbEl.textContent = st.feedback;
        const toneMap = {
          amber:   'bg-amber-500/15 border-amber-400/50 text-amber-300',
          sky:     'bg-sky-500/20 border-sky-400/60 text-sky-200',
          emerald: 'bg-emerald-500/20 border-emerald-400/60 text-emerald-300',

        };
        fbEl.className = `text-xs sm:text-sm font-black py-2.5 px-4 rounded-xl border transition-colors ${toneMap[st.feedbackTone] || toneMap.amber}`;
      }

      if (tapBtn) {
        if (st.phase === 'silent') {
          tapBtn.disabled = false;
          tapBtn.className = 'w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-amber-400 to-yellow-300 hover:brightness-110 active:scale-95 text-slate-950 font-black rounded-2xl text-sm sm:text-base shadow-lg transition-all';
          tapBtn.innerHTML = '<i class="fa-solid fa-hand-pointer mr-2"></i> TAP SILENT BEAT (SPACEBAR)';
        } else {

          tapBtn.innerHTML = '<i class="fa-solid fa-ear-listen mr-2"></i> LISTEN TO THE 4 CLICKS...';
        }
      }

      // Update the 8 beat indicator bulbs (1..4 Audible, 5..8 Silent)
      for (let b = 1; b <= 8; b++) {
        const bulb = document.getElementById(`metro-bulb-${b}`);
        if (!bulb) continue;
        if (b <= 4) {
          const active = st.beatIndex === b && st.phase === 'listen';
          const passed = st.beatIndex > b;
          bulb.className = active
            ? 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-amber-400 text-slate-950 scale-110 shadow-[0_0_14px_rgba(251,191,36,0.85)] transition-all'
            : passed
            ? 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-amber-500/30 border border-amber-400/50 text-amber-200 transition-all'
            : 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-slate-800 border border-slate-700 text-slate-500 transition-all';
        } else {
          const res = st.tappedBeats[b];
          bulb.className = res === 'hit'
            ? 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-emerald-400 text-slate-950 scale-105 shadow-md transition-all'
            : res === 'miss'
            ? 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-rose-500 text-white transition-all'
            : st.phase === 'silent'
            ? 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-sky-950 border-2 border-dashed border-sky-400 text-sky-300 transition-all'
            : 'w-9 h-9 rounded-full flex items-center justify-center font-black text-xs bg-slate-800 border border-slate-700 text-slate-500 transition-all';
        }
      }

      placed: { bell: [], violin: [], cymbal: [], sticks: [] }
    };

    const timbreAdjectivesPool = [
      { word: 'Brassy', cat: 'bell' }, { word: 'Resonant', cat: 'bell' }, { word: 'Ringing', cat: 'bell' },
      { word: 'Warm', cat: 'violin' }, { word: 'Rich', cat: 'violin' }, { word: 'Smooth', cat: 'violin' },

    ];

    function setupTimbreAdjectiveGame() {
      timbreAdjState = {
        completed: false,
        score: 0,
        unplaced: [...timbreAdjectivesPool].sort(() => Math.random() - 0.5),
        placed: { bell: [], violin: [], cymbal: [], sticks: [] }
      };
    }

    function mountEmbeddedTimbreAdjectiveGame(target) {
      if (!target) return;
      setupTimbreAdjectiveGame();

    function mountEmbeddedDynamicsSimulator(target) {
      if (!target) return;
      
      const pairs = [...dynamicsMemoryPairs];
      const deck = [];
      pairs.forEach(p => {
        deck.push({ id: p.id, type: 'front', content: p.front });
        deck.push({ id: p.id, type: 'back', content: p.back });
      });
      deck.sort(() => Math.random() - 0.5);
      
      dynamicsMemoryState = { cards: deck, flipped: [], matched: [], lock: false };
      renderDynamicsMemoryUI(target);
    }

    function flipDynamicsCard(index) {
      const st = dynamicsMemoryState;
      if (st.lock || st.flipped.includes(index) || st.matched.includes(index)) return;

      st.flipped.push(index);
      renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));

      if (st.flipped.length === 2) {
        st.lock = true;
        const [i1, i2] = st.flipped;
        const c1 = st.cards[i1];
        const c2 = st.cards[i2];

        if (c1.id === c2.id) {
          playTonePitch(659.25, 0.2, 0.35, 'triangle');
          setTimeout(() => {
            st.matched.push(i1, i2);
            st.flipped = [];
            st.lock = false;
            if (st.matched.length === st.cards.length) {
              addTokens(10);
              showAppModal('Memory Match Mastered!', 'You matched all 8 dynamic symbols and earned +10 Tokens!', true);
            }
            renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));
          }, 600);
        } else {
          playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
          setTimeout(() => {
            st.flipped = [];
            st.lock = false;
            renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));
          }, 1000);
        }
      }
    }

    function handleStemDrop(event, fallbackZone) {
       if (event) event.preventDefault();
       const st = stemDirectionGameState;
       if (st.answered || st.completed) return;
       if (performance.now() - st.roundStartTime < 800) return;
       
       st.answered = true;
       let snappedY;

       // Calculate exact line or space from coordinates if event exists
       if (event && event.clientY) {
           const svg = event.currentTarget.tagName === 'svg' ? event.currentTarget : event.currentTarget.ownerSVGElement;
           if (svg) {
               const pt = svg.createSVGPoint();
               pt.x = event.clientX;
               pt.y = event.clientY;
               const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
               // Snap to nearest 10 units (half space based on 20px line spacing)
               snappedY = Math.round(svgP.y / 10) * 10;
               // Keep note strictly within the 5 staff lines (Y: 20 to 100)
               snappedY = Math.max(20, Math.min(100, snappedY));
           }
       }

       // Fallback logic if needed
       if (snappedY === undefined) {
           snappedY = fallbackZone === 'above' ? 40 : 80;
       }

       st.droppedY = snappedY;
       
       const isAboveMiddle = st.droppedY < 60;
       const isBelowMiddle = st.droppedY > 60;
       let isCorrect = false;
       
       if (st.targetStem === 'up' && isBelowMiddle) isCorrect = true;
       if (st.targetStem === 'down' && isAboveMiddle) isCorrect = true;
       
       st.lastCorrect = isCorrect;

       if (isCorrect) {
         st.score++;
         st.streak++;
         if (st.streak > st.best) st.best = st.streak;
         addTokens(1);
         playTonePitch(659.25, 0.2, 0.35, 'triangle');

       }

    }

    function playRondoDemoSection(sec) {

        C: { notes: [293.66, 349.23, 440.00, 587.33], wave: 'sawtooth' }

      const m = motifs[sec] || motifs.A;
      m.notes.forEach((f, idx) => {
        setTimeout(() => playTonePitch(f, 0.2, m.wave === 'triangle' ? 0.32 : 0.16, m.wave), idx * 210);
      });
    }

    function playFullRondoDemo() {
      ['A', 'B', 'A', 'C', 'A'].forEach((sec, idx) => {
        setTimeout(() => playRondoDemoSection(sec), idx * 1050);
      });
    }

    let rondoFormState = {
      round: 1, totalRounds: 6, score: 0, targetForm: 'ABACA',
      isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false
    };

    function setupRondoFormRound() {
      const forms = ['AB', 'ABA', 'ABACA'];
      rondoFormState.targetForm = forms[Math.floor(Math.random() * forms.length)];
      rondoFormState.answered = false;
      rondoFormState.lastCorrect = false;
      rondoFormState.audioPlayed = false;
    }

    function mountEmbeddedRondoFormGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      rondoFormState = { round: 1, totalRounds: 6, score: 0, targetForm: 'ABACA', isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false };
      setupRondoFormRound();
      renderRondoFormGameUI(target);
    }

    function playRondoMysteryForm() {
      const st = rondoFormState;
      if (st.isPlaying) return;
      st.isPlaying = true;
      st.audioPlayed = true;
      renderRondoFormGameUI();
      const seq = st.targetForm.split('');
      seq.forEach((sec, idx) => {
        setTimeout(() => playRondoDemoSection(sec), idx * 1020);
      });
      setTimeout(() => {
        st.isPlaying = false;
        renderRondoFormGameUI();
      }, seq.length * 1020 + 150);
    }

    function guessRondoFormChoice(choice) {
      const st = rondoFormState;
      if (st.answered || st.completed || st.isPlaying) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Click "Play Mystery Form" before choosing your answer!', false); return; }
      st.answered = true;
      st.lastCorrect = (st.targetForm === choice);
      if (st.lastCorrect) {
        st.score++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderRondoFormGameUI();
    }

      if (st.lastCorrect) {

        playTonePitch(st.targetNote.freq, 0.4, 0.35, 'triangle');

    // Global Spacebar handler for rhythm games
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (beatTapState.running || crotchetGameState.running || quaverGameState.running || longNoteState.running || metronomeGameState.running || evhGuitarState.running) {
          e.preventDefault();
        }
        if (!e.repeat) {
          if (beatTapState.running) handleBeatTapHit();
          else if (crotchetGameState.running) handleCrotchetTap();
          else if (quaverGameState.running) handleQuaverTap();
          else if (longNoteState.running) beginLongNoteHold();
          else if (metronomeGameState.running) handleMetronomeHit();
          else if (evhGuitarState.running) handleEvhGuitarHit();

      }

      dictationScore: 0,
      dictationCompleted: false,
      dictationAnswered: false,

      dictationTarget: ['crotchet', 'quavers', 'crotchet', 'quavers'],

      audioPlayed: false

    const drumSubdivisionLabels = ['1', '&', '2', '&', '3', '&', '4', '&'];

    function stopDrumSequencerLoop() {
      if (drumLabState.sequencerIntervalId) {
        clearInterval(drumLabState.sequencerIntervalId);
        drumLabState.sequencerIntervalId = null;
      }
      drumLabState.sequencerPlaying = false;
      drumLabState.sequencerStep = -1;
    }

    function toggleDrumSequencerLoop() {
      if (drumLabState.sequencerPlaying) {
        stopDrumSequencerLoop();
        mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
        return;
      }
      drumLabState.sequencerPlaying = true;
      drumLabState.sequencerStep = -1;

      const advanceStep = () => {
        if (!drumLabState.sequencerPlaying) return;
        drumLabState.sequencerStep = (drumLabState.sequencerStep + 1) % 8;
        const step = drumLabState.sequencerStep;
        if (drumLabState.grid.hihat[step]) playDrumSound('hihat');
        if (drumLabState.grid.snare[step]) playDrumSound('snare');
        if (drumLabState.grid.kick[step]) playDrumSound('kick');

        document.querySelectorAll('[data-seq-step]').forEach(btn => {
          const btnStep = Number(btn.getAttribute('data-seq-step'));
          if (btnStep === step) {
            btn.classList.add('ring-2', 'ring-emerald-400', 'scale-105');
          } else {
            btn.classList.remove('ring-2', 'ring-emerald-400', 'scale-105');
          }
        });
      };

      advanceStep();
      drumLabState.sequencerIntervalId = setInterval(advanceStep, 260);
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function toggleDrumGridCell(inst, idx) {
      drumLabState.grid[inst][idx] = drumLabState.grid[inst][idx] ? 0 : 1;

        playDrumSound(inst);
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function playDrumGridSequence(gridObj) {
      toggleDrumSequencerLoop();
    }

    function generateSimpleRhythmDictation() {
      const options = ['crotchet', 'quavers'];
      const pattern = Array.from({ length: 4 }, () => options[Math.floor(Math.random() * options.length)]);
      if (!pattern.includes('quavers')) pattern[1] = 'quavers';
      if (!pattern.includes('crotchet')) pattern[0] = 'crotchet';
      return pattern;
    }

    function playDictationMysteryPattern() {
      if (drumLabState.dictationPlaying) return;
      drumLabState.dictationPlaying = true;
      drumLabState.audioPlayed = true;
      const beatMs = 600;

      // 4-Beat Count-In (1, 2, 3, 4)
      for (let c = 0; c < 4; c++) {
        setTimeout(() => {
          drumLabState.dictationStatusText = `Count-In: ${c + 1}`;
          playTonePitch(784, 0.06, 0.25, 'sine');
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
        }, c * beatMs);
      }

      // 4-Beat Rhythm Pattern (Crotchets & Paired Quavers)
      drumLabState.dictationTarget.forEach((noteType, beatIdx) => {
        const startOffset = (4 + beatIdx) * beatMs;
        setTimeout(() => {
          drumLabState.dictationStatusText = `Listening: Beat ${beatIdx + 1}`;
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;

          if (noteType === 'crotchet') {
            playTonePitch(440, 0.16, 0.42, 'triangle');
          } else {
            playTonePitch(440, 0.11, 0.42, 'triangle');
            setTimeout(() => {
              playTonePitch(440, 0.11, 0.42, 'triangle');
            }, beatMs / 2);
          }
        }, startOffset);
      });

      setTimeout(() => {
        drumLabState.dictationPlaying = false;
        drumLabState.dictationStatusText = 'Drag & drop Crotchets or Quavers into Beats 1–4!';
        const statusEl = document.getElementById('dictation-live-status');
        if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
      }, 8 * beatMs + 80);
    }

    function handleDictationDragStart(event, noteType) {
      drumLabState.draggedNoteTool = noteType;
      drumLabState.selectedNoteTool = noteType;
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', noteType);
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleDictationDrop(event, beatIdx) {
      if (event) event.preventDefault();
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      let droppedType = drumLabState.draggedNoteTool || drumLabState.selectedNoteTool;
      if (event && event.dataTransfer) {
        const dt = event.dataTransfer.getData('text/plain');
        if (dt === 'crotchet' || dt === 'quavers') droppedType = dt;
      }
      drumLabState.dictationGuess[beatIdx] = droppedType;
      drumLabState.draggedNoteTool = null;
      playTonePitch(droppedType === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function applySelectedDictationNote(beatIdx) {
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      drumLabState.dictationGuess[beatIdx] = drumLabState.selectedNoteTool;
      playTonePitch(drumLabState.selectedNoteTool === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function checkDictationPatternGuess() {
      const st = drumLabState;
      if (st.dictationAnswered || st.dictationCompleted) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the 4-beat pattern before checking your answer!', false); return; }
      if (st.dictationGuess.includes(null)) {
        showAppModal('Incomplete Bar', 'Please drag and drop a Crotchet or Paired Quavers into all 4 beat boxes before checking!', false);
        return;
      }

      const match = st.dictationTarget.every((v, i) => v === st.dictationGuess[i]);
      st.dictationAnswered = true;
      st.dictationLastCorrect = match;

      if (match) {
        st.dictationScore++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(165.00, 0.25, 0.3, 'sawtooth');
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function nextDictationRound() {

      if (st.dictationRound < st.dictationTotalRounds) {
        st.dictationRound++;
        st.dictationTarget = generateSimpleRhythmDictation();
        st.dictationGuess = [null, null, null, null];
        st.dictationAnswered = false;
        st.audioPlayed = false;
        st.dictationStatusText = `Round ${st.dictationRound}: Click "Hear Pattern (4-Beat Count-In)" to listen!`;

          st.dictationScore >= 5
