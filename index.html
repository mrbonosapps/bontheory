<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Boncepts of Music - Music Theory Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Dynamic Colorful Animated Background for Login */
        .login-bg-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 25%, #4338ca 50%, #6366f1 75%, #ec4899 100%);
            background-size: 200% 200%;
            animation: gradientShift 12s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .floating-bubble {
            position: absolute;
            border-radius: 9999px;
            filter: blur(40px);
            opacity: 0.45;
            animation: floatSlow 10s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes floatSlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-35px) scale(1.1); }
        }

        /* Continuous Scrolling Marquee Ticker */
        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marqueeScroll 28s linear infinite;
        }
        .marquee-track:hover {
            animation-play-state: paused;
        }

        /* Custom Styles for SVGs */
        .staff-line { stroke: #334155; stroke-width: 2; }
        .staff-text { font-family: 'Inter', sans-serif; font-weight: 700; fill: #2563eb; }
        .note-head { fill: #0f172a; }
        
        /* Chord UI Styles */
        .chord-bg { background-color: #1e293b; }
        .chord-panel { background-color: #0f172a; }
        .custom-select { background-color: #1e293b; color: white; border: 1px solid #334155; }

        /* Continuous Scrolling Ticker Animation */
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-ticker {
            display: inline-flex;
            animation: scrollTicker 38s linear infinite;
        }
        .ticker-container:hover .animate-ticker {
            animation-play-state: paused;
        }

        /* Print styles for Certificate export */
        @media print {
            body { background: white !important; overflow: visible !important; height: auto !important; }
            header, #cert-actions, #nav-user, .print-hide { display: none !important; }
            #app-root { overflow: visible !important; height: auto !important; }
            #cert-container { 
                box-shadow: none !important; 
                border: 6px double #1e293b !important; 
                margin: 0 auto !important;
                page-break-inside: avoid !important;
            }
        }

        /* Leaderboard Marquee Animation */
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marqueeScroll 28s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Navbar & Locked Live Token Ticker Container -->
    <header class="bg-white shadow-sm z-30 sticky top-0 flex flex-col">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between w-full">
            <div class="flex items-center gap-2 cursor-pointer" onclick="if(app.currentUser) app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash')">
                <i class="fa-solid fa-music text-blue-600 text-2xl"></i>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 tracking-tight whitespace-nowrap">The Boncepts of Music</h1>
            </div>
            <div id="nav-user" class="hidden flex items-center gap-4 sm:gap-6">
                <div onclick="if(app.currentUser && app.currentUser.role === 'student') app.navigate('shop')" class="cursor-pointer flex items-center gap-1.5 bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold shadow-sm border border-amber-200 hover:bg-amber-200 transition" title="Current Wallet Tokens">
                    <i class="fa-solid fa-coins text-amber-500"></i>
                    <span id="nav-tokens" class="transition-all duration-300 inline-block">0</span>
                </div>
                <!-- Shortcut button to jump directly down to the Overall Student Leaderboard -->
                <button onclick="scrollToStudentLeaderboard()" class="flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold shadow-sm border border-indigo-200 transition text-sm cursor-pointer" title="Jump to Overall Student Leaderboard">
                    <i class="fa-solid fa-crown text-amber-500"></i>
                    <span class="hidden sm:inline">Leaderboard</span>
                </button>
                <div onclick="if(app.currentUser && app.currentUser.role === 'student') app.navigate('studentTests')" class="cursor-pointer flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold shadow-sm border border-slate-200 transition text-sm" title="View Completed Tests">
                    <i class="fa-solid fa-clipboard-check text-blue-600"></i>
                    <span>Tests:</span>
                    <span id="nav-tests" class="text-blue-700 font-extrabold">0</span>
                </div>
                <div class="flex items-center gap-3 bg-blue-50 py-1.5 px-4 rounded-full border border-blue-100">
                    <span id="nav-username" class="font-bold text-blue-700">Student</span>
                    <button onclick="logout()" class="text-blue-500 hover:text-blue-700 transition" title="Logout">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sticky Live Wallet Tokens Leaderboard (Ticker Bar) -->
        <div id="global-live-ticker-bar" class="hidden bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border-t border-b border-indigo-500/20 py-2 px-4 shadow-inner overflow-hidden select-none">
            <div class="max-w-7xl mx-auto flex items-center gap-3">
                <div class="flex items-center gap-2 bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider flex-shrink-0 border border-indigo-400/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <i class="fa-solid fa-wallet text-amber-400"></i>
                    <span class="hidden sm:inline">Live Token Wallet</span>
                </div>
                <div class="flex-1 overflow-hidden relative">
                    <div id="global-ticker-content" class="animate-marquee gap-8 items-center text-xs sm:text-sm font-semibold text-slate-200">
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-root" class="flex-1 overflow-y-auto w-full relative"></main>

    <script>
        // --- Data & State Management ---
        const DB_STORAGE_KEY = 'boncepts_users_db';
        const SESSION_STORAGE_KEY = 'boncepts_active_session';

        const state = {
            stats: { completedTests: 0, avgScore: 0, tokens: 0 },
            inventory: [],
            testResults: []
        };
        window.state = state;

        // Helper to generate a unique key per user based on name and class
        function getUserRecordKey(user) {
            if (!user || !user.name) return null;
            const cleanName = (user.name || '').trim().toLowerCase();
            const cleanClass = (user.classGroup || '').trim().toLowerCase();
            const cleanTeacher = (user.teacher || '').trim().toLowerCase();
            const role = user.role || 'student';
            return `${role}::${cleanTeacher}::${cleanClass}::${cleanName}`;
        }

        // Get the entire local dictionary of saved accounts
        function getAllUserRecords() {
            try {
                const raw = localStorage.getItem(DB_STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (err) {
                console.warn('Unable to load users db:', err);
                return {};
            }
        }

        // Shop catalog price registry used to compute total net worth / lifetime tokens
        const SHOP_CATALOG = [
            { id: 'gold_clef', name: 'Golden Clef Trophy', cost: 50, icon: 'fa-trophy', color: 'text-yellow-500' },
            { id: 'neon_synth', name: 'Neon Synth Poster', cost: 100, icon: 'fa-image', color: 'text-fuchsia-500' },
            { id: 'mr_b_wrench', name: "Mr B's Wrench", cost: 120, icon: 'fa-wrench', color: 'text-slate-600' },
            { id: 'mr_h_comb', name: "Mr H's Vintage Comb", cost: 150, icon: 'fa-brush', color: 'text-amber-900' },
            { id: 'mr_t_ruler', name: "Mr T's Art Ruler", cost: 180, icon: 'fa-ruler', color: 'text-emerald-500' },
            { id: 'mozart_wig', name: "Mozart's Wig", cost: 200, icon: 'fa-hat-wizard', color: 'text-slate-300' },
            { id: 'beethoven_trumpet', name: "Beethoven's Ear Trumpet", cost: 250, icon: 'fa-ear-listen', color: 'text-amber-700' },
            { id: 'elton_glasses', name: "Elton's Star Glasses", cost: 300, icon: 'fa-glasses', color: 'text-pink-500' },
            { id: 'eminem_mic', name: "Eminem's Microphone", cost: 350, icon: 'fa-microphone', color: 'text-slate-400' },
            { id: 'mj_hat', name: "Michael Jackson's Hat", cost: 400, icon: 'fa-hat-cowboy', color: 'text-zinc-800' },
            { id: 'ts_guitar', name: "Taylor Swift's Guitar", cost: 500, icon: 'fa-guitar', color: 'text-amber-400' },
            { id: 'grand_piano', name: 'Grand Piano Model', cost: 500, icon: 'fa-music', color: 'text-slate-800' },
            { id: 'freddie_mic', name: "Freddie's Mic Stand", cost: 600, icon: 'fa-microphone-lines', color: 'text-slate-300' },
            { id: 'daft_helmet', name: "Daft Punk's Helmet", cost: 800, icon: 'fa-robot', color: 'text-yellow-400' },
            { id: 'evh_guitar', name: "EVH's Striped Guitar", cost: 1000, icon: 'fa-bolt', color: 'text-red-600' }
        ];

        // Helper to compute a student's total Overall Net Worth (Current wallet tokens + cost of all owned shop items)
        function calculateStudentOverallNetWorth(record) {
            if (!record) return 0;
            const currentTokens = (record.stats && record.stats.tokens) ? Number(record.stats.tokens) : 0;
            const inventory = Array.isArray(record.inventory) ? record.inventory : [];
            let inventoryValue = 0;
            inventory.forEach(itemId => {
                const found = SHOP_CATALOG.find(i => i.id === itemId);
                if (found) inventoryValue += found.cost;
            });
            return currentTokens + inventoryValue;
        }

        // Helper to return medal badge based on token or point values
        function getTokenMedal(tokens) {
            const t = Number(tokens) || 0;
            if (t >= 1000) {
                return {
                    tier: 'Platinum',
                    symbol: '💎',
                    badgeClass: 'bg-cyan-500/20 text-cyan-300 border-cyan-400/40 shadow-cyan-500/20',
                    label: 'Platinum Legend'
                };
            } else if (t >= 601) {
                return {
                    tier: 'Gold',
                    symbol: '🥇',
                    badgeClass: 'bg-amber-500/20 text-amber-300 border-amber-400/40 shadow-amber-500/20',
                    label: 'Gold Champion'
                };
            } else if (t >= 301) {
                return {
                    tier: 'Silver',
                    symbol: '🥈',
                    badgeClass: 'bg-slate-300/20 text-slate-200 border-slate-300/40 shadow-slate-400/20',
                    label: 'Silver Virtuoso'
                };
            } else if (t >= 50) {
                return {
                    tier: 'Bronze',
                    symbol: '🥉',
                    badgeClass: 'bg-orange-500/20 text-orange-300 border-orange-400/40 shadow-orange-500/20',
                    label: 'Bronze Achiever'
                };
            }
            return {
                tier: 'Starter',
                symbol: '🎵',
                badgeClass: 'bg-slate-700/40 text-slate-400 border-slate-600/40',
                label: 'Music Learner'
            };
        }

        // Live Wallet Ticker Synchronizer (shows unspent tokens held right now)
        window.updateGlobalLeaderboard = function() {
            const bar = document.getElementById('global-live-ticker-bar');
            const ticker = document.getElementById('global-ticker-content');
            if (!bar || !ticker) return;

            // Display ticker if either a student or teacher is logged in
            if (!app.currentUser) {
                bar.classList.add('hidden');
                return;
            }

            bar.classList.remove('hidden');

            const db = getAllUserRecords();
            // Filter strictly for registered student accounts
            const students = Object.values(db)
                .filter(rec => rec.currentUser && rec.currentUser.role === 'student');

            if (students.length === 0) {
                ticker.innerHTML = `
                    <span class="text-slate-400 italic">No students registered yet. Once students earn tokens, their balances will appear here!</span>
                `;
                return;
            }

            // Sort by current active tokens in wallet (descending)
            students.sort((a, b) => (b.stats?.tokens || 0) - (a.stats?.tokens || 0));

            // Generate ticker pill items
            const studentItemsHTML = students.map(s => {
                const u = s.currentUser;
                const tokens = s.stats?.tokens || 0;
                const medal = getTokenMedal(tokens);
                const isMe = (app.currentUser && app.currentUser.name === u.name);

                return `
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border ${medal.badgeClass} ${isMe ? 'ring-2 ring-amber-400 bg-amber-500/20' : 'bg-slate-800/80'} shadow-xs flex-shrink-0">
                    <span class="text-base select-none">${medal.symbol}</span>
                    <span class="font-extrabold ${isMe ? 'text-amber-300 underline' : 'text-slate-100'}">${u.name}</span>
                    <span class="text-[10px] uppercase font-bold text-slate-400">(${u.classGroup || 'N/A'})</span>
                    <span class="inline-flex items-center gap-1 font-black text-amber-400 ml-1">
                        <i class="fa-solid fa-coins text-[11px]"></i>
                        <span>${tokens}</span>
                    </span>
                    <span class="text-[10px] font-bold text-slate-400 ml-0.5">held</span>
                </div>
                `;
            }).join('');

            // Duplicate array for seamless infinite marquee scroll
            ticker.innerHTML = studentItemsHTML + studentItemsHTML;
        };

        // Save current user state to their isolated profile entry in the database
        function saveUserState() {
            if (!app.currentUser) return;
            try {
                const key = getUserRecordKey(app.currentUser);
                if (!key) return;

                const db = getAllUserRecords();
                db[key] = {
                    currentUser: app.currentUser,
                    stats: state.stats,
                    inventory: state.inventory,
                    testResults: state.testResults || [],
                    lastActive: Date.now()
                };

                localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(db));
                localStorage.setItem(SESSION_STORAGE_KEY, key);
            } catch (err) {
                console.warn('Unable to save user record:', err);
            }
        }

        // Restore a specific user profile or the last active session
        function loadUserState(specificKey = null) {
            try {
                const targetKey = specificKey || localStorage.getItem(SESSION_STORAGE_KEY);
                if (!targetKey) return null;

                const db = getAllUserRecords();
                const record = db[targetKey];
                if (!record) return null;

                if (record.stats) Object.assign(state.stats, record.stats);
                if (Array.isArray(record.inventory)) state.inventory = record.inventory;
                state.testResults = Array.isArray(record.testResults) ? record.testResults : [];
                if (record.currentUser) app.currentUser = record.currentUser;

                return record;
            } catch (err) {
                console.warn('Unable to load user record:', err);
                return null;
            }
        }

        const appData = {
            areas: [
                { id: 'pitch', title: 'Pitch', desc: 'Clefs, Chords, Intervals, Scales & Modes', color: 'from-red-400 to-red-500', icon: 'fa-music' },
                { id: 'duration', title: 'Duration', desc: 'Note values, Time Signatures, Rhythm', color: 'from-yellow-400 to-amber-500', icon: 'fa-clock' },
                { id: 'dynamics', title: 'Dynamics & Expression', desc: 'Terms, signs, and musical expression', color: 'from-emerald-400 to-emerald-500', icon: 'fa-volume-high' },
                { id: 'structure', title: 'Structure', desc: 'Verse/Chorus, Binary, Ternary, Rondo', color: 'from-blue-400 to-blue-500', icon: 'fa-layer-group' },
                { id: 'timbre', title: 'Performing Media & Timbre', desc: 'Instruments and sound manipulation', color: 'from-indigo-400 to-purple-500', icon: 'fa-guitar' },
                { id: 'texture', title: 'Texture', desc: 'Combining layers of sound', color: 'from-pink-400 to-rose-500', icon: 'fa-water' },
            ],
            teacherLogs: []
        };

        const quizData = {
            pitch: {
                level1Practice: [
                    { q: "How many lines are on a musical staff?", options: ["4", "5", "6", "3"], a: 1 },
                    { q: "Which clef is also known as the G Clef?", options: ["Bass Clef", "Alto Clef", "Treble Clef", "Tenor Clef"], a: 2 },
                    { q: "What is a semitone?", options: ["The largest distance between notes", "The smallest distance between two notes on a piano", "A type of rest", "Two whole steps"], a: 1 },
                    { q: "What does a sharp sign (#) do to a note?", options: ["Lowers it by a semitone", "Raises it by a semitone", "Makes it natural", "Makes it louder"], a: 1 },
                    { q: "The Bass Clef is also known as the:", options: ["F Clef", "G Clef", "C Clef", "Drum Clef"], a: 0 }
                ],
                level1Test: [
                    { q: "If you are on the second line of the treble staff, what note are you on?", options: ["G", "B", "E", "D"], a: 0 },
                    { q: "A tone (or whole step) consists of how many semitones?", options: ["1", "2", "3", "4"], a: 1 },
                    { q: "Which note sits on the first ledger line below the treble staff?", options: ["A", "C", "D", "E"], a: 1 },
                    { q: "What is the acronym for the spaces of the Bass Clef?", options: ["FACE", "All Cows Eat Grass", "Every Good Boy Drives Ferraris", "Green Buses Drive Fast Always"], a: 1 },

                    { q: "What is the mnemonic commonly used to remember the five lines of the Treble Clef from bottom to top?", options: ["Every Good Boy Deserves Fruit", "All Cows Eat Grass", "Father Christmas Gave Dad An Electric Blanket", "Good Boys Do Fine Always"], a: 0 },
                    { q: "Which note sits in the third space of the Treble Clef?", options: ["A", "C", "E", "G"], a: 1 },
                    { q: "Between which pair of white keys on a piano keyboard is there NO black key (natural semitones)?", options: ["C and D", "E and F", "F and G", "A and B"], a: 1 },

                    { q: "On the Treble Clef, what note is found on the space directly below the first line (hanging under E)?", options: ["Middle C", "D", "B", "F"], a: 1 },
                    { q: "How many semitones are there between C and D?", options: ["1", "2", "3", "4"], a: 1 },
                    { q: "Where is an accidental (sharp, flat, or natural) placed in standard written notation?", options: ["Directly after the notehead", "Immediately before the notehead on the same line or space", "Above the measure line", "Under the lyrics"], a: 1 },
                    { q: "What is the note found on the top line (fifth line) of the Bass Clef?", options: ["F", "G", "A", "C"], a: 2 }
                ],
                level2Practice: [
                    { q: "What is the interval between C and G?", options: ["Perfect 4th", "Major 3rd", "Perfect 5th", "Major 6th"], a: 2 },
                    { q: "What is the step formula for any Major Scale?", options: ["T-S-T-T-S-T-T", "T-T-S-T-T-T-S", "S-T-T-T-S-T-T", "T-T-T-S-T-T-S"], a: 1 },

                    { q: "In any major scale, between which scale degrees do the natural semitones strictly fall?", options: ["1-2 and 4-5", "2-3 and 5-6", "3-4 and 7-8", "4-5 and 6-7"], a: 2 },

                    { q: "How many semitones make up a Major 3rd (e.g. from C to E)?", options: ["2 semitones (1 tone)", "3 semitones", "4 semitones (2 tones)", "5 semitones"], a: 2 },

                ]
            },
            duration: {
                level1Practice: [
                    { q: "How many beats is a Semibreve (Whole Note) worth?", options: ["1", "2", "3", "4"], a: 3 },
                    { q: "If a note is placed above the middle line, which way should its stem point?", options: ["Up on the right", "Down on the left", "Up on the left", "Down on the right"], a: 1 },

            teacherDash() {
                const currentTeacher = app.currentUser ? app.currentUser.name : 'Teacher';
                const db = getAllUserRecords();
                const studentList = Object.keys(db)
                    .map(k => db[k])
                    .filter(rec => rec.currentUser && rec.currentUser.role === 'student');

                const myStudents = studentList.filter(s => (s.currentUser.teacher || '').toLowerCase() === currentTeacher.toLowerCase());
                const displayList = myStudents.length > 0 ? myStudents : studentList;

                // Flatten all test submissions across displaying students
                const allRecentTests = [];
                displayList.forEach(rec => {
                    const u = rec.currentUser || {};
                    const results = Array.isArray(rec.testResults) ? rec.testResults : [];
                    results.forEach(res => {
                        allRecentTests.push({
                            studentName: u.name || 'Anonymous',
                            classGroup: u.classGroup || 'N/A',
                            teacher: u.teacher || 'Unassigned',
                            area: res.area || 'General',
                            level: res.level || 1,
                            score: res.score || 0,
                            total: res.total || 0,
                            pct: res.percentage || 0,
                            passed: res.passed,
                            timestamp: res.timestamp || Date.now()

                    };

                const tf = window.teacherFilterState;

                // Apply Class filtering
                let filteredTests = tf.selectedClass === 'ALL' 
                    ? [...allRecentTests] 
                    : allRecentTests.filter(t => t.classGroup === tf.selectedClass);

                let filteredStudents = tf.selectedClass === 'ALL'
                    ? [...displayList]
                    : displayList.filter(s => (s.currentUser.classGroup || 'N/A') === tf.selectedClass);

                // Apply Sorting
                if (tf.sortBy === 'date_desc') {
                    filteredTests.sort((a, b) => b.timestamp - a.timestamp);
                } else if (tf.sortBy === 'date_asc') {
                    filteredTests.sort((a, b) => a.timestamp - b.timestamp);
                } else if (tf.sortBy === 'name_asc') {
                    filteredTests.sort((a, b) => a.studentName.localeCompare(b.studentName));
                } else if (tf.sortBy === 'score_desc') {
                    filteredTests.sort((a, b) => b.pct - a.pct);

                // Ranked students for overall leaderboard display

                    const netWorth = calculateStudentOverallNetWorth(s);
                    const walletTokens = (s.stats && s.stats.tokens) ? Number(s.stats.tokens) : 0;
                    const itemsBought = Array.isArray(s.inventory) ? s.inventory.length : 0;
                    const shopInvestment = netWorth - walletTokens;
                    return {
                        record: s,
                        user: s.currentUser,
                        walletTokens,
                        shopInvestment,
                        itemsBought,
                        netWorth,
                        medal: getTokenMedal(netWorth)
                    };
                }).sort((a, b) => b.netWorth - a.netWorth);

                return `
                <div class="p-8 max-w-7xl mx-auto fade-in pb-20">

                            <div class="text-3xl font-black text-slate-800 mt-1">${filteredStudents.length}</div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span class="text-xs font-bold uppercase text-slate-400">Total Tests Recorded</span>

                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span class="text-xs font-bold uppercase text-slate-400">Tokens Earned (Class Total)</span>
                            <div class="text-3xl font-black text-amber-500 mt-1">${filteredStudents.reduce((acc, s) => acc + (s.stats?.tokens || 0), 0)}</div>
                        </div>
                    </div>

                    <!-- Student Management Roster Panel (Quick Edit / Delete) -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-3">

                                <i class="fa-solid fa-user-gear text-indigo-600"></i>
                                <span>Student Management Roster (Edit / Delete)</span>
                            </h3>

                                        <th class="py-2.5 px-3">Student Name</th>
                                        <th class="py-2.5 px-3">Class</th>
                                        <th class="py-2.5 px-3">Assigned Teacher</th>
                                        <th class="py-2.5 px-3">Wallet Tokens</th>
                                        <th class="py-2.5 px-3 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 font-medium">
                                    ${filteredStudents.length === 0 ? `
                                        <tr>
                                            <td colspan="5" class="py-4 text-center text-slate-400">No students registered yet.</td>
                                        </tr>
                                    ` : filteredStudents.map(rec => {
                                        const u = rec.currentUser || {};
                                        const key = getUserRecordKey(u);
                                        return `
                                        <tr class="hover:bg-slate-50 transition">

                                            <td class="py-2.5 px-3 text-slate-600">${u.teacher || 'Mr B'}</td>
                                            <td class="py-2.5 px-3 font-mono font-bold text-amber-600"><i class="fa-solid fa-coins text-xs mr-1"></i>${rec.stats?.tokens || 0}</td>

                                                    <i class="fa-solid fa-pen-to-square mr-1"></i>Edit

                    <!-- Controls & Filter Toolbar -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">

                        <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200 w-full md:w-auto">

                            <button onclick="window.setTeacherViewMode('student')" class="flex-1 md:flex-none px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${tf.viewMode === 'student' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">

                                <i class="fa-solid fa-users-rectangle mr-1.5"></i> View As Class
                            </button>
                        </div>

                        <!-- Class Filter & Sorting -->
                        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">

                                <label class="text-xs font-bold text-slate-500 uppercase">Class:</label>
                                <select onchange="window.setTeacherFilterClass(this.value)" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-100">
                                    <option value="ALL" ${tf.selectedClass === 'ALL' ? 'selected' : ''}>All Classes</option>
                                    ${uniqueClasses.map(cls => `<option value="${cls}" ${tf.selectedClass === cls ? 'selected' : ''}>${cls}</option>`).join('')}
                                </select>

                            <div class="flex items-center gap-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Sort:</label>
                                <select onchange="window.setTeacherSort(this.value)" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-100">
                                    <option value="date_desc" ${tf.sortBy === 'date_desc' ? 'selected' : ''}>Date (Newest First)</option>
                                    <option value="date_asc" ${tf.sortBy === 'date_asc' ? 'selected' : ''}>Date (Oldest First)</option>
                                    <option value="name_asc" ${tf.sortBy === 'name_asc' ? 'selected' : ''}>Student Name (A-Z)</option>
                                    <option value="score_desc" ${tf.sortBy === 'score_desc' ? 'selected' : ''}>Score (Highest First)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic View Content Based on Selected Tab -->
                    ${tf.viewMode === 'student' ? window.renderStudentDrillDownView(filteredStudents) : 
                      tf.viewMode === 'class' ? window.renderClassGroupView(filteredStudents, filteredTests) : 
                      window.renderSubmissionsTableView(filteredTests)}

                    <!-- Overall Student Leaderboard (Embedded on Teacher Dashboard) -->
                    <div id="overall-student-leaderboard-section" class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm scroll-mt-24 mt-8">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 border-b border-slate-100 pb-4">
                            <div>
                                <h3 class="text-2xl font-black text-slate-900 flex items-center gap-2">
                                    <i class="fa-solid fa-crown text-amber-500"></i>
                                    <span>Overall Student Leaderboard</span>
                                </h3>
                                <p class="text-slate-500 text-xs sm:text-sm font-medium mt-1">
                                    Ranks student values across classes: <strong>Tokens Held + Value of Shop Items Purchased</strong>.
                                </p>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-50 px-3.5 py-1.5 rounded-full border border-slate-200 text-xs font-bold text-slate-600 self-start sm:self-auto">
                                <i class="fa-solid fa-medal text-indigo-600"></i>
                                <span>Medals: 50+ 🥉, 301+ 🥈, 601+ 🥇, 1000+ 💎</span>
                            </div>
                        </div>

                        <!-- Top 10 visible with side scrollbar for remainder -->
                        <div class="overflow-x-auto max-h-[520px] overflow-y-auto pr-1">
                            <table class="w-full text-left text-sm">
                                <thead class="sticky top-0 bg-slate-50 shadow-xs z-10">
                                    <tr class="text-slate-600 font-bold border-b border-slate-200 text-xs uppercase tracking-wider">
                                        <th class="py-3 px-4">Rank</th>
                                        <th class="py-3 px-4">Student</th>
                                        <th class="py-3 px-4">Class</th>
                                        <th class="py-3 px-4 text-center">Medal Tier</th>
                                        <th class="py-3 px-4 text-right">Wallet (Held)</th>
                                        <th class="py-3 px-4 text-right">Shop Purchases</th>
                                        <th class="py-3 px-4 text-right">Total Net Worth</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 font-medium">
                                    ${rankedStudents.length === 0 ? `
                                        <tr>
                                            <td colspan="7" class="py-8 text-center text-slate-400 font-medium">No students registered yet.</td>
                                        </tr>
                                    ` : rankedStudents.map((entry, idx) => `
                                        <tr class="transition hover:bg-slate-50/80">
                                            <td class="py-3.5 px-4 font-black text-slate-400">
                                                ${idx === 0 ? '<span class="text-amber-500 text-base">👑 #1</span>' :
                                                  idx === 1 ? '<span class="text-slate-400 text-base">🥈 #2</span>' :
                                                  idx === 2 ? '<span class="text-amber-700 text-base">🥉 #3</span>' : `#${idx + 1}`}
                                            </td>
                                            <td class="py-3.5 px-4 font-bold text-slate-800">${entry.user.name}</td>
                                            <td class="py-3.5 px-4"><span class="bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded font-bold text-xs">${entry.user.classGroup || 'N/A'}</span></td>
                                            <td class="py-3.5 px-4 text-center">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black border ${entry.medal.badgeClass}">
                                                    <span>${entry.medal.symbol}</span>
                                                    <span>${entry.medal.tier}</span>
                                                </span>
                                            </td>
                                            <td class="py-3.5 px-4 text-right font-mono text-slate-600">
                                                <i class="fa-solid fa-coins text-amber-500 text-xs mr-1"></i>${entry.walletTokens}
                                            </td>
                                            <td class="py-3.5 px-4 text-right font-mono text-slate-600">
                                                ${entry.shopInvestment > 0 ? `<span class="text-emerald-600 font-bold">+${entry.shopInvestment}</span> <span class="text-xs text-slate-400">(${entry.itemsBought} items)</span>` : '<span class="text-slate-400">0</span>'}
                                            </td>
                                            <td class="py-3.5 px-4 text-right font-mono font-black text-indigo-700 text-base">
                                                ${entry.netWorth} pts
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Statistics Modal Container (Expanded Size) -->
                    <div id="teacher-stats-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-6 lg:p-8 overflow-y-auto">
                        <div class="bg-white rounded-3xl max-w-6xl w-full shadow-2xl border border-slate-200 max-h-[95vh] flex flex-col overflow-hidden">
                            <div class="p-6 sm:p-7 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                <div class="flex items-center gap-3.5">
                                    <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-xl shadow-xs">
                                        <i class="fa-solid fa-chart-line"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-2xl font-black text-slate-800">Class &amp; Assessment Statistics</h3>
                                        <p class="text-xs sm:text-sm text-slate-500 font-medium">Detailed aggregate analytics, pass rates, topic performance, and student leader rankings</p>
                                    </div>
                                </div>
                                <button onclick="window.closeStatsModal()" class="w-10 h-10 rounded-full bg-white hover:bg-slate-200 text-slate-500 flex items-center justify-center transition shadow-xs">

                                </button>
                            </div>
                            <div class="p-6 sm:p-8 overflow-y-auto space-y-10" id="teacher-stats-body">
                                ${window.renderStatsTables(displayList, allRecentTests)}

                                <button onclick="window.closeStatsModal()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-8 rounded-xl transition text-sm shadow-sm">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }
        };

        // --- Teacher Markbook Filtering & Stats Helpers ---
        window.setTeacherViewMode = function(mode) {
            if (!window.teacherFilterState) window.teacherFilterState = {};
            window.teacherFilterState.viewMode = mode;
            app.navigate('teacherDash');
        };

        window.setTeacherFilterClass = function(cls) {
            if (!window.teacherFilterState) window.teacherFilterState = {};
            window.teacherFilterState.selectedClass = cls;
            app.navigate('teacherDash');
        };

        window.setTeacherSort = function(sort) {
            if (!window.teacherFilterState) window.teacherFilterState = {};
            window.teacherFilterState.sortBy = sort;
            app.navigate('teacherDash');
        };

        window.openStatsModal = function() {
            const modal = document.getElementById('teacher-stats-modal');
            if (modal) modal.classList.remove('hidden');
        };

        window.closeStatsModal = function() {
            const modal = document.getElementById('teacher-stats-modal');
            if (modal) modal.classList.add('hidden');
        };

        // Submissions Table View (Default)
        window.renderSubmissionsTableView = function(tests) {
            return `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">

                        <span>Recent Test Submissions &amp; Marks</span>

                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200 text-xs uppercase tracking-wider">

                                <th class="py-3.5 px-4">Topic / Area</th>

                                <th class="py-3.5 px-4">Score</th>

                                <th class="py-3.5 px-4">Status</th>

                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="py-3.5 px-4 font-bold text-slate-800">${t.studentName}</td>

        // View as Student: Individual student cards with test breakdown
        window.renderStudentDrillDownView = function(students) {

                    const u = rec.currentUser || {};
                    const st = rec.stats || {};
                    const results = Array.isArray(rec.testResults) ? rec.testResults : [];
                    const avg = results.length > 0 ? Math.round(results.reduce((acc, r) => acc + (r.percentage || 0), 0) / results.length) : 0;
                    const key = getUserRecordKey(u);

                    return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs hover:shadow-md transition relative group">

                                </button>
                                <button onclick="window.openDeleteStudentModal('${key}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="Delete Student">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs text-slate-500 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div><strong>Tests Taken:</strong> ${results.length}</div>
                            <div><strong>Tests Passed:</strong> <span class="text-emerald-600 font-bold">${results.filter(r => r.passed).length}</span></div>
                            <div><strong>Tokens:</strong> <span class="text-amber-500 font-bold">${st.tokens || 0}</span></div>
                            <div><strong>Avg. Mark:</strong> <span class="font-bold ${avg >= 50 ? 'text-emerald-600' : 'text-slate-500'}">${results.length > 0 ? avg + '%' : 'N/A'}</span></div>
                        </div>

            const clsInput = document.getElementById('edit-student-class');

            if (!keyInput || !fnInput || !snInput || !clsInput) return;

            const firstName = fnInput.value.trim();
            const surname = snInput.value.trim();

            const teacher = tchrSelect ? tchrSelect.value : (record.currentUser.teacher || 'Mr B');

            const newFullName = `${firstName} ${surname}`;

            record.currentUser.firstName = firstName;
            record.currentUser.surname = surname;

        // --- Tone.js Audio Synth ---
        let synth = null;
        function initChordSynth() {
            if(!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -6;
            }
        }

        window.playNoteAudio = function(note) {
            if(!synth) initChordSynth();
            Tone.start();
            synth.triggerAttackRelease(note, "0.8n");
        };

        window.playCurrentChord = function() {
            if(!synth) initChordSynth();
            Tone.start();
            const rootEl = document.getElementById('chord-root');
            const catEl = document.getElementById('chord-cat');
            if (!rootEl || !catEl) return;
            const root = rootEl.value;
            const type = catEl.value;
            
            let notes = [];
            if(type === 'major') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else if(type === 'minor') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(3).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote(), Tone.Frequency(`${root}4`).transpose(10).toNote()];

            synth.triggerAttackRelease(notes, "1.5n");
        };

        window.updateChordDisplay = function() {
            const rootEl = document.getElementById('chord-root');
            const catEl = document.getElementById('chord-cat');
            if (!rootEl || !catEl) return;
            const root = rootEl.value;
            const cat = catEl.value;
            let name = `${root} Major`;
            let formula = '1 - 3 - 5';
            
            if(cat === 'minor') { name = `${root} Minor`; formula = '1 - b3 - 5'; }
            if(cat === 'dominant') { name = `${root} Dominant 7`; formula = '1 - 3 - 5 - b7'; }
            
            const nameEl = document.getElementById('display-chord-name');
            const formulaEl = document.getElementById('display-formula');
            const notesEl = document.getElementById('display-notes');

            if (nameEl) nameEl.textContent = name;
            if (formulaEl) formulaEl.textContent = formula;

            try {
                let noteNames = [];
                if(cat === 'major') noteNames = [root, Tone.Frequency(`${root}4`).transpose(4).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];
                else if(cat === 'minor') noteNames = [root, Tone.Frequency(`${root}4`).transpose(3).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];
                else noteNames = [root, Tone.Frequency(`${root}4`).transpose(4).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(10).toNote().slice(0,-1)];
                if (notesEl) notesEl.textContent = noteNames.join(' - ');
            } catch(e) {
                if (notesEl) notesEl.textContent = root + " - ...";
            }
        };

        // --- Pitch Level 2 Lesson 1: Scale Audio & Game Logic ---
        window.playScaleAudio = function(tonic) {
            initChordSynth();
            Tone.start();
            let notes = [];
            if (tonic === 'C') notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
            if (tonic === 'G') notes = ['G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F#5', 'G5'];
            if (tonic === 'F') notes = ['F4', 'G4', 'A4', 'Bb4', 'C5', 'D5', 'E5', 'F5'];

            const now = Tone.now();
            notes.forEach((n, idx) => {
                synth.triggerAttackRelease(n, "0.3n", now + idx * 0.35);
            });
        };

        window.scaleSlurGameState = {
            streak: 0,

        window.startScaleGame = function() {

            const chosenKey = scaleKeys[Math.floor(Math.random() * scaleKeys.length)];
            const scaleObj = state.scales[chosenKey];

            // Pick a random consecutive step pair (0 to 6, giving notes 1-2 up to 7-8)
            const stepIndex = Math.floor(Math.random() * 7);
            const n1 = scaleObj.notes[stepIndex];
            const n2 = scaleObj.notes[stepIndex + 1];

            // Major scale semitones always fall between degrees 3-4 (stepIndex 2) and 7-8 (stepIndex 6)
            const isSemitone = (stepIndex === 2 || stepIndex === 6);
            const expected = isSemitone ? "Semitone" : "Tone";

            state.currentChallenge = {
                scaleKey: chosenKey,
                scaleName: scaleObj.name,

        function renderScaleSlurSVG() {
            const state = window.scaleSlurGameState;
            const container = document.getElementById('scale-slur-svg-container');
            const ch = state.currentChallenge;
            if (!container || !ch) return;

            const startX = 115;
            const spacing = 68;

            let svg = `
                <svg width="680" height="210" viewBox="0 0 680 210" class="max-w-full h-auto select-none overflow-visible">

                    <line x1="25" y1="114" x2="655" y2="114" stroke="#1e293b" stroke-width="2.5"/>
                    <line x1="25" y1="137" x2="655" y2="137" stroke="#1e293b" stroke-width="2.5"/>

                    <!-- Treble Clef -->
                    <text x="35" y="146" font-size="120" font-family="serif" fill="#0f172a">&#119070;</text>
            `;

            // Draw all 8 scale notes
            ch.notes.forEach((note, idx) => {
                const cx = startX + idx * spacing;
                const isTarget = (idx === ch.stepIndex || idx === ch.stepIndex + 1);

                // Middle C Ledger Line
                if (note.ledger) {
                    svg += `<line x1="${cx - 22}" y1="${note.cy}" x2="${cx + 22}" y2="${note.cy}" stroke="#0f172a" stroke-width="3"/>`;
                }

                // Accidental symbol if present
                if (note.accidental) {
                    svg += `<text x="${cx - 24}" y="${note.cy + 6}" font-size="20" font-family="serif" font-weight="bold" fill="#0f172a">${note.accidental}</text>`;
                }

                // Notehead: Uniform styling for all notes (no distinct highlight colour or glow)
                svg += `<ellipse cx="${cx}" cy="${note.cy}" rx="18" ry="11.5" fill="#0f172a"/>`;
            });

            // Slur Arch coordinates between stepIndex and stepIndex + 1
            const x1 = startX + ch.stepIndex * spacing;
            const y1 = ch.n1.cy - 16;
            const x2 = startX + (ch.stepIndex + 1) * spacing;
            const y2 = ch.n2.cy - 16;
            const midX = (x1 + x2) / 2;
            const peakY = Math.min(y1, y2) - 18;

            if (state.answeredSlur) {
                // Completed Slur Arch with T or S label
                const isTone = (state.answeredSlur === "Tone");
                const strokeColor = isTone ? "#2563eb" : "#10b981";
                const strokeWidth = isTone ? "3" : "4";
                const label = isTone ? "T" : "S";

                svg += `
                    <path d="M ${x1} ${y1} Q ${midX} ${peakY} ${x2} ${y2}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round"/>

                `;
            }

            svg += `</svg>`;
            container.innerHTML = svg;
        }

            state.startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

        window.doLocatorDrag = function(e) {
            const state = window.intervalLocatorState;
            if (!state.isDragging || state.isLocked) return;
            e.preventDefault();

            const currentClientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const deltaY = currentClientY - state.startY;
            let targetY = state.currentY + deltaY;

            // Clamp between C5 (y=80) and Middle C (y=150)
            if (targetY < 75) targetY = 75;
            if (targetY > 155) targetY = 155;

            // Snap to nearest 10px pitch step
            const snappedY = Math.round(targetY / 10) * 10;
            if (snappedY !== state.currentY && snappedY >= 80 && snappedY <= 150) {
                state.currentY = snappedY;
                state.startY = currentClientY;
                updateLocatorBlueNote();
            }

            // Snap final and play audio preview
            state.currentY = Math.max(80, Math.min(150, Math.round(state.currentY / 10) * 10));

            const card = state.cards[index];
            const backIcon = cardEl.querySelector('.card-back');

            if (backIcon && frontText) {
                backIcon.classList.add('hidden');

            cardEl.classList.remove('bg-white', 'border-slate-200');

        window.startScoreHuntGame = function() {
            const state = window.scoreHuntState;
            if (!state.completedCounts) state.completedCounts = {};
            state.isLocked = false;

            let availableTargets = [];
            state.targets.forEach(t => {
                if ((state.completedCounts[t.id] || 0) < 2) {
                    availableTargets.push(t);
                }
            });

            // Auto-reset if the game was fully completed and is being restarted
            if (availableTargets.length === 0) {
                state.completedCounts = {};
                availableTargets = [...state.targets];
            }
            
            // Pick a random target but avoid repeating the same one twice in a row if possible
            let next;
            do {
                next = availableTargets[Math.floor(Math.random() * availableTargets.length)];
            } while (state.currentTarget && next.id === state.currentTarget.id && availableTargets.length > 1);

            state.currentTarget = next;
            const targetEl = document.getElementById('score-hunt-target');
            if (targetEl) targetEl.textContent = next.label;
            const fb = document.getElementById('score-hunt-feedback');
            if (fb) fb.textContent = '';
        };

        window.checkScoreHuntAnswer = function(selectedId) {
            const state = window.scoreHuntState;
            const fb = document.getElementById('score-hunt-feedback');
            if (!state.currentTarget || !fb || state.isLocked) return;

            let allDone = state.targets.every(t => (state.completedCounts[t.id] || 0) >= 2);
            if (allDone) return;
            
            state.isLocked = true;

            if (selectedId === state.currentTarget.id) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                
                if (!state.completedCounts) state.completedCounts = {};
                state.completedCounts[selectedId] = (state.completedCounts[selectedId] || 0) + 1;
                
                let extraMsg = '';
                // Award tokens for every streak of 3 in a row
                if (state.streak > 0 && state.streak % 3 === 0) {
                    window.addTokens(10);
                    extraMsg = ' <span class="text-amber-500 ml-2">+10 Tokens!</span>';
                }

                fb.innerHTML = `Correct! That is the ${state.currentTarget.label}!${extraMsg}`;
                fb.className = 'font-bold h-6 text-lg mt-4 text-center text-emerald-600';
                
                const streakEl = document.getElementById('score-hunt-streak');
                const bestEl = document.getElementById('score-hunt-best');
                if (streakEl) streakEl.textContent = state.streak;
                if (bestEl) bestEl.textContent = state.best;
                
                allDone = state.targets.every(t => (state.completedCounts[t.id] || 0) >= 2);
                if (allDone) {
                    setTimeout(() => {
                        const targetEl = document.getElementById('score-hunt-target');
                        if (targetEl) targetEl.textContent = "All Done!";
                        if (fb) {
                            fb.textContent = "Congratulations! You've found every symbol twice!";

                        }
                        state.isLocked = false;
                    }, 1300);
                } else {
                    setTimeout(() => {
                        window.startScoreHuntGame();
                    }, 1300);
                }
            } else {
                state.streak = 0;
                fb.textContent = `Oops! That was not the ${state.currentTarget.label}. Try again!`;
                fb.className = 'font-bold h-6 text-lg mt-4 text-center text-red-500';

                setTimeout(() => {

                    state.isLocked = false;
                }, 1500);
            }
        };

            e.preventDefault();
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const delta = clientY - state.startY;
            let newY = state.currentY + delta;
            if (newY < 40) newY = 40;
            if (newY > 120) newY = 120;
            const groupEl = document.getElementById('stem-game-group');
            if (groupEl) groupEl.setAttribute('transform', `translate(0, ${newY})`);
        };

            const state = window.stemGameState;
            if (!state.isDragging) return;
            state.isDragging = false;
            const clientY = e.type.includes('touch') ? (e.changedTouches ? e.changedTouches[0].clientY : state.startY) : e.clientY;
            const delta = clientY - state.startY;
            let finalY = state.currentY + delta;
            finalY = Math.max(40, Math.min(120, Math.round(finalY / 10) * 10));

        let drumKickSynth = null;

        function initDrums() {
            if (!drumKickSynth) {

            }

                const isCrotchet = type === 'crotchet';

                return `

            }).join('');

        window.toggleDrumStepType = function(idx) {

            playDrumHit(idx, true);

        function playDrumHit(stepIdx, singleOnly = false) {
            initDrums();
            Tone.start();
            const isKick = stepIdx % 2 === 0;
            const isCrotchet = window.quaverDrumState.pattern[stepIdx] === 'crotchet';
            const now = Tone.now();

            if (isKick) {
                drumKickSynth.triggerAttackRelease("C1", "8n", now);
                if (!isCrotchet && !singleOnly) {
                    drumKickSynth.triggerAttackRelease("C1", "8n", now + 0.24);
                }
            } else {
                drumSnareSynth.triggerAttackRelease("8n", now);
                if (!isCrotchet && !singleOnly) {
                    drumSnareSynth.triggerAttackRelease("8n", now + 0.24);
                }
            }
        }

                state.isPlaying = true;

                const btn = document.getElementById('quaver-drum-play-btn');

                    playDrumHit(step);
                    state.currentBeatIndex++;

            const state = window.dictationGameState;
            const targetPattern = [];
            for (let i = 0; i < 8; i++) {
                targetPattern.push(Math.random() > 0.5 ? 'crotchet' : 'quaver');
            }
            state.currentPattern = targetPattern;

            const patternToString = (p) => p.join('-');
            const targetStr = patternToString(targetPattern);
            const generated = new Set();
            generated.add(targetStr);

            const options = [targetPattern];

            // Generate 3 unique distractor patterns
            let safety = 0;
            while (options.length < 4 && safety < 100) {
                safety++;
                const p = [...targetPattern];
                // Mutate 1 to 3 random beats
                const flipCount = Math.floor(Math.random() * 3) + 1;
                for (let k = 0; k < flipCount; k++) {
                    const idx = Math.floor(Math.random() * 8);
                    p[idx] = p[idx] === 'crotchet' ? 'quaver' : 'crotchet';
                }
                const pStr = patternToString(p);
                if (!generated.has(pStr)) {
                    generated.add(pStr);
                    options.push(p);
                }
            }

            // Fallback if not enough unique mutations
            while (options.length < 4) {
                const p = [];
                for (let i = 0; i < 8; i++) p.push(Math.random() > 0.5 ? 'crotchet' : 'quaver');
                options.push(p);
            }

            options.sort(() => Math.random() - 0.5);
            state.options = options;

            const optsContainer = document.getElementById('dictation-options-container');
            const fb = document.getElementById('dictation-feedback');
            if (fb) fb.textContent = '';

            if (optsContainer) {
                optsContainer.innerHTML = options.map((opt, optIdx) => `
                    <div onclick="checkDictationAnswer(${optIdx})" class="p-3.5 sm:p-4 bg-white border-2 border-slate-200 hover:border-amber-400 rounded-2xl cursor-pointer transition shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3 group">
                        <span class="w-9 h-9 rounded-xl bg-slate-100 group-hover:bg-amber-100 group-hover:text-amber-800 text-slate-700 font-black text-base flex items-center justify-center flex-shrink-0 transition">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-center sm:justify-start">
                            ${opt.map((item, b) => {
                                const beatNum = b + 1;
                                const isOdd = beatNum % 2 !== 0; // Odd beats (1, 3, 5, 7) = Kick (Blue), Even beats (2, 4, 6, 8) = Snare (Red)
                                const isCrotchet = item === 'crotchet';

                                const colorClass = isOdd 
                                    ? 'bg-blue-50 text-blue-700 border-blue-200' 
                                    : 'bg-rose-50 text-rose-700 border-rose-200';

                                return `
                                <div class="flex flex-col items-center justify-center w-11 sm:w-12 py-1.5 rounded-xl border ${colorClass} select-none">

        window.startVoltaGame = function() {
            const state = window.voltaGameState;
            let next;
            do {
                next = state.pool[Math.floor(Math.random() * state.pool.length)];
            } while (state.currentQ && next.prompt === state.currentQ.prompt && state.pool.length > 1);
            state.currentQ = next;
            const q = state.currentQ;

            const promptEl = document.getElementById('volta-q-prompt');
            const scoreEl = document.getElementById('volta-score-display');
            const optsContainer = document.getElementById('volta-options-container');
            const fb = document.getElementById('volta-feedback');

            if (promptEl) promptEl.textContent = `Sequence for: ${q.prompt}`;
            if (scoreEl) scoreEl.innerHTML = q.svg;
            if (fb) fb.textContent = '';

            // Randomize option positions
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            if (optsContainer) {
                optsContainer.innerHTML = shuffledOptions.map(opt => `
                    <button onclick="checkVoltaAnswer('${opt}')" class="bg-white border-2 border-slate-200 hover:border-purple-400 hover:bg-purple-50 text-slate-800 font-extrabold py-3.5 px-4 rounded-xl transition text-base shadow-sm">
                        ${opt}
                    </button>
                `).join('');
            }
        };

        window.checkVoltaAnswer = function(chosen) {
            const state = window.voltaGameState;
            const q = state.currentQ;
            const fb = document.getElementById('volta-feedback');
            if (!q || !fb) return;

            if (chosen === q.ans) {
                state.streak++;
                if (state.streak > state.best) state.best = state.streak;
                window.addTokens(5);
                fb.textContent = `Correct! ${q.ans}`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-emerald-600";
                document.getElementById('volta-streak').textContent = state.streak;
                document.getElementById('volta-best').textContent = state.best;
                setTimeout(window.startVoltaGame, 1200);
            } else {
                state.streak = 0;
                document.getElementById('volta-streak').textContent = state.streak;
                fb.textContent = `Incorrect! The correct sequence is ${q.ans}.`;
                fb.className = "font-bold h-6 text-lg mt-5 text-center text-red-500";
            }
        };

                if(btn) {
                    btn.classList.remove('bg-pink-100', 'border-pink-500', 'text-pink-800');

                }
            }

        window.playTextureGame1Audio = function() {
            const state = window.textureGame1State;
            if (state.isPlaying) return;
            const q = state.currentQ;
            if (!q) return;

            if (!synth) initChordSynth();
            Tone.start();

            state.isPlaying = true;
            let step = 0;
            const loop = setInterval(() => {
                if (step >= 4) {
                    clearInterval(loop);
                    state.isPlaying = false;
                    return;
                }
                const idx = step % 4;
                const notesToTrigger = [];
                const allLayers = window.textureLabState.layers;
                q.layers.forEach(lid => {
                    const l = allLayers.find(x => x.id === lid);
                    if (l) {
                        if (l.id === 'bass' && idx === 0) notesToTrigger.push('C2');
                        if (l.id === 'pad' && (idx === 0 || idx === 2)) notesToTrigger.push(...l.notes);
                        if (l.pattern && l.pattern[idx]) notesToTrigger.push(l.pattern[idx]);
                    }
                });
                if (notesToTrigger.length > 0 && synth) synth.triggerAttackRelease(notesToTrigger, "0.45n");
                step++;
            }, 500);
        };

        window.checkTextureGame1 = function() {
            const state = window.textureGame1State;
            const q = state.currentQ;
            const fb = document.getElementById('tex-game1-feedback');
            if (!q || !fb) return;

            // Check if arrays match regardless of order
            const isCorrect = q.layers.length === state.userGuess.length && q.layers.every(l => state.userGuess.includes(l));

            if (isCorrect) {
                state.streak++;

        window.playTextureGame2Audio = function() {
            const state = window.textureGame2State;
            if (state.isPlaying) return;

                    if (l) {

                        if (l.id === 'cello' && idx === 0) notesToTrigger.push('A2', 'E2');
                        if (l.pattern && l.pattern[idx]) notesToTrigger.push(l.pattern[idx]);

        window.checkTextureGame2 = function() {

        // --- Authentication & Submission Handlers ---
        window.loginRole = 'student';

            const classContainer = document.getElementById('classContainer');
            const nameFields = document.getElementById('nameFieldsContainer');
            const teacherSelect = document.getElementById('teacherSelectContainer');
            const teacherLabel = document.getElementById('teacherSelectLabel');

            if (roleStudent && roleTeacher) {
                if (role === 'student') {
                    roleStudent.className = 'bg-white shadow-sm text-blue-600 rounded-xl py-2.5 font-bold transition';
                    roleTeacher.className = 'text-slate-500 hover:text-slate-800 rounded-xl py-2.5 font-bold transition';
                    if (classContainer) classContainer.classList.remove('hidden');

        window.handleLogin = function() {
            const role = window.loginRole || 'student';
            const teacherChoice = document.getElementById('login-teacher')?.value || 'Mr B';

            if (role === 'teacher') {
                const pass = document.getElementById('login-passcode')?.value;
                if (pass !== 'Rocky') {
                    document.getElementById('login-error')?.classList.remove('hidden');
                    return;
                }
                app.currentUser = { name: teacherChoice, role: 'teacher', classGroup: 'Staff', teacher: teacherChoice };
            } else {
                const firstName = document.getElementById('login-firstname')?.value.trim();
                const surname = document.getElementById('login-surname')?.value.trim();
                if (!firstName || !surname) return;
                const studentClass = document.getElementById('login-class')?.value.trim() || '7A';
                const fullName = `${firstName} ${surname}`;
                app.currentUser = { 
                    name: fullName, 
                    firstName, 
                    surname, 
                    role: 'student', 
                    classGroup: studentClass, 
                    teacher: teacherChoice 
                };
            }

            // Look up existing profile for this specific user or initialise clean progress
            const userKey = getUserRecordKey(app.currentUser);
            const existingRecord = loadUserState(userKey);

            if (!existingRecord) {
                // New user: fresh state
                state.stats = { completedTests: 0, avgScore: 0, tokens: 0 };
                state.inventory = [];
                state.testResults = [];
            }

            saveUserState();

            if (app.currentUser.role === 'teacher') {
                app.navigate('teacherDash');
            } else {
                app.navigate('studentDash');
            }
        };

        window.logout = function() {
            // Save current progress before logout
            saveUserState();
            app.currentUser = null;
            state.stats = { completedTests: 0, avgScore: 0, tokens: 0 };
            state.inventory = [];
            state.testResults = [];
            try {
                // Clear active session pointer so next session starts at login screen
                localStorage.removeItem(SESSION_STORAGE_KEY);
            } catch (e) {}
            app.navigate('login');
        };

        window.getTeacherSpreadsheetUrl = function() {

        };

        // Smooth scroll shortcut to Overall Student Leaderboard (Works in both student and teacher modes)
        window.scrollToStudentLeaderboard = function() {
            if (!app.currentUser) return;
            const targetDash = app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash';
            const el = document.getElementById('overall-student-leaderboard-section');
            if (!el) {
                app.navigate(targetDash);
                setTimeout(() => {
                    const target = document.getElementById('overall-student-leaderboard-section');
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        window.selectQuizOption = function(idx) {
            if (window.quizState) {
                window.quizState.selectedOption = idx;
                app.navigate('testModule');
            }
        };

        window.exitQuizToLevel = function(area, level) {
            // Clear and reset the quiz/test state completely
            window.quizState = null;
            app.navigate('levelHub', { area, level });
        };

        window.submitQuizAnswer = function() {
            if (!window.quizState || window.quizState.selectedOption === null) return;
            const stateObj = window.quizState;
            const q = stateObj.questions[stateObj.currentIndex];
            stateObj.userAnswers.push(stateObj.selectedOption);
            if (stateObj.selectedOption === q.a) {
                stateObj.score++;
                window.addTokens(10);
            }
            stateObj.currentIndex++;
            stateObj.selectedOption = null;

            if (stateObj.currentIndex >= stateObj.questions.length) {
                stateObj.finished = true;
                if (stateObj.type === 'test') {
                    const pct = Math.round((stateObj.score / stateObj.questions.length) * 100);
                    const isPass = pct >= 50;

                    if (!Array.isArray(state.testResults)) state.testResults = [];
                    state.testResults.push({
                        area: stateObj.area,
                        level: stateObj.level,
                        score: stateObj.score,
                        total: stateObj.questions.length,
                        percentage: pct,
                        passed: isPass,
                        timestamp: Date.now()
                    });

                    state.stats.completedTests = (state.stats.completedTests || 0) + 1;
                    saveUserState();
                }
            }
            app.navigate('testModule');
        };

        window.addTokens = function(amount) {
            state.stats.tokens += amount;
            saveUserState();
            const tokenEl = document.getElementById('nav-tokens');
            if (tokenEl) {
                tokenEl.textContent = state.stats.tokens;
                tokenEl.classList.add('scale-125', 'text-amber-600');
                setTimeout(() => {
                    tokenEl.classList.remove('scale-125', 'text-amber-600');
                }, 300);
            }
            if (window.updateGlobalLeaderboard) {
                window.updateGlobalLeaderboard();
            }
        };

        window.buyItem = function(id, cost) {
            if (state.stats.tokens >= cost && !state.inventory.includes(id)) {
                state.stats.tokens -= cost;
                state.inventory.push(id);
                saveUserState();
                const tokenEl = document.getElementById('nav-tokens');
                if (tokenEl) tokenEl.textContent = state.stats.tokens;
                if (window.updateGlobalLeaderboard) {
                    window.updateGlobalLeaderboard();
                }
                app.navigate('shop');
            }
        };

        // --- App Bootstrapping ---
        window.onload = () => {
            const savedData = loadUserState();
            if (app.currentUser) {
                // If user was previously logged in, resume their dashboard
                app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
            } else {
                app.navigate('login');
            }
        };
    </script>
