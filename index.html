                            <option value="7G">7G</option>
                            <option value="7H">7H</option>
                            <option value="7I">7I</option>
                            <option value="7J">7J</option>
                        </optgroup>
                        <optgroup label="Year 8">
                            <option value="8A">8A</option>
                            <option value="8B">8B</option>
                            <option value="8C">8C</option>
                            <option value="8D">8D</option>
                            <option value="8E">8E</option>
                            <option value="8F">8F</option>
                            <option value="8G">8G</option>
                            <option value="8H">8H</option>
                            <option value="8I">8I</option>
                            <option value="8J">8J</option>
                        </optgroup>
                        <optgroup label="Senior Years">
                            <option value="Yr 9">Yr 9</option>
                            <option value="Yr 10">Yr 10</option>
                            <option value="Yr 11">Yr 11</option>
                            <option value="Yr 12">Yr 12</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Assigned Teacher</label>
                    <select id="edit-student-teacher" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        <option value="Mr B">Mr B</option>
                        <option value="Mr H">Mr H</option>
                        <option value="Mr T">Mr T</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Wallet Tokens</label>
                    <input type="number" id="edit-student-tokens" min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-amber-600 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                </div>
            </div>
            <div class="p-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="window.closeEditStudentModal()" class="px-4 py-2 rounded-xl text-slate-600 font-bold text-sm hover:bg-slate-200 transition">Cancel</button>
                <button onclick="window.saveEditedStudent()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="delete-student-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full shadow-2xl border border-slate-200 overflow-hidden fade-in text-center p-6">
            <input type="hidden" id="delete-student-key" />
            <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="font-black text-slate-800 text-xl mb-2">Delete Student Account?</h3>
            <p class="text-sm text-slate-500 mb-6">
                Are you sure you want to permanently delete <strong id="delete-student-name" class="text-slate-800">this student</strong>? All their completed tests, token wallet, and inventory will be removed.
            </p>
            <div class="flex gap-3 justify-center">
                <button onclick="window.closeDeleteStudentModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-100 transition">Cancel</button>
                <button onclick="window.confirmDeleteStudent()" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm shadow-sm transition">Delete</button>
            </div>
        </div>
    </div>
</body>
</html>
