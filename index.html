  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

    window.leaderboardFilters = { timeframe: 'overall', classGroup: 'ALL' };

    function getAllUserRecords() {
      let localDb = {};
      try {
        const raw = localStorage.getItem('boncepts_users_db');
        if (raw) localDb = JSON.parse(raw);
      } catch (e) {}

      const merged = { ...localDb };
      if (window.cachedCloudUsers && typeof window.cachedCloudUsers === 'object') {
        Object.keys(window.cachedCloudUsers).forEach(k => {
          merged[k] = {
            ...(merged[k] || {}),
            ...window.cachedCloudUsers[k]
          };
        });
      }
      return merged;
    }

    function getDeduplicatedStudents() {
      const all = getAllUserRecords();
      return Object.values(all).filter(u => u && u.role === 'student' && u.firstName);
    }

    function saveUserState() {
      if (!window.app.currentUser) return;
      const u = window.app.currentUser;
      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(u));
      } catch (e) {}

      if (u.role === 'student') {
        const record = {
          key: u.key,
          firstName: u.firstName,
          surname: u.surname,
          class: u.class,
          teacher: u.teacher,
          role: 'student',
          stats: window.state.stats || { tokens: 10, testsTaken: 0 },
          inventory: window.state.inventory || [],
          testHistory: window.state.testHistory || [],
          completedLessons: window.state.completedLessons || [],
          avatar: window.state.avatar || { bg: '#c7d2fe', head: 'round', eyes: 'normal', mouth: 'smile', headwear: 'headphones' }
        };
        try {
          const db = getAllUserRecords();
          db[u.key] = record;
          localStorage.setItem('boncepts_users_db', JSON.stringify(db));
        } catch (e) {}
        if (window.saveUserRecordToCloud) {
          window.saveUserRecordToCloud(u.key, record);
        }
      }
      updateNavBar();
      updateGlobalLeaderboard();
      refreshLeaderboardTableInPlace();
    }

    function addTokens(amount) {
      if (!window.state.stats) window.state.stats = { tokens: 0, testsTaken: 0 };
      window.state.stats.tokens = Math.max(0, (Number(window.state.stats.tokens) || 0) + Number(amount));
      
      const todayStr = new Date().toLocaleDateString();
      if (!window.state.stats.dailyTokens || window.state.stats.dailyTokens.date !== todayStr) {
        window.state.stats.dailyTokens = { date: todayStr, amount: 0 };
      }
      window.state.stats.dailyTokens.amount += Number(amount);

      saveUserState();
    }

    function updateGlobalLeaderboard() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;
      const students = getDeduplicatedStudents();
      students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));
      if (students.length === 0) {
        ticker.textContent = 'Welcome to The Boncepts of Music! Log in to start earning tokens in interactive music labs.';
        return;
      }
      ticker.innerHTML = students.slice(0, 15).map((s, i) =>
        `<span class="mx-4 font-bold">#${i + 1} ${s.firstName} ${s.surname} (${s.class}): <span class="text-amber-300 font-black">${(s.stats && s.stats.tokens) || 0} Tokens</span></span>`
      ).join(' • ');
    }

    function refreshLeaderboardTableInPlace() {
      const tbody = document.getElementById('overall-leaderboard-tbody');
      if (!tbody) return;
      let students = getDeduplicatedStudents();
      
      const todayStr = new Date().toLocaleDateString();
      const { timeframe, classGroup } = window.leaderboardFilters || { timeframe: 'overall', classGroup: 'ALL' };

      if (classGroup !== 'ALL') {
        students = students.filter(s => s.class === classGroup);
      }

      if (timeframe === 'daily') {
        students = students.filter(s => s.stats && s.stats.dailyTokens && s.stats.dailyTokens.date === todayStr && s.stats.dailyTokens.amount > 0);
        students.sort((a, b) => b.stats.dailyTokens.amount - a.stats.dailyTokens.amount);
      } else {
        students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));
      }

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400 text-xs">No students found for this leaderboard filter. Log in and play to appear here!</td></tr>`;
        return;
      }
      tbody.innerHTML = students.map((s, idx) => {
        const toks = timeframe === 'daily' ? s.stats.dailyTokens.amount : ((s.stats && s.stats.tokens) || 0);
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-black text-slate-700">${medal}</td>
            <td class="px-4 py-3 font-bold text-slate-800">
              <div class="flex items-center gap-2">
                ${renderAvatarSVG(s.avatar, 'w-7 h-7')}
                <span>${s.firstName} ${s.surname}</span>
              </div>
            </td>
            <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700">${s.class}</span></td>
            <td class="px-4 py-3 text-right font-black text-amber-600"><i class="fa-solid fa-coins text-amber-400 mr-1"></i>${toks}</td>
          </tr>
        `;
      }).join('');
    }

    // ==========================================
    // WEB AUDIO SYNTHESIZER & ENGRAVED NOTATION HELPERS
    // ==========================================
    let sharedAudioCtx = null;
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playTonePitch(freq = 440, duration = 0.3, gainLevel = 0.3, waveType = 'triangle') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(gainLevel, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function playDrumSound(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'kick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(145, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.22);
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'snare') {
          const bufferSize = ctx.sampleRate * 0.16;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 900;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.16);
        } else {
          const bufferSize = ctx.sampleRate * 0.06;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 6500;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.055);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.06);
        }
      } catch (e) {}
    }

    function setupTimbreRound() {
      const randIdx = Math.floor(Math.random() * timbreInstruments.length);
      timbreGameState.target = timbreInstruments[randIdx];
      timbreGameState.options = [...timbreInstruments].sort(() => Math.random() - 0.5);
      timbreGameState.answered = false;
      timbreGameState.lastCorrect = false;
      timbreGameState.audioPlayed = false;
    }

    function mountEmbeddedTimbreSoundboard(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      timbreGameState = { round: 1, totalRounds: 10, score: 0, target: null, options: [], answered: false, lastCorrect: false, completed: false, audioPlayed: false };
      setupTimbreRound();
      renderTimbreSoundboardUI(target);

    function playTimbreMystery() {
      if (!timbreGameState.target) return;
      timbreGameState.audioPlayed = true;
      playTimbreInstrument(timbreGameState.target.id);
      renderTimbreSoundboardUI(document.getElementById('embedded-tool-container'));
    }

    function handleTimbreDragStart(e, id) {
      if (e && e.dataTransfer) {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleTimbreDrop(event) {
      if (event) {
        event.preventDefault();
        event.currentTarget.classList.remove('border-emerald-400', 'bg-emerald-950/40');
      }
      const st = timbreGameState;
      if (st.answered || st.completed) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the mystery instrument before guessing!', false); return; }
      
      let droppedId = null;
      if (event && event.dataTransfer) {
        droppedId = event.dataTransfer.getData('text/plain');
      }
      if (!droppedId) return;

      st.answered = true;
      st.lastCorrect = (st.target.id === droppedId);
      
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderTimbreSoundboardUI(document.getElementById('embedded-tool-container'));
    }

    function playTimbreInstrument(id) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      if (id === 'violin') {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, now); 
        const lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(5.5, now); 
        const lfoGain = ctx.createGain();
        lfoGain.gain.setValueAtTime(4, now); 
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2500, now);
        osc.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.15); 
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        osc.start(now); lfo.start(now);
        osc.stop(now + 1.25); lfo.stop(now + 1.25);
      } else if (id === 'trumpet') {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(466.16 * 0.95, now); 
        osc.frequency.exponentialRampToValueAtTime(466.16, now + 0.05); 
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.linearRampToValueAtTime(4000, now + 0.1); 
        osc.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
        osc.start(now);
        osc.stop(now + 0.85);
      } else if (id === 'doublebass') {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(65.41, now); 
        osc.connect(gain);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.6, now + 0.02); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.start(now);
        osc.stop(now + 1.6);
      } else if (id === 'harp') {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); 
        osc.connect(gain);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.01); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
        osc.start(now);
        osc.stop(now + 2.1);
      } else if (id === 'snare') {
        const bufferSize = ctx.sampleRate * 0.2;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 1000;
        noise.connect(noiseFilter);
        noiseFilter.connect(gain);
        const toneOsc = ctx.createOscillator();
        toneOsc.type = 'triangle';
        toneOsc.frequency.setValueAtTime(250, now);
        const toneGain = ctx.createGain();
        toneGain.gain.setValueAtTime(0.4, now);
        toneGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        toneOsc.connect(toneGain);
        toneGain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        noise.start(now);
        toneOsc.start(now);
        noise.stop(now + 0.2);
        toneOsc.stop(now + 0.2);
      } else if (id === 'bassdrum') {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1); 
        osc.connect(gain);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (id === 'xylo') {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(783.99, now); 
        osc.connect(gain);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.6, now + 0.005); 
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); 
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (id === 'chimes') {
        const freqs = [1046.50, 1420, 1850, 2400];
        freqs.forEach(f => {
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          const fGain = ctx.createGain();
          fGain.gain.setValueAtTime(0, now);
          fGain.gain.linearRampToValueAtTime(0.15, now + 0.01);
          fGain.gain.exponentialRampToValueAtTime(0.01, now + 2.5); 
          osc.connect(fGain);
          fGain.connect(gain);
          osc.start(now);
          osc.stop(now + 2.6);
        });
      }
    }

    function playOrchestralString(id, technique = 'arco') {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (id === 'harp') {
        const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        arp.forEach((freq, idx) => {
          const t = now + idx * 0.085;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.28, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 1.35);
        });
        return;
      }

      const profiles = {
        violin: { freq: 659.25, filterFreq: 2800, wave: 'sawtooth', vol: 0.24 },
        viola: { freq: 329.63, filterFreq: 1650, wave: 'sawtooth', vol: 0.28 },
        cello: { freq: 146.83, filterFreq: 950, wave: 'sawtooth', vol: 0.34 },
        doublebass: { freq: 65.41, filterFreq: 380, wave: 'triangle', vol: 0.55 }
      };
      const prof = profiles[id] || profiles.violin;

      if (technique === 'pizzicato') {
        [prof.freq, prof.freq * 1.25, prof.freq * 1.5].forEach((f, idx) => {
          const t = now + idx * 0.22;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f * 1.03, t);
          osc.frequency.exponentialRampToValueAtTime(f, t + 0.03);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(prof.filterFreq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(prof.vol * 1.2, t + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.26);
        });
        return;
      }

      if (technique === 'tremolo') {
        for (let i = 0; i < 10; i++) {
          const t = now + i * 0.085;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(prof.freq, t);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(prof.filterFreq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(prof.vol, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.02, t + 0.08);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.085);
        }
        return;
      }

      // Default: Arco (bowed with warm vibrato)
      const osc = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc.type = prof.wave;
      osc.frequency.setValueAtTime(prof.freq, now);
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(5.2, now);
      lfoGain.gain.setValueAtTime(prof.freq * 0.008, now);
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(prof.filterFreq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(prof.vol, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.25);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      lfo.start(now);
      osc.stop(now + 1.3);
      lfo.stop(now + 1.3);
    }

    function playOrchestralWoodwind(id) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        // Reusable breath/air noise helper for woodwind realism
        const addBreathNoise = (duration, centerFreq, qVal, peakGain, attack = 0.03) => {
          const bufSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
          const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buf;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(centerFreq, now);
          filter.Q.setValueAtTime(qVal, now);
          const nGain = ctx.createGain();
          nGain.gain.setValueAtTime(0.0001, now);
          nGain.gain.linearRampToValueAtTime(peakGain, now + attack);
          nGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + duration + 0.02);
        };

        // Delayed expressive vibrato helper (ramps in naturally after attack)
        const attachDelayedVibrato = (targetFreqParam, rateHz, depthHz, delaySec, stopSec) => {
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(rateHz, now);
          lfoGain.gain.setValueAtTime(0.0001, now);
          lfoGain.gain.setValueAtTime(0.0001, now + delaySec);
          lfoGain.gain.linearRampToValueAtTime(depthHz, now + delaySec + 0.35);
          lfo.connect(lfoGain);
          lfoGain.connect(targetFreqParam);
          lfo.start(now);
          lfo.stop(now + stopSec);
        };

        if (id === 'piccolo') {
          // Piccolo (E6 = 1318.51 Hz): bright pure fundamental + shimmering 2nd harmonic + crisp air chiff
          const dur = 1.25;
          const real = new Float32Array([0, 1.0, 0.28, 0.08, 0.02]);
          const imag = new Float32Array(real.length);
          const wave = ctx.createPeriodicWave(real, imag);

          const osc = ctx.createOscillator();
          osc.setPeriodicWave(wave);
          osc.frequency.setValueAtTime(1310, now);
          osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.035);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(4800, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.045);
          gain.gain.setValueAtTime(0.20, now + dur - 0.25);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(lp);
          lp.connect(gain);
          gain.connect(ctx.destination);

          attachDelayedVibrato(osc.frequency, 6.2, 9.5, 0.16, dur + 0.05);
          addBreathNoise(0.11, 3400, 2.2, 0.06, 0.015); // crisp attack chiff
          addBreathNoise(dur * 0.9, 2800, 1.8, 0.018, 0.08); // airy sustain

          osc.start(now);
          osc.stop(now + dur + 0.05);

        } else if (id === 'flute') {
          // Concert Flute (G5 = 783.99 Hz): warm airy fundamental + 2nd/3rd harmonics + realistic chiff & breath
          const dur = 1.4;
          const real = new Float32Array([0, 1.0, 0.36, 0.11, 0.03, 0.01]);
          const imag = new Float32Array(real.length);
          const wave = ctx.createPeriodicWave(real, imag);

          const osc = ctx.createOscillator();
          osc.setPeriodicWave(wave);
          osc.frequency.setValueAtTime(777, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.055);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(2600, now);
          lp.frequency.linearRampToValueAtTime(2100, now + dur);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.30, now + 0.11);
          gain.gain.setValueAtTime(0.28, now + dur - 0.3);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(lp);
          lp.connect(gain);
          gain.connect(ctx.destination);

          attachDelayedVibrato(osc.frequency, 5.4, 6.0, 0.22, dur + 0.05);
          addBreathNoise(0.14, 1950, 2.0, 0.09, 0.02); // classic flute onset chiff
          addBreathNoise(dur * 0.95, 1650, 1.4, 0.025, 0.12); // continuous silky air stream

          osc.start(now);
          osc.stop(now + dur + 0.05);

        } else if (id === 'oboe') {
          // Oboe (A4 = 440 Hz): double-reed nasal formant peaks (~1250 Hz & ~2750 Hz) + focused expressive vibrato
          const dur = 1.4;
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(436, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.04);

          // Parallel double-reed formant resonators
          const formant1 = ctx.createBiquadFilter();
          formant1.type = 'bandpass';
          formant1.frequency.setValueAtTime(1250, now);
          formant1.Q.setValueAtTime(3.2, now);

          const formant2 = ctx.createBiquadFilter();
          formant2.type = 'bandpass';
          formant2.frequency.setValueAtTime(2750, now);
          formant2.Q.setValueAtTime(4.2, now);

          const bodyLp = ctx.createBiquadFilter();
          bodyLp.type = 'lowpass';
          bodyLp.frequency.setValueAtTime(900, now);

          const f1Gain = ctx.createGain(); f1Gain.gain.value = 0.72;
          const f2Gain = ctx.createGain(); f2Gain.gain.value = 0.32;
          const bodyGain = ctx.createGain(); bodyGain.gain.value = 0.18;

          const master = ctx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.45, now + 0.065);
          master.gain.setValueAtTime(0.40, now + dur - 0.25);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(formant1); formant1.connect(f1Gain); f1Gain.connect(master);
          osc.connect(formant2); formant2.connect(f2Gain); f2Gain.connect(master);
          osc.connect(bodyLp); bodyLp.connect(bodyGain); bodyGain.connect(master);
          master.connect(ctx.destination);

          attachDelayedVibrato(osc.frequency, 5.8, 3.8, 0.20, dur + 0.05);
          addBreathNoise(0.07, 1500, 3.0, 0.035, 0.01); // subtle double-reed articulation

          osc.start(now);
          osc.stop(now + dur + 0.05);

        } else if (id === 'clarinet') {
          // Clarinet (D4 = 293.66 Hz): cylindrical closed-pipe acoustics (strong odd harmonics, minimal even harmonics)
          const dur = 1.4;
          const real = new Float32Array([0, 1.0, 0.04, 0.68, 0.03, 0.36, 0.02, 0.16, 0.01, 0.07]);
          const imag = new Float32Array(real.length);
          const wave = ctx.createPeriodicWave(real, imag);

          const osc = ctx.createOscillator();
          osc.setPeriodicWave(wave);
          osc.frequency.setValueAtTime(292, now);
          osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.03);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(1650, now);
          lp.frequency.exponentialRampToValueAtTime(1050, now + 0.25);
          lp.Q.setValueAtTime(1.2, now);

          // Woody chalumeau warmth boost
          const bodyPeak = ctx.createBiquadFilter();
          bodyPeak.type = 'peaking';
          bodyPeak.frequency.setValueAtTime(920, now);
          bodyPeak.Q.setValueAtTime(2.0, now);
          bodyPeak.gain.setValueAtTime(4.5, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.36, now + 0.055);
          gain.gain.setValueAtTime(0.33, now + dur - 0.28);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(lp);
          lp.connect(bodyPeak);
          bodyPeak.connect(gain);
          gain.connect(ctx.destination);

          attachDelayedVibrato(osc.frequency, 4.9, 1.8, 0.30, dur + 0.05);
          addBreathNoise(0.08, 1200, 2.5, 0.03, 0.01); // soft single-reed onset

          osc.start(now);
          osc.stop(now + dur + 0.05);

        } else if (id === 'bassoon') {
          // Bassoon (G2 = 98.00 Hz): deep woody double-reed formants (~480 Hz body & ~1150 Hz reed buzz)
          const dur = 1.5;
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(96.8, now);
          osc.frequency.exponentialRampToValueAtTime(98.00, now + 0.045);

          // Fundamental reinforcement for warm low-end weight
          const subOsc = ctx.createOscillator();
          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(98.00, now);
          const subGain = ctx.createGain();
          subGain.gain.value = 0.28;

          const formant1 = ctx.createBiquadFilter();
          formant1.type = 'bandpass';
          formant1.frequency.setValueAtTime(480, now);
          formant1.Q.setValueAtTime(2.8, now);

          const formant2 = ctx.createBiquadFilter();
          formant2.type = 'bandpass';
          formant2.frequency.setValueAtTime(1150, now);
          formant2.Q.setValueAtTime(3.6, now);

          const f1Gain = ctx.createGain(); f1Gain.gain.value = 0.85;
          const f2Gain = ctx.createGain(); f2Gain.gain.value = 0.35;

          const master = ctx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.55, now + 0.07);
          master.gain.setValueAtTime(0.48, now + dur - 0.3);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(formant1); formant1.connect(f1Gain); f1Gain.connect(master);
          osc.connect(formant2); formant2.connect(f2Gain); f2Gain.connect(master);
          subOsc.connect(subGain); subGain.connect(master);
          master.connect(ctx.destination);

          attachDelayedVibrato(osc.frequency, 4.8, 1.2, 0.28, dur + 0.05);
          addBreathNoise(0.08, 650, 2.5, 0.04, 0.015); // crisp wooden reed attack

          osc.start(now);
          subOsc.start(now);
          osc.stop(now + dur + 0.05);
          subOsc.stop(now + dur + 0.05);
        }
      } catch (e) {}
    }

    let orchestralWoodwindsState = { round: 1, totalRounds: 8, score: 0, target: null, answered: false, lastCorrect: false, completed: false, audioPlayed: false };

    function setupOrchestralWoodwindsRound() {
      orchestralWoodwindsState.target = orchestralWoodwindsCatalog[Math.floor(Math.random() * orchestralWoodwindsCatalog.length)];
      orchestralWoodwindsState.answered = false;
      orchestralWoodwindsState.lastCorrect = false;
      orchestralWoodwindsState.audioPlayed = false;
    }

    function mountEmbeddedOrchestralWoodwindsLab(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      orchestralWoodwindsState = { round: 1, totalRounds: 8, score: 0, target: null, answered: false, lastCorrect: false, completed: false, audioPlayed: false };
      setupOrchestralWoodwindsRound();
      renderOrchestralWoodwindsLabUI(target);
    }

    function playOrchestralWoodwindsMystery() {
      if (!orchestralWoodwindsState.target) return;
      orchestralWoodwindsState.audioPlayed = true;
      playOrchestralWoodwind(orchestralWoodwindsState.target.id);
      renderOrchestralWoodwindsLabUI(document.getElementById('embedded-tool-container'));
    }

    function guessOrchestralWoodwind(instId) {
      const st = orchestralWoodwindsState;
      if (st.answered || st.completed) return;
      if (!st.audioPlayed) {
        showAppModal('Listen First', 'Click "Play Mystery Woodwind Sound" before making your guess!', false);
        return;
      }
      st.answered = true;
      st.lastCorrect = (st.target.id === instId);
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderOrchestralWoodwindsLabUI(document.getElementById('embedded-tool-container'));
    }

    function nextOrchestralWoodwindsRound() {
      const st = orchestralWoodwindsState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupOrchestralWoodwindsRound();
        renderOrchestralWoodwindsLabUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderOrchestralWoodwindsLabUI(document.getElementById('embedded-tool-container'));
        showAppModal('Woodwind Ear Detective Complete!', `You identified ${st.score}/${st.totalRounds} woodwind instruments and earned +${st.score} Tokens!`, st.score >= 4);
      }
    }

    function playOrchestralBrass(id) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        const profiles = {
          trumpet:    { freq: 466.16, startCutoff: 750,  peakCutoff: 3600, sustainCutoff: 2400, dur: 1.15, vol: 0.30, vibRate: 5.6, vibDepth: 3.2 },
          frenchhorn: { freq: 174.61, startCutoff: 320,  peakCutoff: 1350, sustainCutoff: 900,  dur: 1.35, vol: 0.36, vibRate: 4.8, vibDepth: 1.3 },
          trombone:   { freq: 116.54, startCutoff: 280,  peakCutoff: 1800, sustainCutoff: 1150, dur: 1.30, vol: 0.38, vibRate: 4.9, vibDepth: 1.0 },
          tuba:       { freq: 58.27,  startCutoff: 140,  peakCutoff: 560,  sustainCutoff: 360,  dur: 1.45, vol: 0.52, vibRate: 4.2, vibDepth: 0.5 }
        };
        const p = profiles[id] || profiles.trumpet;

        // Primary rich brass oscillator + slightly detuned unison for ensemble warmth
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';

        // Authentic lip-buzz pitch attack scoop
        osc1.frequency.setValueAtTime(p.freq * 0.985, now);
        osc1.frequency.exponentialRampToValueAtTime(p.freq, now + 0.04);
        osc2.frequency.setValueAtTime(p.freq * 0.988, now);
        osc2.frequency.exponentialRampToValueAtTime(p.freq * 1.003, now + 0.04);

        // Fundamental warmth layer for horn/trombone/tuba
        const subOsc = ctx.createOscillator();
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(p.freq, now);
        const subGain = ctx.createGain();
        subGain.gain.value = id === 'trumpet' ? 0.12 : 0.35;

        // Characteristic brass filter bloom ("bwaah")
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.setValueAtTime(2.0, now);
        filter.frequency.setValueAtTime(p.startCutoff, now);
        filter.frequency.exponentialRampToValueAtTime(p.peakCutoff, now + 0.09);
        filter.frequency.exponentialRampToValueAtTime(p.sustainCutoff, now + 0.35);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(p.vol, now + 0.06);
        gain.gain.setValueAtTime(p.vol * 0.88, now + p.dur - 0.25);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + p.dur);

        // Subtle delayed brass vibrato
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(p.vibRate, now);
        lfoGain.gain.setValueAtTime(0.0001, now);
        lfoGain.gain.setValueAtTime(0.0001, now + 0.22);
        lfoGain.gain.linearRampToValueAtTime(p.vibDepth, now + 0.55);
        lfo.connect(lfoGain);
        lfoGain.connect(osc1.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        subOsc.connect(subGain);
        subGain.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now); osc2.start(now); subOsc.start(now); lfo.start(now);
        osc1.stop(now + p.dur + 0.05);
        osc2.stop(now + p.dur + 0.05);
        subOsc.stop(now + p.dur + 0.05);
        lfo.stop(now + p.dur + 0.05);
      } catch (e) {}
    }

    function startOrchestralBrassChallenge() {
      stopOrchestralBrassLab();
      // Build balanced 8-note queue (each of the 4 brass instruments appears twice, shuffled)
      const queue = [...orchestralBrassCatalog, ...orchestralBrassCatalog].sort(() => Math.random() - 0.5);
      orchestralBrassState = {
        running: true,
        round: 0,
        totalRounds: 8,
        score: 0,
        target: null,
        timeLeftMs: 3000,
        intervalId: null,

        feedback: null,
        completed: false,

      launchNextBrassNote();

    function launchNextBrassNote() {
      const st = orchestralBrassState;
      if (st.intervalId) clearInterval(st.intervalId);
      if (st.nextTimeoutId) clearTimeout(st.nextTimeoutId);

      if (st.round >= st.totalRounds) {
        st.running = false;
        st.roundActive = false;
        st.completed = true;
        renderOrchestralBrassLabUI(document.getElementById('embedded-tool-container'));
        showAppModal('Brass Bell Drop Complete!', `You dropped ${st.score}/${st.totalRounds} notes into the right bells in time and earned +${st.score * 2} Tokens!`, st.score >= 4);
        return;
      }

      st.round++;
      st.target = st.roundQueue[st.round - 1];
      st.timeLeftMs = 3000;
      st.roundActive = true;
      st.feedback = null;

      playOrchestralBrass(st.target.id);
      renderOrchestralBrassLabUI(document.getElementById('embedded-tool-container'));

      const startTime = performance.now();
      st.intervalId = setInterval(() => {
        if (!st.running || !st.roundActive) {
          clearInterval(st.intervalId);
          return;
        }
        const elapsed = performance.now() - startTime;
        st.timeLeftMs = Math.max(0, 3000 - elapsed);

        const barEl = document.getElementById('brass-timer-bar');
        const txtEl = document.getElementById('brass-timer-text');
        if (barEl) {
          const pct = (st.timeLeftMs / 3000) * 100;
          barEl.style.width = `${pct}%`;
          if (pct < 35) {
            barEl.classList.remove('bg-amber-400');
            barEl.classList.add('bg-rose-500');
          }
        }
        if (txtEl) {
          txtEl.textContent = `${(st.timeLeftMs / 1000).toFixed(1)}s`;
        }

        if (st.timeLeftMs <= 0) {
          clearInterval(st.intervalId);
          st.roundActive = false;
          st.feedback = { type: 'timeout', msg: `⏱ Time's up! That note belonged in the ${st.target.name}'s bell.` };
          playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
          renderOrchestralBrassLabUI(document.getElementById('embedded-tool-container'));
          st.nextTimeoutId = setTimeout(launchNextBrassNote, 1300);
        }
      }, 50);
    }

      if (e) {

      const st = orchestralBrassState;
      if (!st.running || !st.roundActive || !st.target) return;

      clearInterval(st.intervalId);
      st.roundActive = false;

      if (st.target.id === instId) {
        st.score++;
        addTokens(2);
        st.feedback = { type: 'correct', msg: `✓ Bullseye into the ${st.target.name}'s bell! (+2 Tokens)` };

        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');

      st.nextTimeoutId = setTimeout(launchNextBrassNote, 1200);

          master.gain.setValueAtTime(0.42, now + dur - 0.32);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(4.5, now);
          lfoGain.gain.setValueAtTime(0.0001, now);
          lfoGain.gain.setValueAtTime(0.0001, now + 0.3);
          lfoGain.gain.linearRampToValueAtTime(0.9, now + 0.65);
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          osc.connect(lp);
          lp.connect(bodyPeak);
          bodyPeak.connect(master);
          subOsc.connect(subGain);
          subGain.connect(master);
          master.connect(ctx.destination);

          addWoodwindNoise(0.09, 680, 2.2, 0.035, 0.015);

          osc.start(now); subOsc.start(now); lfo.start(now);
          osc.stop(now + dur + 0.05);
          subOsc.stop(now + dur + 0.05);
          lfo.stop(now + dur + 0.05);
          return;
        }

        if (inst.id === 'cor_anglais') {
          // Cor Anglais / English Horn (D4 = 293.66 Hz): melancholic, velvety alto double-reed formants
          const dur = 1.5;
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(290.5, now);
          osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.045);

          const formant1 = ctx.createBiquadFilter();
          formant1.type = 'bandpass';
          formant1.frequency.setValueAtTime(860, now);
          formant1.Q.setValueAtTime(3.0, now);

          const formant2 = ctx.createBiquadFilter();
          formant2.type = 'bandpass';
          formant2.frequency.setValueAtTime(1950, now);
          formant2.Q.setValueAtTime(3.8, now);

          const bodyLp = ctx.createBiquadFilter();
          bodyLp.type = 'lowpass';
          bodyLp.frequency.setValueAtTime(600, now);

          const f1Gain = ctx.createGain(); f1Gain.gain.value = 0.78;
          const f2Gain = ctx.createGain(); f2Gain.gain.value = 0.28;
          const bodyGain = ctx.createGain(); bodyGain.gain.value = 0.26;

          const master = ctx.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.linearRampToValueAtTime(0.48, now + 0.075);
          master.gain.setValueAtTime(0.43, now + dur - 0.3);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(5.3, now);
          lfoGain.gain.setValueAtTime(0.0001, now);
          lfoGain.gain.setValueAtTime(0.0001, now + 0.22);
          lfoGain.gain.linearRampToValueAtTime(2.6, now + 0.55);
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          osc.connect(formant1); formant1.connect(f1Gain); f1Gain.connect(master);
          osc.connect(formant2); formant2.connect(f2Gain); f2Gain.connect(master);
          osc.connect(bodyLp); bodyLp.connect(bodyGain); bodyGain.connect(master);
          master.connect(ctx.destination);

          addWoodwindNoise(0.08, 1050, 2.8, 0.032, 0.012);

          osc.start(now); lfo.start(now);
          osc.stop(now + dur + 0.05);
          lfo.stop(now + dur + 0.05);
          return;
        }

        playTonePitch(inst.freq || 440, 0.55, 0.28, inst.wave || 'triangle');
      } catch (e) {}
    }

    function setupReedClassifierGame() {
      const shuffled = [...woodwindReedPool].sort(() => Math.random() - 0.5);
      woodwindReedState = {
        round: 1,
        totalRounds: 10,
        score: 0,
        queue: shuffled.slice(0, 10),
        current: shuffled[0],
        answered: false,
        selectedReed: null,
        lastCorrect: false,
        completed: false
      };
    }

    function handleReedGuess(reedType) {
      const st = woodwindReedState;
      if (st.answered || st.completed || !st.current) return;

      st.answered = true;
      st.selectedReed = reedType;
      st.lastCorrect = (st.current.reed === reedType);

      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderWoodwindReedGameUI(document.getElementById('embedded-tool-container'));
    }

    function nextReedRound() {
      const st = woodwindReedState;
      if (st.round < st.totalRounds) {
        st.round++;
        st.current = st.queue[st.round - 1];
        st.answered = false;
        st.selectedReed = null;
        st.lastCorrect = false;
        renderWoodwindReedGameUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderWoodwindReedGameUI(document.getElementById('embedded-tool-container'));
        showAppModal(
          'Reed Classifier Complete!',
          `You classified ${st.score} / ${st.totalRounds} woodwind instruments correctly and earned +${st.score} Tokens!`,
          st.score >= 5
        );
      }
    }

    function mountEmbeddedWoodwindReedsGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      setupReedClassifierGame();
      renderWoodwindReedGameUI(target);
    }

              <circle cx="${x}" cy="${y}" r="8.5" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>

    const orchestralPercussionCatalog = [
      { id: 'drum', name: 'Snare Drum', method: 'hit', timbre: 'Crisp, snappy, and rhythmic', hint: 'Struck on the drumhead with wooden drumsticks.' },
      { id: 'cymbal', name: 'Crash Cymbal', method: 'hit', timbre: 'Bright, crashing, metallic shimmer', hint: 'Struck with a mallet or clashed together.' },
      { id: 'woodblock', name: 'Wood Blocks', method: 'hit', timbre: 'Hollow, dry, resonant knock', hint: 'Hollow hardwood block struck with a beater.' },
      { id: 'castanets', name: 'Castanets', method: 'hit', timbre: 'Sharp, dry, rapid wooden clack', hint: 'Two concave shells clapped/struck together.' },
      { id: 'maraca', name: 'Maracas', method: 'shake', timbre: 'Swishing, rhythmic bead rattle', hint: 'Hollow gourds filled with dried seeds.' },
      { id: 'tambourine', name: 'Tambourine', method: 'shake', timbre: 'Bright, sparkling metal jingle', hint: 'Frame lined with pairs of metallic jingles.' },
      { id: 'sleighbells', name: 'Sleigh Bells', method: 'shake', timbre: 'Festive, bright, ringing cluster', hint: 'Handle lined with jingling metal bells.' },
      { id: 'guiro', name: 'Guiro', method: 'scrape', timbre: 'Raspy, notched wooden buzz', hint: 'Stick dragged across carved wooden ridges.' },
      { id: 'cabasa', name: 'Cabasa', method: 'scrape', timbre: 'Metallic, textured bead-chain rasp', hint: 'Steel beads twisted & scraped across a ridged cylinder.' },
      { id: 'sandblocks', name: 'Sandblocks', method: 'scrape', timbre: 'Gritty, swishing sandpaper brush', hint: 'Two sandpaper-lined blocks rubbed across each other.' }
    ];

    function playOrchestralPercussion(id) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        const playNoiseBurst = (startOffset, dur, filterType, freq, qVal, peakGain, attack = 0.004) => {
          const t = now + startOffset;
          const bufSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
          const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
          const src = ctx.createBufferSource();
          src.buffer = buf;
          const flt = ctx.createBiquadFilter();
          flt.type = filterType;
          flt.frequency.setValueAtTime(freq, t);
          if (qVal) flt.Q.setValueAtTime(qVal, t);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(peakGain, t + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(flt);
          flt.connect(g);
          g.connect(ctx.destination);
          src.start(t);
          src.stop(t + dur + 0.02);
        };

        if (id === 'drum') {
          // Crisp Snare Drum hit: membrane thump + snare wire rattle
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(215, now);
          osc.frequency.exponentialRampToValueAtTime(118, now + 0.09);
          g.gain.setValueAtTime(0.55, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.18);
          playNoiseBurst(0, 0.24, 'highpass', 1350, 0.9, 0.55, 0.002);

        } else if (id === 'cymbal') {
          // Crash Cymbal: shimmering metallic inharmonic partials + bright noise tail
          const partials = [311, 467, 633, 811, 1087, 1423, 1879];
          const hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.setValueAtTime(2900, now);
          const master = ctx.createGain();
          master.gain.setValueAtTime(0.001, now);
          master.gain.linearRampToValueAtTime(0.28, now + 0.01);
          master.gain.exponentialRampToValueAtTime(0.0005, now + 1.35);
          hp.connect(master); master.connect(ctx.destination);
          partials.forEach(f => {
            const o = ctx.createOscillator();
            o.type = 'square';
            o.frequency.setValueAtTime(f, now);
            o.connect(hp);
            o.start(now); o.stop(now + 1.4);
          });
          playNoiseBurst(0, 1.3, 'highpass', 4200, 0.7, 0.32, 0.008);

        } else if (id === 'woodblock') {
          // Two-tone hollow Wood Block knocks
          [0, 0.24].forEach((offset, idx) => {
            const t = now + offset;
            const freq = idx === 0 ? 860 : 1120;
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq * 1.06, t);
            o.frequency.exponentialRampToValueAtTime(freq, t + 0.018);
            g.gain.setValueAtTime(0.001, t);
            g.gain.linearRampToValueAtTime(0.55, t + 0.003);
            g.gain.exponentialRampToValueAtTime(0.0005, t + 0.085);
            o.connect(g); g.connect(ctx.destination);
            o.start(t); o.stop(t + 0.095);
            playNoiseBurst(offset, 0.03, 'bandpass', freq * 1.6, 5.5, 0.28, 0.001);
          });

        } else if (id === 'castanets') {
          // Signature rapid Spanish Castanet clack-clack-CLACK
          [0, 0.095, 0.21].forEach((offset, idx) => {
            const t = now + offset;
            const gainBoost = idx === 2 ? 0.58 : 0.42;
            playNoiseBurst(offset, 0.032, 'bandpass', 2150, 4.5, gainBoost, 0.001);
            playNoiseBurst(offset, 0.025, 'bandpass', 3200, 5.0, gainBoost * 0.65, 0.001);
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(1480, t);
            g.gain.setValueAtTime(gainBoost * 0.45, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
            o.connect(g); g.connect(ctx.destination);
            o.start(t); o.stop(t + 0.032);
          });

        } else if (id === 'maraca') {
          // Rhythmic double-shake Maracas ("chika-chika")
          [0, 0.16, 0.34, 0.50].forEach((offset, idx) => {
            const accent = idx % 2 === 0 ? 0.38 : 0.24;
            playNoiseBurst(offset, 0.11, 'bandpass', 5600, 1.8, accent, 0.028);
          });

        } else if (id === 'tambourine') {
          // Shaken Tambourine jingle bursts
          [0, 0.18, 0.36].forEach((offset, idx) => {
            const t = now + offset;
            const dur = idx === 2 ? 0.38 : 0.15;
            playNoiseBurst(offset, dur, 'highpass', 5800, 1.0, 0.26, 0.015);
            [5200, 6750, 8250].forEach(f => {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = 'sine';
              o.frequency.setValueAtTime(f + (Math.random() * 140), t);
              g.gain.setValueAtTime(0.0005, t);
              g.gain.linearRampToValueAtTime(0.075, t + 0.015);
              g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
              o.connect(g); g.connect(ctx.destination);
              o.start(t); o.stop(t + dur + 0.02);
            });
          });

        } else if (id === 'sleighbells') {
          // Festive shaken Sleigh Bells cluster
          [0, 0.18, 0.36].forEach((offset, idx) => {
            const t = now + offset;
            const dur = idx === 2 ? 0.42 : 0.16;
            playNoiseBurst(offset, dur * 0.8, 'bandpass', 6800, 2.2, 0.18, 0.012);
            [2630, 3480, 4690, 5980].forEach(f => {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = 'sine';
              o.frequency.setValueAtTime(f, t);
              g.gain.setValueAtTime(0.0005, t);
              g.gain.linearRampToValueAtTime(0.07, t + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
              o.connect(g); g.connect(ctx.destination);
              o.start(t); o.stop(t + dur + 0.02);
            });
          });

        } else if (id === 'guiro') {
          // Ridged wooden Guiro scrape (slow stroke up + quick stroke down)
          for (let i = 0; i < 11; i++) {
            playNoiseBurst(i * 0.022, 0.02, 'bandpass', 1450 + i * 45, 5.5, 0.34, 0.002);
          }
          for (let j = 0; j < 7; j++) {
            playNoiseBurst(0.36 + j * 0.018, 0.018, 'bandpass', 1950 - j * 50, 5.5, 0.30, 0.002);
          }

        } else if (id === 'cabasa') {
          // Metallic bead-chain Cabasa twist/scrape across steel ridges
          for (let i = 0; i < 12; i++) {
            playNoiseBurst(i * 0.018, 0.028, 'bandpass', 4600 + (i % 3) * 750, 3.0, 0.24, 0.004);
          }
          for (let j = 0; j < 10; j++) {
            playNoiseBurst(0.34 + j * 0.018, 0.028, 'bandpass', 5400 + (j % 3) * 650, 3.0, 0.22, 0.004);
          }

        } else if (id === 'sandblocks') {
          // Dry gritty Sandblocks swishing scrape
          playNoiseBurst(0, 0.22, 'bandpass', 2450, 1.1, 0.34, 0.045);
          playNoiseBurst(0.30, 0.22, 'bandpass', 2750, 1.1, 0.32, 0.045);
        }
      } catch (e) {}
    }

    let percussionLabState = {
      running: false,
      round: 0,
      totalRounds: 10,
      score: 0,
      target: null,
      timeLeftMs: 3000,
      intervalId: null,
      nextTimeoutId: null,
      roundActive: false,
      feedback: null,
      completed: false,
      roundQueue: []
    };

    function stopPercussionLab() {
      if (percussionLabState.intervalId) clearInterval(percussionLabState.intervalId);
      if (percussionLabState.nextTimeoutId) clearTimeout(percussionLabState.nextTimeoutId);
      percussionLabState.intervalId = null;
      percussionLabState.nextTimeoutId = null;
      percussionLabState.running = false;
      percussionLabState.roundActive = false;
    }

    function mountEmbeddedPercussionLab(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      stopPercussionLab();
      percussionLabState = {
        running: false,
        round: 0,
        totalRounds: 10,
        score: 0,
        target: null,
        timeLeftMs: 3000,
        intervalId: null,
        nextTimeoutId: null,
        roundActive: false,
        feedback: null,
        completed: false,
        roundQueue: []
      };
      renderPercussionLabUI(target);
    }

    function startPercussionChallenge() {
      stopPercussionLab();
      const queue = [...orchestralPercussionCatalog].sort(() => Math.random() - 0.5);
      percussionLabState = {
        running: true,
        round: 0,
        totalRounds: queue.length,
        score: 0,
        target: null,
        timeLeftMs: 3000,
        intervalId: null,
        nextTimeoutId: null,
        roundActive: false,
        feedback: null,
        completed: false,
        roundQueue: queue
      };
      launchNextPercussionRound();
    }

    function launchNextPercussionRound() {
      const st = percussionLabState;
      if (st.intervalId) clearInterval(st.intervalId);
      if (st.nextTimeoutId) clearTimeout(st.nextTimeoutId);

      if (st.round >= st.totalRounds) {
        st.running = false;
        st.roundActive = false;
        st.completed = true;
        renderPercussionLabUI(document.getElementById('embedded-tool-container'));
        showAppModal('Percussion Challenge Complete!', `You sorted ${st.score}/${st.totalRounds} percussion instruments in time and earned +${st.score * 2} Tokens!`, st.score >= 5);
        return;
      }

      st.round++;
      st.target = st.roundQueue[st.round - 1];
      st.timeLeftMs = 3000;
      st.roundActive = true;
      st.feedback = null;

      playOrchestralPercussion(st.target.id);
      renderPercussionLabUI(document.getElementById('embedded-tool-container'));

      const startTime = performance.now();
      st.intervalId = setInterval(() => {
        if (!st.running || !st.roundActive) {
          clearInterval(st.intervalId);
          return;
        }
        const elapsed = performance.now() - startTime;
        st.timeLeftMs = Math.max(0, 3000 - elapsed);

        const barEl = document.getElementById('perc-timer-bar');
        const txtEl = document.getElementById('perc-timer-text');
        if (barEl) {
          const pct = (st.timeLeftMs / 3000) * 100;
          barEl.style.width = `${pct}%`;
          if (pct < 35) {
            barEl.classList.remove('bg-emerald-400');
            barEl.classList.add('bg-rose-500');
          }
        }
        if (txtEl) {
          txtEl.textContent = `${(st.timeLeftMs / 1000).toFixed(1)}s`;
        }

        if (st.timeLeftMs <= 0) {
          clearInterval(st.intervalId);
          st.roundActive = false;
          const mLabel = st.target.method.toUpperCase();
          st.feedback = { type: 'timeout', msg: `⏱ Time's up! The ${st.target.name} is played by: ${mLabel}.` };
          playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
          renderPercussionLabUI(document.getElementById('embedded-tool-container'));
          st.nextTimeoutId = setTimeout(launchNextPercussionRound, 1300);
        }
      }, 50);
    }

    function handlePercussionDragStart(e) {
      if (e && e.dataTransfer) {
        e.dataTransfer.setData('text/plain', 'percInst');
        e.dataTransfer.effectAllowed = 'move';
      }
    }

    function handlePercussionMethodDrop(e, methodId) {
      if (e) {
        e.preventDefault();
        e.currentTarget.classList.remove('ring-4', 'ring-amber-400', 'scale-[1.03]');
      }
      const st = percussionLabState;
      if (!st.running || !st.roundActive || !st.target) return;

      clearInterval(st.intervalId);
      st.roundActive = false;

      const labelMap = { hit: 'HIT', shake: 'SHAKE', scrape: 'SCRAPE' };
      if (st.target.method === methodId) {
        st.score++;
        addTokens(2);
        st.feedback = { type: 'correct', msg: `✓ Spot on! The ${st.target.name} is ${labelMap[methodId]}! (+2 Tokens)` };
        playTonePitch(659.25, 0.18, 0.35, 'triangle');
        setTimeout(() => playTonePitch(880, 0.22, 0.35, 'triangle'), 120);
      } else {
        st.feedback = { type: 'wrong', msg: `✗ Not quite — the ${st.target.name} is played by ${labelMap[st.target.method]}!` };
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }

      renderPercussionLabUI(document.getElementById('embedded-tool-container'));
      st.nextTimeoutId = setTimeout(launchNextPercussionRound, 1250);
    }

          ${!st.running && !st.completed ? `

    // --- DYNAMICS CHALLENGE GAME ---
    let dynamicsChallengeState = { round: 1, totalRounds: 10, score: 0, target: null, options: [], answered: false, lastCorrect: false, completed: false, roundStartTime: 0 };

    const dynamicsChallengePool = [
      { type: 'symbol', symbol: 'pp', label: 'Pianissimo', desc: 'Very Soft' },
      { type: 'symbol', symbol: 'p', label: 'Piano', desc: 'Soft' },
      { type: 'symbol', symbol: 'mp', label: 'Mezzo Piano', desc: 'Moderately Soft' },
      { type: 'symbol', symbol: 'mf', label: 'Mezzo Forte', desc: 'Moderately Loud' },
      { type: 'symbol', symbol: 'f', label: 'Forte', desc: 'Loud' },
      { type: 'symbol', symbol: 'ff', label: 'Fortissimo', desc: 'Very Loud' },
      { type: 'hairpin', symbol: '<', label: 'Crescendo', desc: 'Gradually getting louder' },
      { type: 'hairpin', symbol: '>', label: 'Decrescendo', desc: 'Gradually getting softer' },
      { type: 'terraced', symbol: 'p \u2192 f', label: 'Terraced Shift (p to f)', desc: 'Sudden shift from soft to loud' },
      { id: 'terraced', symbol: 'f \u2192 p', label: 'Terraced Shift (f to p)', desc: 'Sudden shift from loud to soft' }
    ];

    function handleDynamicsDragStart(event) {
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', 'dynamicsCard');
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleDynamicsDrop(event, label) {
      if (event) {
        event.preventDefault();
        event.currentTarget.classList.remove('border-amber-400', 'bg-slate-700');
      }
      guessDynamicsChallenge(label);
    }

    function setupDynamicsChallengeRound() {
      const target = dynamicsChallengePool[Math.floor(Math.random() * dynamicsChallengePool.length)];
      dynamicsChallengeState.target = target;
      const wrongOpts = dynamicsChallengePool.filter(d => d.label !== target.label).sort(() => Math.random() - 0.5).slice(0, 3);
      dynamicsChallengeState.options = [target, ...wrongOpts].sort(() => Math.random() - 0.5);
      dynamicsChallengeState.answered = false;
      dynamicsChallengeState.roundStartTime = performance.now();
    }

    function mountEmbeddedDynamicsChallengeGame(target) {
      if (!target) return;
      dynamicsChallengeState = { round: 1, totalRounds: 10, score: 0, target: null, options: [], answered: false, lastCorrect: false, completed: false, roundStartTime: 0 };
      setupDynamicsChallengeRound();
      renderDynamicsChallengeUI(target);
    }

    function guessDynamicsChallenge(label) {
      const st = dynamicsChallengeState;
      if (st.answered || st.completed) return;
      if (performance.now() - st.roundStartTime < 800) return;
      st.answered = true;
      st.lastCorrect = (st.target.label === label);
      if (st.lastCorrect) {
        st.score++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderDynamicsChallengeUI(document.getElementById('embedded-tool-container'));
    }

    function nextDynamicsChallengeRound() {
      const st = dynamicsChallengeState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupDynamicsChallengeRound();
        renderDynamicsChallengeUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderDynamicsChallengeUI(document.getElementById('embedded-tool-container'));
        showAppModal('Dynamics Challenge Complete!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score * 2} Tokens!`, st.score >= 5);
      }
    }

    function renderDynamicsChallengeUI(target) {

              <button type="button" onclick="mountEmbeddedDynamicsChallengeGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Another 10 Rounds</button>

                <span class="text-xs font-bold">${st.lastCorrect ? '✓ Spot on (+2 Tokens)!' : `✗ Incorrect. The correct answer was: <strong>${st.target.label} - ${st.target.desc}</strong>`}</span>
                <button type="button" onclick="nextDynamicsChallengeRound()" class="px-4 py-2 bg-white text-slate-950 hover:bg-slate-100 font-black rounded-xl text-xs shrink-0">

                }">
                  <span class="font-black text-sm text-white pointer-events-none">${opt.label}</span>
                  <span class="text-xs text-slate-400 mt-0.5 pointer-events-none">${opt.desc}</span>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // ARTICULATION DETECTIVE GAME

    function setupArticulationRound() {
      const pool = [...articulationGameItems];
      const target = pool[Math.floor(Math.random() * pool.length)];
      articulationGameState.target = target;
      articulationGameState.options = pool.sort(() => Math.random() - 0.5);
      articulationGameState.answered = false;
      articulationGameState.lastCorrect = false;
      articulationGameState.roundStartTime = performance.now();

      if (!target) return;
      articulationGameState = { round: 1, totalRounds: 10, score: 0, target: null, options: [], answered: false, lastCorrect: false, completed: false, roundStartTime: 0 };
      setupArticulationRound();
      renderArticulationGameUI(target);
    }

    function handleArticulationDragStart(e, id) {
      if (e && e.dataTransfer) {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleArticulationDrop(e) {
      if (e) e.preventDefault();
      const st = articulationGameState;
      if (st.answered || st.completed) return;
      if (performance.now() - st.roundStartTime < 800) return;
      
      let droppedId = null;
      if (e && e.dataTransfer) {
        droppedId = e.dataTransfer.getData('text/plain');
      }
      if (!droppedId) return;
      
      st.answered = true;
      st.lastCorrect = (st.target.id === droppedId);
      
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderArticulationGameUI();
    }

      const st = articulationGameState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupArticulationRound();
        renderArticulationGameUI();
      } else {
        st.completed = true;
        renderArticulationGameUI();
        showAppModal('Articulation Detective Complete!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score} Tokens!`, st.score >= 5);

                  ondragleave="this.setAttribute('fill', 'rgba(251,191,36,0.3)');"

    let staffNotationState = { round: 1, totalRounds: 10, score: 0, targetNote: null, isPlaying: false, answered: false, guessedY: null, lastCorrect: false, completed: false, audioPlayed: false, roundStartTime: 0 };

    function getFreqForNote(note) {
      const p = pitchKeyboardKeys.find(k => k.note === note);
      if (p) return p.freq;
      if (note === 'D5') return 587.33;
      if (note === 'E5') return 659.25;
      if (note === 'F5') return 698.46;
      return 440;
    }

    function setupStaffNotationRound() {
      const pool = Object.keys(staffNoteY);
      staffNotationState.targetNote = pool[Math.floor(Math.random() * pool.length)];
      staffNotationState.answered = false;
      staffNotationState.guessedY = null;
      staffNotationState.isPlaying = false;
      staffNotationState.audioPlayed = false;
      staffNotationState.roundStartTime = performance.now();
    }

    function mountEmbeddedStaffNotationGame(target) {
      if (!target) return;
      staffNotationState = { round: 1, totalRounds: 10, score: 0, targetNote: null, isPlaying: false, answered: false, guessedY: null, lastCorrect: false, completed: false, audioPlayed: false, roundStartTime: 0 };
      setupStaffNotationRound();
      renderStaffNotationGameUI(target);
    }
    
    function playStaffNotationTarget() {
      const st = staffNotationState;
      if (st.isPlaying || !st.targetNote) return;
      st.isPlaying = true;
      st.audioPlayed = true;
      renderStaffNotationGameUI(document.getElementById('embedded-tool-container'));
      playTonePitch(getFreqForNote(st.targetNote), 0.6, 0.35, 'triangle');
      setTimeout(() => {
        st.isPlaying = false;
        renderStaffNotationGameUI(document.getElementById('embedded-tool-container'));
      }, 800);
    }

    function handleStaffClick(event) {
      const st = staffNotationState;
      if (st.answered || st.completed || !st.targetNote) return;
      if (performance.now() - st.roundStartTime < 800) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the target pitch before guessing!', false); return; }
      
      const svg = event.currentTarget;
      const pt = svg.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
      
      let closestNote = null;
      let minDiff = Infinity;
      for (const [note, y] of Object.entries(staffNoteY)) {
        const diff = Math.abs(svgP.y - y);
        if (diff < minDiff) {
          minDiff = diff;
          closestNote = note;
        }
      }
      
      if (minDiff > 12) return; 
      
      st.guessedY = staffNoteY[closestNote];
      st.answered = true;
      st.lastCorrect = (closestNote === st.targetNote);
      
      playTonePitch(getFreqForNote(closestNote), 0.4, 0.35, 'triangle');
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        setTimeout(() => playTonePitch(659.25, 0.2, 0.35, 'triangle'), 500);
      } else {
        setTimeout(() => playTonePitch(155.56, 0.25, 0.3, 'sawtooth'), 500);
      }
      renderStaffNotationGameUI(document.getElementById('embedded-tool-container'));
    }

    function nextStaffNotationRound() {
      const st = staffNotationState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupStaffNotationRound();
        renderStaffNotationGameUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderStaffNotationGameUI(document.getElementById('embedded-tool-container'));
        showAppModal('Staff Notation Game Complete!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score} Tokens!`, st.score >= 5);
      }
    }

      `;

    function mountEmbeddedDynamicsSimulator(target) {
      if (!target) return;
      
      const pairs = [...dynamicsMemoryPairs];
      const deck = [];
      pairs.forEach(p => {
        deck.push({ id: p.id, type: 'front', content: p.front });
        deck.push({ id: p.id, type: 'back', content: p.back });
      });
      deck.sort(() => Math.random() - 0.5);
      
      dynamicsMemoryState = { cards: deck, flipped: [], matched: [], lock: false };
      renderDynamicsMemoryUI(target);
    }

    function flipDynamicsCard(index) {
      const st = dynamicsMemoryState;
      if (st.lock || st.flipped.includes(index) || st.matched.includes(index)) return;

      st.flipped.push(index);
      renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));

      if (st.flipped.length === 2) {
        st.lock = true;
        const [i1, i2] = st.flipped;
        const c1 = st.cards[i1];
        const c2 = st.cards[i2];

        if (c1.id === c2.id) {
          playTonePitch(659.25, 0.2, 0.35, 'triangle');
          setTimeout(() => {
            st.matched.push(i1, i2);
            st.flipped = [];
            st.lock = false;
            if (st.matched.length === st.cards.length) {
              addTokens(10);
              showAppModal('Memory Match Mastered!', 'You matched all 8 dynamic symbols and earned +10 Tokens!', true);
            }
            renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));
          }, 600);
        } else {
          playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
          setTimeout(() => {
            st.flipped = [];
            st.lock = false;
            renderDynamicsMemoryUI(document.getElementById('embedded-tool-container'));
          }, 1000);
        }
      }
    }

      const st = dynamicsMemoryState;
      
      target.innerHTML = `

          <div class="flex items-center justify-between border-b border-slate-800 pb-4">

          <div class="grid grid-cols-4 gap-2.5">

    // ==========================================
    // STEM DIRECTION GAME (DURATION LEVEL 2)
    // ==========================================
    let stemDirectionGameState = {
      round: 1, totalRounds: 10, score: 0, streak: 0, best: 0,
      targetStem: 'up', // 'up' or 'down'
      answered: false, lastCorrect: false, completed: false,
      droppedY: null, roundStartTime: 0
    };

    function setupStemDirectionRound() {
      stemDirectionGameState.targetStem = Math.random() > 0.5 ? 'up' : 'down';
      stemDirectionGameState.answered = false;
      stemDirectionGameState.lastCorrect = false;
      stemDirectionGameState.droppedY = null;
      stemDirectionGameState.roundStartTime = performance.now();
    }

    function mountEmbeddedStemDirectionGame(target) {
      if (!target) return;
      stemDirectionGameState = { round: 1, totalRounds: 10, score: 0, streak: 0, best: 0, targetStem: 'up', answered: false, lastCorrect: false, completed: false, droppedY: null, roundStartTime: 0 };
      setupStemDirectionRound();
