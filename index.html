    }

    function handleStemDragStart(e) {
       if (e && e.dataTransfer) { e.dataTransfer.setData('text/plain', 'stemNote'); e.dataTransfer.effectAllowed = 'copy'; }
    }

    function handleStemDrop(event, fallbackZone) {
       if (event) event.preventDefault();
       const st = stemDirectionGameState;
       if (st.answered || st.completed) return;
       if (performance.now() - st.roundStartTime < 800) return;
       
       st.answered = true;
       let snappedY;

       // Calculate exact line or space from coordinates if event exists
       if (event && event.clientY) {
           const svg = event.currentTarget.tagName === 'svg' ? event.currentTarget : event.currentTarget.ownerSVGElement;
           if (svg) {
               const pt = svg.createSVGPoint();
               pt.x = event.clientX;
               pt.y = event.clientY;
               const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
               // Snap to nearest 10 units (half space based on 20px line spacing)
               snappedY = Math.round(svgP.y / 10) * 10;
               // Keep note strictly within the 5 staff lines (Y: 20 to 100)
               snappedY = Math.max(20, Math.min(100, snappedY));
           }
       }

       // Fallback logic if needed
       if (snappedY === undefined) {
           snappedY = fallbackZone === 'above' ? 40 : 80;
       }

       st.droppedY = snappedY;
       
       const isAboveMiddle = st.droppedY < 60;
       const isBelowMiddle = st.droppedY > 60;
       let isCorrect = false;
       
       if (st.targetStem === 'up' && isBelowMiddle) isCorrect = true;
       if (st.targetStem === 'down' && isAboveMiddle) isCorrect = true;
       
       st.lastCorrect = isCorrect;

       if (isCorrect) {
         st.score++;
         st.streak++;
         if (st.streak > st.best) st.best = st.streak;
         addTokens(1);
         playTonePitch(659.25, 0.2, 0.35, 'triangle');
       } else {
         st.streak = 0;
         playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
       }
       renderStemDirectionUI(document.getElementById('embedded-tool-container'));
    }

    function nextStemDirectionRound() {
      const st = stemDirectionGameState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupStemDirectionRound();
        renderStemDirectionUI(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderStemDirectionUI(document.getElementById('embedded-tool-container'));
        showAppModal('Stem Direction Game Complete!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score} Tokens!`, st.score >= 5);
      }
    }

    function renderStemDirectionUI(target) {

    // ==========================================
    // DURATION & RHYTHM MINIGAMES (BEAT TAP, CROTCHET, QUAVER, LONG NOTE, DRUM & DICTATION)
    // ==========================================
    
    let beatTapState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], streak: 0, lastBeatTime: 0, hitThisBeat: false, intervalId: null, completed: false };

    function stopBeatTapLoop() {
      if (beatTapState.intervalId) clearInterval(beatTapState.intervalId);
      beatTapState.intervalId = null;
      beatTapState.running = false;
    }

    function mountEmbeddedBeatTapGame(target) {
      if (!target) return;
      stopBeatTapLoop();
      beatTapState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], streak: 0, lastBeatTime: 0, hitThisBeat: false, intervalId: null, completed: false };
      renderBeatTapUI(target);
    }

    function startBeatTapSpeed() {
      stopBeatTapLoop();
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const ms = Math.round(60000 / bpm);
      beatTapState.running = true;
      beatTapState.streak = 0;

      const tick = () => {
        beatTapState.lastBeatTime = performance.now();
        beatTapState.hitThisBeat = false;
        playTonePitch(660, 0.08, 0.3, 'sine');
        const pulseEl = document.getElementById('beat-tap-pulse-ring');
        if (pulseEl) {
          pulseEl.classList.add('scale-110', 'border-amber-400', 'bg-amber-400/20');
          setTimeout(() => pulseEl.classList.remove('scale-110', 'border-amber-400', 'bg-amber-400/20'), 140);
        }
      };
      tick();
      beatTapState.intervalId = setInterval(tick, ms);
      renderBeatTapUI();
    }

    function handleBeatTapHit() {
      if (!beatTapState.running || beatTapState.completed) return;
      
      // Anti-Spam: Break streak if they mash multiple times on the same beat
      if (beatTapState.hitThisBeat) {
        beatTapState.streak = 0;
        playTonePitch(180, 0.12, 0.25, 'sawtooth');
        renderBeatTapUI();
        return;
      }

      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const beatMs = 60000 / bpm;
      const now = performance.now();
      const diff = Math.abs(now - beatTapState.lastBeatTime);
      const dist = Math.min(diff, Math.abs(beatMs - diff));

      if (dist <= beatMs * 0.36) {
        beatTapState.hitThisBeat = true;
        beatTapState.streak++;
        playTonePitch(880, 0.07, 0.25, 'triangle');
        if (beatTapState.streak >= 8) {
          if (beatTapState.speedIdx < 3) {
            beatTapState.speedIdx++;
            startBeatTapSpeed();
            return;
          } else {
            stopBeatTapLoop();
            beatTapState.completed = true;
            addTokens(10);
            showAppModal('Steady Beat Mastered!', 'You tapped in time across all 4 speeds and earned +10 Tokens!', true);
          }
        }
      } else {
        beatTapState.streak = 0;
        playTonePitch(180, 0.12, 0.25, 'sawtooth');
      }
      renderBeatTapUI();
    }

    function renderBeatTapUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Rhythm Minigame • 4 Tempos</span>
              <h3 class="text-xl font-black">Steady Beat Spacebar Tapper</h3>
              <p class="text-xs text-slate-300 mt-1">Press the <strong>Spacebar</strong> (or tap the pad below) in time with the pulse. Get <strong>8 consecutive in-time taps</strong> to advance through all 4 speeds!</p>
            </div>

              Speed ${beatTapState.speedIdx + 1} / 4 (${bpm} BPM)
            </span>
          </div>

          ${beatTapState.completed ? `

              <h4 class="text-xl font-black text-emerald-300">All 4 Speeds Mastered (+10 Tokens)!</h4>
              <button type="button" onclick="mountEmbeddedBeatTapGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex flex-col items-center justify-center py-4 space-y-4">
              <div id="beat-tap-pulse-ring" class="w-32 h-32 rounded-full border-4 border-indigo-500 bg-slate-800 flex flex-col items-center justify-center transition-transform">
                <span class="text-3xl font-black text-amber-400">${beatTapState.streak} / 8</span>
                <span class="text-[10px] font-bold uppercase text-slate-400">Streak</span>
              </div>
              ${!beatTapState.running ? `
                <button type="button" onclick="startBeatTapSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                  Start Speed ${beatTapState.speedIdx + 1} (${bpm} BPM)
                </button>
              ` : `
                <button type="button" onmousedown="handleBeatTapHit()" ontouchstart="event.preventDefault(); handleBeatTapHit();" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-black rounded-2xl text-sm shadow-lg">
                  TAP BEAT (or Press SPACEBAR)
                </button>
              `}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 2: 8-BEAT CROTCHET SIGHT-READER (4-BEAT COUNT-IN)
    // ==========================================
    let crotchetGameState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], pattern: [], tickIdx: -4, hitBeats: [], mistakes: 0, intervalId: null, completed: false };

    function stopCrotchetGameLoop() {
      if (crotchetGameState.intervalId) clearInterval(crotchetGameState.intervalId);
      crotchetGameState.intervalId = null;
      crotchetGameState.running = false;
    }

    function generateCrotchetPattern() {
      const arr = [];
      for (let i = 0; i < 8; i++) arr.push(Math.random() > 0.35 ? 1 : 0);
      if (!arr.includes(1)) arr[0] = 1;
      return arr;
    }

    function mountEmbeddedCrotchetGame(target) {
      if (!target) return;
      stopCrotchetGameLoop();
      crotchetGameState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], pattern: generateCrotchetPattern(), tickIdx: -4, hitBeats: [], mistakes: 0, intervalId: null, completed: false };
      renderCrotchetGameUI(target);
    }

    function startCrotchetSpeed() {
      stopCrotchetGameLoop();
      const bpm = crotchetGameState.speeds[crotchetGameState.speedIdx];
      const ms = Math.round(60000 / bpm);
      crotchetGameState.pattern = generateCrotchetPattern();
      crotchetGameState.tickIdx = -5;
      crotchetGameState.hitBeats = [];
      crotchetGameState.mistakes = 0;
      crotchetGameState.running = true;

      const step = () => {
        crotchetGameState.tickIdx++;
        const t = crotchetGameState.tickIdx;
        if (t < 0) {
          playTonePitch(784, 0.06, 0.25, 'sine');
        } else if (t < 8) {
          playTonePitch(523.25, 0.06, 0.2, 'sine');
        } else {
          stopCrotchetGameLoop();
          const required = crotchetGameState.pattern.reduce((a, b) => a + b, 0);
          if (crotchetGameState.hitBeats.length >= Math.max(1, required - 1) && crotchetGameState.mistakes <= 1) {
            if (crotchetGameState.speedIdx < 3) {
              crotchetGameState.speedIdx++;
              startCrotchetSpeed();
              return;
            } else {
              crotchetGameState.completed = true;
              addTokens(10);
              showAppModal('Crotchet Sight-Reader Complete!', 'You mastered all 4 speeds and earned +10 Tokens!', true);
            }
          }
        }
        renderCrotchetGameUI();
      };
      step();
      crotchetGameState.intervalId = setInterval(step, ms);
    }

    function handleCrotchetTap() {
      if (!crotchetGameState.running) return;
      const b = crotchetGameState.tickIdx;
      if (b < 0 || b >= 8) return;
      if (crotchetGameState.pattern[b] === 1 && !crotchetGameState.hitBeats.includes(b)) {
        crotchetGameState.hitBeats.push(b);
        playTonePitch(880, 0.09, 0.35, 'triangle');
      } else {
        crotchetGameState.mistakes++;
        playTonePitch(165, 0.12, 0.3, 'sawtooth');
        // Anti-Spam: Stop game if too many mashed mistakes occur
        if (crotchetGameState.mistakes >= 3) {
          stopCrotchetGameLoop();
          showAppModal('Spam Detected', 'Avoid auto-clicking or tapping on rests! Try again.', false);
        }
      }
      renderCrotchetGameUI();
    }

    function renderCrotchetGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = crotchetGameState;
      const bpm = st.speeds[st.speedIdx];
      const countInText = st.running && st.tickIdx < 0 ? `Count-In: ${5 + st.tickIdx}` : st.running ? `Beat ${st.tickIdx + 1}` : 'Ready';

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">8-Beat Sight-Reading Challenge</span>
              <h3 class="text-xl font-black">Crotchet &amp; Rest Sight-Reader</h3>
              <p class="text-xs text-slate-300 mt-1">Press <strong>Spacebar</strong> (or tap the button) ONLY on beats showing a <strong>Crotchet</strong> and skip the rests!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
              Speed ${st.speedIdx + 1} / 4 (${bpm} BPM)
            </span>
          </div>

          <div class="text-center">
            <span class="text-2xl sm:text-3xl font-black text-amber-400">${countInText}</span>
          </div>

          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
            ${st.pattern.map((val, idx) => {
              const isCurrent = st.running && st.tickIdx === idx;
              const isHit = st.hitBeats.includes(idx);
              return `
                <div class="p-3 rounded-2xl border-2 text-center ${isCurrent ? 'border-amber-400 bg-indigo-900 scale-105' : isHit ? 'border-emerald-500 bg-emerald-950/60' : 'border-slate-700 bg-slate-800'}">
                  <div class="text-xs font-black text-slate-400 mb-1">${idx + 1}</div>
                  <div class="${val === 1 ? 'text-white' : 'text-slate-500'}">${renderEngravedNoteDarkSVG(val === 1 ? 'crotchet' : 'rest', 'w-10 h-14')}</div>
                </div>
              `;
            }).join('')}
          </div>

          ${st.completed ? `
            <div class="p-5 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-2">
              <div class="text-lg font-black text-emerald-300">All 4 Speeds Completed (+10 Tokens)!</div>
              <button type="button" onclick="mountEmbeddedCrotchetGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex justify-center gap-3">
              ${!st.running ? `
                <button type="button" onclick="startCrotchetSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                  Start Speed ${st.speedIdx + 1} (${bpm} BPM)
                </button>
              ` : `
                <button type="button" onmousedown="handleCrotchetTap()" ontouchstart="event.preventDefault(); handleCrotchetTap();" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl text-sm shadow-lg">
                  TAP CROTCHET (SPACEBAR)
                </button>
              `}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 3: 8-BEAT QUAVER & CROTCHET SIGHT-READER
    // ==========================================
    let quaverGameState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], pattern: [], halfStepIdx: -8, hitSlots: [], mistakes: 0, intervalId: null, completed: false };

    function stopQuaverGameLoop() {
      if (quaverGameState.intervalId) clearInterval(quaverGameState.intervalId);
      quaverGameState.intervalId = null;
      quaverGameState.running = false;
    }

    function generateQuaverPattern() {
      const types = ['crotchet', 'quavers', 'rest'];
      return Array.from({ length: 8 }, () => types[Math.floor(Math.random() * types.length)]);
    }

    function mountEmbeddedQuaverGame(target) {
      if (!target) return;
      stopQuaverGameLoop();
      quaverGameState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], pattern: generateQuaverPattern(), halfStepIdx: -8, hitSlots: [], mistakes: 0, intervalId: null, completed: false };
      renderQuaverGameUI(target);
    }

    function startQuaverSpeed() {
      stopQuaverGameLoop();
      const bpm = quaverGameState.speeds[quaverGameState.speedIdx];
      const eighthMs = Math.round(30000 / bpm);
      quaverGameState.pattern = generateQuaverPattern();
      quaverGameState.halfStepIdx = -9;
      quaverGameState.hitSlots = [];
      quaverGameState.mistakes = 0;
      quaverGameState.running = true;

      const step = () => {
        quaverGameState.halfStepIdx++;
        const h = quaverGameState.halfStepIdx;
        if (h < 0 && h % 2 === 0) playTonePitch(784, 0.05, 0.22, 'sine');
        else if (h >= 0 && h < 16 && h % 2 === 0) playTonePitch(523.25, 0.05, 0.18, 'sine');
        else if (h >= 16) {
          stopQuaverGameLoop();
          const required = quaverGameState.pattern.reduce((acc, val) => acc + (val === 'quavers' ? 2 : val === 'crotchet' ? 1 : 0), 0);
          
          if (quaverGameState.hitSlots.length >= Math.max(1, required - 2) && quaverGameState.mistakes <= 2) {
            if (quaverGameState.speedIdx < 3) {
              quaverGameState.speedIdx++;
              startQuaverSpeed();
              return;
            } else {
              quaverGameState.completed = true;
              addTokens(10);
              showAppModal('Quaver & Crotchet Sight-Reader Complete!', 'You completed all 4 speeds and earned +10 Tokens!', true);
            }
          } else {
            showAppModal('Try Again', 'You missed too many notes or tapped on rests.', false);
          }
        }
        renderQuaverGameUI();
      };
      step();
      quaverGameState.intervalId = setInterval(step, eighthMs);
    }

    function handleQuaverTap() {
      if (!quaverGameState.running) return;
      const h = quaverGameState.halfStepIdx;
      if (h < 0 || h >= 16) return;
      const beatIdx = Math.floor(h / 2);
      const isAnd = h % 2 === 1;
      const kind = quaverGameState.pattern[beatIdx];
      
      let isCorrect = false;
      if ((kind === 'crotchet' && !isAnd) || kind === 'quavers') {
        if (!quaverGameState.hitSlots.includes(h)) {
          isCorrect = true;
          quaverGameState.hitSlots.push(h);
          playTonePitch(880, 0.07, 0.3, 'triangle');
        }
      }
      
      if (!isCorrect) {
        quaverGameState.mistakes++;
        playTonePitch(165, 0.1, 0.25, 'sawtooth');
        // Anti-Spam: Stop game if 4 or more mashed mistakes occur
        if (quaverGameState.mistakes >= 4) {
           stopQuaverGameLoop();
           showAppModal('Spam Detected', 'Avoid auto-clicking! Tap only on the correct notes.', false);
        }
      }
      
      renderQuaverGameUI();
    }

    function renderQuaverGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = quaverGameState;
      const bpm = st.speeds[st.speedIdx];
      const activeBeat = st.running && st.halfStepIdx >= 0 ? Math.floor(st.halfStepIdx / 2) : -1;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Quaver &amp; Crotchet Sight-Reader</span>
              <h3 class="text-xl font-black">8-Beat Quaver &amp; Crotchet Challenge</h3>
              <p class="text-xs text-slate-300 mt-1">Tap once on <strong>Crotchets</strong>, twice quickly ("1 &amp;") on <strong>Paired Quavers</strong>, and hold on <strong>Rests</strong> across 4 speeds!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
              Speed ${st.speedIdx + 1} / 4 (${bpm} BPM)
            </span>
          </div>

        running: false,

        best: 0,
        lastCrossCount: 0,

        lastTime: 0,
        bonusAwarded: false
    };

    function stopMetronomeGame() {
        metronomeGameState.running = false;
    }

    function startMetronomeGame() {
        stopMetronomeGame();
        metronomeGameState = {
            running: true,
            bpm: 80,
            phase: -Math.PI / 2, // Start left
            streak: 0,
            best: 0,
            lastCrossCount: 0,
            lastHitCrossCount: -1,
            lastTime: performance.now(),
            bonusAwarded: false
        };
        requestAnimationFrame(metronomeLoop);
        renderMetronomeUIUpdates();
    }

    function metronomeLoop(time) {
        if (!metronomeGameState.running) return;
        const st = metronomeGameState;
        
        if (!st.lastTime) st.lastTime = time;
        const delta = time - st.lastTime;
        st.lastTime = time;
        
        st.phase += (delta / (60000 / st.bpm)) * Math.PI;
        
        const currentCross = Math.floor((st.phase + Math.PI/2) / Math.PI);
        
        if (currentCross > st.lastCrossCount) {
            playTonePitch(800, 0.05, 0.3, 'square'); // Click sound
            st.lastCrossCount = currentCross;
            
            // Tempo Shift every 8 beats
            if (currentCross % 8 === 0 && currentCross > 0) {
                st.bpm = Math.floor(Math.random() * (160 - 50 + 1)) + 50;
                renderMetronomeTextUpdates();
            }
            
            // Check for missed beat
            if (currentCross - st.lastHitCrossCount > 1 && st.streak > 0) {
                st.streak = 0;
                playTonePitch(150, 0.15, 0.3, 'sawtooth');
                renderMetronomeTextUpdates();
            }
        }
        
        const angle = 45 * Math.sin(st.phase);
        const arm = document.getElementById('metronome-arm');
        if (arm) arm.setAttribute('transform', `rotate(${angle} 50 90)`);
        
        requestAnimationFrame(metronomeLoop);
    }

    function handleMetronomeHit() {
        const st = metronomeGameState;
        if (!st.running) return;
        
        const angle = 45 * Math.sin(st.phase);
        
        if (Math.abs(angle) < 12) { // Tolerance in degrees
            const closestCross = Math.round(st.phase / Math.PI);
            if (st.lastHitCrossCount === closestCross) {
                st.streak = 0;
                playTonePitch(150, 0.15, 0.3, 'sawtooth'); // Mashed
            } else {
                st.streak++;
                if (st.streak > st.best) st.best = st.streak;
                st.lastHitCrossCount = closestCross;
                playTonePitch(600, 0.1, 0.4, 'triangle'); // Success ding
                
                if (st.streak > 0 && st.streak % 10 === 0) {
                    addTokens(5);
                    setTimeout(() => playTonePitch(523.25, 0.1, 0.4, 'sine'), 100);
                    setTimeout(() => playTonePitch(659.25, 0.1, 0.4, 'sine'), 200);
                    setTimeout(() => playTonePitch(783.99, 0.2, 0.4, 'sine'), 300);
                }
            }
        } else {
            st.streak = 0;
            playTonePitch(150, 0.15, 0.3, 'sawtooth'); // Miss ding
        }
        renderMetronomeTextUpdates();
    }

    function mountEmbeddedLongNoteGame(target) {
      if (!target) return;

    function beginLongNoteHold() {
      const st = longNoteState;
      if (!st.running || st.answered || st.completed || st.isHolding) return;
      st.isHolding = true;
      st.holdStartTime = performance.now();
      const ctx = getAudioCtx();
      if(ctx) {
        lnOsc = ctx.createOscillator();
        lnGain = ctx.createGain();
        lnOsc.type = 'triangle';
        lnOsc.frequency.value = 330;
        lnGain.gain.setValueAtTime(0.001, ctx.currentTime);
        lnGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
        lnOsc.connect(lnGain);
        lnGain.connect(ctx.destination);
        lnOsc.start();
      }
      renderLongNoteGameUI(document.getElementById('embedded-tool-container'));
    }

    function endLongNoteHold() {
      const st = longNoteState;
      if (!st.running || st.answered || st.completed || !st.isHolding) return;
      st.isHolding = false;
      if (lnOsc && lnGain) {
         const ctx = getAudioCtx();
         lnGain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.05);
         lnOsc.stop(ctx.currentTime + 0.06);
         lnOsc = null; lnGain = null;
      }

      const holdDuration = performance.now() - st.holdStartTime;
      const beatMs = 60000 / st.bpm;
      const targetDuration = st.targetNote.beats * beatMs;
      const tolerance = beatMs * 0.45; // 45% tolerance

      st.answered = true;
      if (Math.abs(holdDuration - targetDuration) < tolerance) {
        st.lastCorrect = true;
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');

    // 6. Ledger Line Game

      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(st.targetNote.freq, 0.4, 0.35, 'triangle');

      target.innerHTML = `

                <button type="button" onclick="nextLedgerLineRound()" class="px-4 py-2 bg-white text-slate-950 hover:bg-slate-100 font-black rounded-xl text-xs">

                </button>
              </div>
            ` : ''}

            <div class="grid grid-cols-2 gap-3">
              ${ledgerNotes.map(c => `
                <button type="button" onclick="guessLedgerLine('${c.id}')" ${st.answered ? 'disabled' : ''} class="p-4 rounded-2xl border-2 text-center transition-all ${

    // Global Spacebar handler for rhythm games
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (beatTapState.running || crotchetGameState.running || quaverGameState.running || longNoteState.running || metronomeGameState.running || evhGuitarState.running) {
          e.preventDefault();
        }
        if (!e.repeat) {
          if (beatTapState.running) handleBeatTapHit();
          else if (crotchetGameState.running) handleCrotchetTap();
          else if (quaverGameState.running) handleQuaverTap();
          else if (longNoteState.running) beginLongNoteHold();
          else if (metronomeGameState.running) handleMetronomeHit();
          else if (evhGuitarState.running) handleEvhGuitarHit();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && longNoteState.running) {
        e.preventDefault();
        endLongNoteHold();
      }
    });

    // ==========================================
    // MINIGAME 5: 8-BEAT DRUM SEQUENCER & DICTATION LAB
    // ==========================================
    let drumLabState = {
      activeTab: 'sequencer',
      sequencerPlaying: false,
      sequencerStep: -1,
      sequencerIntervalId: null,
      grid: {
        hihat: [1, 1, 1, 1, 1, 1, 1, 1],
        snare: [0, 0, 1, 0, 0, 0, 1, 0],
        kick:  [1, 0, 0, 0, 1, 0, 0, 0]
      },
      selectedNoteTool: 'crotchet',
      draggedNoteTool: null,
      dictationRound: 1,
      dictationTotalRounds: 10,
      dictationScore: 0,
      dictationCompleted: false,
      dictationAnswered: false,
      dictationLastCorrect: false,
      dictationTarget: ['crotchet', 'quavers', 'crotchet', 'quavers'],
      dictationGuess: [null, null, null, null],
      dictationPlaying: false,
      dictationStatusText: 'Click "Hear Pattern (4-Beat Count-In)" to listen!',
      audioPlayed: false
    };

    const drumSubdivisionLabels = ['1', '&', '2', '&', '3', '&', '4', '&'];

    function stopDrumSequencerLoop() {
      if (drumLabState.sequencerIntervalId) {
        clearInterval(drumLabState.sequencerIntervalId);
        drumLabState.sequencerIntervalId = null;
      }
      drumLabState.sequencerPlaying = false;
      drumLabState.sequencerStep = -1;
    }

    function toggleDrumSequencerLoop() {
      if (drumLabState.sequencerPlaying) {
        stopDrumSequencerLoop();
        mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
        return;
      }
      drumLabState.sequencerPlaying = true;
      drumLabState.sequencerStep = -1;

      const advanceStep = () => {
        if (!drumLabState.sequencerPlaying) return;
        drumLabState.sequencerStep = (drumLabState.sequencerStep + 1) % 8;
        const step = drumLabState.sequencerStep;
        if (drumLabState.grid.hihat[step]) playDrumSound('hihat');
        if (drumLabState.grid.snare[step]) playDrumSound('snare');
        if (drumLabState.grid.kick[step]) playDrumSound('kick');

        document.querySelectorAll('[data-seq-step]').forEach(btn => {
          const btnStep = Number(btn.getAttribute('data-seq-step'));
          if (btnStep === step) {
            btn.classList.add('ring-2', 'ring-emerald-400', 'scale-105');
          } else {
            btn.classList.remove('ring-2', 'ring-emerald-400', 'scale-105');
          }
        });
      };

      advanceStep();
      drumLabState.sequencerIntervalId = setInterval(advanceStep, 260);
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function toggleDrumGridCell(inst, idx) {
      drumLabState.grid[inst][idx] = drumLabState.grid[inst][idx] ? 0 : 1;
      if (!drumLabState.sequencerPlaying && drumLabState.grid[inst][idx]) {
        playDrumSound(inst);
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function playDrumGridSequence(gridObj) {
      toggleDrumSequencerLoop();
    }

    function generateSimpleRhythmDictation() {
      const options = ['crotchet', 'quavers'];
      const pattern = Array.from({ length: 4 }, () => options[Math.floor(Math.random() * options.length)]);
      if (!pattern.includes('quavers')) pattern[1] = 'quavers';
      if (!pattern.includes('crotchet')) pattern[0] = 'crotchet';
      return pattern;
    }

    function playDictationMysteryPattern() {
      if (drumLabState.dictationPlaying) return;
      drumLabState.dictationPlaying = true;
      drumLabState.audioPlayed = true;
      const beatMs = 600;

      // 4-Beat Count-In (1, 2, 3, 4)
      for (let c = 0; c < 4; c++) {
        setTimeout(() => {
          drumLabState.dictationStatusText = `Count-In: ${c + 1}`;
          playTonePitch(784, 0.06, 0.25, 'sine');
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
        }, c * beatMs);
      }

      // 4-Beat Rhythm Pattern (Crotchets & Paired Quavers)
      drumLabState.dictationTarget.forEach((noteType, beatIdx) => {
        const startOffset = (4 + beatIdx) * beatMs;
        setTimeout(() => {
          drumLabState.dictationStatusText = `Listening: Beat ${beatIdx + 1}`;
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;

          if (noteType === 'crotchet') {
            playTonePitch(440, 0.16, 0.42, 'triangle');
          } else {
            playTonePitch(440, 0.11, 0.42, 'triangle');
            setTimeout(() => {
              playTonePitch(440, 0.11, 0.42, 'triangle');
            }, beatMs / 2);
          }
        }, startOffset);
      });

      setTimeout(() => {
        drumLabState.dictationPlaying = false;
        drumLabState.dictationStatusText = 'Drag & drop Crotchets or Quavers into Beats 1–4!';
        const statusEl = document.getElementById('dictation-live-status');
        if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
      }, 8 * beatMs + 80);
    }

    function handleDictationDragStart(event, noteType) {
      drumLabState.draggedNoteTool = noteType;
      drumLabState.selectedNoteTool = noteType;
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', noteType);
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleDictationDrop(event, beatIdx) {
      if (event) event.preventDefault();
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      let droppedType = drumLabState.draggedNoteTool || drumLabState.selectedNoteTool;
      if (event && event.dataTransfer) {
        const dt = event.dataTransfer.getData('text/plain');
        if (dt === 'crotchet' || dt === 'quavers') droppedType = dt;
      }
      drumLabState.dictationGuess[beatIdx] = droppedType;
      drumLabState.draggedNoteTool = null;
      playTonePitch(droppedType === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function applySelectedDictationNote(beatIdx) {
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      drumLabState.dictationGuess[beatIdx] = drumLabState.selectedNoteTool;
      playTonePitch(drumLabState.selectedNoteTool === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function checkDictationPatternGuess() {
      const st = drumLabState;
      if (st.dictationAnswered || st.dictationCompleted) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the 4-beat pattern before checking your answer!', false); return; }
      if (st.dictationGuess.includes(null)) {
        showAppModal('Incomplete Bar', 'Please drag and drop a Crotchet or Paired Quavers into all 4 beat boxes before checking!', false);
        return;
      }

      const match = st.dictationTarget.every((v, i) => v === st.dictationGuess[i]);
      st.dictationAnswered = true;
      st.dictationLastCorrect = match;

      if (match) {
        st.dictationScore++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(165.00, 0.25, 0.3, 'sawtooth');
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function nextDictationRound() {
      const st = drumLabState;
      if (st.dictationRound < st.dictationTotalRounds) {
        st.dictationRound++;
        st.dictationTarget = generateSimpleRhythmDictation();
        st.dictationGuess = [null, null, null, null];
        st.dictationAnswered = false;
        st.audioPlayed = false;
        st.dictationStatusText = `Round ${st.dictationRound}: Click "Hear Pattern (4-Beat Count-In)" to listen!`;
        mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
      } else {
        st.dictationCompleted = true;
        mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
        showAppModal(
          '🎉 10-Round Dictation Complete!',
          `You matched ${st.dictationScore} out of ${st.dictationTotalRounds} rhythms and earned +${st.dictationScore * 2} Tokens (2 Tokens per correct answer)!`,
          st.dictationScore >= 5
        );
      }
    }

    function resetDictationChallenge() {
      drumLabState.dictationRound = 1;
      drumLabState.dictationScore = 0;
      drumLabState.dictationCompleted = false;
      drumLabState.dictationAnswered = false;
      drumLabState.audioPlayed = false;
      drumLabState.dictationTarget = generateSimpleRhythmDictation();
      drumLabState.dictationGuess = [null, null, null, null];
      drumLabState.dictationStatusText = 'Click "Hear Pattern (4-Beat Count-In)" to listen!';
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function mountEmbeddedDrumModule(target) {
      if (!target) return;
      const st = drumLabState;
      const allFilled = !st.dictationGuess.includes(null);

      target.innerHTML = `

          <div class="flex flex-wrap items-center gap-3 border-b border-slate-800 pb-4">
            <button type="button" onclick="drumLabState.activeTab='sequencer'; mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));" class="px-4 py-2.5 rounded-xl text-xs font-black transition-all ${st.activeTab === 'sequencer' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-white hover:bg-slate-700'}">

            </button>
            <button type="button" onclick="drumLabState.activeTab='dictation'; mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));" class="px-5 py-2.5 rounded-xl text-xs font-black transition-all border-2 ${st.activeTab === 'dictation' ? 'bg-amber-400 border-amber-200 text-slate-950 shadow-lg shadow-amber-400/30 scale-[1.02]' : 'bg-amber-500/20 border-amber-400 text-amber-300 hover:bg-amber-400 hover:text-slate-950 shadow-md shadow-amber-400/15'}">
              <i class="fa-solid fa-ear-listen mr-1.5"></i> 2. Dictation Activity (2 Tokens / Round)
            </button>
          </div>

          ${st.activeTab === 'sequencer' ? `
            <div class="space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="text-lg font-black">8-Beat Drum Groove Sequencer</h3>

                </div>
                <button type="button" onclick="toggleDrumSequencerLoop()" class="px-5 py-2.5 ${st.sequencerPlaying ? 'bg-rose-500 hover:bg-rose-400 text-white' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'} font-black rounded-xl text-xs shadow transition-all">
                  <i class="fa-solid ${st.sequencerPlaying ? 'fa-stop' : 'fa-repeat'} mr-1.5"></i> ${st.sequencerPlaying ? 'Stop Loop' : 'Play Loop (Repeat)'}

              </div>
              ${['hihat', 'snare', 'kick'].map(inst => `

              `).join('')}
            </div>
          ` : `

                  <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">10-Round Challenge • 2 Tokens Per Correct Answer</span>

              ${st.dictationCompleted ? `

                <!-- Draggable Note Value Palette (Crotchets & Quavers) -->
                <div class="space-y-2">
                  <div class="text-[11px] font-black uppercase tracking-wider text-slate-400">Step 1: Drag a Note Value Below (or Click to Select)</div>

                    <div draggable="true"

                      class="p-3.5 rounded-2xl border-2 flex items-center gap-3 cursor-grab active:cursor-grabbing select-none transition-all ${st.selectedNoteTool === 'crotchet' ? 'border-amber-400 bg-indigo-900 text-white shadow-md' : 'border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500'}">

                    <div draggable="true"
                      ondragstart="handleDictationDragStart(event, 'quavers')"

                      class="p-3.5 rounded-2xl border-2 flex items-center gap-3 cursor-grab active:cursor-grabbing select-none transition-all ${st.selectedNoteTool === 'quavers' ? 'border-amber-400 bg-indigo-900 text-white shadow-md' : 'border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500'}">
                      <div class="text-amber-300 shrink-0 pointer-events-none">${renderEngravedNoteDarkSVG('quavers', 'w-10 h-12')}</div>

                <div class="space-y-2">

                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    ${st.dictationGuess.map((noteType, idx) => {
                      const isActualCorrect = st.dictationAnswered && st.dictationTarget[idx] === noteType;
                      const isActualWrong = st.dictationAnswered && st.dictationTarget[idx] !== noteType;
                      return `
                        <div

                          class="p-4 rounded-2xl border-2 ${
                            isActualCorrect
                              ? 'border-emerald-400 bg-emerald-950/60'
                              : isActualWrong
                              ? 'border-rose-500 bg-rose-950/60'
                              : noteType
                              ? 'border-indigo-400 bg-slate-800'

                ${!st.dictationAnswered ? `

                      Check Round ${st.dictationRound} (+2 Tokens)
                    </button>
                    <button type="button" onclick="drumLabState.dictationGuess=[null,null,null,null]; mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));" class="px-4 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs">

              `}
            </div>

      `;
    }

    // ==========================================
    // INTERACTIVE MINIGAME 9: TEXTURE SOUND LAB & 5-ROUND LAYER DETECTIVE (2 TOKENS PER CORRECT ANSWER)
    // ==========================================
    const textureLabLayers = [
      { id: 'bass', role: 'BASS', name: 'Deep Bass Drone', color: '#818cf8', barBg: 'bg-indigo-500', desc: 'Low sustained C2 rumble' },
      { id: 'harmony', role: 'HARMONY', name: 'Warm Harmony Pad', color: '#f472b6', barBg: 'bg-pink-500', desc: 'Lush mid-range C major chord' },
      { id: 'rhythm', role: 'RHYTHM', name: 'Arpeggio Motion', color: '#fbbf24', barBg: 'bg-amber-400', desc: 'Pulsing 8th-note rhythmic pattern' },
      { id: 'melody', role: 'MELODY', name: 'Lead Melody', color: '#34d399', barBg: 'bg-emerald-400', desc: 'Expressive singing upper tune' },
      { id: 'air', role: 'UPPER AIR', name: 'Sparkle Chime', color: '#22d3ee', barBg: 'bg-cyan-400', desc: 'High shimmering bell overtones' }
    ];

    let textureLabState = {
      activeLayers: ['bass', 'melody'],
      round: 1,
      totalRounds: 5,
      score: 0,
      targetLayers: [],
      selectedGuess: [],
      answered: false,
      lastCorrect: false,
      completed: false,
      audioPlayed: false
    };

    function playTextureLayerCombination(layerIds) {
      if (!Array.isArray(layerIds) || layerIds.length === 0) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;

        // 1. Deep Bass Drone (Sawtooth low-pass C2)
        if (layerIds.includes('bass')) {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(65.41, now); // C2
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(210, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.42, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.48);
        }

        // 2. Warm Harmony Pad (Triangle triad C3-E3-G3)
        if (layerIds.includes('harmony')) {
          [130.81, 164.81, 196.00].forEach(freq => {
            playTonePitch(freq, 1.4, 0.14, 'triangle');
          });
        }

        // 3. Arpeggio Motion (Crisp square 8th-note steps)
        if (layerIds.includes('rhythm')) {
          const arpNotes = [261.63, 329.63, 392.00, 329.63, 261.63, 329.63, 392.00, 493.88];
          arpNotes.forEach((freq, idx) => {
            setTimeout(() => {
              playTonePitch(freq, 0.12, 0.16, 'square');
            }, idx * 170);
          });
        }

        // 4. Lead Melody (Singing upper melodic phrase G4-A4-G4-E4-C5)
        if (layerIds.includes('melody')) {
          const melSeq = [
            { freq: 392.00, delay: 0, dur: 0.32 },
            { freq: 440.00, delay: 330, dur: 0.25 },
            { freq: 392.00, delay: 600, dur: 0.25 },
            { freq: 523.25, delay: 880, dur: 0.52 }
          ];
          melSeq.forEach(n => {
            setTimeout(() => {
              playTonePitch(n.freq, n.dur, 0.26, 'sawtooth');
            }, n.delay);
          });
        }

        // 5. Sparkle Chime (High sine bell pings C6-G6-E6)
        if (layerIds.includes('air')) {
          const chimes = [
            { freq: 1046.50, delay: 120 },
            { freq: 1567.98, delay: 540 },
            { freq: 1318.51, delay: 980 }
          ];
          chimes.forEach(c => {
            setTimeout(() => {
              playTonePitch(c.freq, 0.45, 0.18, 'sine');
            }, c.delay);
          });
        }
      } catch (e) {}
    }

    function generateRandomTextureLayerSet(count) {
      const allIds = textureLabLayers.map(l => l.id).sort(() => Math.random() - 0.5);
      return allIds.slice(0, Math.min(5, Math.max(1, count)));
    }

    function toggleTextureSandboxLayer(layerId) {
      const idx = textureLabState.activeLayers.indexOf(layerId);
      if (idx >= 0) {
        textureLabState.activeLayers.splice(idx, 1);
      } else {
        textureLabState.activeLayers.push(layerId);
      }
      renderTextureLabGameUI();
    }

    function playTextureSandboxMix() {
      if (textureLabState.activeLayers.length === 0) {
        showAppModal('No Layers Active', 'Toggle at least one musical layer ON in the Sound Lab to hear its texture!', false);
        return;
      }
      playTextureLayerCombination(textureLabState.activeLayers);
    }

    function mountEmbeddedTextureLabGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      textureLabState = {
        activeLayers: ['bass', 'melody'],
        round: 1,
        totalRounds: 15,
        score: 0,
        targetLayers: generateRandomTextureLayerSet(1),
        selectedGuess: [],
        answered: false,
        lastCorrect: false,
        completed: false,
        audioPlayed: false
      };
      renderTextureLabGameUI(target);
    }

    function playMysteryTextureMix() {
      textureLabState.audioPlayed = true;
      playTextureLayerCombination(textureLabState.targetLayers);
    }

    function toggleMysteryTextureGuess(layerId) {
      if (textureLabState.answered || textureLabState.completed) return;
      const idx = textureLabState.selectedGuess.indexOf(layerId);
      if (idx >= 0) {
        textureLabState.selectedGuess.splice(idx, 1);
      } else {
        textureLabState.selectedGuess.push(layerId);
      }
      renderTextureLabGameUI();
    }

    function handleTextureDragStart(event, layerId) {
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', layerId);
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleTextureDrop(event) {
      if (event) event.preventDefault();
      const st = textureLabState;
      if (st.answered || st.completed) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the mystery mix before guessing!', false); return; }

      let layerId = null;
      if (event && event.dataTransfer) {
        layerId = event.dataTransfer.getData('text/plain');
      }
      if (!layerId) return;

      if (!st.selectedGuess.includes(layerId)) {
        st.selectedGuess.push(layerId);
        renderTextureLabGameUI();
      }
    }

    function removeTextureGuess(layerId) {
      const st = textureLabState;
      if (st.answered || st.completed) return;
      st.selectedGuess = st.selectedGuess.filter(id => id !== layerId);
      renderTextureLabGameUI();
    }

    function submitTextureLayerGuess() {
      const st = textureLabState;
      if (st.answered || st.completed || st.selectedGuess.length === 0) return;
      if (!st.audioPlayed) { showAppModal('Listen First', 'Please play the mystery mix before guessing!', false); return; }

      const sortedTarget = [...st.targetLayers].sort();
      const sortedGuess = [...st.selectedGuess].sort();
      const isRight =
        sortedTarget.length === sortedGuess.length &&
        sortedTarget.every((val, idx) => val === sortedGuess[idx]);

      st.answered = true;
      st.lastCorrect = isRight;

      if (isRight) {
        st.score++;
        playTonePitch(659.25, 0.22, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.28, 0.3, 'sawtooth');
      }
      renderTextureLabGameUI();
    }

    function nextTextureDetectiveRound() {
      const st = textureLabState;
      const count = Math.ceil(st.round / 3);
      
      if (!st.lastCorrect) {
        let newLayers = generateRandomTextureLayerSet(count);
        // Ensure at least one layer is different from the failed attempt if possible
        if (count < textureLabLayers.length) {
           while (newLayers.every(l => st.targetLayers.includes(l))) {
               newLayers = generateRandomTextureLayerSet(count);
           }
        }
        st.targetLayers = newLayers;
        st.selectedGuess = [];
        st.answered = false;
        st.audioPlayed = false;
        renderTextureLabGameUI();
        return;
      }

      if (st.round < st.totalRounds) {
        st.round++;
        st.targetLayers = generateRandomTextureLayerSet(Math.ceil(st.round / 3));
        st.selectedGuess = [];
        st.answered = false;
        st.audioPlayed = false;
        renderTextureLabGameUI();
      } else {
        st.completed = true;
        const reward = st.score * 2; // 2 tokens awarded for every correct answer
        if (reward > 0) addTokens(reward);
        renderTextureLabGameUI();
        showAppModal(
          '🎚️ Texture Layer Detective Complete!',
          `You completed all ${st.totalRounds} rounds correctly and earned +${reward} Tokens!`,
          true
        );
      }
    }

    function renderTextureLabGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = textureLabState;
      const activeCount = st.activeLayers.length;
      const densityLabel = activeCount === 0
        ? 'Silent (0)'
        : activeCount <= 2
        ? `Thin & Sparse (${activeCount})`
        : activeCount === 3
        ? `Medium Layering (${activeCount})`
        : `Thick & Dense (${activeCount})`;
      const densityBadgeStyle = activeCount <= 2
        ? 'bg-sky-900/80 text-sky-300 border-sky-500/40'
        : activeCount === 3
        ? 'bg-amber-900/80 text-amber-300 border-amber-500/40'
        : 'bg-rose-900/80 text-rose-300 border-rose-500/40';

      target.innerHTML = `
        <div class="space-y-6">
          <!-- PART 1: INTERACTIVE TEXTURE SOUND LAB -->
          <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <span class="text-[11px] font-black uppercase tracking-widest text-indigo-600">Interactive Sandbox</span>
                <h3 class="text-2xl font-black text-slate-900">Texture Sound Lab</h3>
                <p class="text-xs text-slate-500 mt-0.5">Toggle the 5 distinctive musical layers ON or OFF, then click <strong>Start Sound Lab</strong> to hear Thin vs. Thick textures.</p>
              </div>
              <button type="button" onclick="playTextureSandboxMix()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black rounded-2xl text-xs shadow-md transition-all shrink-0">
                <i class="fa-solid fa-play mr-1.5"></i> Start Sound Lab
              </button>
            </div>

            <!-- Dark Visualizer Box -->
            <div class="bg-slate-950 rounded-2xl p-5 sm:p-6 space-y-4">
              <div class="flex items-center justify-between">
                <span class="px-3 py-1 rounded-full text-xs font-black border ${densityBadgeStyle}">
                  ${densityLabel}
                </span>
                <span class="text-[11px] font-bold text-slate-400">${activeCount} of 5 layers active</span>
              </div>
              <div class="space-y-2.5 pt-1">
                ${[...textureLabLayers].reverse().map(layer => {
                  const isOn = st.activeLayers.includes(layer.id);
                  return `
                    <div class="h-3 rounded-full transition-all duration-300 ${isOn ? `${layer.barBg} w-full shadow-sm` : 'bg-slate-800/70 w-1/4'}"></div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 5 Layer Toggle Switches -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${textureLabLayers.map(layer => {
                const isOn = st.activeLayers.includes(layer.id);
                return `
                  <button type="button" onclick="toggleTextureSandboxLayer('${layer.id}')" class="p-4 rounded-2xl border-2 text-left flex items-center justify-between gap-3 transition-all ${
                    isOn ? 'border-pink-500 bg-pink-50/30 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'
                  }">
                    <div>
                      <div class="text-[10px] font-black uppercase tracking-wider text-slate-400">${layer.role}</div>

                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- PART 2: 15-ROUND MYSTERY TEXTURE LAYER DETECTIVE GAME -->
          <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">

              <div>
                <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">15-Round Ear Challenge • 2 Tokens Per Correct Answer</span>
                <h3 class="text-xl font-black text-white">Mystery Texture Layer Detective</h3>
                <p class="text-xs text-slate-300 mt-1">Listen to the randomized mix across <strong>15 rounds</strong>, select <strong>ALL active layers</strong> you hear, and earn <strong>2 Tokens</strong> for every correct round!</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
                  Round ${st.round} / ${st.totalRounds}
                </span>
                <span class="px-3 py-1 rounded-xl bg-emerald-950 border border-emerald-700 text-xs font-black text-emerald-300">
                  Score: ${st.score} (+${st.score * 2} Tokens)
                </span>
              </div>
            </div>

            ${st.completed ? `
              <div class="bg-emerald-950/60 border-2 border-emerald-500/60 rounded-2xl p-6 text-center space-y-3">
                <div class="w-14 h-14 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center text-2xl mx-auto shadow-lg">
                  <i class="fa-solid fa-layer-group"></i>
                </div>
                <h4 class="text-2xl font-black text-emerald-300">Texture Detective Complete!</h4>
                <p class="text-xs text-slate-200">You got <strong>${st.score} / ${st.totalRounds}</strong> rounds right and earned <strong>+${st.score * 2} Tokens</strong> (2 Tokens per correct answer)!</p>
                <button type="button" onclick="mountEmbeddedTextureLabGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">
                  Play Another 15 Rounds
                </button>
              </div>
            ` : `
              <div class="space-y-4">
                <div class="p-4 rounded-2xl bg-slate-800/80 border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div class="text-center sm:text-left">
                    <div class="text-xs font-black uppercase tracking-wider text-amber-300">Round ${st.round} of ${st.totalRounds}</div>
                    <p class="text-xs text-slate-300 mt-0.5">Click <strong>Play Mystery Mix</strong>, then highlight every instrument layer playing in the mix:</p>
                  </div>
                  <button type="button" onclick="playMysteryTextureMix()" class="px-6 py-3 bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black rounded-2xl text-xs shadow-lg shrink-0">
                    <i class="fa-solid fa-volume-high mr-1.5"></i> Play Mystery Mix
                  </button>
                </div>

    // ==========================================
    // MINIGAME 15: STAGGERED TEXTURE LAB (LESSON 2)
    // ==========================================
    let staggeredTextureState = {
      sandboxPlaying: false,
      sandboxActiveLayers: [],
      sandboxTimeoutIds: [],
      round: 1, totalRounds: 5, score: 0, targetType: null, targetStages: [], isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false
    };

    function generateStaggeredStages(type) {
      const all = ['bass', 'harmony', 'rhythm', 'melody', 'air'];
      const shuffled = all.sort(() => Math.random() - 0.5);
      
      let stages = [];
      if (type === 'thick') {
         stages.push([shuffled[0]]);
         stages.push([shuffled[0], shuffled[1], shuffled[2]]);
         stages.push([...shuffled]);
      } else {
         stages.push([...shuffled]);
         stages.push([shuffled[0], shuffled[1], shuffled[2]]);
         stages.push([shuffled[0]]);
      }
      return stages;
    }

    function playSandboxStaggered(type) {
      const st = staggeredTextureState;
      if (st.sandboxPlaying) return;
      st.sandboxPlaying = true;
      st.sandboxActiveLayers = [];
      renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
      
      const stageDelay = 1600;
      let stages = generateStaggeredStages(type);

      stages.forEach((layers, idx) => {
        const tId = setTimeout(() => {
          st.sandboxActiveLayers = layers;
          renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
          playTextureLayerCombination(layers);
        }, idx * stageDelay);
        st.sandboxTimeoutIds.push(tId);
      });

      const endId = setTimeout(() => {
        st.sandboxPlaying = false;
        st.sandboxActiveLayers = [];
        renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
      }, (stages.length * stageDelay) + 500);
      st.sandboxTimeoutIds.push(endId);
    }

    function setupStaggeredTextureRound() {
      staggeredTextureState.targetType = Math.random() > 0.5 ? 'thick' : 'thin';
      staggeredTextureState.targetStages = generateStaggeredStages(staggeredTextureState.targetType);
      staggeredTextureState.answered = false;
      staggeredTextureState.audioPlayed = false;
    }

    function playStaggeredMysterySequence() {
      if(staggeredTextureState.isPlaying) return;
      staggeredTextureState.isPlaying = true;
      staggeredTextureState.audioPlayed = true;
      renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));

      const stageDelay = 1600;
      let stages = staggeredTextureState.targetStages;

      stages.forEach((layers, idx) => {
        setTimeout(() => playTextureLayerCombination(layers), idx * stageDelay);
      });

      setTimeout(() => {
        staggeredTextureState.isPlaying = false;
        renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
      }, (stages.length * stageDelay) + 500);
    }

    function handleStaggeredDragStart(event) {
      if (event && event.dataTransfer) {

        event.dataTransfer.effectAllowed = 'copy';

    }

    function guessStaggeredTexture(guess) {
      const st = staggeredTextureState;
      if(st.answered || st.completed) return;
      if(!st.audioPlayed) { showAppModal('Listen First', 'Please play the mystery sequence before guessing!', false); return; }
      st.answered = true;
      st.lastCorrect = (guess === st.targetType);
      
      if(st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
    }
    
    function nextStaggeredTextureRound() {
      const st = staggeredTextureState;
      if (st.round < st.totalRounds) {
        st.round++;
        setupStaggeredTextureRound();
        renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
      } else {
        st.completed = true;
        renderStaggeredTextureLab(document.getElementById('embedded-tool-container'));
        showAppModal('Progressive Layering Complete!', `You identified ${st.score}/${st.totalRounds} sequences correctly and earned +${st.score} Tokens!`, st.score >= 3);
      }
    }

    function mountEmbeddedStaggeredTextureLab(target) {
      if (!target) return;
      // Clear any existing timeouts if game is unmounted mid-play
      if (staggeredTextureState && staggeredTextureState.sandboxTimeoutIds) {
        staggeredTextureState.sandboxTimeoutIds.forEach(id => clearTimeout(id));
      }
      staggeredTextureState = { sandboxPlaying: false, sandboxActiveLayers: [], sandboxTimeoutIds: [], round: 1, totalRounds: 5, score: 0, targetType: null, targetStages: [], isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false };

      renderStaggeredTextureLab(target);

    let toneSemitoneState = { round: 1, totalRounds: 10, score: 0, targetIsTone: null, targetKeys: [], isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false };

    const toneSemitoneScale = [

      const startIdx = Math.floor(Math.random() * 11);
      const isTone = Math.random() > 0.5;
      const endIdx = startIdx + (isTone ? 2 : 1);
      toneSemitoneState.targetIsTone = isTone;
      toneSemitoneState.targetKeys = [startIdx, endIdx];
      toneSemitoneState.answered = false;
      toneSemitoneState.lastCorrect = false;
      toneSemitoneState.audioPlayed = false;
    }

    function mountEmbeddedToneSemitoneGame(target) {
      if (!target) return;
      toneSemitoneState = { round: 1, totalRounds: 10, score: 0, targetIsTone: null, targetKeys: [], isPlaying: false, answered: false, lastCorrect: false, completed: false, audioPlayed: false };
      setupToneSemitoneRound();
      renderToneSemitoneGameUI(target);
    }

    function playToneSemitoneMystery() {
      if (toneSemitoneState.isPlaying || toneSemitoneState.answered) return;
      toneSemitoneState.isPlaying = true;
      toneSemitoneState.audioPlayed = true;
      renderToneSemitoneGameUI();
      
      const key1 = toneSemitoneScale[toneSemitoneState.targetKeys[0]];
      const key2 = toneSemitoneScale[toneSemitoneState.targetKeys[1]];

        playTonePitch(key2.freq, 0.5, 0.35, 'triangle');

          toneSemitoneState.isPlaying = false;
          renderToneSemitoneGameUI();
        }, 600);
      }, 700);

      st.answered = true;
      st.lastCorrect = (st.targetIsTone === guessIsTone);
      
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');

      renderToneSemitoneGameUI();

          ` : `
