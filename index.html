    function playWaveformTone(isTarget, start) {
       const st = waveformGameState;
       stopWaveformGame(); // Prevent overlapping pulses
       if (!start) return;

       const cfg = isTarget ? st.target : st.current;
       const ctx = getAudioCtx();
       if (!ctx) return;

       const osc = ctx.createOscillator();
       const gain = ctx.createGain();
       osc.type = wfgWaves[cfg.wave];
       osc.frequency.value = wfgFreqs[cfg.freq];
       gain.gain.value = wfgVols[cfg.vol];

       osc.connect(gain);
       gain.connect(ctx.destination);
       osc.start();

       if (isTarget) {
          st.targetOsc = osc;
       } else {
          st.synthOsc = osc;
       }
    }

    function playWaveformTone(isTarget) {
       const st = waveformGameState;
       stopWaveformGame(); // Prevent overlapping pulses

       const cfg = isTarget ? st.target : st.current;
       const ctx = getAudioCtx();
       if (!ctx) return;
       const now = ctx.currentTime;

       const osc = ctx.createOscillator();
       const gain = ctx.createGain();
       osc.type = wfgWaves[cfg.wave];
       osc.frequency.setValueAtTime(wfgFreqs[cfg.freq], now);
       
       gain.gain.setValueAtTime(0.001, now);
       gain.gain.linearRampToValueAtTime(wfgVols[cfg.vol], now + 0.05);
       gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

       osc.connect(gain);
       gain.connect(ctx.destination);
       osc.start(now);
       osc.stop(now + 1.6);

       if (isTarget) {
          st.targetOsc = osc;
       } else {
          st.synthOsc = osc;
       }
    }

    function generateWaveformSVG(waveIdx, freqIdx, volIdx, color) {
       const reps = freqIdx + 2; 
       const amp = 0.2 + (volIdx * 0.2); 
       const mid = 50;
       const h = 40 * amp;

       let d = `M 0 ${mid}`;
       const stepX = 100 / reps;

       for(let i=0; i<reps; i++) {
         const startX = i * stepX;
         const endX = (i+1) * stepX;
         const qX = startX + (stepX/2);

         if (waveIdx === 0) {
           d += ` Q ${startX + stepX*0.25} ${mid - h}, ${qX} ${mid} T ${endX} ${mid}`;
         } else if (waveIdx === 1) {
           d += ` L ${startX + stepX*0.25} ${mid - h} L ${startX + stepX*0.75} ${mid + h} L ${endX} ${mid}`;
         } else if (waveIdx === 2) {
           d += ` L ${startX} ${mid - h} L ${qX} ${mid - h} L ${qX} ${mid + h} L ${endX} ${mid + h} L ${endX} ${mid}`;
         } else if (waveIdx === 3) {
           d += ` L ${endX} ${mid - h} L ${endX} ${mid + h}`;
         }
       }
       if (waveIdx === 3) d += ` L 100 ${mid}`;

       return `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md" preserveAspectRatio="none">
         <line x1="0" y1="50" x2="100" y2="50" stroke="${color}" stroke-opacity="0.2" stroke-width="1" />
         <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" />
       </svg>`;
    }

    function startDynamicsTracer() {
        stopDynamicsTracer();
        const canvas = document.getElementById('tracer-canvas');
        if (!canvas) return;
        document.getElementById('tracer-start-overlay').classList.add('hidden');
        
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        
        dynamicsTracerState = {
            running: true,
            streak: 0,
            completed: false,
            canvas: canvas,
            ctx: canvas.getContext('2d'),
            path: [],
            playerY: canvas.height / 2,
            isTracing: false,
            framePhase: 0,
            lastToneTime: 0
        };

        // Fill initial quiet path
        for (let x = 0; x <= canvas.width + 20; x += 5) {
            dynamicsTracerState.path.push({x: x, y: canvas.height / 2, halfW: 60});
        }

        // Input binding (Mouse + Touch)
        const updatePlayerY = (e) => {
            if (!dynamicsTracerState.running) return;
            dynamicsTracerState.isTracing = true;
            const rect = canvas.getBoundingClientRect();
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) clientY = e.touches[0].clientY;
            dynamicsTracerState.playerY = clientY - rect.top;
        };
        
        canvas.onmousedown = (e) => { updatePlayerY(e); };
        canvas.onmousemove = (e) => { if(dynamicsTracerState.isTracing || e.buttons === 1) updatePlayerY(e); };
        canvas.onmouseup = () => dynamicsTracerState.isTracing = false;
        canvas.onmouseleave = () => dynamicsTracerState.isTracing = false;
        
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updatePlayerY(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePlayerY(e); }, {passive: false});
        canvas.addEventListener('touchend', () => dynamicsTracerState.isTracing = false);

        dynamicsTracerState.animFrame = requestAnimationFrame(tracerLoop);
    }
    
    function playTracerChord(isGood) {
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (isGood) {
               [261.63, 329.63, 392.00].forEach(f => playTonePitch(f, 0.2, 0.1, 'sine'));
            } else {
               [180, 205, 230].forEach(f => playTonePitch(f, 0.35, 0.2, 'sawtooth'));
            }
        } catch(e){}
    }

    function tracerLoop() {
        const st = dynamicsTracerState;
        if (!st.running) return;
        
        const w = st.canvas.width;
        const h = st.canvas.height;
        const ctx = st.ctx;
        
        // Difficulty strictly based on streak progress out of 200
        const diff = Math.min(1, st.streak / 200); 
        
        // As it scales, speed dramatically increases and waveforms become erratic!
        const speed = 4 + (diff * 8); 
        st.framePhase += 0.02 + (diff * 0.08);
        
        // Move path left
        for (let i = 0; i < st.path.length; i++) st.path[i].x -= speed;
        
        // Cleanup invisible segments
        while(st.path.length > 0 && st.path[0].x < -20) st.path.shift();
        
        // Add new extreme segments to right edge
        let lastX = st.path.length > 0 ? st.path[st.path.length-1].x : 0;
        while(lastX < w + 20) {
            lastX += 5;
            
            // Dramatic Rises & Drops based on scale
            const yAmplitude = 30 + (diff * 85); 
            const yWave = Math.sin(st.framePhase * 0.5) * yAmplitude + Math.sin(st.framePhase * 1.5) * (diff * 40);
            const targetY = (h / 2) + yWave;
            
            // Width modulates rapidly, shrinking to make it harder
            const wWave = Math.sin(st.framePhase * 0.8);
            const targetHalfW = 75 - (diff * 45) + (wWave * 15); 
            
            st.path.push({x: lastX, y: targetY, halfW: Math.max(12, targetHalfW)});
        }
        
        // Collision Detection at fixed Player X
        const playerX = 120;
        let currentSeg = st.path.find(p => p.x >= playerX) || st.path[0];
        
        let isInside = false;
        if (st.isTracing) {
            const upperY = currentSeg.y - currentSeg.halfW;
            const lowerY = currentSeg.y + currentSeg.halfW;
            if (st.playerY >= upperY && st.playerY <= lowerY) {
                isInside = true;
            }
        }
        
        const now = performance.now();
        if (isInside) {
            if (now - st.lastToneTime > 120) { 
                st.streak++;
                st.lastToneTime = now;
                const streakEl = document.getElementById('tracer-streak');
                if (streakEl) streakEl.textContent = st.streak + ' / 200';
                
                if (st.streak % 10 === 0) playTracerChord(true); 
                
                if (st.streak >= 200) {
                    st.running = false;
                    st.completed = true;
                    addTokens(15);
                    renderDynamicsTracerView(document.getElementById('app-viewport'));
                    return; 
                }
            }
        } else if (st.isTracing) {
            st.streak = 0;
            const streakEl = document.getElementById('tracer-streak');
            if (streakEl) streakEl.textContent = '0 / 200';
            
            if (now - st.lastToneTime > 300) {
                playTracerChord(false);
                st.lastToneTime = now;
                
                // Flash Red Error screen overlay
                st.ctx.fillStyle = 'rgba(225, 29, 72, 0.35)';
                st.ctx.fillRect(0,0,w,h);
            }
        }
        
        // Master Canvas Render
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, w, h);
        
        // Paint Path Boundaries
        ctx.beginPath();
        ctx.moveTo(st.path[0].x, st.path[0].y - st.path[0].halfW);
        for(let i=1; i<st.path.length; i++) ctx.lineTo(st.path[i].x, st.path[i].y - st.path[i].halfW);
        for(let i=st.path.length-1; i>=0; i--) ctx.lineTo(st.path[i].x, st.path[i].y + st.path[i].halfW);
        ctx.closePath();
        
        ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; 
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Draw Center Target Line (faint)
        ctx.beginPath();
        ctx.moveTo(st.path[0].x, st.path[0].y);
        for(let i=1; i<st.path.length; i++) ctx.lineTo(st.path[i].x, st.path[i].y);
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Draw Vertical Guide line
        ctx.beginPath();
        ctx.moveTo(playerX, 0);
        ctx.lineTo(playerX, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Render Player Baton
        ctx.beginPath();
        ctx.arc(playerX, st.playerY, 8, 0, Math.PI*2);
        ctx.fillStyle = isInside ? '#10b981' : (st.isTracing ? '#e11d48' : '#94a3b8');
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        st.animFrame = requestAnimationFrame(tracerLoop);
    }

    function startDrumHeroGame() {
        stopDrumHeroGame();
        const canvas = document.getElementById('dh-canvas');
        if (!canvas) return;
        document.getElementById('dh-start-overlay').classList.add('hidden');
        
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        
        drumHeroState = {
            running: true,
            streak: 0,
            best: drumHeroState.best || 0,
            completed: false,
            canvas: canvas,
            ctx: canvas.getContext('2d'),
            notes: [],
            lastTime: performance.now(),
            spawnTimer: 0,
            laneHitFeedback: [0, 0, 0],

            hitWindow: 35,
            paused: false,
            pauseTimer: 0
        };

        drumHeroState.animFrame = requestAnimationFrame(drumHeroLoop);
    }

    function drumHeroLoop(time) {
        const st = drumHeroState;
        if (!st.running) return;
        
        const delta = time - st.lastTime;
        st.lastTime = time;
        const ctx = st.ctx;
        const w = st.canvas.width;
        const h = st.canvas.height;
        const targetY = h - 60;
        
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, w, h);

        // Draw Lanes
        const laneW = w / 3;
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(laneW, 0); ctx.lineTo(laneW, h);
        ctx.moveTo(laneW * 2, 0); ctx.lineTo(laneW * 2, h);
        ctx.stroke();

        // Draw Target Zones & Feedback
        const laneColors = ['#818cf8', '#f472b6', '#fbbf24']; // Kick, Snare, Hi-Hat
        for (let i = 0; i < 3; i++) {
            const cx = (i * laneW) + (laneW / 2);
            // Feedback Flash
            if (st.laneHitFeedback[i] > 0) {
                ctx.fillStyle = laneColors[i];
                ctx.globalAlpha = st.laneHitFeedback[i] / 150;
                ctx.beginPath();
                ctx.arc(cx, targetY, 25, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (!st.paused) st.laneHitFeedback[i] -= delta;
            }

            // Target Rings
            ctx.strokeStyle = laneColors[i];
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, targetY, 20, 0, Math.PI*2);
            ctx.stroke();
        }

        if (st.paused) {
            st.pauseTimer -= delta;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('2 Tokens Awarded!', w/2, h/2 - 15);
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('Get ready for next round!', w/2, h/2 + 15);
            
            if (st.pauseTimer <= 0) {
                st.paused = false;
                st.notes = []; 
                st.spawnTimer = 0;
            }
            
            st.animFrame = requestAnimationFrame(drumHeroLoop);
            return;
        }

        // Difficulty scaling
        const currentSpeed = st.speed;
        const spawnInterval = Math.max(300, 1100 - (st.speed * 110));

        st.spawnTimer += delta;
        if (st.spawnTimer > spawnInterval) {
            st.spawnTimer = 0;
            const lane = Math.floor(Math.random() * 3);
            st.notes.push({ lane: lane, y: -20, hit: false, missed: false });
        }

        // Update and Draw Notes
        for (let i = st.notes.length - 1; i >= 0; i--) {
            let note = st.notes[i];
            if (note.hit) {
                st.notes.splice(i, 1);
                continue;
            }
            
            note.y += currentSpeed * (delta / 16);
            const cx = (note.lane * laneW) + (laneW / 2);

            if (note.y > targetY + st.hitWindow && !note.missed) {
                note.missed = true;
                st.streak = 0;
                playTonePitch(150, 0.15, 0.3, 'sawtooth');
                const strEl = document.getElementById('dh-streak');
                if (strEl) strEl.textContent = '0 / ' + st.best;
                
                // Red flash overlay for miss
                ctx.fillStyle = 'rgba(225, 29, 72, 0.3)';
                ctx.fillRect(0,0,w,h);
            }

            if (note.y > h + 30) {
                st.notes.splice(i, 1);
                continue;
            }

            // Draw Note
            ctx.fillStyle = note.missed ? '#475569' : laneColors[note.lane];
            ctx.beginPath();
            ctx.arc(cx, note.y, 16, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        st.animFrame = requestAnimationFrame(drumHeroLoop);
    }

    function handleDrumHeroKey(code) {
        const st = drumHeroState;
        if (!st.running || st.paused) return;

        let lane = -1;
        let audioType = 'hihat';
        if (code === 'ArrowLeft') { lane = 0; audioType = 'kick'; }
        if (code === 'ArrowDown') { lane = 1; audioType = 'snare'; }
        if (code === 'ArrowRight') { lane = 2; audioType = 'hihat'; }
        
        if (lane === -1) return;

        st.laneHitFeedback[lane] = 150; // trigger visual flash
        
        const h = st.canvas.height;
        const targetY = h - 60;
        
        // Find closest note in this lane
        let hitNote = null;
        let minDiff = Infinity;
        for (let i = 0; i < st.notes.length; i++) {
            const n = st.notes[i];
            if (n.lane === lane && !n.hit && !n.missed) {
                const diff = Math.abs(n.y - targetY);
                if (diff < minDiff) {
                    minDiff = diff;
                    hitNote = n;
                }
            }
        }

        if (hitNote && minDiff <= st.hitWindow) {
            hitNote.hit = true;
            st.streak++;
            if (st.streak > st.best) st.best = st.streak;
            playDrumSound(audioType);
            
            const strEl = document.getElementById('dh-streak');
            if (strEl) strEl.textContent = st.streak + ' / ' + st.best;

            if (st.streak >= 100) {
                st.completed = true;
                st.running = false;
                addTokens(15);
                renderDrumHeroGameView(document.getElementById('app-viewport'));
            } else if (st.streak > 0 && st.streak % 10 === 0) {
                st.paused = true;
                st.pauseTimer = 3000;
                st.speed += 0.4;
                addTokens(2);
            }
        } else {
            // Pressed when no note was in zone -> Break streak
            st.streak = 0;
            playTonePitch(150, 0.15, 0.3, 'sawtooth');
            const strEl = document.getElementById('dh-streak');
            if (strEl) strEl.textContent = '0 / ' + st.best;
        }
    }

    function stopWrenchGame() {
        if (wrenchGameState.timerId) clearInterval(wrenchGameState.timerId);
        wrenchGameState.running = false;
    }

    function startWrenchGame() {
        stopWrenchGame();
        wrenchGameState = {
            running: true,
            round: 1,
            sequence: [],
            playerSequence: [],
            isPlayingSequence: false,
            timerId: null,
            timeLeft: 3,
            showTimer: false,
            completed: false,
            score: 0
        };
        nextWrenchRound();
        renderWrenchGameView(document.getElementById('app-viewport'));
    }

    function nextWrenchRound() {
        const st = wrenchGameState;
        if (st.round > 12) {
            handleWrenchGameComplete();
            return;
        }
        st.playerSequence = [];
        
        // 3 rounds of 2, 3 of 3, 3 of 4, 3 of 5
        const seqLength = Math.floor((st.round - 1) / 3) + 2; 
        
        st.sequence = [];
        for (let i = 0; i < seqLength; i++) {
            st.sequence.push(Math.floor(Math.random() * wrenchInstruments.length));
        }
        
        if (st.round >= 7) {
            st.showTimer = true;
            st.timeLeft = 3;
        } else {
            st.showTimer = false;
        }

        playWrenchSequence();
    }

    function playWrenchSequence() {
        const st = wrenchGameState;
        st.isPlayingSequence = true;
        renderWrenchGameUIUpdates();

        let delay = 500;
        st.sequence.forEach((instIdx, i) => {
            setTimeout(() => {
                if(!st.running) return;
                const btn = document.getElementById('wrench-btn-' + instIdx);
                const inst = wrenchInstruments[instIdx];
                const aClasses = inst.activeClasses;
                if (btn) {
                    btn.classList.remove('bg-slate-800', inst.baseBorder, 'text-slate-300');
                    btn.classList.add(...aClasses);
                }
                inst.play();
                setTimeout(() => {
                    if (btn) {
                        btn.classList.remove(...aClasses);
                        btn.classList.add('bg-slate-800', inst.baseBorder, 'text-slate-300');
                    }
                }, 400);
            }, delay);
            delay += 800;
        });

        setTimeout(() => {
            if(!st.running) return;
            st.isPlayingSequence = false;
            renderWrenchGameUIUpdates();
            if (st.showTimer) {
                st.timerId = setInterval(() => {
                    st.timeLeft -= 1;
                    renderWrenchGameUIUpdates();
                    if (st.timeLeft <= 0) {
                        clearInterval(st.timerId);
                        handleWrenchFail();
                    }
                }, 1000);
            }
        }, delay);
    }

    function handleWrenchHit(instIdx) {
        const st = wrenchGameState;
        if (!st.running || st.isPlayingSequence || st.completed) return;

        const inst = wrenchInstruments[instIdx];
        inst.play();

        const btn = document.getElementById('wrench-btn-' + instIdx);
        const aClasses = inst.activeClasses;
        if (btn) {
            btn.classList.remove('bg-slate-800', inst.baseBorder, 'text-slate-300');
            btn.classList.add(...aClasses);
            setTimeout(() => {
                btn.classList.remove(...aClasses);
                btn.classList.add('bg-slate-800', inst.baseBorder, 'text-slate-300');
            }, 200);
        }

        st.playerSequence.push(instIdx);

        const currentIndex = st.playerSequence.length - 1;
        if (st.sequence[currentIndex] !== instIdx) {
            handleWrenchFail();
            return;
        }

        if (st.playerSequence.length === st.sequence.length) {
            if (st.timerId) clearInterval(st.timerId);
            const seqLen = st.sequence.length;
            const reward = seqLen === 1 ? 1 : 2;
            st.score += reward;
            addTokens(reward);
            
            const statusEl = document.getElementById('wrench-status');
            if (statusEl) {
                statusEl.innerHTML = `<span class="text-emerald-400">Perfect! +${reward} Token${reward > 1 ? 's' : ''}</span>`;
            }

            st.round++;
            setTimeout(() => {
                if(st.running) nextWrenchRound();
            }, 1000);
        }
    }

    function handleWrenchFail() {
        const st = wrenchGameState;
        if (st.timerId) clearInterval(st.timerId);
        playTonePitch(155.56, 0.3, 0.3, 'sawtooth');
        const statusEl = document.getElementById('wrench-status');
        if (statusEl) {
            statusEl.innerHTML = `<span class="text-rose-400">Oops! Try that round again...</span>`;
        }
        st.playerSequence = [];
        st.isPlayingSequence = true; 
        setTimeout(() => {
            if(st.running) {
                if (st.round >= 7) st.timeLeft = 3;
                playWrenchSequence();
            }
        }, 1500);

    // ==========================================
    // MINIGAME ARCADE: THE GROOVE LOCK (8-STRING BASS)
    // ==========================================
    let grooveLockState = {
        running: false,
        round: 1, totalRounds: 10, score: 0,
        pattern: [], 
        placedTokens: [],
        isPlaying: false,
        answered: false,
        lastCorrect: false,
        completed: false,
        playbackTimer: null
    };

    function generateGroovePattern() {
        const numKicks = Math.floor(Math.random() * 3) + 2; // 2 to 4 kicks
        const pattern = new Set();
        pattern.add(0); // Always beat 1
        while (pattern.size < numKicks) {
            pattern.add(Math.floor(Math.random() * 8));
        }
        return Array.from(pattern).sort();
    }

    function initGrooveLockGame() {
        stopGrooveLockGame();
        grooveLockState = {
            running: true, round: 1, totalRounds: 10, score: 0,
            pattern: generateGroovePattern(),
            placedTokens: [], isPlaying: false, answered: false, lastCorrect: false, completed: false,
            playbackTimer: null
        };
        renderGrooveLockGameView(document.getElementById('app-viewport'));
    }

    function stopGrooveLockGame() {
        if (grooveLockState.playbackTimer) clearInterval(grooveLockState.playbackTimer);
        grooveLockState.running = false;
        grooveLockState.isPlaying = false;
    }

    function nextGrooveLockRound() {
        const st = grooveLockState;
        if (st.round < st.totalRounds) {
            st.round++;
            st.pattern = generateGroovePattern();
            st.placedTokens = [];
            st.answered = false;
            st.lastCorrect = false;
            renderGrooveLockGameView(document.getElementById('app-viewport'));
        } else {
            st.completed = true;
            renderGrooveLockGameView(document.getElementById('app-viewport'));
            showAppModal('Groove Locked!', `You scored ${st.score}/${st.totalRounds} and earned +${st.score*2} Tokens!`, st.score >= 5);
        }
    }

    function playGrooveLoop() {
        const st = grooveLockState;
        if (st.isPlaying) return;
        st.isPlaying = true;
        renderGrooveLockGameView(document.getElementById('app-viewport'));
        
        let step = 0;
        st.playbackTimer = setInterval(() => {
            // Visual feedback
            document.querySelectorAll('.groove-segment').forEach((el, idx) => {
                if (idx === step) el.classList.add('bg-white/30');
                else el.classList.remove('bg-white/30');
            });
            
            // Audio
            playDrumSound('hihat');
            if (st.pattern.includes(step)) playDrumSound('kick');
            // Snare on 2 and 4 (indices 2 and 6)
            if (step === 2 || step === 6) playDrumSound('snare');
            
            step++;
            if (step >= 8) {
                clearInterval(st.playbackTimer);
                st.playbackTimer = null;
                setTimeout(() => {
                    document.querySelectorAll('.groove-segment').forEach(el => el.classList.remove('bg-white/30'));
                    st.isPlaying = false;
                    renderGrooveLockGameView(document.getElementById('app-viewport'));
                }, 300);
            }
        }, 300); // 300ms per 8th note = 100 BPM
    }
    
    function handleGrooveDragStart(e) {
        if (e && e.dataTransfer) {
            e.dataTransfer.setData('text/plain', 'bassToken');
            e.dataTransfer.effectAllowed = 'copy';

    }
    
    function handleGrooveDrop(e, index) {
        if (e) e.preventDefault();
        const st = grooveLockState;
        if (st.answered || st.completed || st.isPlaying) return;
        
        if (!st.placedTokens.includes(index)) {
            st.placedTokens.push(index);
            playTonePitch(87.31, 0.2, 0.4, 'sawtooth'); // Slap sound
            renderGrooveLockGameView(document.getElementById('app-viewport'));
        }
    }
    
    function removeGrooveToken(index) {
        const st = grooveLockState;
        if (st.answered || st.completed || st.isPlaying) return;
        st.placedTokens = st.placedTokens.filter(i => i !== index);
        renderGrooveLockGameView(document.getElementById('app-viewport'));
    }
    
    function checkGrooveLock() {
        const st = grooveLockState;
        if (st.answered || st.completed || st.isPlaying) return;
        
        const isCorrect = st.pattern.length === st.placedTokens.length && 
                          st.pattern.every(val => st.placedTokens.includes(val));
        
        st.answered = true;
        st.lastCorrect = isCorrect;
        
        if (isCorrect) {
            st.score++;
            addTokens(2);
            playTonePitch(659.25, 0.2, 0.35, 'triangle');
        } else {
            playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
        }
        renderGrooveLockGameView(document.getElementById('app-viewport'));
    }

    function handleRestDragStart(e, restId) {
      if (e && e.dataTransfer) {
        e.dataTransfer.setData('text/plain', restId);
        e.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleRestDrop(event) {
      if (event) {
        event.preventDefault();
        event.currentTarget.classList.remove('border-amber-400', 'bg-slate-700');
      }
      const st = restMatcherState;
      if (st.answered || st.completed) return;
      if (performance.now() - st.roundStartTime < 800) return;
      
      let droppedRestId = null;
      if (event && event.dataTransfer) {
        droppedRestId = event.dataTransfer.getData('text/plain');
      }
      if (!droppedRestId) return;

      st.answered = true;
      st.lastCorrect = (st.target.req === droppedRestId);
      
      if (st.lastCorrect) {
        st.score++;
        addTokens(1);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');
      }
      renderRestMatcherGameUI(document.getElementById('embedded-tool-container'));
    }

    function renderRestMatcherGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = restMatcherState;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">10-Round Challenge • Drag &amp; Drop</span>
              <h3 class="text-xl font-black">Rest Matcher Game</h3>
              <p class="text-xs text-slate-300 mt-1">Drag the correct rest symbol from below and drop it onto the matching note!</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">Round ${st.round} / ${st.totalRounds}</span>
              <span class="px-3 py-1 rounded-xl bg-emerald-950 border border-emerald-700 text-xs font-black text-emerald-300">Score: ${st.score} (+${st.score} Tokens)</span>
            </div>
          </div>

          ${st.completed ? `
            <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-3">
              <h4 class="text-xl font-black text-emerald-300">Challenge Complete!</h4>
              <p class="text-xs text-slate-200">You scored <strong>${st.score} / ${st.totalRounds}</strong> and earned <strong>+${st.score} Tokens</strong>!</p>
              <button type="button" onclick="mountEmbeddedRestMatcherGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Another 10 Rounds</button>
            </div>
          ` : `
            <div class="flex justify-center my-6">
              <div 
                ondragover="${!st.answered ? "event.preventDefault(); this.classList.add('border-amber-400', 'bg-slate-700');" : ""}"
                ondragleave="${!st.answered ? "this.classList.remove('border-amber-400', 'bg-slate-700');" : ""}"
                ondrop="${!st.answered ? "handleRestDrop(event)" : ""}"
                class="min-w-[8rem] px-6 h-32 rounded-3xl bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center text-slate-200 shadow-inner transition-colors ${!st.answered ? 'hover:border-amber-400' : 'opacity-50'}">
                ${st.target.html()}
              </div>
            </div>

            ${st.answered ? `
              <div class="p-4 rounded-2xl border ${st.lastCorrect ? 'bg-emerald-950/70 border-emerald-500 text-emerald-200' : 'bg-rose-950/70 border-rose-500 text-rose-200'} flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
                <span class="text-xs font-bold">${st.lastCorrect ? '✓ Spot on (+1 Token)!' : `✗ Incorrect. That note requires a <strong>${st.target.name} Rest</strong> (${st.target.beats}).`}</span>
                <button type="button" onclick="nextRestMatcherRound()" class="px-4 py-2 bg-white text-slate-950 hover:bg-slate-100 font-black rounded-xl text-xs shrink-0">
                  ${st.round < st.totalRounds ? 'Next Round →' : 'Finish'}
                </button>
              </div>
            ` : ''}

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${st.options.map(opt => `
                <div draggable="${!st.answered}" ondragstart="handleRestDragStart(event, '${opt.id}')"
                  class="p-4 rounded-2xl border-2 text-center transition-all flex flex-col items-center justify-center ${
                  st.answered && opt.id === st.target.id ? 'border-emerald-400 bg-emerald-950/60' : 
                  st.answered ? 'border-slate-700 bg-slate-800 opacity-50' : 'border-slate-700 bg-slate-800 hover:border-amber-400 hover:bg-slate-700 cursor-grab active:cursor-grabbing'
                }">
                  <div class="text-slate-300 pointer-events-none mb-2">${renderEngravedNoteDarkSVG(opt.id, 'w-12 h-16')}</div>
                  <div class="font-black text-sm text-white pointer-events-none">${opt.name} Rest</div>
                  <div class="text-[10px] font-bold text-slate-400 mt-0.5 pointer-events-none">${opt.beats}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.key) {
            window.app.currentUser = parsed;
            const db = getAllUserRecords();
            if (db[parsed.key]) {
              window.state = {
                stats: db[parsed.key].stats || { tokens: 10, testsTaken: 0 },
                inventory: db[parsed.key].inventory || [],
                testHistory: db[parsed.key].testHistory || [],
                completedLessons: db[parsed.key].completedLessons || []
              };
            }
          }
        }
      } catch (e) {}

      updateNavBar();
      updateGlobalLeaderboard();
      window.app.navigate('home');
    };
  </script>
</body>
</html>
