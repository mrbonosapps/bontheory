  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

          <div class="space-y-4">
            ${concept.levels.map(lvl => {
              const doneCount = lvl.lessons.filter(les => completed.includes(`${concept.id}_lvl${lvl.level}_les${les.lessonNum}`)).length;
              return `
                <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <span class="text-[11px] font-black uppercase tracking-wider text-indigo-600">Level ${lvl.level} • ${doneCount}/${lvl.lessons.length} Lessons Viewed</span>
                      <h2 class="text-xl font-black text-slate-800">${lvl.title}</h2>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                      <button onclick="app.navigate('levelDetail', { conceptId: '${concept.id}', levelNum: ${lvl.level} })" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shadow-sm">
                        View Lessons
                      </button>
                      <button onclick="app.navigate('levelTest', { conceptId: '${concept.id}', levelNum: ${lvl.level} })" class="px-4 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs shadow-sm">
                        Take 15-Question Test
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderLevelDetail(container, { conceptId, levelNum }) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const completed = state.completedLessons || [];

      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6">
          <button onclick="app.navigate('conceptDetail', { conceptId: '${concept.id}' })" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-2 border-indigo-200 hover:border-indigo-400 text-xs font-black shadow-sm transition-all">&larr; Back to ${concept.title}</button>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-black uppercase tracking-widest text-indigo-600">${concept.title}</span>
              <h1 class="text-2xl font-black text-slate-800 mt-1">${level.title}</h1>
            </div>
            <button onclick="app.navigate('levelTest', { conceptId: '${concept.id}', levelNum: ${level.level} })" class="px-5 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow shrink-0">
              <i class="fa-solid fa-clipboard-check mr-1"></i> Final 15-Question Test
            </button>
          </div>

          <div class="space-y-3">
            ${level.lessons.map(les => {
              const lessonKey = `${concept.id}_lvl${level.level}_les${les.lessonNum}`;
              const isDone = completed.includes(lessonKey);
              return `
                <div onclick="app.navigate('lessonDetail', { conceptId: '${concept.id}', levelNum: ${level.level}, lessonNum: ${les.lessonNum} })" class="bg-white rounded-2xl p-5 border ${isDone ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-200'} hover:border-indigo-400 shadow-sm transition-all cursor-pointer flex items-center justify-between gap-4">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm shrink-0 ${isDone ? 'bg-emerald-500 text-white' : 'bg-indigo-50 text-indigo-600'}">
                      ${isDone ? '<i class="fa-solid fa-check"></i>' : les.lessonNum}
                    </div>
                    <div>
                      <h3 class="font-black text-base text-slate-800">${les.title}</h3>
                      <p class="text-xs text-slate-500 mt-0.5">${les.summary}</p>
                    </div>
                  </div>
                  <span class="text-xs font-black text-indigo-600 shrink-0">Open &rarr;</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderLessonDetail(container, { conceptId, levelNum, lessonNum }) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const lessonIdx = level.lessons.findIndex(l => l.lessonNum === lessonNum);
      const lesson = lessonIdx >= 0 ? level.lessons[lessonIdx] : level.lessons[0];
      const nextLesson = level.lessons[lessonIdx + 1];

      const lessonKey = `${concept.id}_lvl${level.level}_les${lesson.lessonNum}`;
      if (!state.completedLessons) state.completedLessons = [];
      if (!state.completedLessons.includes(lessonKey)) {
        state.completedLessons.push(lessonKey);
        saveUserState();
      }

      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <button onclick="app.navigate('levelDetail', { conceptId: '${concept.id}', levelNum: ${level.level} })" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white border-2 border-indigo-700 hover:border-indigo-800 text-xs font-black shadow-md transition-all">
              <i class="fa-solid fa-arrow-left"></i> Back to ${level.title}
            </button>
            <span class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-black">
              <i class="fa-solid fa-check mr-1"></i> Lesson Viewed
            </span>
          </div>

          <article class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-4">
            <span class="text-xs font-black uppercase tracking-widest text-indigo-600">${concept.title} • ${level.title}</span>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800">${lesson.title}</h1>
            <div class="text-sm text-slate-700 leading-relaxed space-y-3 pt-2">
              ${lesson.content}
            </div>
          </article>

          <div id="embedded-tool-container"></div>

          <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
            <button onclick="app.navigate('levelDetail', { conceptId: '${concept.id}', levelNum: ${level.level} })" class="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl text-xs">
              All Level Lessons
            </button>
            ${nextLesson ? `
              <button onclick="app.navigate('lessonDetail', { conceptId: '${concept.id}', levelNum: ${level.level}, lessonNum: ${nextLesson.lessonNum} })" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shadow">
                Next: ${nextLesson.title} &rarr;
              </button>
            ` : `
              <button onclick="app.navigate('levelTest', { conceptId: '${concept.id}', levelNum: ${level.level} })" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs shadow">
                Take Final 15-Question Test &rarr;
              </button>
            `}
          </div>
        </div>
      `;

      const toolContainer = document.getElementById('embedded-tool-container');
      if (lesson.interactiveTool === 'beatTapGame') mountEmbeddedBeatTapGame(toolContainer);
      else if (lesson.interactiveTool === 'crotchetGame') mountEmbeddedCrotchetGame(toolContainer);
      else if (lesson.interactiveTool === 'quaverGame') mountEmbeddedQuaverGame(toolContainer);
      else if (lesson.interactiveTool === 'drumAndDictation') mountEmbeddedDrumModule(toolContainer);
      else if (lesson.interactiveTool === 'longNoteGame') mountEmbeddedLongNoteGame(toolContainer);
      else if (lesson.interactiveTool === 'pitchWaveGame') mountEmbeddedPitchWaveGame(toolContainer);
      else if (lesson.interactiveTool === 'melodicContourGame') mountEmbeddedMelodicContourGame(toolContainer);
      else if (lesson.interactiveTool === 'dynamicsSim') mountEmbeddedDynamicsSimulator(toolContainer);
      else if (lesson.interactiveTool === 'timbreSoundboard') mountEmbeddedTimbreSoundboard(toolContainer);
    }

    // ==========================================
    // MINIGAME 1: STEADY BEAT SPACEBAR TAPPER
    // ==========================================
    let beatTapTimer = null;
    let beatTapState = { running: false, speedIdx: 0, speeds: [75, 95, 115, 135], beatCount: 0, hits: 0, totalTargets: 8, beatTimestamp: 0, tappedThisBeat: false };

    function stopBeatTapLoop() {
      if (beatTapTimer) {
        clearInterval(beatTapTimer);
        beatTapTimer = null;
      }
      beatTapState.running = false;
    }

    function mountEmbeddedBeatTapGame(target) {
      if (!target) return;
      stopBeatTapLoop();
      beatTapState = { running: false, speedIdx: 0, speeds: [75, 95, 115, 135], beatCount: 0, hits: 0, totalTargets: 8, beatTimestamp: 0, tappedThisBeat: false };
      renderBeatTapUI(target);
    }

    function startBeatTapRound() {
      stopBeatTapLoop();
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const intervalMs = Math.round(60000 / bpm);
      beatTapState.running = true;
      beatTapState.beatCount = 0;
      beatTapState.hits = 0;
      beatTapState.tappedThisBeat = false;
      renderBeatTapUI();

      beatTapTimer = setInterval(() => {
        beatTapState.beatCount++;
        beatTapState.beatTimestamp = performance.now();
        beatTapState.tappedThisBeat = false;
        playTonePitch(beatTapState.beatCount <= 4 ? 880 : 587.33, 0.08, 0.3, 'sine');
        renderBeatTapUI();

        if (beatTapState.beatCount > 4 + beatTapState.totalTargets) {
          stopBeatTapLoop();
          if (beatTapState.hits >= 6) {
            if (beatTapState.speedIdx < 3) {
              beatTapState.speedIdx++;
              showAppModal('Speed Cleared!', `Great steady pulse (${beatTapState.hits}/8 hits)! Advancing to Speed ${beatTapState.speedIdx + 1} (${beatTapState.speeds[beatTapState.speedIdx]} BPM).`, true);
            } else {
              addTokens(10);
              beatTapState.speedIdx = 0;
              showAppModal('Steady Beat Mastered!', 'You conquered all 4 tempo speeds and earned +10 Tokens!', true);
            }
          } else {
            showAppModal('Keep Practicing!', `You hit ${beatTapState.hits}/8 beats on time. Try again to lock into the pulse!`, false);
          }
          renderBeatTapUI();
        }
      }, intervalMs);
    }

    function triggerBeatTapHit() {
      if (!beatTapState.running || beatTapState.beatCount <= 4 || beatTapState.tappedThisBeat) return;
      const diff = Math.abs(performance.now() - beatTapState.beatTimestamp);
      beatTapState.tappedThisBeat = true;
      if (diff <= 260) {
        beatTapState.hits++;
        playTonePitch(1046.5, 0.09, 0.35, 'triangle');
      }
      renderBeatTapUI();
    }

    function renderBeatTapUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const statusText = !beatTapState.running
        ? `Ready for Speed ${beatTapState.speedIdx + 1} (${bpm} BPM)`
        : beatTapState.beatCount <= 4
        ? `Count-In: ${beatTapState.beatCount}`
        : `Beat ${Math.min(8, beatTapState.beatCount - 4)} of 8 • Hits: ${beatTapState.hits}/8`;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800 text-center">
          <div>
            <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Pulse Challenge • Speed ${beatTapState.speedIdx + 1} of 4 (${bpm} BPM)</span>
            <h3 class="text-xl font-black mt-1">Steady Beat Spacebar Tapper</h3>
            <p class="text-xs text-slate-300 mt-1">After the 4-beat count-in, press <strong>Spacebar</strong> (or tap below) in time with every steady beat.</p>
          </div>
          <div class="text-2xl sm:text-3xl font-black text-amber-300 py-3">${statusText}</div>
          <div class="flex justify-center gap-3">
            ${!beatTapState.running ? `
              <button type="button" onclick="startBeatTapRound()" class="px-6 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow">
                Start Speed ${beatTapState.speedIdx + 1} (${bpm} BPM)
              </button>
            ` : `
              <button type="button" onmousedown="triggerBeatTapHit()" ontouchstart="event.preventDefault(); triggerBeatTapHit();" class="px-8 py-4 bg-indigo-600 active:bg-emerald-500 text-white font-black rounded-2xl text-sm shadow-lg">
                TAP BEAT (OR SPACEBAR)
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 2: 8-BEAT CROTCHET SIGHT-READER (4-BEAT COUNT-IN, LARGE FONT)
    // ==========================================
    let crotchetTimer = null;
    let crotchetState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], tick: 0, pattern: [], hits: 0, mistakes: 0, tappedThisBeat: false };

    function stopCrotchetGameLoop() {
      if (crotchetTimer) {
        clearInterval(crotchetTimer);
        crotchetTimer = null;
      }
      crotchetState.running = false;
    }

    function generateCrotchetPattern() {
      const arr = Array.from({ length: 8 }, () => (Math.random() > 0.35 ? 1 : 0));
      if (!arr.includes(1)) arr[0] = 1;
      return arr;
    }

    function mountEmbeddedCrotchetGame(target) {
      if (!target) return;
      stopCrotchetGameLoop();
      crotchetState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], tick: 0, pattern: generateCrotchetPattern(), hits: 0, mistakes: 0, tappedThisBeat: false };
      renderCrotchetGameUI(target);
    }

    function startCrotchetSpeed() {
      stopCrotchetGameLoop();
      crotchetState.pattern = generateCrotchetPattern();
      crotchetState.running = true;
      crotchetState.tick = 0;
      crotchetState.hits = 0;
      crotchetState.mistakes = 0;
      crotchetState.tappedThisBeat = false;
      const bpm = crotchetState.speeds[crotchetState.speedIdx];
      const ms = Math.round(60000 / bpm);
      renderCrotchetGameUI();

      crotchetTimer = setInterval(() => {
        crotchetState.tick++;
        crotchetState.tappedThisBeat = false;
        playTonePitch(crotchetState.tick <= 4 ? 880 : 523.25, 0.07, 0.25, 'sine');
        renderCrotchetGameUI();

        if (crotchetState.tick > 12) {
          stopCrotchetGameLoop();
          const expectedHits = crotchetState.pattern.filter(v => v === 1).length;
          if (crotchetState.hits >= Math.max(1, expectedHits - 1) && crotchetState.mistakes <= 1) {
            if (crotchetState.speedIdx < 3) {
              crotchetState.speedIdx++;
              showAppModal('Pattern Cleared!', `Nice sight-reading! Advancing to Speed ${crotchetState.speedIdx + 1} (${crotchetState.speeds[crotchetState.speedIdx]} BPM).`, true);
            } else {
              addTokens(10);
              crotchetState.speedIdx = 0;
              showAppModal('Crotchet Sight-Reader Mastered!', 'You completed all 4 speeds and earned +10 Tokens!', true);
            }
          } else {
            showAppModal('Try Again!', `You hit ${crotchetState.hits}/${expectedHits} crotchets with ${crotchetState.mistakes} extra taps on rests.`, false);
          }
          crotchetState.pattern = generateCrotchetPattern();
          renderCrotchetGameUI();
        }
      }, ms);
    }

    function triggerCrotchetTap() {
      if (!crotchetState.running || crotchetState.tick < 5 || crotchetState.tick > 12 || crotchetState.tappedThisBeat) return;
      crotchetState.tappedThisBeat = true;
      const beatIdx = crotchetState.tick - 5;
      if (crotchetState.pattern[beatIdx] === 1) {
        crotchetState.hits++;
        playTonePitch(659.25, 0.1, 0.35, 'triangle');
      } else {
        crotchetState.mistakes++;
        playTonePitch(164.81, 0.14, 0.3, 'sawtooth');
      }
      renderCrotchetGameUI();
    }

    function renderCrotchetGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = crotchetState.speeds[crotchetState.speedIdx];
      const activeBeat = crotchetState.tick >= 5 && crotchetState.tick <= 12 ? crotchetState.tick - 5 : -1;
      const cueBanner = !crotchetState.running
        ? `Speed ${crotchetState.speedIdx + 1} of 4 • ${bpm} BPM`
        : crotchetState.tick <= 4
        ? `COUNT-IN: ${crotchetState.tick} / 4`
        : `PLAY BEAT ${activeBeat + 1} OF 8`;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">8-Beat Sight-Reading Challenge</span>
              <h3 class="text-xl font-black">Crotchet vs. Rest Sight-Reader</h3>
              <p class="text-xs text-slate-300">After the 4-beat count-in, press <strong>Spacebar</strong> ONLY on beats with a Crotchet and hold on Rests!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200 self-start">
              Speed ${crotchetState.speedIdx + 1}/4 (${bpm} BPM)
            </span>
          </div>

          <div class="text-center text-2xl sm:text-3xl font-black text-amber-300 py-1">${cueBanner}</div>

          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5">
            ${crotchetState.pattern.map((val, idx) => `
              <div class="p-3 rounded-2xl border-2 text-center transition-all ${activeBeat === idx ? 'beat-active bg-indigo-900 border-amber-400' : 'bg-slate-800 border-slate-700'}">
                <div class="text-xs font-black text-slate-400 mb-1">Beat ${idx + 1}</div>
                ${renderEngravedNoteDarkSVG(val === 1 ? 'crotchet' : 'rest', val === 1 ? '#fbbf24' : '#64748b', 'w-10 h-14')}
                <div class="text-[10px] font-bold mt-1 ${val === 1 ? 'text-amber-300' : 'text-slate-400'}">${val === 1 ? 'TAP' : 'REST'}</div>
              </div>
            `).join('')}
          </div>

          <div class="flex justify-center pt-1">
            ${!crotchetState.running ? `
              <button type="button" onclick="startCrotchetSpeed()" class="px-6 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow">
                Start 4-Beat Count-In (${bpm} BPM)
              </button>
            ` : `
              <button type="button" onmousedown="triggerCrotchetTap()" ontouchstart="event.preventDefault(); triggerCrotchetTap();" class="px-8 py-4 bg-indigo-600 active:bg-emerald-500 text-white font-black rounded-2xl text-sm shadow-lg">
                TAP CROTCHET (SPACEBAR)
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 3: QUAVER & CROTCHET COMBINATION SIGHT-READER
    // ==========================================
    let quaverTimer = null;
    let quaverState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], subTick: 0, pattern: [], hits: 0 };

    function stopQuaverGameLoop() {
      if (quaverTimer) {
        clearInterval(quaverTimer);
        quaverTimer = null;
      }
      quaverState.running = false;
    }

    function generateQuaverPattern() {
      const types = ['crotchet', 'quavers', 'rest'];
      return Array.from({ length: 8 }, () => types[Math.floor(Math.random() * types.length)]);
    }

    function mountEmbeddedQuaverGame(target) {
      if (!target) return;
      stopQuaverGameLoop();
      quaverState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], subTick: 0, pattern: generateQuaverPattern(), hits: 0 };
      renderQuaverGameUI(target);
    }

    function startQuaverSpeed() {
      stopQuaverGameLoop();
      quaverState.pattern = generateQuaverPattern();
      quaverState.running = true;
      quaverState.subTick = 0;
      quaverState.hits = 0;
      const bpm = quaverState.speeds[quaverState.speedIdx];
      const eighthMs = Math.round(30000 / bpm);
      renderQuaverGameUI();

      quaverTimer = setInterval(() => {
        quaverState.subTick++;
        if (quaverState.subTick % 2 === 1) {
          playTonePitch(quaverState.subTick <= 8 ? 880 : 523.25, 0.06, 0.22, 'sine');
        }
        renderQuaverGameUI();

        if (quaverState.subTick > 24) {
          stopQuaverGameLoop();
          if (quaverState.hits >= 5) {
            if (quaverState.speedIdx < 3) {
              quaverState.speedIdx++;
              showAppModal('Quaver Groove Cleared!', `Great subdivisions! Moving to Speed ${quaverState.speedIdx + 1} (${quaverState.speeds[quaverState.speedIdx]} BPM).`, true);
            } else {
              addTokens(10);
              quaverState.speedIdx = 0;
              showAppModal('Quaver & Crotchet Master!', 'You mastered all 4 speeds and earned +10 Tokens!', true);
            }
          } else {
            showAppModal('Keep Practicing!', 'Tap once on Crotchets and twice quickly ("1 &") on Paired Quavers!', false);
          }
          quaverState.pattern = generateQuaverPattern();
          renderQuaverGameUI();
        }
      }, eighthMs);
    }

    function triggerQuaverTap() {
      if (!quaverState.running || quaverState.subTick < 9 || quaverState.subTick > 24) return;
      const idx = quaverState.subTick - 9;
      const beatIdx = Math.floor(idx / 2);
      const isAnd = idx % 2 === 1;
      const noteType = quaverState.pattern[beatIdx];

      if (noteType === 'quavers' || (noteType === 'crotchet' && !isAnd)) {
        quaverState.hits++;
        playTonePitch(783.99, 0.08, 0.35, 'triangle');
      } else {
        playTonePitch(164.81, 0.1, 0.25, 'sawtooth');
      }
      renderQuaverGameUI();
    }

    function renderQuaverGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = quaverState.speeds[quaverState.speedIdx];
      const activeBeat = quaverState.subTick >= 9 && quaverState.subTick <= 24 ? Math.floor((quaverState.subTick - 9) / 2) : -1;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Subdivision Sight-Reader</span>
              <h3 class="text-xl font-black">Quavers (2 Taps) &amp; Crotchets (1 Tap) Challenge</h3>
              <p class="text-xs text-slate-300">Tap <strong>twice ("1 &amp;")</strong> on Paired Quavers, <strong>once</strong> on Crotchets, and hold on Rests!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200 self-start">
              Speed ${quaverState.speedIdx + 1}/4 (${bpm} BPM)
            </span>
          </div>

          <div class="text-center text-2xl font-black text-amber-300">
            ${!quaverState.running ? `Ready • ${bpm} BPM` : quaverState.subTick <= 8 ? `Count-In: ${Math.ceil(quaverState.subTick / 2)}` : `Beat ${activeBeat + 1} of 8 • Hits: ${quaverState.hits}`}
          </div>

          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5">
            ${quaverState.pattern.map((type, idx) => `
              <div class="p-3 rounded-2xl border-2 text-center transition-all ${activeBeat === idx ? 'beat-active bg-indigo-900 border-amber-400' : 'bg-slate-800 border-slate-700'}">
                <div class="text-xs font-black text-slate-400 mb-1">${type === 'quavers' ? `${idx + 1} &` : `Beat ${idx + 1}`}</div>
                ${renderEngravedNoteDarkSVG(type, type === 'rest' ? '#64748b' : '#fbbf24', 'w-11 h-14')}
                <div class="text-[10px] font-bold mt-1 text-slate-300 uppercase">${type === 'quavers' ? '2 Taps' : type === 'crotchet' ? '1 Tap' : 'Rest'}</div>
              </div>
            `).join('')}
          </div>

          <div class="flex justify-center">
            ${!quaverState.running ? `
              <button type="button" onclick="startQuaverSpeed()" class="px-6 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow">
                Start Quaver Challenge (${bpm} BPM)
              </button>
            ` : `
              <button type="button" onmousedown="triggerQuaverTap()" ontouchstart="event.preventDefault(); triggerQuaverTap();" class="px-8 py-4 bg-indigo-600 active:bg-emerald-500 text-white font-black rounded-2xl text-sm shadow-lg">
                TAP RHYTHM (SPACEBAR)
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 4: LONG NOTE SUSTAIN SYNTH MODULE (MINIMS, DOTTED MINIMS, SEMIBREVES)
    // ==========================================
    let longNoteTimer = null;
    let longNoteState = { running: false, speedIdx: 0, speeds: [76, 92, 108, 124], tick: 0, holding: false, heldBeats: 0, phrase: [] };

    function stopLongNoteGameLoop() {
      if (longNoteTimer) {
        clearInterval(longNoteTimer);
        longNoteTimer = null;
      }
      longNoteState.running = false;
      longNoteState.holding = false;
    }

    function buildLongNotePhrase() {
      const phrases = [
        [{ type: 'semibreve', beats: 4, label: 'Semibreve (4)' }, { type: 'minim', beats: 2, label: 'Minim (2)' }, { type: 'minim', beats: 2, label: 'Minim (2)' }],
        [{ type: 'dottedMinim', beats: 3, label: 'Dotted Minim (3)' }, { type: 'crotchet', beats: 1, label: 'Crotchet (1)' }, { type: 'semibreve', beats: 4, label: 'Semibreve (4)' }],
        [{ type: 'minim', beats: 2, label: 'Minim (2)' }, { type: 'dottedMinim', beats: 3, label: 'Dotted Minim (3)' }, { type: 'dottedMinim', beats: 3, label: 'Dotted Minim (3)' }]
      ];
      return phrases[Math.floor(Math.random() * phrases.length)];
    }

    function mountEmbeddedLongNoteGame(target) {
      if (!target) return;
      stopLongNoteGameLoop();
      longNoteState = { running: false, speedIdx: 0, speeds: [76, 92, 108, 124], tick: 0, holding: false, heldBeats: 0, phrase: buildLongNotePhrase() };
      renderLongNoteGameUI(target);
    }

    function startLongNoteRound() {
      stopLongNoteGameLoop();
      longNoteState.phrase = buildLongNotePhrase();
      longNoteState.running = true;
      longNoteState.tick = 0;
      longNoteState.heldBeats = 0;
      const bpm = longNoteState.speeds[longNoteState.speedIdx];
      const ms = Math.round(60000 / bpm);
      renderLongNoteGameUI();

      longNoteTimer = setInterval(() => {
        longNoteState.tick++;
        playTonePitch(longNoteState.tick <= 4 ? 880 : 440, 0.08, 0.22, 'sine');
        if (longNoteState.tick > 4 && longNoteState.holding) {
          longNoteState.heldBeats++;
          playTonePitch(329.63, ms / 1000, 0.28, 'triangle');
        }
        renderLongNoteGameUI();

        if (longNoteState.tick >= 12) {
          stopLongNoteGameLoop();
          if (longNoteState.heldBeats >= 5) {
            if (longNoteState.speedIdx < 3) {
              longNoteState.speedIdx++;
              showAppModal('Long Note Phrase Cleared!', `Great sustain control! Advancing to Speed ${longNoteState.speedIdx + 1} (${longNoteState.speeds[longNoteState.speedIdx]} BPM).`, true);
            } else {
              addTokens(10);
              longNoteState.speedIdx = 0;
              showAppModal('Long Note Sustain Mastered!', 'You mastered Minims, Dotted Minims & Semibreves across all 4 speeds (+10 Tokens)!', true);
            }
          } else {
            showAppModal('Hold Longer!', 'Press and HOLD Spacebar (or the Hold Pad) for the full 2, 3, or 4 beats of each long note!', false);
          }
          renderLongNoteGameUI();
        }
      }, ms);
    }

    function handleLongNoteDown() {
      if (!longNoteState.running) return;
      longNoteState.holding = true;
      playTonePitch(329.63, 0.35, 0.3, 'triangle');
      renderLongNoteGameUI();
    }

    function handleLongNoteUp() {
      longNoteState.holding = false;
      renderLongNoteGameUI();
    }

    function renderLongNoteGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = longNoteState.speeds[longNoteState.speedIdx];
      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Long Note Sustain Synth</span>
              <h3 class="text-xl font-black">Hold Minims (2), Dotted Minims (3) &amp; Semibreves (4)</h3>
              <p class="text-xs text-slate-300">After the 4-beat count-in, press and <strong>HOLD</strong> Spacebar (or the button below) for each note's exact beat duration!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200 self-start">
              Speed ${longNoteState.speedIdx + 1}/4 (${bpm} BPM)
            </span>
          </div>

          <div class="grid grid-cols-3 gap-4">
            ${longNoteState.phrase.map(n => `
              <div class="p-4 rounded-2xl bg-slate-800 border border-slate-700 text-center">
                ${renderEngravedNoteDarkSVG(n.type, '#fbbf24', 'w-14 h-20')}
                <div class="font-black text-xs text-amber-300 mt-1">${n.label}</div>
              </div>
            `).join('')}
          </div>

          <div class="text-center text-xl font-black text-amber-300">
            ${!longNoteState.running ? `Ready • ${bpm} BPM` : longNoteState.tick <= 4 ? `Count-In: ${longNoteState.tick}/4` : `Beat ${longNoteState.tick - 4} of 8 • Sustained Beats: ${longNoteState.heldBeats}`}
          </div>

          <div class="flex justify-center">
            ${!longNoteState.running ? `
              <button type="button" onclick="startLongNoteRound()" class="px-6 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow">
                Start Long Note Synth (${bpm} BPM)
              </button>
            ` : `
              <button type="button"
                onmousedown="handleLongNoteDown()" onmouseup="handleLongNoteUp()" onmouseleave="handleLongNoteUp()"
                ontouchstart="event.preventDefault(); handleLongNoteDown();" ontouchend="handleLongNoteUp()"
                class="px-8 py-4 ${longNoteState.holding ? 'bg-emerald-500 text-slate-950 scale-95' : 'bg-indigo-600 text-white'} font-black rounded-2xl text-sm shadow-lg transition-all">
                ${longNoteState.holding ? 'HOLDING SUSTAIN...' : 'PRESS & HOLD (OR SPACEBAR)'}
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 5: PITCH & SOUND-WAVE MATCHER
    // ==========================================
    const pitchWaveOptions = [
      { id: 'low', label: 'Low Pitch (~130 Hz)', desc: 'Slow, wide sound waves', freq: 130.81, path: 'M0 24 Q 22.5 4, 45 24 T 90 24 T 135 24 T 180 24', color: '#818cf8' },
      { id: 'mid', label: 'Medium Pitch (~262 Hz)', desc: 'Moderate sound waves', freq: 261.63, path: 'M0 24 Q 11.25 4, 22.5 24 T 45 24 T 67.5 24 T 90 24 T 112.5 24 T 135 24 T 157.5 24 T 180 24', color: '#34d399' },
      { id: 'high', label: 'High Pitch (~523 Hz)', desc: 'Fast sound waves', freq: 523.25, path: 'M0 24 Q 6 4, 12 24 T 24 24 T 36 24 T 48 24 T 60 24 T 72 24 T 84 24 T 96 24 T 108 24 T 120 24 T 132 24 T 144 24 T 156 24 T 168 24 T 180 24', color: '#fbbf24' },
      { id: 'vhigh', label: 'Very High Pitch (~880 Hz)', desc: 'Tightly packed waves', freq: 880.00, path: 'M0 24 Q 3.75 4, 7.5 24 T 15 24 T 22.5 24 T 30 24 T 37.5 24 T 45 24 T 52.5 24 T 60 24 T 67.5 24 T 75 24 T 82.5 24 T 90 24 T 97.5 24 T 105 24 T 112.5 24 T 120 24 T 127.5 24 T 135 24 T 142.5 24 T 150 24 T 157.5 24 T 165 24 T 172.5 24 T 180 24', color: '#fb7185' }
    ];

    let pitchWaveState = { round: 1, score: 0, targetId: 'low', completed: false };

    function mountEmbeddedPitchWaveGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      pitchWaveState = { round: 1, score: 0, targetId: pitchWaveOptions[Math.floor(Math.random() * 3)].id, completed: false };
      renderPitchWaveUI(target);
    }

    function playMysteryPitchWave() {
      const item = pitchWaveOptions.find(o => o.id === pitchWaveState.targetId) || pitchWaveOptions[0];
      playTonePitch(item.freq, 0.55, 0.42, 'sine');
    }

    function guessPitchWave(chosenId) {
      if (pitchWaveState.completed) return;
      const isCorrect = chosenId === pitchWaveState.targetId;
      if (isCorrect) {
        pitchWaveState.score++;
        playTonePitch(659.25, 0.18, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.22, 0.3, 'sawtooth');
      }

      if (pitchWaveState.round < 4) {
        pitchWaveState.round++;
        const poolSize = pitchWaveState.round >= 3 ? 4 : 3;
        pitchWaveState.targetId = pitchWaveOptions[Math.floor(Math.random() * poolSize)].id;
        renderPitchWaveUI();
      } else {
        pitchWaveState.completed = true;
        const reward = pitchWaveState.score >= 3 ? 10 : 5;
        addTokens(reward);
        renderPitchWaveUI();
        showAppModal('Sound-Wave Matcher Complete!', `You matched ${pitchWaveState.score}/4 pitches to their waveforms and earned +${reward} Tokens!`, true);
      }
    }

    function renderPitchWaveUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const choices = pitchWaveState.round >= 3 ? pitchWaveOptions : pitchWaveOptions.slice(0, 3);

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Ear &amp; Waveform Lab</span>
              <h3 class="text-xl font-black">Pitch &amp; Sound-Wave Matcher</h3>
              <p class="text-xs text-slate-300">Listen to the mystery pitch, then click the sound-wave diagram that matches its frequency!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200 self-start">
              Round ${pitchWaveState.round} / 4 • Score: ${pitchWaveState.score}
            </span>
          </div>

          ${pitchWaveState.completed ? `
            <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-3">
              <h4 class="text-xl font-black text-emerald-300">All 4 Rounds Complete (${pitchWaveState.score}/4)!</h4>
              <button type="button" onclick="mountEmbeddedPitchWaveGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">
                Play Again
              </button>
            </div>
          ` : `
            <div class="text-center">
              <button type="button" onclick="playMysteryPitchWave()" class="px-6 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                <i class="fa-solid fa-volume-high mr-1.5"></i> Play Mystery Pitch (Round ${pitchWaveState.round})
              </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${choices.map(opt => `
                <button type="button" onclick="guessPitchWave('${opt.id}')" class="p-4 rounded-2xl bg-slate-800 hover:bg-indigo-900 border border-slate-700 hover:border-amber-400 text-center space-y-1.5 transition-all">
                  <svg viewBox="0 0 180 48" class="w-full h-11">
                    <path d="${opt.path}" fill="none" stroke="${opt.color}" stroke-width="3" />
                  </svg>
                  <div class="font-black text-xs text-white">${opt.label}</div>
                  <div class="text-[11px] text-slate-400">${opt.desc}</div>
                </button>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 6: 8-BEAT DRUM SEQUENCER & DICTATION LAB
    // ==========================================
    let drumModuleTab = 'sequencer';
    let drumGrid = {
      kick: [1, 0, 0, 0, 1, 0, 0, 0],
      snare: [0, 0, 1, 0, 0, 0, 1, 0],
      hat: [1, 1, 1, 1, 1, 1, 1, 1]
    };
    let dictationTarget = [1, 0, 1, 0, 1, 1, 0, 1];
    let dictationGuess = [0, 0, 0, 0, 0, 0, 0, 0];

    function toggleDrumCell(track, step) {
      drumGrid[track][step] = drumGrid[track][step] ? 0 : 1;
      if (drumGrid[track][step]) playDrumSound(track);
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function playDrumSequencerPattern() {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          if (drumGrid.kick[i]) playDrumSound('kick');
          if (drumGrid.snare[i]) playDrumSound('snare');
          if (drumGrid.hat[i]) playDrumSound('hat');
        }, i * 260);
      }
    }

    function playDictationMysteryPattern() {
      dictationTarget.forEach((hit, i) => {
        setTimeout(() => {
          if (hit) playDrumSound('snare');
          else playTonePitch(320, 0.04, 0.08, 'sine');
        }, i * 320);
      });
    }

    function toggleDictationCell(step) {
      dictationGuess[step] = dictationGuess[step] ? 0 : 1;
      if (dictationGuess[step]) playDrumSound('snare');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function checkDictationAnswer() {
      const isMatch = dictationTarget.every((v, idx) => v === dictationGuess[idx]);
      if (isMatch) {
        addTokens(5);
        dictationTarget = Array.from({ length: 8 }, () => (Math.random() > 0.45 ? 1 : 0));
        dictationGuess = [0, 0, 0, 0, 0, 0, 0, 0];
        showAppModal('Dictation Correct (+5 Tokens)!', 'You transcribed all 8 beats accurately! A new mystery rhythm has been generated.', true);
      } else {
        showAppModal('Not Quite!', 'Listen again to the 8-beat snare pattern and match the exact beats where the snare hits.', false);
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function mountEmbeddedDrumModule(target) {
      if (!target) return;
      const tracks = [
        { key: 'kick', label: 'Kick Drum' },
        { key: 'snare', label: 'Snare Drum' },
        { key: 'hat', label: 'Hi-Hat' }
      ];

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-4">
            <button type="button" onclick="drumModuleTab='sequencer'; mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));" class="px-4 py-2 rounded-xl text-xs font-black ${drumModuleTab === 'sequencer' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}">
              <i class="fa-solid fa-drum mr-1"></i> 1. 8-Beat Drum Sequencer
            </button>
            <button type="button" onclick="drumModuleTab='dictation'; mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));" class="px-4 py-2 rounded-xl text-xs font-black ${drumModuleTab === 'dictation' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-white'}">
              <i class="fa-solid fa-ear-listen mr-1"></i> 2. Dictation Activity (+5 Tokens)
            </button>
          </div>

          ${drumModuleTab === 'sequencer' ? `
            <div class="space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-black">8-Beat Drum Pattern Builder</h3>
                <button type="button" onclick="playDrumSequencerPattern()" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs">
                  <i class="fa-solid fa-play mr-1"></i> Play 8-Beat Groove
                </button>
              </div>
              <div class="space-y-2.5">
                ${tracks.map(t => `
                  <div class="grid grid-cols-9 gap-2 items-center">
                    <div class="text-xs font-bold text-slate-300">${t.label}</div>
                    ${drumGrid[t.key].map((val, idx) => `
                      <button type="button" onclick="toggleDrumCell('${t.key}', ${idx})" class="h-11 rounded-xl font-black text-xs border transition-all ${val ? 'bg-indigo-500 border-amber-300 text-white' : 'bg-slate-800 border-slate-700 text-slate-500'}">
                        ${idx + 1}
                      </button>
                    `).join('')}
                  </div>
                `).join('')}
              </div>
            </div>
          ` : `
            <div class="space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="text-lg font-black">8-Beat Rhythmic Dictation</h3>
                  <p class="text-xs text-slate-300">Listen to the mystery 8-beat snare rhythm and toggle the beats you hear.</p>
                </div>
                <button type="button" onclick="playDictationMysteryPattern()" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs">
                  <i class="fa-solid fa-volume-high mr-1"></i> Hear Mystery Rhythm
                </button>
              </div>
              <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                ${dictationGuess.map((val, idx) => `
                  <button type="button" onclick="toggleDictationCell(${idx})" class="p-3 rounded-2xl border-2 text-center ${val ? 'bg-indigo-600 border-amber-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}">
                    <div class="text-xs font-black mb-1">Beat ${idx + 1}</div>
                    ${renderEngravedNoteDarkSVG(val ? 'crotchet' : 'rest', val ? '#fbbf24' : '#64748b', 'w-9 h-12')}
                  </button>
                `).join('')}
              </div>
              <button type="button" onclick="checkDictationAnswer()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">
                Check My Dictation (+5 Tokens)
              </button>
            </div>
          `}
        </div>
      `;
    }

    function mountEmbeddedDictation(target) {
      drumModuleTab = 'dictation';
      mountEmbeddedDrumModule(target);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(document.activeElement.tagName) === -1) {
        if (beatTapState.running) {
          e.preventDefault();
          triggerBeatTapHit();
        } else if (crotchetState.running) {
          e.preventDefault();
          triggerCrotchetTap();
        } else if (quaverState.running) {
          e.preventDefault();
          triggerQuaverTap();
        } else if (longNoteState.running) {
          e.preventDefault();
          if (!e.repeat) handleLongNoteDown();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && longNoteState.running) {
        handleLongNoteUp();
      }
    });

    window.app = {
      currentUser: null,
      currentView: 'home',
      navigate(view, params = {}) {
        if (typeof stopBeatTapLoop === 'function') stopBeatTapLoop();
        if (typeof stopCrotchetGameLoop === 'function') stopCrotchetGameLoop();
        if (typeof stopQuaverGameLoop === 'function') stopQuaverGameLoop();
        if (typeof stopLongNoteGameLoop === 'function') stopLongNoteGameLoop();

        this.currentView = view;
        const container = document.getElementById('app-viewport');
        if (!container) return;
        updateNavBar();

        switch (view) {
          case 'home':
            renderHomeView(container);
            break;
          case 'login':
            renderLoginView(container);
            break;
          case 'studentDash':
            renderStudentDash(container);
            break;
          case 'teacherDash':
            renderTeacherDash(container);
            break;
          case 'conceptsHub':
            renderConceptsHub(container);
            break;
          case 'conceptDetail':
            renderConceptDetail(container, params);
            break;
          case 'levelDetail':
            renderLevelDetail(container, params);
            break;
          case 'lessonDetail':
            renderLessonDetail(container, params);
            break;
          case 'levelTest':
            renderLevelTestView(container, params);
            break;
          case 'shop':
            renderShopView(container);
            break;
          case 'rhythmModule':
            renderRhythmModule(container);
            break;
          case 'dictationChallenge':
            renderDictationChallenge(container);
            break;
          default:
            renderHomeView(container);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    function updateNavBar() {
      const loginBtn = document.getElementById('nav-login-btn');
      const profileDiv = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const tokenSpan = document.getElementById('nav-user-tokens');
      const nameDiv = document.getElementById('nav-user-name');
      const roleDiv = document.getElementById('nav-user-role');

      if (app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profileDiv) {
          profileDiv.classList.remove('hidden');
          profileDiv.classList.add('flex');
        }
        if (nameDiv) nameDiv.textContent = `${app.currentUser.firstName} ${app.currentUser.surname}`;
        if (roleDiv) {
          roleDiv.textContent = app.currentUser.role === 'teacher'
            ? 'Music Staff'
            : `Class ${app.currentUser.class} (${app.currentUser.teacher || 'Mr B'})`;
        }
        if (app.currentUser.role === 'student') {
          if (tokenBadge) {
            tokenBadge.classList.remove('hidden');
            tokenBadge.classList.add('flex');
          }
          if (tokenSpan) tokenSpan.textContent = (state.stats && state.stats.tokens) || 0;
        } else {
          if (tokenBadge) tokenBadge.classList.add('hidden');
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profileDiv) {
          profileDiv.classList.add('hidden');
          profileDiv.classList.remove('flex');
        }
        if (tokenBadge) {
          tokenBadge.classList.add('hidden');
          tokenBadge.classList.remove('flex');
        }
      }
    }

    function protectedNavigate(view, params = {}) {
      if (!app.currentUser) {
        showAppModal('Login Required', 'Please log in with your Student or Teacher portal account to explore concepts and rewards.', false);
        app.navigate('login');
        return;
      }
      app.navigate(view, params);
    }

    function openCurrentPortal() {
      if (!app.currentUser) {
        app.navigate('login');
        return;
      }
      app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
    }

    function logoutUser() {
      app.currentUser = null;
      try {
        localStorage.removeItem('boncepts_active_session');
      } catch (e) {}
      updateNavBar();
      app.navigate('home');
    }

    function scrollToStudentLeaderboard() {
      const el = document.getElementById('overall-student-leaderboard-section');
      if (el) {

    // PERSISTENCE & LEADERBOARD HELPERS
    // ==========================================
    function getAllUserRecords() {
      let localUsers = {};
      try {
        localUsers = JSON.parse(localStorage.getItem('boncepts_users_db') || '{}');
      } catch (e) {}
      const cloudUsers = window.cachedCloudUsers || {};
      return { ...localUsers, ...cloudUsers };
    }

    function getDeduplicatedStudents() {
      const all = getAllUserRecords();
      const map = {};
      Object.entries(all).forEach(([key, val]) => {
        if (!val || val.role === 'teacher') return;
        const normKey = key.toLowerCase();
        map[normKey] = { key, ...val };
      });
      return Object.values(map);
    }

    function saveUserState() {
      if (!app.currentUser) return;
      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(app.currentUser));
      } catch (e) {}

      if (app.currentUser.role === 'student') {
        const record = {
          ...app.currentUser,
          stats: state.stats || { tokens: 10, testsTaken: 0 },
          inventory: state.inventory || [],
          testHistory: state.testHistory || [],
          completedLessons: state.completedLessons || []
        };
        try {
          const all = getAllUserRecords();
          all[app.currentUser.key] = record;
          localStorage.setItem('boncepts_users_db', JSON.stringify(all));
        } catch (e) {}

        if (window.saveUserRecordToCloud) {
          window.saveUserRecordToCloud(app.currentUser.key, record);
        }
      }
      updateNavBar();
      updateGlobalLeaderboard();
      refreshLeaderboardTableInPlace();
    }

    function addTokens(amount) {
      if (!app.currentUser || app.currentUser.role !== 'student') return;
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.tokens = (Number(state.stats.tokens) || 0) + Number(amount);
      saveUserState();
    }

    function updateGlobalLeaderboard() {
      const ticker = document.getElementById('global-ticker-content');
      if (!ticker) return;
      const students = getDeduplicatedStudents();
      students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));
      if (students.length === 0) {
        ticker.textContent = 'Log in as a Student to claim your starter +10 Tokens and appear on the Live Classroom Ticker!';
        return;
      }
      ticker.innerHTML = students.map((s, idx) =>
        `<span class="mx-4"><strong class="text-amber-300">#${idx + 1} ${s.firstName} ${s.surname}</strong> (${s.class}): <span class="text-emerald-300 font-bold">${(s.stats && s.stats.tokens) || 0} Tokens</span></span>`
      ).join(' &bull; ');
    }

    function refreshLeaderboardTableInPlace() {
      const tbody = document.getElementById('overall-leaderboard-tbody');
      if (!tbody) return;
      const students = getDeduplicatedStudents();
      students.sort((a, b) => ((b.stats && b.stats.tokens) || 0) - ((a.stats && a.stats.tokens) || 0));

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400 text-xs">No student balances recorded yet. Log in to appear on the leaderboard!</td></tr>`;
        return;
      }

      tbody.innerHTML = students.map((s, idx) => {
        const rankBadge = idx === 0
          ? '<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-black text-xs">🥇 #1</span>'
          : idx === 1
          ? '<span class="px-2.5 py-1 rounded-full bg-slate-200 text-slate-700 font-black text-xs">🥈 #2</span>'

        return `

    // ==========================================
    // WEB AUDIO SYNTHESIZER ENGINE
    // ==========================================
    let sharedAudioCtx = null;
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) sharedAudioCtx = new AudioContextClass();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playTonePitch(freq = 440, duration = 0.35, gainLevel = 0.35, waveType = 'triangle') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function playDrumSound(type = 'kick') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'kick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'snare') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, now);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else {
          playTonePitch(980, 0.06, 0.22, 'square');
        }
      } catch (e) {}
    }

        { pairId: 'f', symHtml: '<span class="text-3xl font-black italic text-amber-400">f</span>', defText: 'Forte (Loud)' },
        { pairId: 'ff', symHtml: '<span class="text-3xl font-black italic text-amber-400">ff</span>', defText: 'Fortissimo (Very Loud)' },
        {
          pairId: 'cresc',
          symHtml: `<svg viewBox="0 0 120 36" class="w-24 h-8 mx-auto"><polyline points="108,5 12,18 108,31" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg><span class="text-[10px] font-bold text-sky-300 uppercase mt-1 block">Hairpin</span>`,
          defText: 'Crescendo (Gradually getting louder)'
        },
        {
          pairId: 'decresc',
          symHtml: `<svg viewBox="0 0 120 36" class="w-24 h-8 mx-auto"><polyline points="12,5 108,18 12,31" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg><span class="text-[10px] font-bold text-rose-300 uppercase mt-1 block">Hairpin</span>`,
          defText: 'Decrescendo (Gradually getting softer)'
        }
      ];

      const deck = [];
      pairs.forEach(item => {
        deck.push({ uid: `${item.pairId}_sym`, pairId: item.pairId, kind: 'symbol', content: item.symHtml });
        deck.push({ uid: `${item.pairId}_def`, pairId: item.pairId, kind: 'definition', content: `<span class="text-xs font-black text-white leading-snug">${item.defText}</span>` });
      });

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function resetDynamicsMemoryRound(incrementRound = false) {
      if (incrementRound) dynamicsMemoryState.roundsWon++;
      dynamicsMemoryState.cards = buildShuffledDynamicsDeck();
      dynamicsMemoryState.flippedIndices = [];
      dynamicsMemoryState.matchedPairIds = [];
      dynamicsMemoryState.moves = 0;
      dynamicsMemoryState.lockBoard = false;
      mountEmbeddedDynamicsSimulator(document.getElementById('embedded-tool-container'));
    }

    function handleDynamicsCardFlip(idx) {
      const st = dynamicsMemoryState;
      if (st.lockBoard) return;
      const card = st.cards[idx];
      if (!card) return;
      if (st.flippedIndices.includes(idx) || st.matchedPairIds.includes(card.pairId)) return;

      playTonePitch(523.25, 0.08, 0.2, 'sine');
      st.flippedIndices.push(idx);
      mountEmbeddedDynamicsSimulator(document.getElementById('embedded-tool-container'));

      if (st.flippedIndices.length === 2) {
        st.moves++;
        st.lockBoard = true;
        const [firstIdx, secondIdx] = st.flippedIndices;
        const firstCard = st.cards[firstIdx];
        const secondCard = st.cards[secondIdx];

        if (firstCard.pairId === secondCard.pairId) {
          setTimeout(() => {
            st.matchedPairIds.push(firstCard.pairId);
            st.flippedIndices = [];
            st.lockBoard = false;
            playTonePitch(659.25, 0.18, 0.32, 'triangle');

            if (st.matchedPairIds.length === 8) {
              const reward = st.moves <= 14 ? 10 : 5;
              addTokens(reward);
              showAppModal(
                '🎉 Dynamics Memory Match Complete!',
                `You matched all 8 dynamic symbols & definitions in ${st.moves} moves and earned +${reward} Tokens! Shuffling a fresh deck for your next round...`,
                true
              );
              resetDynamicsMemoryRound(true);
              return;
            }
            mountEmbeddedDynamicsSimulator(document.getElementById('embedded-tool-container'));
          }, 420);
        } else {
          setTimeout(() => {
            playTonePitch(196.00, 0.14, 0.2, 'sawtooth');
            st.flippedIndices = [];
            st.lockBoard = false;
            mountEmbeddedDynamicsSimulator(document.getElementById('embedded-tool-container'));
          }, 850);
        }
      }
    }

      const rawQuestions = level.testQuestions || [];

      // Shuffle answer options for every question so the correct answer is mixed across all 4 boxes
      activeShuffledQuestions = rawQuestions.map(item => {
        const indexedOptions = item.options.map((text, idx) => ({
          text,
          isCorrect: idx === item.correct
        }));
        for (let i = indexedOptions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
        }
        return {
          q: item.q,
          options: indexedOptions.map(o => o.text),

    function playTimbreInstrumentSound(instrumentId) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (instrumentId === 'violin') {
          // Warm bowed string with gentle swell & vibrato
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1150, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.28, now + 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.92);
        } else if (instrumentId === 'trumpet') {
          // Brassy, bright metallic harmonic punch
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sawtooth';
          osc2.type = 'square';
          osc1.frequency.setValueAtTime(523.25, now);
          osc2.frequency.setValueAtTime(523.25, now);
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1800, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.32, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.68);
          osc2.stop(now + 0.68);
        } else if (instrumentId === 'snare') {
          // Short crisp crack-like white noise + body snap
          const bufferSize = ctx.sampleRate * 0.16;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(900, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          playTonePitch(210, 0.09, 0.35, 'triangle');
        } else if (instrumentId === 'bass_drum') {
          // Deep heavy low-end thud
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(125, now);
          osc.frequency.exponentialRampToValueAtTime(36, now + 0.28);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (instrumentId === 'double_bass') {
          // Rumbling dark woody low string sustain
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(65.41, now); // C2
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(240, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.55, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.98);
        } else if (instrumentId === 'harp') {
          // Shimmering cascading arpeggio glissando
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            setTimeout(() => {
              playTonePitch(freq, 0.55, 0.24, 'sine');
            }, idx * 65);
          });
        } else if (instrumentId === 'xylophone') {
          // Wooden, dry hollow short percussive hit
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
          setTimeout(() => playTonePitch(1760, 0.03, 0.18, 'triangle'), 0);
        } else if (instrumentId === 'bells') {
          // Resonant, bright ringing metallic chime
          playTonePitch(880, 1.3, 0.3, 'sine');
          playTonePitch(1760, 1.1, 0.15, 'sine');
          playTonePitch(2637, 0.85, 0.09, 'triangle');
        }
      } catch (e) {}
    }

    function mountEmbeddedTimbreSoundboard(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const shuffled = [...timbreInstrumentsCatalog].sort(() => Math.random() - 0.5);
      timbreGameState = {
        round: 1,
        totalRounds: 8,
        score: 0,
        queue: shuffled,
        answered: false,
        lastChosenId: null,
        lastCorrect: false,
        completed: false
      };
      renderTimbreSoundboardUI(target);
    }

    function playMysteryTimbreClip() {
      const current = timbreGameState.queue[timbreGameState.round - 1];
      if (!current) return;
      playTimbreInstrumentSound(current.id);
    }

    function submitTimbreSoundboardChoice(chosenId) {
      if (timbreGameState.answered || timbreGameState.completed) return;
      const current = timbreGameState.queue[timbreGameState.round - 1];
      const isRight = chosenId === current.id;
      timbreGameState.answered = true;
      timbreGameState.lastChosenId = chosenId;
      timbreGameState.lastCorrect = isRight;

      if (isRight) {
        timbreGameState.score++;
      } else {
        playTimbreInstrumentSound(current.id);
      }
      renderTimbreSoundboardUI();
    }

    function nextTimbreSoundboardRound() {
      if (timbreGameState.round < timbreGameState.totalRounds) {
        timbreGameState.round++;
        timbreGameState.answered = false;
        timbreGameState.lastChosenId = null;
        renderTimbreSoundboardUI();
      } else {
        timbreGameState.completed = true;
        const reward = timbreGameState.score >= 6 ? 10 : 5;
        addTokens(reward);
        renderTimbreSoundboardUI();
        showAppModal(
          '🎶 Timbre Soundboard Complete!',
          `You matched ${timbreGameState.score} out of ${timbreGameState.totalRounds} instruments by their tone colour and earned +${reward} Tokens!`,
          timbreGameState.score >= 5
        );
      }
    }

    // ==========================================
    // MELODIC CONTOUR (STEP VS LEAP & DIRECTION) MINIGAME (10 ROUNDS)
    function submitLevelTest(conceptId, levelNum) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const questions = activeShuffledQuestions.length > 0 ? activeShuffledQuestions : (level.testQuestions || []);
      let score = 0;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected && Number(selected.value) === q.correct) {
          score++;
        }
      });

      const pct = Math.round((score / questions.length) * 100);
      const earnedTokens = pct >= 80 ? 25 : pct >= 50 ? 15 : 5;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.unshift({
        concept: concept.title,
        level: level.title,
        score: score,
        total: questions.length,
        percentage: pct,
        date: new Date().toLocaleDateString()
      });
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;
      addTokens(earnedTokens);

      showAppModal(
        `Test Complete: ${score}/${questions.length} (${pct}%)`,
        `Your mark has been confidentially recorded in your Student Markbook, and you earned +${earnedTokens} Tokens!`,
        pct >= 50
      );
      app.navigate('studentDash');
    }
