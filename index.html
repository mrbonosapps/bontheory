<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonTheory - Music Theory Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Styles for SVGs */
        .staff-line { stroke: #334155; stroke-width: 2; }
        .staff-text { font-family: 'Inter', sans-serif; font-weight: 700; fill: #2563eb; }
        .note-head { fill: #0f172a; }
        
        /* Chord UI Styles */
        .chord-bg { background-google: #1e293b; }
        .chord-panel { background-color: #0f172a; }
        .custom-select { background-color: #1e293b; color: white; border: 1px solid #334155; }

        /* Print styles for Certificate export */
        @media print {
            body { background: white !important; overflow: visible !important; height: auto !important; }
            header, #cert-actions, #nav-user, .print-hide { display: none !important; }
            #app-root { overflow: visible !important; height: auto !important; }
            #cert-container { 
                box-shadow: none !important; 
                border: 6px double #1e293b !important; 
                margin: 0 auto !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="text-gray-801 h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="bg-white shadow-sm z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="if(app.currentUser) app.navigate(app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash')">
                <i class="fa-solid fa-music text-blue-600 text-2xl"></i>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BonTheory</h1>
            </div>
            <div id="nav-user" class="hidden flex items-center gap-6">
                <div class="text-sm font-medium text-gray-500">
                    Tests: <span id="nav-tests" class="text-gray-800 font-bold">0</span>
                </div>
                <div class="flex items-center gap-3 bg-blue-50 py-1.5 px-4 rounded-full border border-blue-100">
                    <span id="nav-username" class="font-bold text-blue-700">Student</span>
                    <button onclick="logout()" class="text-blue-500 hover:text-blue-700 transition" title="Logout">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-root" class="flex-1 overflow-y-auto w-full relative"></main>

    <script>

            },
            structure: {
                level1Practice: [
                    { q: "In a song, which section usually has changing lyrics to advance the story?", options: ["Chorus", "Verse", "Intro", "Outro"], a: 1 },

                    { q: "What is the most standard order for a basic Verse-Chorus song?", options: ["Chorus - Chorus - Verse", "Verse 1 - Chorus - Verse 2 - Chorus", "Bridge - Verse - Outro", "Verse 1 - Verse 2 - Verse 3"], a: 1 },
                    { q: "Why is the Chorus often performed louder or with more instruments?", options: ["To make it less noticeable", "To highlight the emotional peak and main theme", "Because the verse is always silent", "It is an accidental mistake"], a: 1 },
                    { q: "What musical structure consists of two distinct, contrasting sections (AB)?", options: ["Ternary Form", "Binary Form", "Rondo Form", "Monophonic"], a: 1 },

                level1Test: [
                    { q: "What is the primary function of a Verse in popular song structure?", options: ["To provide the main repeating tagline", "To tell the story and introduce new lyrical ideas", "To end the song abruptly", "To act as a drum solo"], a: 1 },
                    { q: "How do the lyrics of different verses in the same song typically compare?", options: ["They are always 100% identical", "They change between verses to progress the narrative", "They are never sung in English", "They must have no rhyme scheme"], a: 1 },

                    { q: "Why is 'Twinkle, Twinkle, Little Star' considered an example of Ternary Form?", options: ["It has only one single verse", "It features an opening theme, a contrasting middle, and an exact return of the opening theme", "It has no repeating melodies", "It is written in two contrasting movements"], a: 1 },

                ]
            },

                    { q: "What vibrates to produce sound in a Chordophone?", options: ["A column of air", "A stretched membrane or skin", "Stretched strings", "An electronic oscillator"], a: 2 },

                    { q: "Why is an acoustic piano considered a Chordophone?", options: ["It has wooden keys", "Its sound is produced by hammers striking stretched strings", "It uses an amplifier", "It blows air across pipes"], a: 1 },
                    { q: "The Australian Didgeridoo creates sound through vibrating air blown through a hollow cylinder. It is an:", options: ["Aerophone", "Idiophone", "Membranophone", "Electrophone"], a: 0 },
                    { q: "Which of the following is an example of an Electrophone?", options: ["Acoustic Violin", "Synthesizer", "Snare Drum", "Clarinet"], a: 1 },
                    { q: "Cymbals produce sound through the vibration of their own metal body. They are:", options: ["Idiophones", "Membranophones", "Chordophones", "Aerophones"], a: 0 },

                    { q: "Which adjective would most accurately describe the timbre of orchestral cymbals crashing together?", options: ["Mellow and warm", "Shimmering, metallic and bright", "Deep and hollow", "Airy and breathy"], a: 1 },
                    { q: "A cello playing a lyrical melody in its lower register is most accurately described as having a timbre that is:", options: ["Piercing and shrill", "Buzzing and robotic", "Warm, rich, and resonant", "Brittle and dry"], a: 2 }
                ]
            },
            texture: {
                level1Practice: [
                    { q: "What does musical 'Texture' describe?", options: ["How loud or soft the instruments play", "How many layers of sound are heard and how they relate to each other", "The speed and tempo of the rhythm", "The pitch clef used on the staff"], a: 1 },
                    { q: "Which of the following describes a 'Thin' texture?", options: ["A full symphony orchestra playing together", "A solo acoustic flute playing alone in a quiet room", "A rock band with drums, bass, distorted guitars, and vocals", "A 100-person choir singing 8-part harmony"], a: 1 },
                    { q: "What happens to the musical texture when a soloist is joined by a bassline, chords, and background instruments?", options: ["The texture becomes thinner", "The texture becomes thicker and more dense", "The tempo is cut in half", "The notes change from sharp to flat"], a: 1 },
                    { q: "If you remove the harmony pad, bass, and arpeggios leaving only a single note, the texture is:", options: ["Very thick", "Dense and crowded", "Thin and transparent", "Polyphonic"], a: 2 }
                ],

                    { q: "In the study of music, the term 'Texture' is best defined as:", options: ["The physical feeling of the instrument's wood or brass", "The layers of sound heard in a piece and the density they create", "The key signature at the start of a bar", "The volume changes marked by hairpins"], a: 1 },

                    { q: "Why might a composer deliberately choose a very thin texture for the beginning of a piece?", options: ["Because they ran out of instruments", "To create intimacy, focus, or suspense before building energy", "Because thin textures are always faster", "Instruments cannot play at the start of a song"], a: 1 },
                    { q: "When an entire choir sings together in rich 4-part harmony, how does the texture compare to a solo singer?", options: ["It is much thicker and richer", "It is much thinner", "It is completely unchanged", "It becomes an Idiophone"], a: 0 },

                    { q: "If a band suddenly stops playing and only the lead singer's voice continues unaccompanied, the texture has:", options: ["Shifted dramatically from thick to thin", "Shifted from thin to thick", "Become an electrophone", "Modulated to a major key"], a: 0 },
                    { q: "Can a piece of music change between thick and thin textures throughout its duration?", options: ["No, a piece must remain one texture from start to finish", "Yes, composers vary texture across sections to create contrast and excitement", "Only if it is written in Binary form", "Only if it uses synthesizers"], a: 1 }
                ]
            }
        };

        // --- Core App Logic ---
        const app = {
            currentUser: null,
            navigate(viewName, data = null) {
                // If leaving texture lab, silence its audio loop
                if (window.stopTextureLabAudio) window.stopTextureLabAudio();
                if (window.stopTextureLab2Audio) window.stopTextureLab2Audio();

                const root = document.getElementById('app-root');
                if (!views[viewName]) {
                    console.error("View not found:", viewName);
                    return;
                }
                root.innerHTML = views[viewName](data);
                
                // Update Navbar
                const navUser = document.getElementById('nav-user');
                if (this.currentUser) {
                    navUser.classList.remove('hidden');
                    document.getElementById('nav-username').textContent = this.currentUser.name;
                    document.getElementById('nav-tests').textContent = state.stats.completedTests;
                } else {
                    navUser.classList.add('hidden');
                }

                // If navigating to Chord Theory, initialize synth & update display
                if(viewName === 'chordTheoryCentre') {
                    try {
                        initChordSynth();
                        setTimeout(() => { if (window.updateChordDisplay) window.updateChordDisplay(); }, 20);
                    } catch(err) {
                        console.error("Chord Theory init error:", err);
                    }
                }
                
                // Game Init Triggers
                if(viewName === 'durationLesson1' && data === 'game') setTimeout(() => { if(window.startStemGame) window.startStemGame(); }, 50);
                if(viewName === 'durationLesson2' && data === 'game') setTimeout(() => { if(window.startDurationGame2) window.startDurationGame2(); }, 50);
                if(viewName === 'durationLesson3' && data === 'game') setTimeout(() => { if(window.startQuaverGame) window.startQuaverGame(); }, 50);
                if(viewName === 'durationLesson4' && data === 'game') setTimeout(() => { if(window.startDurationGame4) window.startDurationGame4(); }, 50);
                if(viewName === 'dynamicsLesson1' && data === 'game') setTimeout(() => { if(window.startTempoMemoryGame) window.startTempoMemoryGame(); }, 50);
                if(viewName === 'dynamicsLesson2' && data === 'game') setTimeout(() => { if(window.startDynamicsMatchingGame) window.startDynamicsMatchingGame(); }, 50);
                if(viewName === 'dynamicsLesson3' && data === 'game') setTimeout(() => { if(window.startScoreHuntGame) window.startScoreHuntGame(); }, 50);
                if(viewName === 'structureLesson1' && data === 'game') setTimeout(() => { if(window.startStructureLesson1Game) window.startStructureLesson1Game(); }, 50);
                if(viewName === 'structureLesson3' && data === 'game') setTimeout(() => { if(window.startStructureLesson3Game) window.startStructureLesson3Game(); }, 50);
                if(viewName === 'timbreLesson1' && data === 'game') setTimeout(() => { if(window.startTimbreGame) window.startTimbreGame(); }, 50);
                if(viewName === 'timbreLesson2' && data === 'game') setTimeout(() => { if(window.startTimbreWordGame) window.startTimbreWordGame(); }, 50);
                if(viewName === 'textureLesson1' && data === 'game') setTimeout(() => { if(window.initTextureLab) window.initTextureLab(); }, 50);
                if(viewName === 'textureLesson2' && data === 'game') setTimeout(() => { if(window.initTextureLab2) window.initTextureLab2(); }, 50);
                if(viewName === 'pitchLesson4' && data === 'game') setTimeout(() => { if(window.startBassClefGame) window.startBassClefGame(); }, 50);
                if(viewName === 'pitchLesson1' && data === 'game') setTimeout(() => { if(window.startTrebleClefGame) window.startTrebleClefGame(); }, 50);
                if(viewName === 'pitchLesson2' && data === 'game') setTimeout(() => { if(window.startToneSemitoneGame) window.startToneSemitoneGame(); }, 50);
                if(viewName === 'pitchLesson3' && data === 'game') setTimeout(() => { if(window.startAccGame) window.startAccGame(); }, 50);
            }
        };

        // --- Views ---
        const views = {
            login() {
                return `
                <div class="h-full flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full fade-in border border-gray-100">
                        <div class="text-center mb-8">

        window.playNoteAudio = function(note) {

            synth.triggerAttackRelease([note], "0.8n");

        window.playCurrentChord = function() {
            if(!synth) initChordSynth();
            Tone.start();
            const root = document.getElementById('chord-root').value;
            const type = document.getElementById('chord-cat').value;
            
            let notes = [];
            if(type === 'major') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else if(type === 'minor') notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(3).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote()];
            else notes = [`${root}4`, Tone.Frequency(`${root}4`).transpose(4).toNote(), Tone.Frequency(`${root}4`).transpose(7).toNote(), Tone.Frequency(`${root}4`).transpose(10).toNote()];

            synth.triggerAttackRelease(notes, "1.5n");
        };

        window.updateChordDisplay = function() {
            const rootEl = document.getElementById('chord-root');

            const root = rootEl.value;
            const cat = catEl.value;
            let name = `${root} Major`;
            let formula = '1 - 3 - 5';
            
            if(cat === 'minor') { name = `${root} Minor`; formula = '1 - b3 - 5'; }
            if(cat === 'dominant') { name = `${root} Dominant 7`; formula = '1 - 3 - 5 - b7'; }
            
            document.getElementById('display-chord-name').textContent = name;
            document.getElementById('display-formula').textContent = formula;

            try {
                let noteNames = [];
                if(cat === 'major') noteNames = [root, Tone.Frequency(`${root}4`).transpose(4).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];
                else if(cat === 'minor') noteNames = [root, Tone.Frequency(`${root}4`).transpose(3).toNote().slice(0,-1), Tone.Frequency(`${root}4`).transpose(7).toNote().slice(0,-1)];

        // Reliable single-transmission submission helper
        window.lastSubmissionKey = null;
        window.sendResultsToGoogleSheet = function(payload) {
            const endpoint = window.getGoogleSheetWebappUrl();
            if (!endpoint) {
                console.warn("No Google Sheet Web App URL configured.");
                return;
            }

            try {
                // Ensure all fields are safe strings
                const cleanPayload = {};
                Object.keys(payload).forEach(key => {
                    cleanPayload[key] = (payload[key] !== undefined && payload[key] !== null) ? String(payload[key]) : '';
                });

                // Deduplication key based on student, area, level, score, and minute
                const submissionKey = `${cleanPayload.studentName}_${cleanPayload.area}_${cleanPayload.level}_${cleanPayload.score}_${cleanPayload.timestamp.substring(0, 16)}`;
                if (window.lastSubmissionKey === submissionKey) {
                    console.log("Duplicate submission prevented.");
                    return;
                }
                window.lastSubmissionKey = submissionKey;

                const formData = new URLSearchParams(cleanPayload);
                const bodyStr = formData.toString();

                // Send exactly ONCE via fetch (no-cors)
                if (window.fetch) {
                    fetch(endpoint, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { 
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" 
                        },
                        body: bodyStr
                    }).then(() => {
                        console.log("Test result successfully dispatched to spreadsheet.");
                    }).catch(err => {
                        console.warn("Fetch failed, falling back to beacon/img:", err);
                        // Fallback only if fetch actively failed
                        if (navigator.sendBeacon) {
                            const blob = new Blob([bodyStr], { type: 'application/x-www-form-urlencoded;charset=UTF-8' });
                            navigator.sendBeacon(endpoint, blob);
                        } else {
                            const pingImg = new Image();
                            pingImg.src = endpoint + (endpoint.includes('?') ? '&' : '?') + formData.toString() + '&_t=' + Date.now();
                        }
                    });
                } else if (navigator.sendBeacon) {
                    const blob = new Blob([bodyStr], { type: 'application/x-www-form-urlencoded;charset=UTF-8' });
                    navigator.sendBeacon(endpoint, blob);
                } else {
                    const pingImg = new Image();
                    pingImg.src = endpoint + (endpoint.includes('?') ? '&' : '?') + formData.toString() + '&_t=' + Date.now();

                console.error("Submission error:", err);
            }
        };

        window.startTempoMemoryGame = function() {

            // Pick 6 random pairs for a snappy 12-card grid
            const shuffledPool = [...state.termPairs].sort(() => Math.random() - 0.5).slice(0, 6);
            const deck = [];
            shuffledPool.forEach((item, pairId) => {
                deck.push({ id: `${pairId}-term`, pairId, text: item.term, type: 'term' });
                deck.push({ id: `${pairId}-def`, pairId, text: item.def, type: 'def' });
            });
            state.cards = deck.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('tempo-memory-grid');
            const matchEl = document.getElementById('tempo-matched-count');
            const turnsEl = document.getElementById('tempo-turns-count');
            const msgEl = document.getElementById('tempo-game-msg');

            if (matchEl) matchEl.textContent = `0 / 6`;
            if (turnsEl) turnsEl.textContent = `0`;
            if (msgEl) msgEl.classList.add('hidden');

            if (grid) {

        window.flipTempoCard = function(index) {
            const state = window.tempoMemoryState;
            if (state.isLocked) return;
            const cardEl = document.getElementById(`tempo-card-${index}`);
            if (!cardEl || cardEl.classList.contains('matched') || state.flipped.includes(index)) return;

            // Reveal card
            const card = state.cards[index];
            const backIcon = cardEl.querySelector('.card-back');
            const frontText = cardEl.querySelector('.card-front');
            if (backIcon && frontText) {
                backIcon.classList.add('hidden');
                frontText.textContent = card.text;
                frontText.classList.remove('hidden');

        window.startTextureLabAudio = function() {
            const state = window.textureLabState;
            if (!synth) initChordSynth();
            Tone.start();

            state.isPlaying = true;
            state.stepIndex = 0;

            const btn = document.getElementById('texture-play-master-btn');
            if (btn) {
                btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-3 px-6 rounded-2xl shadow-md transition flex items-center gap-2 flex-shrink-0";
                btn.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Stop Audio</span>`;
            }

            // Step through a 4-beat loop pattern at 120bpm (500ms per step)
            state.loopIntervalId = setInterval(() => {
                if (!state.isPlaying) return;
                const idx = state.stepIndex % 4;

                const bassL = state.layers.find(l => l.id === 'bass');
                const padL = state.layers.find(l => l.id === 'pad');
                const arpL = state.layers.find(l => l.id === 'arp');
                const leadL = state.layers.find(l => l.id === 'lead');
                const sparkL = state.layers.find(l => l.id === 'sparkle');

                const notesToTrigger = [];

                // Bass Drone on beat 0
                if (bassL && bassL.active && idx === 0) notesToTrigger.push('C2');

                // Pad on beats 0 and 2
                if (padL && padL.active && (idx === 0 || idx === 2)) notesToTrigger.push(...padL.notes);

                // Arpeggio pulses on every beat
                if (arpL && arpL.active) {
                    const n = arpL.pattern[idx];
                    if (n) notesToTrigger.push(n);
                }

                // Lead Melody notes on beats
                if (leadL && leadL.active) {
                    const n = leadL.pattern[idx];
                    if (n) notesToTrigger.push(n);
                }

                // Sparkle chime
                if (sparkL && sparkL.active) {
                    const n = sparkL.pattern[idx];
                    if (n) notesToTrigger.push(n);
                }

                if (notesToTrigger.length > 0 && synth) {
                    synth.triggerAttackRelease(notesToTrigger, "0.45n");
                }

                state.stepIndex++;
            }, 500);
        };

                }
            }

            // Render SVG timeline with bar grid and playhead
            const svg = document.getElementById('texture2-layers-svg');
            if (svg) {
                const totalBars = state.totalBars || 6;
                const barWidth = 75;
                const startX = 90;

                let markup = `
                    <!-- Background Grid -->
                    <rect x="0" y="0" width="560" height="150" fill="#090d16" rx="8" />
                `;

                // Draw Bar vertical columns
                for (let b = 1; b <= totalBars; b++) {
                    const bx = startX + (b - 1) * barWidth;
                    const isCurrent = (b === currentBar && state.isPlaying);
                    markup += `
                        <line x1="${bx}" y1="5" x2="${bx}" y2="145" stroke="${isCurrent ? '#4f46e5' : '#1e293b'}" stroke-width="${isCurrent ? '2' : '1'}" stroke-dasharray="${isCurrent ? 'none' : '3'}" />
                        <text x="${bx + barWidth/2}" y="18" font-family="Inter" font-size="9" font-weight="bold" fill="${isCurrent ? '#f59e0b' : '#64748b'}" text-anchor="middle">BAR ${b}</text>
                    `;
                }

                // Render each layer horizontal block along its timeline
                const layerYMap = {
                    chimem: { y: 30, h: 12 },
                    leadm:  { y: 52, h: 14 },
                    arpm:   { y: 74, h: 14 },
                    cello:  { y: 96, h: 16 },
                    sub:    { y: 118, h: 18 }
                };

                state.layers.forEach(layer => {
                    const pos = layerYMap[layer.id];
                    if (!pos) return;

                    // Row label
                    markup += `
                        <text x="12" y="${pos.y + pos.h - 3}" font-family="Inter" font-size="8.5" font-weight="bold" fill="${layer.active ? '#cbd5e1' : '#475569'}">${layer.name.split('.')[1] || layer.name}</text>
                    `;

                    if (layer.active) {
                        const startXPos = startX + (layer.startBar - 1) * barWidth;
                        const blockW = (totalBars - layer.startBar + 1) * barWidth;
                        const isSoundingNow = currentBar >= layer.startBar && state.isPlaying;

                        markup += `
                            <g class="transition-all duration-200">
                                <rect x="${startXPos}" y="${pos.y}" width="${blockW}" height="${pos.h}" fill="${layer.color}" rx="4" opacity="${isSoundingNow ? '0.95' : '0.5'}" stroke="${isSoundingNow ? '#ffffff' : 'none'}" stroke-width="${isSoundingNow ? '1.5' : '0'}" />
                                <text x="${startXPos + 8}" y="${pos.y + pos.h - 3}" font-family="Inter" font-size="8" font-weight="bold" fill="#ffffff">Enters &rarr;</text>
                            </g>
                        `;
                    }
                });

                // Playhead needle
                if (state.isPlaying) {
                    const playheadX = startX + (currentBar - 1) * barWidth + ((currentBeatInBar - 1) / 4) * barWidth;
                    markup += `
                        <line x1="${playheadX}" y1="10" x2="${playheadX}" y2="145" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
                        <circle cx="${playheadX}" cy="10" r="4" fill="#f59e0b" />
                    `;
                }

                svg.innerHTML = markup;
            }
        }

        window.toggleTexture2MasterPlay = function() {
            const state = window.textureLab2State;
            if (state.isPlaying) {
                window.stopTextureLab2Audio();
            } else {
                window.startTextureLab2Audio();
            }
        };

        window.startTextureLab2Audio = function() {
            const state = window.textureLab2State;
            if (!synth) initChordSynth();
            Tone.start();

            state.isPlaying = true;
            state.stepIndex = 0;
            state.currentBar = 1;

            const btn = document.getElementById('texture2-master-btn');
            if (btn) {
                btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-3 px-6 rounded-2xl shadow-md transition flex items-center gap-2 flex-shrink-0 text-sm";
                btn.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Stop Studio</span>`;
            }

            // Loop in A Minor at 128 BPM (~468ms per step, 4 beats per bar, 6 bars loop = 24 steps)
            state.loopIntervalId = setInterval(() => {
                if (!state.isPlaying) return;

                const stepInBar = state.stepIndex % 4; // 0, 1, 2, 3 (Beats 1-4)
                state.currentBar = Math.floor((state.stepIndex % (state.totalBars * 4)) / 4) + 1; // 1 to 6

                const bar = state.currentBar;
                const subL = state.layers.find(l => l.id === 'sub');
                const celloL = state.layers.find(l => l.id === 'cello');
                const arpL = state.layers.find(l => l.id === 'arpm');
                const leadL = state.layers.find(l => l.id === 'leadm');
                const chimeL = state.layers.find(l => l.id === 'chimem');

                const notesToTrigger = [];

                // Sub Bass on beats 0 and 2 (if active and bar reached)
                if (subL && subL.active && bar >= subL.startBar && (stepInBar === 0 || stepInBar === 2)) {
                    notesToTrigger.push('A1');
                }

                // Cello Drone on beat 0 (if active and bar reached)
                if (celloL && celloL.active && bar >= celloL.startBar && stepInBar === 0) {
                    notesToTrigger.push('A2', 'E2');
                }

                // Arpeggio Ostinato on every beat (if active and bar reached)
                if (arpL && arpL.active && bar >= arpL.startBar) {
                    const n = arpL.pattern[stepInBar];
                    if (n) notesToTrigger.push(n);
                }

                // Haunting Melody on beats (if active and bar reached)
                if (leadL && leadL.active && bar >= leadL.startBar) {
                    const n = leadL.pattern[stepInBar];
                    if (n) notesToTrigger.push(n);
                }

                // High Chimes (if active and bar reached)
                if (chimeL && chimeL.active && bar >= chimeL.startBar) {
                    const n = chimeL.pattern[stepInBar];
                    if (n) notesToTrigger.push(n);
                }

                if (notesToTrigger.length > 0 && synth) {
                    synth.triggerAttackRelease(notesToTrigger, "0.4n");
                }

                updateTextureLab2UI();
                state.stepIndex++;
            }, 468);
        };

        window.stopTextureLab2Audio = function() {
            const state = window.textureLab2State;
            state.isPlaying = false;
            if (state.loopIntervalId) {
                clearInterval(state.loopIntervalId);
                state.loopIntervalId = null;
            }
            state.currentBar = 1;
            const btn = document.getElementById('texture2-master-btn');
            if (btn) {
                btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3 px-6 rounded-2xl shadow-md transition flex items-center gap-2 flex-shrink-0 text-sm";
                btn.innerHTML = `<i class="fa-solid fa-play"></i> <span>Start Studio</span>`;
            }
            updateTextureLab2UI();
        };

        // Boot
        window.onload = () => {
            app.navigate('login');
        };
    </script>
</body>
</html>
