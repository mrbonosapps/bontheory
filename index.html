  <!-- FIREBASE CLOUD REAL-TIME ENGINE (Multiplayer Sync) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    window.cloudAvailable = false;
    window.cachedCloudUsers = {};

    async function initFirebaseCloud() {
      try {
        if (!window.__firebase_config) return;
        const config = JSON.parse(window.__firebase_config);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        await signInAnonymously(auth);

        const appId = window.__app_id || 'boncepts-c84d3';
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

        window.saveUserRecordToCloud = async (key, data) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await setDoc(userDoc, data, { merge: true });
          } catch (e) {
            console.warn("Cloud save:", e.message);
          }
        };

        window.deleteUserRecordFromCloud = async (key) => {
          try {
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', key);
            await deleteDoc(userDoc);
          } catch (e) {
            console.warn("Cloud delete:", e.message);
          }
        };

        onSnapshot(usersCol, (snapshot) => {
          const remoteUsers = {};
          snapshot.forEach(d => {
            const data = d.data();
            if (data && typeof data === 'object') {
              remoteUsers[d.id] = {
                ...data,
                stats: (data.stats && typeof data.stats === 'object') ? data.stats : { tokens: 0, testsTaken: 0 }
              };
            }
          });
          window.cachedCloudUsers = remoteUsers;
          window.cloudAvailable = true;

          const indicator = document.getElementById('cloud-status-indicator');
          if (indicator) {
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Sync`;
          }

          if (window.app && window.app.currentUser && remoteUsers[window.app.currentUser.key]) {
            const remoteMe = remoteUsers[window.app.currentUser.key];
            if (remoteMe && remoteMe.stats && typeof remoteMe.stats.tokens === 'number') {
              if (window.state && window.state.stats) {
                window.state.stats.tokens = remoteMe.stats.tokens;
              }
              if (Array.isArray(remoteMe.completedLessons) && window.state) {
                window.state.completedLessons = remoteMe.completedLessons;
              }
              const tokEl = document.getElementById('nav-user-tokens');
              if (tokEl) tokEl.textContent = remoteMe.stats.tokens;
            }
          }

          try {
            if (window.updateGlobalLeaderboard) window.updateGlobalLeaderboard();
            if (window.refreshLeaderboardTableInPlace) window.refreshLeaderboardTableInPlace();
          } catch (renderErr) {
            console.warn("Leaderboard render error caught:", renderErr);
          }
        }, (err) => {
          console.warn("Cloud snapshot error:", err.message);
        });

      } catch (err) {
        console.warn("Firebase Init status:", err.message);
        const indicator = document.getElementById('cloud-status-indicator');
        if (indicator) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Sandbox`;
        }
      }
    }

    initFirebaseCloud();
  </script>

  <!-- CURRICULUM DATA & CORE LOGIC SCRIPT -->
  <script>
    // ==========================================
    // CORE APPLICATION STATE & NAVIGATION CONTROLLER
    // ==========================================
    window.state = {
      stats: { tokens: 10, testsTaken: 0 },
      inventory: [],
      testHistory: [],
      completedLessons: []
    };

    function updateNavBar() {
      const loginBtn = document.getElementById('nav-login-btn');
      const profileBox = document.getElementById('nav-user-profile');
      const tokenBadge = document.getElementById('nav-token-badge');
      const tokenVal = document.getElementById('nav-user-tokens');
      const nameEl = document.getElementById('nav-user-name');
      const roleEl = document.getElementById('nav-user-role');
      const bonachordLink = document.getElementById('nav-bonachord-link');

      if (window.app && window.app.currentUser) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profileBox) {
          profileBox.classList.remove('hidden');
          profileBox.classList.add('flex');
        }
        if (bonachordLink) bonachordLink.classList.remove('hidden');
        if (nameEl) nameEl.textContent = `${window.app.currentUser.firstName} ${window.app.currentUser.surname}`;
        if (roleEl) {
          roleEl.textContent = window.app.currentUser.role === 'teacher'
            ? 'Music Staff'
            : `Class ${window.app.currentUser.class}`;
        }
        if (window.app.currentUser.role === 'student') {
          if (tokenBadge) {
            tokenBadge.classList.remove('hidden');
            tokenBadge.classList.add('flex');
          }
          if (tokenVal) tokenVal.textContent = (window.state && window.state.stats && window.state.stats.tokens) || 0;
        } else {
          if (tokenBadge) tokenBadge.classList.add('hidden');
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profileBox) profileBox.classList.add('hidden');
        if (tokenBadge) tokenBadge.classList.add('hidden');
        if (bonachordLink) bonachordLink.classList.add('hidden');
      }
    }

    function stopAllActiveAudioLoops() {
      try { if (typeof stopBeatTapLoop === 'function') stopBeatTapLoop(); } catch (e) {}
      try { if (typeof stopCrotchetGameLoop === 'function') stopCrotchetGameLoop(); } catch (e) {}
      try { if (typeof stopQuaverGameLoop === 'function') stopQuaverGameLoop(); } catch (e) {}
      try { if (typeof stopLongNoteGameLoop === 'function') stopLongNoteGameLoop(); } catch (e) {}
      try { if (typeof stopDrumSequencerLoop === 'function') stopDrumSequencerLoop(); } catch (e) {}
    }

    window.app = {
      currentUser: null,
      currentRoute: 'home',
      navigate(route, params = {}) {
        stopAllActiveAudioLoops();
        this.currentRoute = route;
        updateNavBar();
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        switch (route) {
          case 'home':
            renderHomeView(viewport);
            break;
          case 'login':
            renderLoginView(viewport);
            break;
          case 'studentDash':
            if (!this.currentUser) return renderLoginView(viewport);
            renderStudentDash(viewport);
            break;
          case 'teacherDash':
            if (!this.currentUser || this.currentUser.role !== 'teacher') return renderLoginView(viewport);
            renderTeacherDash(viewport);
            break;
          case 'conceptsHub':
            renderConceptsHub(viewport);
            break;
          case 'conceptDetail':
            renderConceptDetail(viewport, params);
            break;
          case 'levelDetail':
            renderLevelDetail(viewport, params);
            break;
          case 'lessonDetail':
            renderLessonDetail(viewport, params);
            break;
          case 'levelTest':
            renderLevelTestView(viewport, params);
            break;
          case 'shop':
            renderShopView(viewport);
            break;
          default:
            renderHomeView(viewport);
        }
      }
    };

    function protectedNavigate(route, params = {}) {
      if (!window.app.currentUser) {
        showAppModal('Login Required', 'Please log in with your name and class to access lessons, games, and the rewards shop.', false);
        window.app.navigate('login');
        return;
      }
      window.app.navigate(route, params);
    }

    function openCurrentPortal() {
      if (!window.app.currentUser) {
        window.app.navigate('login');
        return;
      }
      window.app.navigate(window.app.currentUser.role === 'teacher' ? 'teacherDash' : 'studentDash');
    }

    function logoutUser() {
      stopAllActiveAudioLoops();
      window.app.currentUser = null;
      try { localStorage.removeItem('boncepts_active_session'); } catch (e) {}
      updateNavBar();
      window.app.navigate('home');
    }

    function scrollToStudentLeaderboard() {
      const el = document.getElementById('overall-student-leaderboard-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      } else {
        window.app.navigate('home');
        setTimeout(() => {
          const target = document.getElementById('overall-student-leaderboard-section');
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        }, 120);
      }
    }

    function showAppModal(title, body, isSuccess = true) {
      const modal = document.getElementById('app-modal');
      const iconBox = document.getElementById('app-modal-icon');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      if (!modal) return;
      if (titleEl) titleEl.textContent = title;
      if (bodyEl) bodyEl.textContent = body;
      if (iconBox) {
        iconBox.className = isSuccess
          ? 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-emerald-100 text-emerald-600'
          : 'w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl bg-amber-100 text-amber-600';
        iconBox.innerHTML = isSuccess ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-circle-info"></i>';
      }
      modal.classList.remove('hidden');
    }

    function closeAppModal() {
      const modal = document.getElementById('app-modal');
      if (modal) modal.classList.add('hidden');
    }

    // ==========================================
    // PERSISTENCE, TOKEN WALLET & LEADERBOARD SYNC
    // ==========================================
    function getAllUserRecords() {
      let localDb = {};
      try {
        const raw = localStorage.getItem('boncepts_users_db');
        if (raw) localDb = JSON.parse(raw);
      } catch (e) {}

      const merged = { ...localDb };
      if (window.cachedCloudUsers && typeof window.cachedCloudUsers === 'object') {
        Object.keys(window.cachedCloudUsers).forEach(k => {
          merged[k] = {
            ...(merged[k] || {}),
            ...window.cachedCloudUsers[k]
          };
        });
      }
      return merged;
    }

    function getDeduplicatedStudents() {
      const all = getAllUserRecords();
      return Object.values(all).filter(u => u && u.role === 'student' && u.firstName);
    }

    function saveUserState() {
      if (!window.app.currentUser) return;
      const u = window.app.currentUser;
      try {
        localStorage.setItem('boncepts_active_session', JSON.stringify(u));
      } catch (e) {}

      if (u.role === 'student') {
        const record = {
          key: u.key,
          firstName: u.firstName,
          surname: u.surname,
          class: u.class,
          teacher: u.teacher,
          role: 'student',
          stats: window.state.stats || { tokens: 10, testsTaken: 0 },
          inventory: window.state.inventory || [],
          testHistory: window.state.testHistory || [],
          completedLessons: window.state.completedLessons || []
        };
        try {
          const db = getAllUserRecords();
          db[u.key] = record;

    // ==========================================
    // WEB AUDIO SYNTHESIZER & ENGRAVED NOTATION HELPERS
    // ==========================================
    let sharedAudioCtx = null;
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playTonePitch(freq = 440, duration = 0.3, gainLevel = 0.3, waveType = 'triangle') {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(gainLevel, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function playDrumSound(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'kick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(145, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.22);
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'snare') {
          const bufferSize = ctx.sampleRate * 0.16;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 900;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.16);
        } else {
          const bufferSize = ctx.sampleRate * 0.06;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 6500;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.055);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.06);
        }
      } catch (e) {}
    }

    // ==========================================
    // DURATION & RHYTHM MINIGAMES (BEAT TAP, CROTCHET, QUAVER, LONG NOTE, DRUM & DICTATION)
    // ==========================================
    let beatTapState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], streak: 0, lastBeatTime: 0, intervalId: null, completed: false };

    function stopBeatTapLoop() {
      if (beatTapState.intervalId) clearInterval(beatTapState.intervalId);
      beatTapState.intervalId = null;
      beatTapState.running = false;
    }

    function mountEmbeddedBeatTapGame(target) {
      if (!target) return;
      stopBeatTapLoop();
      beatTapState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], streak: 0, lastBeatTime: 0, intervalId: null, completed: false };
      renderBeatTapUI(target);
    }

    function startBeatTapSpeed() {
      stopBeatTapLoop();
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const ms = Math.round(60000 / bpm);
      beatTapState.running = true;
      beatTapState.streak = 0;

      const tick = () => {
        beatTapState.lastBeatTime = performance.now();
        playTonePitch(660, 0.08, 0.3, 'sine');
        const pulseEl = document.getElementById('beat-tap-pulse-ring');
        if (pulseEl) {
          pulseEl.classList.add('scale-110', 'border-amber-400', 'bg-amber-400/20');
          setTimeout(() => pulseEl.classList.remove('scale-110', 'border-amber-400', 'bg-amber-400/20'), 140);
        }
      };
      tick();
      beatTapState.intervalId = setInterval(tick, ms);
      renderBeatTapUI();
    }

    function handleBeatTapHit() {
      if (!beatTapState.running || beatTapState.completed) return;
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      const beatMs = 60000 / bpm;
      const now = performance.now();
      const diff = Math.abs(now - beatTapState.lastBeatTime);
      const dist = Math.min(diff, Math.abs(beatMs - diff));

      if (dist <= beatMs * 0.36) {
        beatTapState.streak++;
        playTonePitch(880, 0.07, 0.25, 'triangle');
        if (beatTapState.streak >= 8) {
          if (beatTapState.speedIdx < 3) {
            beatTapState.speedIdx++;
            startBeatTapSpeed();
            return;
          } else {
            stopBeatTapLoop();
            beatTapState.completed = true;
            addTokens(10);
            showAppModal('Steady Beat Mastered!', 'You tapped in time across all 4 speeds and earned +10 Tokens!', true);
          }
        }
      } else {
        beatTapState.streak = 0;
        playTonePitch(180, 0.12, 0.25, 'sawtooth');
      }
      renderBeatTapUI();
    }

    function renderBeatTapUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const bpm = beatTapState.speeds[beatTapState.speedIdx];
      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">

              <h3 class="text-xl font-black">Steady Beat Spacebar Tapper</h3>
              <p class="text-xs text-slate-300 mt-1">Press the <strong>Spacebar</strong> (or tap the pad below) in time with the pulse. Get <strong>8 consecutive in-time taps</strong> to advance through all 4 speeds!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
              Speed ${beatTapState.speedIdx + 1} / 4 (${bpm} BPM)
            </span>
          </div>

          ${beatTapState.completed ? `
            <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-3">
              <h4 class="text-xl font-black text-emerald-300">All 4 Speeds Mastered (+10 Tokens)!</h4>
              <button type="button" onclick="mountEmbeddedBeatTapGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2.5 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex flex-col items-center justify-center py-4 space-y-4">
              <div id="beat-tap-pulse-ring" class="w-32 h-32 rounded-full border-4 border-indigo-500 bg-slate-800 flex flex-col items-center justify-center transition-transform">
                <span class="text-3xl font-black text-amber-400">${beatTapState.streak} / 8</span>
                <span class="text-[10px] font-bold uppercase text-slate-400">Streak</span>
              </div>
              ${!beatTapState.running ? `
                <button type="button" onclick="startBeatTapSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">

              ` : `
                <button type="button" onmousedown="handleBeatTapHit()" ontouchstart="event.preventDefault(); handleBeatTapHit();" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-black rounded-2xl text-sm shadow-lg">

    // ==========================================
    // MINIGAME 2: 8-BEAT CROTCHET SIGHT-READER (4-BEAT COUNT-IN)
    // ==========================================
    let crotchetGameState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], pattern: [], tickIdx: -4, hitBeats: [], mistakes: 0, intervalId: null, completed: false };

    function stopCrotchetGameLoop() {
      if (crotchetGameState.intervalId) clearInterval(crotchetGameState.intervalId);
      crotchetGameState.intervalId = null;
      crotchetGameState.running = false;
    }

    function generateCrotchetPattern() {
      const arr = [];
      for (let i = 0; i < 8; i++) arr.push(Math.random() > 0.35 ? 1 : 0);
      if (!arr.includes(1)) arr[0] = 1;
      return arr;
    }

    function mountEmbeddedCrotchetGame(target) {
      if (!target) return;
      stopCrotchetGameLoop();
      crotchetGameState = { running: false, speedIdx: 0, speeds: [80, 105, 130, 155], pattern: generateCrotchetPattern(), tickIdx: -4, hitBeats: [], mistakes: 0, intervalId: null, completed: false };
      renderCrotchetGameUI(target);
    }

    function startCrotchetSpeed() {
      stopCrotchetGameLoop();
      const bpm = crotchetGameState.speeds[crotchetGameState.speedIdx];
      const ms = Math.round(60000 / bpm);
      crotchetGameState.pattern = generateCrotchetPattern();
      crotchetGameState.tickIdx = -5;
      crotchetGameState.hitBeats = [];
      crotchetGameState.mistakes = 0;
      crotchetGameState.running = true;

      const step = () => {
        crotchetGameState.tickIdx++;
        const t = crotchetGameState.tickIdx;
        if (t < 0) {
          playTonePitch(784, 0.06, 0.25, 'sine');
        } else if (t < 8) {
          playTonePitch(523.25, 0.06, 0.2, 'sine');
        } else {
          stopCrotchetGameLoop();
          const required = crotchetGameState.pattern.reduce((a, b) => a + b, 0);
          if (crotchetGameState.hitBeats.length >= Math.max(1, required - 1) && crotchetGameState.mistakes <= 1) {
            if (crotchetGameState.speedIdx < 3) {
              crotchetGameState.speedIdx++;
              startCrotchetSpeed();
              return;
            } else {
              crotchetGameState.completed = true;
              addTokens(10);
              showAppModal('Crotchet Sight-Reader Complete!', 'You mastered all 4 speeds and earned +10 Tokens!', true);
            }
          }
        }
        renderCrotchetGameUI();
      };
      step();
      crotchetGameState.intervalId = setInterval(step, ms);
    }

    function handleCrotchetTap() {
      if (!crotchetGameState.running) return;
      const b = crotchetGameState.tickIdx;
      if (b < 0 || b >= 8) return;
      if (crotchetGameState.pattern[b] === 1 && !crotchetGameState.hitBeats.includes(b)) {
        crotchetGameState.hitBeats.push(b);
        playTonePitch(880, 0.09, 0.35, 'triangle');
      } else {
        crotchetGameState.mistakes++;
        playTonePitch(165, 0.12, 0.3, 'sawtooth');
      }
      renderCrotchetGameUI();
    }

    function renderCrotchetGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = crotchetGameState;
      const bpm = st.speeds[st.speedIdx];
      const countInText = st.running && st.tickIdx < 0 ? `Count-In: ${5 + st.tickIdx}` : st.running ? `Beat ${st.tickIdx + 1}` : 'Ready';

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">

              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">8-Beat Sight-Reading Challenge</span>
              <h3 class="text-xl font-black">Crotchet &amp; Rest Sight-Reader</h3>
              <p class="text-xs text-slate-300 mt-1">Press <strong>Spacebar</strong> (or tap the button) ONLY on beats showing a <strong>Crotchet</strong> and skip the rests!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">

          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">

              return `
                <div class="p-3 rounded-2xl border-2 text-center ${isCurrent ? 'border-amber-400 bg-indigo-900 scale-105' : isHit ? 'border-emerald-500 bg-emerald-950/60' : 'border-slate-700 bg-slate-800'}">
                  <div class="text-xs font-black text-slate-400 mb-1">${idx + 1}</div>
                  <div class="${val === 1 ? 'text-white' : 'text-slate-500'}">${renderEngravedNoteDarkSVG(val === 1 ? 'crotchet' : 'rest', 'w-10 h-14')}</div>
                </div>
              `;
            }).join('')}
          </div>

          ${st.completed ? `
            <div class="p-5 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-2">
              <div class="text-lg font-black text-emerald-300">All 4 Speeds Completed (+10 Tokens)!</div>
              <button type="button" onclick="mountEmbeddedCrotchetGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex justify-center gap-3">
              ${!st.running ? `
                <button type="button" onclick="startCrotchetSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                  Start Speed ${st.speedIdx + 1} (${bpm} BPM)
                </button>
              ` : `
                <button type="button" onmousedown="handleCrotchetTap()" ontouchstart="event.preventDefault(); handleCrotchetTap();" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl text-sm shadow-lg">
                  TAP CROTCHET (SPACEBAR)
                </button>
              `}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 3: 8-BEAT QUAVER & CROTCHET SIGHT-READER
    // ==========================================
    let quaverGameState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], pattern: [], halfStepIdx: -8, hitSlots: [], intervalId: null, completed: false };

    function stopQuaverGameLoop() {
      if (quaverGameState.intervalId) clearInterval(quaverGameState.intervalId);
      quaverGameState.intervalId = null;
      quaverGameState.running = false;
    }

    function generateQuaverPattern() {
      const types = ['crotchet', 'quavers', 'rest'];
      return Array.from({ length: 8 }, () => types[Math.floor(Math.random() * types.length)]);
    }

    function mountEmbeddedQuaverGame(target) {
      if (!target) return;
      stopQuaverGameLoop();
      quaverGameState = { running: false, speedIdx: 0, speeds: [72, 88, 104, 120], pattern: generateQuaverPattern(), halfStepIdx: -8, hitSlots: [], intervalId: null, completed: false };
      renderQuaverGameUI(target);
    }

    function startQuaverSpeed() {
      stopQuaverGameLoop();
      const bpm = quaverGameState.speeds[quaverGameState.speedIdx];
      const eighthMs = Math.round(30000 / bpm);
      quaverGameState.pattern = generateQuaverPattern();
      quaverGameState.halfStepIdx = -9;
      quaverGameState.hitSlots = [];
      quaverGameState.running = true;

      const step = () => {
        quaverGameState.halfStepIdx++;
        const h = quaverGameState.halfStepIdx;
        if (h < 0 && h % 2 === 0) playTonePitch(784, 0.05, 0.22, 'sine');
        else if (h >= 0 && h < 16 && h % 2 === 0) playTonePitch(523.25, 0.05, 0.18, 'sine');
        else if (h >= 16) {
          stopQuaverGameLoop();
          if (quaverGameState.speedIdx < 3) {
            quaverGameState.speedIdx++;
            startQuaverSpeed();
            return;
          } else {
            quaverGameState.completed = true;
            addTokens(10);
            showAppModal('Quaver & Crotchet Sight-Reader Complete!', 'You completed all 4 speeds and earned +10 Tokens!', true);
          }
        }
        renderQuaverGameUI();
      };
      step();
      quaverGameState.intervalId = setInterval(step, eighthMs);
    }

    function handleQuaverTap() {
      if (!quaverGameState.running) return;
      const h = quaverGameState.halfStepIdx;
      if (h < 0 || h >= 16) return;
      const beatIdx = Math.floor(h / 2);
      const isAnd = h % 2 === 1;
      const kind = quaverGameState.pattern[beatIdx];
      if ((kind === 'crotchet' && !isAnd) || kind === 'quavers') {
        if (!quaverGameState.hitSlots.includes(h)) quaverGameState.hitSlots.push(h);
        playTonePitch(880, 0.07, 0.3, 'triangle');
      } else {
        playTonePitch(165, 0.1, 0.25, 'sawtooth');
      }
      renderQuaverGameUI();
    }

    function renderQuaverGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = quaverGameState;
      const bpm = st.speeds[st.speedIdx];
      const activeBeat = st.running && st.halfStepIdx >= 0 ? Math.floor(st.halfStepIdx / 2) : -1;

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Quaver &amp; Crotchet Sight-Reader</span>
              <h3 class="text-xl font-black">8-Beat Quaver &amp; Crotchet Challenge</h3>
              <p class="text-xs text-slate-300 mt-1">Tap once on <strong>Crotchets</strong>, twice quickly ("1 &amp;") on <strong>Paired Quavers</strong>, and hold on <strong>Rests</strong> across 4 speeds!</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
              Speed ${st.speedIdx + 1} / 4 (${bpm} BPM)
            </span>
          </div>

          <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
            ${st.pattern.map((kind, idx) => {
              const isCurrent = activeBeat === idx;
              const isHit = st.hitSlots.includes(idx * 2) || st.hitSlots.includes(idx * 2 + 1);
              return `
                <div class="p-3 rounded-2xl border-2 text-center ${isCurrent ? 'border-amber-400 bg-indigo-900 scale-105' : isHit ? 'border-emerald-500 bg-emerald-950/60' : 'border-slate-700 bg-slate-800'}">
                  <div class="text-xs font-black text-slate-400 mb-1">${idx + 1}${kind === 'quavers' ? ' &' : ''}</div>
                  <div class="${kind === 'rest' ? 'text-slate-500' : 'text-white'}">${renderEngravedNoteDarkSVG(kind, 'w-10 h-14')}</div>
                </div>
              `;
            }).join('')}
          </div>

          ${st.completed ? `
            <div class="p-5 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-2">
              <div class="text-lg font-black text-emerald-300">All 4 Speeds Mastered (+10 Tokens)!</div>
              <button type="button" onclick="mountEmbeddedQuaverGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex justify-center">
              ${!st.running ? `
                <button type="button" onclick="startQuaverSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                  Start Speed ${st.speedIdx + 1} (${bpm} BPM)
                </button>
              ` : `
                <button type="button" onmousedown="handleQuaverTap()" ontouchstart="event.preventDefault(); handleQuaverTap();" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl text-sm shadow-lg">
                  TAP RHYTHM (SPACEBAR)
                </button>
              `}
            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // MINIGAME 4: LONG NOTE SUSTAIN SOUND MODULE
    // ==========================================
    let longNoteState = {
      running: false,
      speedIdx: 0,
      speeds: [76, 92, 108, 124],
      notes: [],
      beatIdx: -4,
      holding: false,
      holdStartTime: 0,
      noteSpans: [],
      noteHeldMs: [],
      continuousAcrossBoundary: [],
      failedNoteIndices: [],
      feedbackMsg: '',
      intervalId: null,
      completed: false
    };

    function stopLongNoteGameLoop() {
      if (longNoteState.intervalId) clearInterval(longNoteState.intervalId);
      longNoteState.intervalId = null;
      longNoteState.running = false;
      longNoteState.holding = false;
      longNoteState.holdStartTime = 0;
    }

    function buildLongNotePhrase() {
      const options = [
        { type: 'semibreve', beats: 4 },
        { type: 'dottedMinim', beats: 3 },
        { type: 'minim', beats: 2 },
        { type: 'crotchet', beats: 1 }
      ];
      let phrase = [];
      let remaining = 8;
      
      while (remaining > 0) {
        const valid = options.filter(o => o.beats <= remaining);
        const pick = valid[Math.floor(Math.random() * valid.length)];
        phrase.push({ type: pick.type, beats: pick.beats });
        remaining -= pick.beats;
      }
      
      // Ensure at least one note is longer than 1 beat so it remains a sustain challenge
      if (!phrase.some(n => n.beats > 1)) return buildLongNotePhrase();
      return phrase;
    }

    function computeLongNoteSpans(notes) {
      let cursor = 0;
      return notes.map((n, idx) => {
        const span = { idx, type: n.type, beats: n.beats, startBeat: cursor, endBeat: cursor + n.beats };
        cursor += n.beats;
        return span;
      });
    }

    function recordLongNoteHoldSegment(endTimeMs) {
      const st = longNoteState;
      if (!st.holding || !st.holdStartTime) return;
      const startMs = st.holdStartTime;
      const resolvedEndMs = typeof endTimeMs === 'number' ? endTimeMs : performance.now();
      st.holding = false;
      st.holdStartTime = 0;
      if (!st.running || !st.phraseStartTime) return;

      const bpm = st.speeds[st.speedIdx];
      const beatMs = 60000 / bpm;

      st.noteSpans.forEach((span, idx) => {
        const nStart = st.phraseStartTime + span.startBeat * beatMs;
        const nEnd = st.phraseStartTime + span.endBeat * beatMs;
        // Forgiving 260ms grace buffer before note starts and after note ends
        const overlapStart = Math.max(startMs, nStart - 260);
        const overlapEnd = Math.min(resolvedEndMs, nEnd + 260);
        if (overlapEnd > overlapStart) {
          st.noteHeldMs[idx] = (st.noteHeldMs[idx] || 0) + (overlapEnd - overlapStart);
        }
      });
    }

    function mountEmbeddedLongNoteGame(target) {
      if (!target) return;
      stopLongNoteGameLoop();
      const notes = buildLongNotePhrase();
      longNoteState = {
        running: false,
        speedIdx: 0,
        speeds: [76, 92, 108, 124],
        notes,
        beatIdx: -4,
        holding: false,
        holdStartTime: 0,
        phraseStartTime: 0,
        noteSpans: computeLongNoteSpans(notes),
        noteHeldMs: notes.map(() => 0),
        continuousAcrossBoundary: notes.map(() => false),
        failedNoteIndices: [],
        feedbackMsg: '',
        intervalId: null,
        completed: false
      };
      renderLongNoteGameUI(target);
    }

    function startLongNoteSpeed() {
      stopLongNoteGameLoop();
      const bpm = longNoteState.speeds[longNoteState.speedIdx];
      const ms = Math.round(60000 / bpm);
      
      // Generate a new mixed phrase UNLESS they are retrying a failed attempt
      const notes = (longNoteState.failedNoteIndices && longNoteState.failedNoteIndices.length > 0)
        ? longNoteState.notes
        : buildLongNotePhrase();
        
      longNoteState.notes = notes;
      longNoteState.noteSpans = computeLongNoteSpans(notes);
      longNoteState.noteHeldMs = notes.map(() => 0);
      longNoteState.continuousAcrossBoundary = notes.map(() => false);
      longNoteState.failedNoteIndices = [];
      longNoteState.feedbackMsg = '';
      longNoteState.beatIdx = -5;
      longNoteState.holding = false;
      longNoteState.holdStartTime = 0;
      longNoteState.phraseStartTime = 0;
      longNoteState.running = true;

      const step = () => {
        longNoteState.beatIdx++;
        const b = longNoteState.beatIdx;
        const now = performance.now();

        if (b < 0) {
          playTonePitch(784, 0.06, 0.22, 'sine');
        } else if (b < 8) {
          if (b === 0) {
            longNoteState.phraseStartTime = now;
          }
          playTonePitch(523.25, 0.06, 0.18, 'sine');

          // Check if a new note starts on beat b while Spacebar was held continuously since well before this beat
          const startingNoteIdx = longNoteState.noteSpans.findIndex(s => s.startBeat === b);
          if (startingNoteIdx > 0 && longNoteState.holding && longNoteState.holdStartTime > 0) {
            // Only flag if they held straight across without releasing for at least 380ms prior to the new note
            if (now - longNoteState.holdStartTime > 380) {
              longNoteState.continuousAcrossBoundary[startingNoteIdx] = true;
            }
          }

          if (longNoteState.holding) {
            playTonePitch(329.63, (ms / 1000) * 0.95, 0.28, 'triangle');
          }
        } else {
          if (longNoteState.holding) {
            recordLongNoteHoldSegment(now);
          }
          stopLongNoteGameLoop();

          // Evaluate each note's sustained time with generous human tolerance
          const failed = [];
          longNoteState.noteSpans.forEach((span, idx) => {
            const targetMs = span.beats * ms;
            const heldMs = longNoteState.noteHeldMs[idx] || 0;
            // Generous leniency: allow holding at least 55% of target duration (minus 220ms) and up to target + 1.35 beats
            const minAllowed = Math.max(180, targetMs * 0.55 - 180);
            const maxAllowed = targetMs + ms * 1.35;

            if (longNoteState.continuousAcrossBoundary[idx] || heldMs < minAllowed || heldMs > maxAllowed) {
              failed.push(idx);
            }
          });

          longNoteState.failedNoteIndices = failed;

          if (failed.length === 0) {
            if (longNoteState.speedIdx < 3) {
              longNoteState.speedIdx++;
              longNoteState.feedbackMsg = `Great sustain! Advancing to Speed ${longNoteState.speedIdx + 1}...`;
              renderLongNoteGameUI();
              setTimeout(() => startLongNoteSpeed(), 700);
              return;
            } else {
              longNoteState.completed = true;
              addTokens(10);
              showAppModal('Long Note Sustain Mastered!', 'You sustained Minims, Dotted Minims, and Semibreves cleanly across all 4 speeds (+10 Tokens)!', true);
            }
          } else {
            longNoteState.feedbackMsg = 'Check the red-bordered note(s): hold for the full beat count and release briefly before the next note starts!';
            playTonePitch(165, 0.2, 0.25, 'sawtooth');
          }
        }
        renderLongNoteGameUI();
      };
      step();
      longNoteState.intervalId = setInterval(step, ms);
    }

    function beginLongNoteHold() {
      if (!longNoteState.running) return;
      if (!longNoteState.holding) {
        longNoteState.holding = true;
        longNoteState.holdStartTime = performance.now();
        playTonePitch(329.63, 0.4, 0.3, 'triangle');
        renderLongNoteGameUI();
      }
    }

    function endLongNoteHold() {
      if (longNoteState.holding) {
        recordLongNoteHoldSegment(performance.now());
        renderLongNoteGameUI();
      }
    }

    function renderLongNoteGameUI(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const st = longNoteState;
      const bpm = st.speeds[st.speedIdx];
      const activeSpanIdx = st.running && st.beatIdx >= 0 && st.beatIdx < 8
        ? st.noteSpans.findIndex(s => st.beatIdx >= s.startBeat && st.beatIdx < s.endBeat)
        : -1;
      const statusBanner = st.running && st.beatIdx < 0
        ? `Count-In: ${5 + st.beatIdx}`
        : st.running
        ? `Beat ${st.beatIdx + 1} of 8`
        : 'Ready';

      target.innerHTML = `
        <div class="bg-slate-900 p-6 sm:p-8 rounded-3xl text-white space-y-5 border border-slate-800">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <span class="text-[11px] font-black uppercase tracking-widest text-amber-400">Long Note Sustain Synth Module</span>
              <h3 class="text-xl font-black">8-Beat Sustain &amp; Hold Challenge</h3>
              <p class="text-xs text-slate-300 mt-1">
                <strong>Instructions:</strong> After the 4-beat count-in, press and <strong>HOLD Spacebar</strong> for the exact beats of each note, then <strong>RELEASE Spacebar</strong> before pressing again for the next note!
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="px-3 py-1 rounded-xl bg-amber-400/15 border border-amber-400/40 text-xs font-black text-amber-300">
                ${statusBanner}
              </span>
              <span class="px-3 py-1 rounded-xl bg-indigo-950 border border-indigo-700 text-xs font-black text-indigo-200">
                Speed ${st.speedIdx + 1} / 4 (${bpm} BPM)
              </span>
            </div>
          </div>

          ${st.feedbackMsg ? `
            <div class="p-3.5 rounded-2xl ${st.failedNoteIndices.length > 0 ? 'bg-rose-950/70 border border-rose-500 text-rose-200' : 'bg-emerald-950/70 border border-emerald-500 text-emerald-200'} text-xs font-bold text-center">
              ${st.feedbackMsg}
            </div>
          ` : ''}

          <div class="grid grid-cols-1 sm:grid-cols-${st.notes.length} gap-3">
            ${st.notes.map((n, idx) => {
              const isCurrent = activeSpanIdx === idx;
              const isFailed = st.failedNoteIndices.includes(idx);
              const borderClass = isFailed
                ? 'border-2 border-rose-500 bg-rose-950/40'
                : isCurrent
                ? 'border-2 border-amber-400 bg-indigo-950/80 scale-[1.02]'
                : 'border border-slate-700 bg-slate-800';
              const keycapClass = isCurrent && st.holding
                ? 'bg-emerald-400 text-slate-950 border-emerald-300 translate-y-0.5'
                : isCurrent
                ? 'bg-amber-400 text-slate-950 border-amber-300'
                : 'bg-slate-700 text-slate-300 border-slate-600';

              return `
                <div class="p-4 rounded-2xl ${borderClass} text-center flex flex-col justify-between transition-all">
                  <div>
                    <div class="text-amber-300">${renderEngravedNoteDarkSVG(n.type, 'w-12 h-16')}</div>
                    <div class="font-black text-xs uppercase mt-1">${n.beats} ${n.beats === 1 ? 'Beat' : 'Beats'}</div>
                  </div>
                  <!-- Spacebar Keycap Image Below Each Note -->
                  <div class="mt-3 pt-2 border-t border-slate-700/70">
                    <div class="mx-auto w-full max-w-[140px] py-1.5 px-2 rounded-lg border-b-4 text-[10px] font-black uppercase tracking-widest transition-all ${keycapClass}">
                      <i class="fa-solid fa-keyboard mr-1"></i> Spacebar
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${st.completed ? `
            <div class="p-5 rounded-2xl bg-emerald-950/60 border border-emerald-500 text-center space-y-2">
              <div class="text-lg font-black text-emerald-300">All 4 Sustain Speeds Mastered (+10 Tokens)!</div>
              <button type="button" onclick="mountEmbeddedLongNoteGame(document.getElementById('embedded-tool-container'))" class="px-5 py-2 bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
            </div>
          ` : `
            <div class="flex justify-center">
              ${!st.running ? `
                <button type="button" onclick="startLongNoteSpeed()" class="px-7 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-2xl text-xs shadow-lg">
                  ${st.failedNoteIndices.length > 0 ? `Retry Speed ${st.speedIdx + 1} (${bpm} BPM)` : `Start Speed ${st.speedIdx + 1} (${bpm} BPM)`}
                </button>
              ` : `
                <button type="button"
                  onmousedown="beginLongNoteHold()"
                  onmouseup="endLongNoteHold()"
                  onmouseleave="endLongNoteHold()"
                  ontouchstart="event.preventDefault(); beginLongNoteHold();"
                  ontouchend="endLongNoteHold()"
                  class="px-8 py-4 ${st.holding ? 'bg-emerald-500 text-slate-950 scale-95' : 'bg-indigo-600 text-white'} font-black rounded-2xl text-sm shadow-lg transition-all">
                  ${st.holding ? 'SUSTAINING NOTE...' : 'PRESS & HOLD (SPACEBAR)'}
                </button>
              `}
            </div>
          `}
        </div>
      `;
    }

    // Global Spacebar handler for rhythm games
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (beatTapState.running || crotchetGameState.running || quaverGameState.running || longNoteState.running) {
          e.preventDefault();
        }
        if (!e.repeat) {
          if (beatTapState.running) handleBeatTapHit();
          else if (crotchetGameState.running) handleCrotchetTap();
          else if (quaverGameState.running) handleQuaverTap();
          else if (longNoteState.running) beginLongNoteHold();
        }
      }
    });

    window.addEventListener('keyup', (e) => {

    const drumSubdivisionLabels = ['1', '&', '2', '&', '3', '&', '4', '&'];

    function stopDrumSequencerLoop() {
      if (drumLabState.sequencerIntervalId) {
        clearInterval(drumLabState.sequencerIntervalId);
        drumLabState.sequencerIntervalId = null;
      }
      drumLabState.sequencerPlaying = false;
      drumLabState.sequencerStep = -1;
    }

    function toggleDrumSequencerLoop() {
      if (drumLabState.sequencerPlaying) {
        stopDrumSequencerLoop();
        mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
        return;
      }
      drumLabState.sequencerPlaying = true;
      drumLabState.sequencerStep = -1;

      const advanceStep = () => {
        if (!drumLabState.sequencerPlaying) return;
        drumLabState.sequencerStep = (drumLabState.sequencerStep + 1) % 8;
        const step = drumLabState.sequencerStep;
        if (drumLabState.grid.hihat[step]) playDrumSound('hihat');
        if (drumLabState.grid.snare[step]) playDrumSound('snare');
        if (drumLabState.grid.kick[step]) playDrumSound('kick');

        document.querySelectorAll('[data-seq-step]').forEach(btn => {
          const btnStep = Number(btn.getAttribute('data-seq-step'));
          if (btnStep === step) {
            btn.classList.add('ring-2', 'ring-emerald-400', 'scale-105');
          } else {
            btn.classList.remove('ring-2', 'ring-emerald-400', 'scale-105');
          }
        });
      };

      advanceStep();
      drumLabState.sequencerIntervalId = setInterval(advanceStep, 260);
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function toggleDrumGridCell(inst, idx) {
      drumLabState.grid[inst][idx] = drumLabState.grid[inst][idx] ? 0 : 1;
      if (!drumLabState.sequencerPlaying && drumLabState.grid[inst][idx]) {
        playDrumSound(inst);
      }
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function playDrumGridSequence(gridObj) {
      toggleDrumSequencerLoop();

    function generateSimpleRhythmDictation() {
      const options = ['crotchet', 'quavers'];
      const pattern = Array.from({ length: 4 }, () => options[Math.floor(Math.random() * options.length)]);
      if (!pattern.includes('quavers')) pattern[1] = 'quavers';
      if (!pattern.includes('crotchet')) pattern[0] = 'crotchet';
      return pattern;
    }

    function playDictationMysteryPattern() {
      if (drumLabState.dictationPlaying) return;
      drumLabState.dictationPlaying = true;
      const beatMs = 600;

      // 4-Beat Count-In (1, 2, 3, 4)
      for (let c = 0; c < 4; c++) {
        setTimeout(() => {
          drumLabState.dictationStatusText = `Count-In: ${c + 1}`;
          playTonePitch(784, 0.06, 0.25, 'sine');
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
        }, c * beatMs);
      }

      // 4-Beat Rhythm Pattern (Crotchets & Paired Quavers)
      drumLabState.dictationTarget.forEach((noteType, beatIdx) => {
        const startOffset = (4 + beatIdx) * beatMs;
        setTimeout(() => {
          drumLabState.dictationStatusText = `Listening: Beat ${beatIdx + 1}`;
          const statusEl = document.getElementById('dictation-live-status');
          if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;

          if (noteType === 'crotchet') {
            playTonePitch(440, 0.16, 0.42, 'triangle');
          } else {
            playTonePitch(440, 0.11, 0.42, 'triangle');
            setTimeout(() => {
              playTonePitch(440, 0.11, 0.42, 'triangle');
            }, beatMs / 2);
          }
        }, startOffset);
      });

      setTimeout(() => {
        drumLabState.dictationPlaying = false;
        drumLabState.dictationStatusText = 'Drag & drop Crotchets or Quavers into Beats 1–4!';
        const statusEl = document.getElementById('dictation-live-status');
        if (statusEl) statusEl.textContent = drumLabState.dictationStatusText;
      }, 8 * beatMs + 80);
    }

    function handleDictationDragStart(event, noteType) {
      drumLabState.draggedNoteTool = noteType;
      drumLabState.selectedNoteTool = noteType;
      if (event && event.dataTransfer) {
        event.dataTransfer.setData('text/plain', noteType);
        event.dataTransfer.effectAllowed = 'copy';
      }
    }

    function handleDictationDrop(event, beatIdx) {
      if (event) event.preventDefault();
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      let droppedType = drumLabState.draggedNoteTool || drumLabState.selectedNoteTool;
      if (event && event.dataTransfer) {
        const dt = event.dataTransfer.getData('text/plain');
        if (dt === 'crotchet' || dt === 'quavers') droppedType = dt;
      }
      drumLabState.dictationGuess[beatIdx] = droppedType;
      drumLabState.draggedNoteTool = null;
      playTonePitch(droppedType === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');
      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));
    }

    function applySelectedDictationNote(beatIdx) {
      if (drumLabState.dictationAnswered || drumLabState.dictationCompleted) return;
      drumLabState.dictationGuess[beatIdx] = drumLabState.selectedNoteTool;
      playTonePitch(drumLabState.selectedNoteTool === 'crotchet' ? 523.25 : 659.25, 0.08, 0.25, 'triangle');

    function checkDictationPatternGuess() {
      const st = drumLabState;
      if (st.dictationAnswered || st.dictationCompleted) return;
      if (st.dictationGuess.includes(null)) {
        showAppModal('Incomplete Bar', 'Please drag and drop a Crotchet or Paired Quavers into all 4 beat boxes before checking!', false);

      const match = st.dictationTarget.every((v, i) => v === st.dictationGuess[i]);

      st.dictationLastCorrect = match;

      if (match) {
        st.dictationScore++;
        addTokens(2);
        playTonePitch(659.25, 0.2, 0.35, 'triangle');

        playTonePitch(165.00, 0.25, 0.3, 'sawtooth');

      mountEmbeddedDrumModule(document.getElementById('embedded-tool-container'));

    // ==========================================
    // INTERACTIVE MINIGAME 9: TEXTURE SOUND LAB & 5-ROUND LAYER DETECTIVE (2 TOKENS PER CORRECT ANSWER)
    // ==========================================
    const textureLabLayers = [
      { id: 'bass', role: 'BASS', name: 'Deep Bass Drone', color: '#818cf8', barBg: 'bg-indigo-500', desc: 'Low sustained C2 rumble' },
      { id: 'harmony', role: 'HARMONY', name: 'Warm Harmony Pad', color: '#f472b6', barBg: 'bg-pink-500', desc: 'Lush mid-range C major chord' },
      { id: 'rhythm', role: 'RHYTHM', name: 'Arpeggio Motion', color: '#fbbf24', barBg: 'bg-amber-400', desc: 'Pulsing 8th-note rhythmic pattern' },
      { id: 'melody', role: 'MELODY', name: 'Lead Melody', color: '#34d399', barBg: 'bg-emerald-400', desc: 'Expressive singing upper tune' },
      { id: 'air', role: 'UPPER AIR', name: 'Sparkle Chime', color: '#22d3ee', barBg: 'bg-cyan-400', desc: 'High shimmering bell overtones' }
    ];

    let textureLabState = {
      activeLayers: ['bass', 'melody'],
      round: 1,
      totalRounds: 5,
      score: 0,
      targetLayers: [],
      selectedGuess: [],
      answered: false,
      lastCorrect: false,
      completed: false
    };

    function playTextureLayerCombination(layerIds) {
      if (!Array.isArray(layerIds) || layerIds.length === 0) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;

        // 1. Deep Bass Drone (Sawtooth low-pass C2)
        if (layerIds.includes('bass')) {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(65.41, now); // C2
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(210, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.42, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.48);
        }

        // 2. Warm Harmony Pad (Triangle triad C3-E3-G3)
        if (layerIds.includes('harmony')) {
          [130.81, 164.81, 196.00].forEach(freq => {
            playTonePitch(freq, 1.4, 0.14, 'triangle');
          });
        }

        // 3. Arpeggio Motion (Crisp square 8th-note steps)
        if (layerIds.includes('rhythm')) {
          const arpNotes = [261.63, 329.63, 392.00, 329.63, 261.63, 329.63, 392.00, 493.88];
          arpNotes.forEach((freq, idx) => {
            setTimeout(() => {
              playTonePitch(freq, 0.12, 0.16, 'square');
            }, idx * 170);
          });
        }

        // 4. Lead Melody (Singing upper melodic phrase G4-A4-G4-E4-C5)
        if (layerIds.includes('melody')) {
          const melSeq = [
            { freq: 392.00, delay: 0, dur: 0.32 },
            { freq: 440.00, delay: 330, dur: 0.25 },
            { freq: 392.00, delay: 600, dur: 0.25 },
            { freq: 523.25, delay: 880, dur: 0.52 }
          ];
          melSeq.forEach(n => {
            setTimeout(() => {
              playTonePitch(n.freq, n.dur, 0.26, 'sawtooth');
            }, n.delay);
          });
        }

        // 5. Sparkle Chime (High sine bell pings C6-G6-E6)
        if (layerIds.includes('air')) {
          const chimes = [
            { freq: 1046.50, delay: 120 },
            { freq: 1567.98, delay: 540 },
            { freq: 1318.51, delay: 980 }
          ];
          chimes.forEach(c => {
            setTimeout(() => {
              playTonePitch(c.freq, 0.45, 0.18, 'sine');
            }, c.delay);
          });
        }
      } catch (e) {}
    }

    function generateRandomTextureLayerSet() {
      const count = Math.floor(Math.random() * 4) + 1; // 1 to 4 layers (up to 5)
      const allIds = textureLabLayers.map(l => l.id).sort(() => Math.random() - 0.5);
      return allIds.slice(0, Math.min(5, Math.max(1, count)));
    }

    function toggleTextureSandboxLayer(layerId) {
      const idx = textureLabState.activeLayers.indexOf(layerId);

        textureLabState.activeLayers.push(layerId);

      renderTextureLabGameUI();

      playTextureLayerCombination(textureLabState.activeLayers);

    function submitTextureLayerGuess() {
      const st = textureLabState;
      if (st.answered || st.completed || st.selectedGuess.length === 0) return;

      const sortedTarget = [...st.targetLayers].sort();
      const sortedGuess = [...st.selectedGuess].sort();
      const isRight =
        sortedTarget.length === sortedGuess.length &&
        sortedTarget.every((val, idx) => val === sortedGuess[idx]);

      st.answered = true;
      st.lastCorrect = isRight;

      if (isRight) {
        st.score++;
        playTonePitch(659.25, 0.22, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.28, 0.3, 'sawtooth');
      }
      renderTextureLabGameUI();
    }

    const pitchWaveCatalog = [
      { id: 'low', label: 'Low Pitch (~130 Hz)', desc: 'Slow, wide waves', freq: 130.81, color: '#818cf8', path: 'M0 25 Q 25 4, 50 25 T 100 25 T 150 25 T 200 25' },

      { id: 'high', label: 'High Pitch (~523 Hz)', desc: 'Fast, close waves', freq: 523.25, color: '#38bdf8', path: 'M0 25 Q 8.3 4, 16.6 25 T 33.3 25 T 50 25 T 66.6 25 T 83.3 25 T 100 25 T 116.6 25 T 133.3 25 T 150 25 T 166.6 25 T 183.3 25 T 200 25' },
      { id: 'vhigh', label: 'Very High Pitch (~784 Hz)', desc: 'Ultra-fast, tightly packed waves', freq: 783.99, color: '#fbbf24', path: 'M0 25 Q 6.25 4, 12.5 25 T 25 25 T 37.5 25 T 50 25 T 62.5 25 T 75 25 T 87.5 25 T 100 25 T 112.5 25 T 125 25 T 137.5 25 T 150 25 T 162.5 25 T 175 25 T 187.5 25 T 200 25' }
    ];

    let pitchWaveState = { round: 1, totalRounds: 4, score: 0, target: null, choices: [], answered: false, lastCorrect: false, completed: false };

    function setupPitchWaveRound() {
      const pool = pitchWaveState.round <= 2 ? pitchWaveCatalog.slice(0, 3) : pitchWaveCatalog;
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      pitchWaveState.choices = shuffled;
      pitchWaveState.target = shuffled[Math.floor(Math.random() * shuffled.length)];
      pitchWaveState.answered = false;
    }

    function mountEmbeddedPitchWaveGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      pitchWaveState = { round: 1, totalRounds: 4, score: 0, target: null, choices: [], answered: false, lastCorrect: false, completed: false };
      setupPitchWaveRound();
      renderPitchWaveGameUI(target);
    }

    function selectPitchWaveChoice(waveId) {
      if (pitchWaveState.answered || pitchWaveState.completed) return;
      pitchWaveState.answered = true;
      const isRight = pitchWaveState.target && pitchWaveState.target.id === waveId;
      pitchWaveState.lastCorrect = isRight;
      if (isRight) {
        pitchWaveState.score++;
        playTonePitch(659.25, 0.2, 0.35, 'triangle');
      } else {
        playTonePitch(155.56, 0.25, 0.3, 'sawtooth');

      renderPitchWaveGameUI();

                <span class="text-xs font-bold">${st.lastCorrect ? `✓ Correct! That was ${st.target.label}.` : `✗ Not quite — that was ${st.target.label}.`}</span>

    // ==========================================
    // RESTORED MELODIC CONTOUR (STEP VS LEAP & DIRECTION) MINIGAME (10 ROUNDS, 1 TOKEN PER CORRECT ANSWER)
    // ==========================================
    const melodicContourIntervals = [
      { id: 'asc_step', label: 'Ascending Step', movement: 'Step', direction: 'Ascending', freqs: [261.63, 293.66], yPositions: [48, 41] },
      { id: 'desc_step', label: 'Descending Step', movement: 'Step', direction: 'Descending', freqs: [440.00, 392.00], yPositions: [27, 34] },
      { id: 'asc_leap', label: 'Ascending Leap', movement: 'Leap', direction: 'Ascending', freqs: [261.63, 392.00], yPositions: [48, 27] },
      { id: 'desc_leap', label: 'Descending Leap', movement: 'Leap', direction: 'Descending', freqs: [523.25, 329.63], yPositions: [20, 41] },
      { id: 'asc_step_2', label: 'Ascending Step', movement: 'Step', direction: 'Ascending', freqs: [329.63, 349.23], yPositions: [41, 34] },
      { id: 'desc_step_2', label: 'Descending Step', movement: 'Step', direction: 'Descending', freqs: [392.00, 349.23], yPositions: [27, 34] },

      { id: 'desc_leap_2', label: 'Descending Leap', movement: 'Leap', direction: 'Descending', freqs: [493.88, 293.66], yPositions: [20, 48] }
    ];

    let melodicContourState = {
      round: 1,
      totalRounds: 10,
      score: 0,
      current: melodicContourIntervals[0],
      pickedMovement: null,
      pickedDirection: null,
      answered: false,
      lastCorrect: false,
      completed: false
    };

    function playMelodicInterval(freqs) {
      if (!Array.isArray(freqs) || freqs.length < 2) return;
      playTonePitch(freqs[0], 0.42, 0.38, 'triangle');
      setTimeout(() => {
        playTonePitch(freqs[1], 0.52, 0.38, 'triangle');
      }, 480);
    }

    function pickNextMelodicContourChallenge() {
      return melodicContourIntervals[Math.floor(Math.random() * melodicContourIntervals.length)];
    }

    function mountEmbeddedMelodicContourGame(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      melodicContourState = {
        round: 1,
        totalRounds: 10,
        score: 0,
        current: pickNextMelodicContourChallenge(),
        pickedMovement: null,
        pickedDirection: null,
        answered: false,
        lastCorrect: false,
        completed: false
      };
      renderMelodicContourGameUI(target);
    }

    function checkMelodicContourGuess() {
      const st = melodicContourState;
      if (st.answered || st.completed || !st.pickedMovement || !st.pickedDirection) return;
      st.answered = true;
      const isRight = st.pickedMovement === st.current.movement && st.pickedDirection === st.current.direction;
      st.lastCorrect = isRight;

      if (isRight) {
        st.score++;
        addTokens(1);

    function mountEmbeddedDynamicsSimulator(target) {
      if (!target) target = document.getElementById('embedded-tool-container');
      if (!target) return;
      const deck = [];
      dynamicsMemoryPairs.forEach(p => {
        deck.push({ pairId: p.id, text: p.front, kind: 'symbol' });
        deck.push({ pairId: p.id, text: p.back, kind: 'def' });
      });
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      dynamicsMemoryState = { cards: deck, flipped: [], matched: [], lock: false };
      renderDynamicsMemoryUI(target);
    }

    function flipDynamicsMemoryCard(idx) {
      const st = dynamicsMemoryState;
      if (st.lock || st.flipped.includes(idx) || st.matched.includes(st.cards[idx].pairId)) return;
      st.flipped.push(idx);
      renderDynamicsMemoryUI();

      if (st.flipped.length === 2) {
        st.lock = true;
        const [a, b] = st.flipped;
        if (st.cards[a].pairId === st.cards[b].pairId) {
          st.matched.push(st.cards[a].pairId);
          st.flipped = [];
          st.lock = false;
          playTonePitch(659.25, 0.15, 0.3, 'triangle');
          renderDynamicsMemoryUI();
          if (st.matched.length === dynamicsMemoryPairs.length) {
            addTokens(10);
            showAppModal('Dynamics Memory Match Complete!', 'You matched all 8 dynamic symbols and earned +10 Tokens! Reshuffling cards...', true);
            setTimeout(() => mountEmbeddedDynamicsSimulator(), 600);
          }
        } else {
          setTimeout(() => {
            st.flipped = [];
            st.lock = false;
            renderDynamicsMemoryUI();
          }, 800);
        }
      }
    }

    function submitLevelTest(conceptId, levelNum) {
      const concept = conceptsCurriculum.find(c => c.id === conceptId) || conceptsCurriculum[0];
      const level = concept.levels.find(l => l.level === levelNum) || concept.levels[0];
      const questions = activeShuffledQuestions.length > 0 ? activeShuffledQuestions : (level.testQuestions || []);
      let score = 0;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
        if (selected && Number(selected.value) === q.correct) {
          score++;
        }
      });

      const pct = Math.round((score / questions.length) * 100);
      const earnedTokens = pct >= 80 ? 25 : pct >= 50 ? 15 : 5;

      if (!state.testHistory) state.testHistory = [];
      state.testHistory.unshift({
        concept: concept.title,
        level: level.title,
        score: score,
        total: questions.length,
        percentage: pct,
        date: new Date().toLocaleDateString()
      });
      if (!state.stats) state.stats = { tokens: 0, testsTaken: 0 };
      state.stats.testsTaken = (state.stats.testsTaken || 0) + 1;
      addTokens(earnedTokens);

      showAppModal(
        `Test Complete: ${score}/${questions.length} (${pct}%)`,
        `Your mark has been confidentially recorded in your Student Markbook, and you earned +${earnedTokens} Tokens!`,
        pct >= 50
      );
      app.navigate('studentDash');
    }

    function buyShopItem(itemId) {
      const item = shopCatalog.find(i => i.id === itemId);
      if (!item) return;
      if (!state.inventory) state.inventory = [];
      if (state.inventory.includes(item.id)) return;

      const bal = (state.stats && state.stats.tokens) || 0;
      if (bal < item.cost) {
        showAppModal('Not Enough Tokens', `You need ${item.cost} tokens for ${item.name}, and you currently have ${bal}. Complete lessons and tests to earn more!`, false);
        return;
      }

      state.stats.tokens = bal - item.cost;
      state.inventory.push(item.id);
      saveUserState();
      showAppModal('Item Unlocked!', `You redeemed ${item.name} (${item.category})!`, true);
      renderShopView(document.getElementById('app-viewport'));
    }

    function handleUserLogin() {
      const role = document.getElementById('login-role').value;

      if (!firstName || !surname) return;

        if (code !== 'Rocky') {
          showAppModal('Invalid Staff Code', 'Please enter the valid teacher staff access code.', false);
          return;

        const key = `teacher_${firstName.toLowerCase()}_${surname.toLowerCase()}`.replace(/\s+/g, '_');
        app.currentUser = { key, firstName, surname, role: 'teacher', class: 'Staff', teacher: `${firstName} ${surname}` };
        saveUserState();
        app.navigate('teacherDash');
        return;

      const studentClass = document.getElementById('login-class').value;
      const teacher = document.getElementById('login-teacher').value;
      const key = `student_${firstName.toLowerCase()}_${surname.toLowerCase()}`.replace(/\s+/g, '_');

      const existingUsers = getAllUserRecords();
      const existing = existingUsers[key];

      app.currentUser = {
        key,
        firstName,
        surname,
        class: studentClass,
        teacher,
        role: 'student'
      };

      if (existing) {
        state = {
          stats: existing.stats || { tokens: 10, testsTaken: 0 },
          inventory: existing.inventory || [],
          testHistory: existing.testHistory || [],
          completedLessons: existing.completedLessons || []
        };
      } else {
        state = {
          stats: { tokens: 10, testsTaken: 0 },
          inventory: [],
          testHistory: [],
          completedLessons: []
        };
      }

      saveUserState();
      app.navigate('studentDash');

                                  <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs shrink-0 ${
                                    isModuleComplete
                                      ? 'bg-emerald-500 text-white'
                                      : isStarted
                                      ? 'bg-amber-400 text-slate-950'
                                      : 'bg-white border border-slate-300 text-slate-300'
                                  }">
                                    <i class="fa-solid ${isModuleComplete ? 'fa-check' : isStarted ? 'fa-spinner' : 'fa-minus'}"></i>
                                  </span>
                                  <div class="truncate">
                                    <div class="text-xs font-bold text-slate-800 truncate">${concept.title}</div>
                                    <div class="text-[10px] font-semibold ${isModuleComplete ? 'text-emerald-700' : isStarted ? 'text-amber-700' : 'text-slate-400'}">
                                      ${viewedCount} / ${totalLessonsInConcept} Lessons Viewed
                                    </div>
                                  </div>
                                </div>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-black shrink-0 ${
                                  isModuleComplete
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : isStarted
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-slate-200/70 text-slate-500'
                                }">
                                  ${isModuleComplete ? 'Done' : isStarted ? 'In Progress' : 'Not Started'}
                                </span>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>

                      <!-- Right: Confidential 15-Question Test Results (5 cols) -->
                      <div class="lg:col-span-5 space-y-3">
                        <h4 class="text-xs font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                          <i class="fa-solid fa-file-circle-check text-emerald-600"></i> 15-Question Level Test Results (${testHistory.length})
                        </h4>
                        ${testHistory.length === 0 ? `
                          <div class="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-xs text-slate-400 text-center">
                            No level tests submitted yet.
                          </div>
                        ` : `
                          <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                            ${testHistory.map(t => `
                              <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                                <div>
                                  <div class="font-bold text-slate-800">${t.concept}</div>
                                  <div class="text-[10px] text-slate-500">${t.level} &bull; ${t.date}</div>
                                </div>
                                <span class="px-2.5 py-1 rounded-xl font-black shrink-0 ${
                                  t.percentage >= 80
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : t.percentage >= 50
                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-rose-100 text-rose-800'
                                }">
                                  ${t.score}/${t.total} (${t.percentage}%)
                                </span>
                              </div>
                            `).join('')}
                          </div>
                        `}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function openEditStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('edit-student-key').value = key;
      document.getElementById('edit-student-firstname').value = s.firstName || '';
      document.getElementById('edit-student-surname').value = s.surname || '';
      document.getElementById('edit-student-class').value = s.class || '7A';
      document.getElementById('edit-student-teacher').value = s.teacher || 'Mr B';
      document.getElementById('edit-student-tokens').value = (s.stats && s.stats.tokens) || 0;
      document.getElementById('edit-student-modal').classList.remove('hidden');
    }

    function closeEditStudentModal() {
      document.getElementById('edit-student-modal').classList.add('hidden');
    }

    function saveEditedStudent() {
      const key = document.getElementById('edit-student-key').value;
      const all = getAllUserRecords();
      const existing = all[key];
      if (!existing) return;

      existing.firstName = document.getElementById('edit-student-firstname').value.trim() || existing.firstName;
      existing.surname = document.getElementById('edit-student-surname').value.trim() || existing.surname;
      existing.class = document.getElementById('edit-student-class').value;
      existing.teacher = document.getElementById('edit-student-teacher').value;
      if (!existing.stats) existing.stats = { tokens: 0, testsTaken: 0 };
      existing.stats.tokens = Number(document.getElementById('edit-student-tokens').value) || 0;

      try {
        all[key] = existing;
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.saveUserRecordToCloud) {
        window.saveUserRecordToCloud(key, existing);
      }

      closeEditStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    function openDeleteStudentModal(key) {
      const all = getAllUserRecords();
      const s = all[key];
      if (!s) return;
      document.getElementById('delete-student-key').value = key;
      document.getElementById('delete-student-name').textContent = `${s.firstName} ${s.surname}`;
      document.getElementById('delete-student-modal').classList.remove('hidden');
    }

    function closeDeleteStudentModal() {
      document.getElementById('delete-student-modal').classList.add('hidden');
    }

    function confirmDeleteStudent() {
      const key = document.getElementById('delete-student-key').value;
      if (!key) return;
      try {
        const all = getAllUserRecords();
        delete all[key];
        localStorage.setItem('boncepts_users_db', JSON.stringify(all));
      } catch (e) {}

      if (window.cachedCloudUsers) delete window.cachedCloudUsers[key];
      if (window.deleteUserRecordFromCloud) window.deleteUserRecordFromCloud(key);

      closeDeleteStudentModal();
      updateGlobalLeaderboard();
      renderTeacherDash(document.getElementById('app-viewport'));
    }

    // ==========================================
    // OVERALL STUDENT LEADERBOARD MARKUP
    // ==========================================
    function renderLeaderboardMarkup() {
      return `
        <section id="overall-student-leaderboard-section" class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500"></i> Overall Classroom Token Leaderboard
              </h2>
              <p class="text-xs text-slate-500">Live token standings synced across all logged-in devices.</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-xs font-bold self-start sm:self-auto">
              Live Sync Active
            </span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-black uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="px-4 py-3">Rank</th>
                  <th class="px-4 py-3">Student</th>
                  <th class="px-4 py-3">Class</th>
                  <th class="px-4 py-3 text-right">Tokens</th>
                </tr>
              </thead>
              <tbody id="overall-leaderboard-tbody" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="4" class="px-4 py-6 text-center text-slate-400 text-xs">Loading live classroom standings...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ==========================================
    // APPLICATION BOOTSTRAP ON WINDOW LOAD
    // ==========================================
    window.onload = function() {
      try {
        const savedSession = localStorage.getItem('boncepts_active_session');
        if (savedSession) {
          const parsed = JSON.parse(savedSession);
          if (parsed && parsed.key) {
            app.currentUser = parsed;
            const db = getAllUserRecords();
            if (db[parsed.key]) {
              state = {
                stats: db[parsed.key].stats || { tokens: 10, testsTaken: 0 },
                inventory: db[parsed.key].inventory || [],
                testHistory: db[parsed.key].testHistory || [],
                completedLessons: db[parsed.key].completedLessons || []
              };
            }
          }
        }
      } catch (e) {}

      updateNavBar();
      updateGlobalLeaderboard();
      app.navigate('home');
    };
  </script>
</body>
</html>
